async function commitPoImport(){
  const d=window.__poParse; if(!d) return;
  const po_number=$('pi-po').value.trim();
  if(!po_number){ toast('A PO number is required',{err:true}); return; }
  const buyer_id=$('pi-buyer').value;
  if(!buyer_id){ toast('Add a buyer first from Buyers & logins',{err:true}); return; }

  const rows=[...document.querySelectorAll('#pi-items tr[data-i]')].filter(tr=>tr.querySelector('.pi-use').checked);
  const val=$('pi-val').value;
  const rec={ buyer_id, po_number,
    po_date:$('pi-date').value||today(), project:$('pi-proj').value.trim()||null,
    reference:$('pi-ref').value.trim()||null, expected_ship_date:$('pi-esd').value||null,
    amount_total: val?Number(val):null, currency:$('pi-cur').value,
    payment_terms:$('pi-pay').value.trim()||null, ship_to:$('pi-ship').value.trim()||null };

  $('loading').style.display='flex';
  try{
    const dup=S.pos.find(p=>p.buyer_id===buyer_id && p.po_number===po_number);
    if(dup && !confirm(po_number+' already exists for this buyer. Add these products to it?')){
      $('loading').style.display='none'; return; }
    let poId;
    if(dup){ poId=dup.id; }
    else{
      const ins=await sb.from('bt_purchase_orders').insert(rec).select().single();
      if(ins.error) throw ins.error;
      poId=ins.data.id;
    }
    let line=dup?(dup.items||[]).reduce((m,i)=>Math.max(m,i.line_no||0),0):0;
    for(const tr of rows){
      line++;
      const g=c=>tr.querySelector('.'+c).value.trim();
      const n=c=>{ const v=tr.querySelector('.'+c).value; return v?Number(v):null; };
      const ins=await sb.from('bt_order_items').insert({
        po_id:poId, line_no:line, product:g('pi-prod')||'Item',
        item_ref:g('pi-ref')||null, stone:g('pi-stone')||null,
        qty:n('pi-qty')||1, unit:g('pi-unit')||'pcs',
        l_mm:n('pi-l'), w_mm:n('pi-w'), h_mm:n('pi-h'),
        description:(d.items[+tr.getAttribute('data-i')]||{}).description||null,
        rate:(d.items[+tr.getAttribute('data-i')]||{}).rate||null,
        target_date:rec.expected_ship_date });
      if(ins.error) throw ins.error;
    }

    const crows=[...document.querySelectorAll('#pi-charges tr[data-c]')].filter(tr=>tr.querySelector('.pc-use').checked);
    let nCharge=0;
    for(const tr of crows){
      const label=tr.querySelector('.pc-label').value.trim();
      const amt=tr.querySelector('.pc-amt').value;
      if(!label || !amt) continue;
      const ins=await sb.from('bt_charges').insert({ po_id:poId, label, amount:Number(amt), currency:rec.currency });
      if(ins.error) throw ins.error;
      nCharge++;
    }
    window.__poParse=null;
    await loadData();
    $('loading').style.display='none';
    toast(rows.length+' product'+(rows.length===1?'':'s')+
      (nCharge?' and '+nCharge+' charge'+(nCharge===1?'':'s'):'')+' imported into '+po_number);
    go('#/po/'+poId);
  }catch(e){
    $('loading').style.display='none';
    toast('Import failed: '+(e.message||e),{err:true});
  }
}

/* ---------- import ---------- */
function impFile(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ $('imp-csv').value=String(r.result); };
  r.readAsText(f);
}
function impPreview(){
  const text=$('imp-csv').value.trim();
  if(!text){ toast('Paste CSV first',{err:true}); return; }
  const rows=csvParse(text);
  if(rows.length<2){ toast('Need a header row and at least one data row',{err:true}); return; }
  const hdr=rows[0].map(x=>x.trim().toLowerCase());
  const need=['po_number','product'];
  for(const n of need){ if(hdr.indexOf(n)<0){ toast('Missing column: '+n,{err:true}); return; } }
  const recs=rows.slice(1).map(r=>{ const o={}; hdr.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o; }).filter(o=>o.po_number&&o.product);
  const pos=[...new Set(recs.map(r=>r.po_number))];
  $('imp-out').innerHTML='<div class="attn attn--ok attn--flat"><span>'+recs.length+' item lines across '+pos.length+' PO(s): '+pos.map(esc).join(', ')+
    '</span></div><div class="button-row"><button class="button" type="button" onclick="impCommit()">Import now</button></div>';
  window.__impRecs=recs;
}
async function impCommit(){
  const recs=window.__impRecs||[]; if(!recs.length) return;
  const buyerId=$('imp-buyer').value;
  $('loading').style.display='flex';
  try{
    const byPo={};
    for(const r of recs){ (byPo[r.po_number]=byPo[r.po_number]||[]).push(r); }
    for(const poNum of Object.keys(byPo)){
      let po=S.pos.find(p=>p.buyer_id===buyerId && p.po_number===poNum);
      if(!po){
        const first=byPo[poNum][0];
        const ins=await sb.from('bt_purchase_orders').insert({buyer_id:buyerId, po_number:poNum, po_date:first.po_date||today()}).select().single();
        if(ins.error) throw ins.error;
        po=ins.data; po.items=[];
      }
      let line=(po.items||[]).reduce((m,i)=>Math.max(m,i.line_no||0),0);
      for(const r of byPo[poNum]){
        line++;
        const ins=await sb.from('bt_order_items').insert({po_id:po.id, line_no:line, product:r.product,
          stone:r.stone||null, finish:r.finish||null, qty:Number(r.qty)||1, unit:r.unit||'pcs',
          l_mm:r.l_mm?Number(r.l_mm):null, w_mm:r.w_mm?Number(r.w_mm):null, h_mm:r.h_mm?Number(r.h_mm):null,
          dims_text:r.dims_text||null, target_date:r.target_date||null, notes:r.notes||null});
        if(ins.error) throw ins.error;
      }
    }
    await loadData();
    $('loading').style.display='none';
    toast('Imported '+recs.length+' items.');
    // land on the order book, where the thing just imported actually is
    go('#/orders');
  }catch(e){
    $('loading').style.display='none';
    toast('Import failed: '+(e.message||e),{err:true});
  }
}

// Everything the owner can jump to or start, in one list. Ctrl-K, or the search
// bar in the header. Finding a PO quickly was one of the three frictions Yash named.
function commandItems(q){
  const n=_norm(q||'');
  const out=[];
  const add=(kind,label,meta,run)=>out.push({kind,label,meta,run});

  if(!n){
    add('Create','New purchase order','',"mNewPO()");
    add('Create','Import a PO or spreadsheet','',"go('#/admin/import')");
    add('Create','Add a workshop update','',"pickDaily()");
    add('Create','New buyer','',"mBuyer()");
    add('Go','Command Centre','',"go('#/home')");
    add('Go','Production queue','',"go('#/production')");
    add('Go','Finance','',"go('#/finance')");
    add('Go','Accounts','',"go('#/accounts')");
    return out;
  }
  const hit=s=>_norm(s).indexOf(n)>=0;
  (S.pos||[]).forEach(p=>{
    if(hit(p.po_number)||hit(p.project||'')||hit((S.buyersById[p.buyer_id]||{}).company||''))
      add('Order', p.po_number, (p.project||'')+' · '+((S.buyersById[p.buyer_id]||{}).company||''), "go('#/po/"+p.id+"')");
  });
  (S.items||[]).forEach(it=>{
    if(hit(it.product)||hit(it.stone||'')||hit(it.item_code||''))
      add('Product', it.product, (it.stone||'')+' · '+poRef(it), "go('#/item/"+it.id+"')");
  });
  (S.buyers||[]).forEach(b=>{ if(hit(b.company)) add('Client', b.company, b.city||'', "go('#/clients')"); });
  (S.invoices||[]).forEach(i=>{
    if(hit(i.invoice_no||'')) add('Invoice', i.invoice_no,
      ((S.buyersById[i.buyer_id]||{}).company||'')+' · '+money(i.total,i.currency), "go('#/accounts')");
  });
  return out.slice(0,40);
}

function openCommand(){
  if(!isAdmin()) return;
  modal('<div class="cmd"><input id="cmd-q" class="cmd__input" type="search" autocomplete="off" '+
    'placeholder="Search orders, products, clients or invoices" aria-label="Search">'+
    '<div class="cmd__list" id="cmd-list"></div>'+
    '<p class="cmd__hint">Enter to open · Esc to close</p></div>');
  window.__cmdSel=0;
  renderCommand();
  const inp=$('cmd-q');
  inp.oninput=()=>{ window.__cmdSel=0; renderCommand(); };
  inp.onkeydown=(e)=>{
    const n=(window.__cmdRows||[]).length;
    if(e.key==='ArrowDown'){ e.preventDefault(); window.__cmdSel=Math.min(n-1,(window.__cmdSel||0)+1); renderCommand(true); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); window.__cmdSel=Math.max(0,(window.__cmdSel||0)-1); renderCommand(true); }
    else if(e.key==='Enter'){ e.preventDefault(); runCommand(window.__cmdSel||0); }
  };
  setTimeout(()=>inp.focus(),30);
}

function renderCommand(keepValue){
  const inp=$('cmd-q'); if(!inp) return;
  const rows=commandItems(inp.value);
  window.__cmdRows=rows;
  const sel=window.__cmdSel||0;
  const el=$('cmd-list');
  el.innerHTML = rows.length
    ? rows.map((r,i)=>'<button class="cmd__row'+(i===sel?' cmd__row--on':'')+'" type="button" onclick="runCommand('+i+')">'+
        '<span class="cmd__kind">'+esc(r.kind)+'</span>'+
        '<span class="cmd__label">'+esc(r.label)+'</span>'+
        '<span class="cmd__meta">'+esc(r.meta||'')+'</span></button>').join('')
    : '<div class="empty-state">Nothing matches.</div>';
  const on=el.querySelector('.cmd__row--on');
  if(on && keepValue) on.scrollIntoView({block:'nearest'});
}

function runCommand(i){
  const r=(window.__cmdRows||[])[i];
  if(!r) return;
  closeModal();
  try{ eval(r.run); }catch(e){ toast('Could not open that',{err:true}); }
}

function toggleCreate(ev){

   they hold, which purchase orders they are scoped to, and whether the money is
   visible to them. Every one of these is enforced in the database as well — this
   screen only writes the rows the policies read. */
function mBuyerAccess(userId){
  const p=(S.profilesAll||[]).find(x=>x.user_id===userId);
  if(!p){ toast('That login no longer exists',{err:true}); return; }
  const b=S.buyersById[p.buyer_id]||{};
  const pos=(S.pos||[]).filter(x=>x.buyer_id===p.buyer_id)
    .sort((x,y)=>String(x.po_number).localeCompare(String(y.po_number)));
  const scoped=(S.poScope||[]).filter(x=>x.user_id===userId).map(x=>x.po_id);
  const role=p.buyer_role||'administrator';
  const ROLES=[['administrator','Buyer administrator','Everything this company is allowed to see, and can make decisions.'],
               ['project','Buyer project user','Only the orders you tick below.'],
               ['finance','Buyer finance user','Invoices, the ledger and the balance.']];
  const m=modal('<h3>Access for '+esc(p.full_name||p.email)+'</h3>'+
    '<div class="sub">'+esc(b.company||'')+'</div>'+
    '<div class="form-grid">'+
    '<div class="field field--full"><label>Role</label>'+
      ROLES.map(([v,name,copy])=>'<label class="check-row"><input type="radio" name="ba-role" value="'+v+'"'+
        (role===v?' checked':'')+' onchange="document.getElementById(\'ba-scope\').hidden=this.value!==\'project\'">'+
        '<span><strong>'+esc(name)+'</strong><br><span class="field-hint">'+esc(copy)+'</span></span></label>').join('')+
    '</div>'+

// Every metric on the Reports pages, and exactly how it is counted. If a figure
// cannot be derived from rows that exist, it says so here rather than guessing.
function mMetricDefs(){
  const rows=[
    ['Delivery confidence','Starts at 100 and counts down for each exception on the order — a hold, a stage past its planned date, a decision waiting on the buyer, a passed ship date — then blends in how far the pieces have actually progressed. It is arithmetic on what is wrong today, not a prediction.'],
    ['Daily update compliance','Active pieces with a workshop update logged for that date, over all active pieces. A piece counts as active until it is delivered or cancelled.'],
    ['Average stage delay','Mean days past the planned date across every stage currently running late. Stages with no planned date are not counted, so setting planned dates makes this figure sharper.'],
    ['Cycle time by stage','Days between started_at and completed_at, averaged over stages that have actually completed. Stages still running are excluded.'],
    ['Production flow','Active pieces grouped by the stage they are sitting in. The busiest stage is named as the constraint, with the longest time any piece has been waiting there.'],
    ['Receivable ageing','Published invoices grouped by days since the invoice date. Invoices carry no payment term in StoneFlow, so this cannot age against a due date and does not pretend to.'],
    ['Outstanding','Published invoice totals less payments recorded in StoneFlow. It is not a Tally balance — the buyer-facing statement is, and that comes from your books.'],
    ['Reworded before sending','Published updates where your edited wording differs from what the workshop first submitted.']
  ];
  modal('<h3>How these are counted</h3><div class="sub">So a number is never acted on without knowing what it means.</div>'+
    '<div class="side-card__rows">'+rows.map(r=>'<div class="def-row"><strong>'+esc(r[0])+'</strong><p>'+esc(r[1])+'</p></div>').join('')+'</div>'+
    '<div class="button-row"><button class="button button--secondary" type="button" onclick="closeModal()">Close</button></div>');
}

// A plain CSV of what the current reports show, for a spreadsheet or an email.
function exportReport(){
  const k=reportKPIs(), conf=deliveryConfidence(), flow=productionFlow(), cyc=cycleTimeByStage();
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const L=[];
  L.push(['StoneFlow report', fdate(today())].map(q).join(','));
  L.push('');
  L.push(['Metric','Value','Note'].map(q).join(','));
  L.push(['Delivery confidence', k.onTime===null?'':k.onTime+'%', k.atRisk+' at risk'].map(q).join(','));
  L.push(['Daily update compliance', (k.compliance===null?'':k.compliance+'%'), k.uc.today+' of '+k.uc.of].map(q).join(','));
  L.push(['Average stage delay', k.delay===null?'none':k.delay.toFixed(1)+' days',''].map(q).join(','));
  L.push(['Invoiced', money(k.ageing.total,k.ageing.currency), k.ageing.n+' invoices'].map(q).join(','));
  L.push(['Payments recorded', money(k.ageing.paid,k.ageing.currency),''].map(q).join(','));
  L.push(['Outstanding', money(k.ageing.outstanding,k.ageing.currency),''].map(q).join(','));
  L.push('');
  L.push(['Order','Buyer','Stage','Ships','Confidence','Exceptions'].map(q).join(','));
  conf.forEach(c=>{ const b=S.buyersById[c.po.buyer_id];
    L.push([c.po.po_number, b?b.company:'', c.stage, c.po.expected_ship_date||'', c.score+'%', c.why.join(' · ')].map(q).join(',')); });
  L.push('');
  L.push(['Stage','Active pieces'].map(q).join(','));
  flow.rows.forEach(r=>L.push([r.stage.name, r.items.length].map(q).join(',')));
  L.push('');
  L.push(['Stage','Average days','Vs plan','Completed stages counted'].map(q).join(','));
  cyc.forEach(x=>L.push([x.stage.name, x.avg.toFixed(1), x.slip===null?'':x.slip.toFixed(1), x.n].map(q).join(',')));
  const blob=new Blob(["﻿"+L.join('\n')], {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='stoneflow-report-'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Report downloaded');
}

    '<div class="field"><label for="dp-date">Dispatched on</label><input id="dp-date" type="date" value="'+today()+'"></div>'+

      dispatch_state:'dispatched', shipped_at:$('dp-date').value||today(),

/* ---------------------------------------------------------------------------
   Creating a batch, and giving work out.

   Both of these are thin: the rules live in the database, where a supervisor
   cannot get round them by reloading the page. What is here is the form, the
   sensible default, and passing the server's own words back to the person when
   it refuses — the messages bt_create_batch and bt_assign_work raise are written
   to be read by whoever is standing at the tablet, not by a developer.
--------------------------------------------------------------------------- */

function mCreateBatch(groupKey){
  const groups=unbatchedGroups();
  if(!groups.length){
    toast('Every piece on the floor is already in a batch.');
    return;
  }
  // Pieces from two different shipments cannot share a batch — the server
  // refuses it — so the choice of shipment comes before the choice of pieces.
  if(!groupKey && groups.length>1){
    const m=modal('<h3>Which shipment?</h3>'+
      '<div class="sub">A batch holds pieces from one shipment only. Pick the one you are grouping.</div>'+
      '<div class="button-row" style="flex-direction:column;align-items:stretch">'+
      groups.map((g,i)=>'<button class="button button--secondary button--wide" type="button" data-k="'+esc(g.key)+'">'+
        'Shipment '+String.fromCharCode(65+i)+' — '+g.items.length+' piece'+(g.items.length===1?'':'s')+
        (g.ship?' · expected '+esc(fdate(g.ship)):'')+'</button>').join('')+
      '<button class="button button--quiet" type="button" onclick="closeModal()">Cancel</button></div>');
    m.m.querySelectorAll('[data-k]').forEach(b=>{
      b.onclick=()=>{ const k=b.getAttribute('data-k'); closeModal(); mCreateBatch(k); };
    });
    return;
  }
  const g = groupKey ? groups.find(x=>x.key===groupKey) : groups[0];
  if(!g){ toast('Those pieces have already been batched. Reloading.'); refresh(); return; }

  const m=modal('<h3>New shipment batch</h3>'+
    '<div class="sub">The code is issued by the system so two people cannot create the same one. '+
    'Tick the pieces leaving together and set the date they should be ready by.</div>'+
    '<div class="form-grid">'+
      '<div class="field field--full"><label for="bt-ship">Planned ship date</label>'+
        '<input id="bt-ship" type="date" value="'+esc(g.ship||'')+'"></div>'+
      '<div class="field field--full"><label for="bt-note">Note (optional)</label>'+
        '<input id="bt-note" placeholder="e.g. going with the container on the 30th"></div>'+
      '<div class="field field--full"><label>Pieces</label>'+
        '<div class="pick-list" id="bt-items">'+g.items.map(it=>
          '<label class="pick"><input type="checkbox" checked value="'+esc(it.id)+'">'+
          '<span><strong>'+esc(it.product)+'</strong>'+
          '<small>'+esc([it.item_ref,it.stone,(+it.qty||1)+' '+(it.unit||'pcs')].filter(Boolean).join(' · '))+'</small></span></label>').join('')+
        '</div></div>'+
      '<p class="field-hint field--full">The batch is what the floor sees. The order it belongs to stays in the office.</p>'+
      '<div class="button-row field--full"><button class="button" type="button" id="bt-go">Create batch</button>'+
      '<button class="button button--secondary" type="button" onclick="closeModal()">Cancel</button></div>'+
    '</div>');
  m.m.querySelector('#bt-go').onclick=async (e)=>{
    const btn=e.currentTarget;
    const ids=Array.from(m.m.querySelectorAll('#bt-items input:checked')).map(x=>x.value);
    if(!ids.length){ toast('Tick at least one piece.',{err:true}); return; }
    const ship=$('bt-ship').value||null, note=$('bt-note').value.trim()||null;
    btn.disabled=true;
    const {data,error}=await sb.rpc('bt_create_batch',{p_items:ids, p_ship:ship, p_note:note});
    btn.disabled=false;
    if(error){ toast(error.message,{err:true}); return; }
    closeModal();
    await refresh();
    toast((data&&data.code?data.code:'Batch')+' created with '+ids.length+' piece'+(ids.length===1?'':'s')+'.');
  };
}

function mAssign(itemId, stageId, presetPerson){
  const open=(S.items||[]).filter(it=>!['delivered','cancelled','made'].includes(it.status));
  if(!open.length){ toast('There is nothing on the floor to give out.'); return; }
  const it0 = itemId ? S.itemsById[itemId] : open[0];
  if(!it0){ toast('That piece is no longer on the floor.',{err:true}); return; }
  const people=floorPeople();
  if(!people.length){ toast('No workshop logins yet — the office creates them under People & access.',{err:true}); return; }

  const cur=openAssignment(it0.id);
  const stages=activeStages();
  const defStage = stageId!=null ? stageId
    : (cur ? cur.stage_id : ((curStage(it0)||stages[0]||{}).id));
  const defLead = presetPerson || (cur?cur.assigned_to:'');

  const pieceField = itemId
    ? '<div class="field field--full"><label>Piece</label>'+
      '<div class="pick-fixed"><strong>'+esc(it0.product)+'</strong>'+
      '<small>'+esc([it0.item_ref, batchCodeOf(it0.id), it0.stone, dimsOf(it0)].filter(Boolean).join(' · '))+'</small></div>'+
      '<input type="hidden" id="as-item" value="'+esc(it0.id)+'"></div>'
    : '<div class="field field--full"><label for="as-item">Piece</label><select id="as-item">'+
      open.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.product)+
        ' — '+esc([batchCodeOf(x.id), x.item_ref].filter(Boolean).join(' · '))+'</option>').join('')+
      '</select></div>';

  const m=modal('<h3>'+(cur?'Change who is on this':'Give out work')+'</h3>'+
    '<div class="sub">The person answers on their own screen — accepted, a question, or cannot start. '+
    'You will see which on the Today page.</div>'+
    '<div class="form-grid">'+
      pieceField+
      '<div class="field"><label for="as-stage">Stage</label><select id="as-stage">'+
        stages.map(s=>'<option value="'+s.id+'"'+(s.id===defStage?' selected':'')+'>'+esc(s.name)+'</option>').join('')+
        '</select></div>'+
      '<div class="field"><label for="as-target">Finish by</label>'+
        '<input id="as-target" type="date" value="'+esc(cur&&cur.target_date?cur.target_date:'')+'"></div>'+
      '<div class="field field--full"><label for="as-lead">Who does the work</label><select id="as-lead">'+
        '<option value="">Choose a person…</option>'+
        people.map(p=>'<option value="'+esc(p.user_id)+'"'+(p.user_id===defLead?' selected':'')+'>'+
          esc(p.full_name)+' — '+((workloadByPerson()[p.user_id]||0))+' piece'+
          ((workloadByPerson()[p.user_id]||0)===1?'':'s')+' now</option>').join('')+
        '</select></div>'+
      '<div class="field field--full"><label>Helping (optional)</label>'+
        '<div class="pick-list pick-list--tight" id="as-support">'+people.map(p=>
          '<label class="pick"><input type="checkbox" value="'+esc(p.user_id)+'"'+
          ((cur&&(cur.support||[]).indexOf(p.user_id)>=0)?' checked':'')+'>'+
          '<span><strong>'+esc(p.full_name)+'</strong></span></label>').join('')+'</div>'+
        '<p class="field-hint">Their time is recorded separately. The same person cannot both lead and help.</p></div>'+
      '<div class="field field--full"><label for="as-note">What to do</label>'+
        '<textarea id="as-note" rows="2" placeholder="e.g. Flute the four legs to the drawing, 12 mm spacing">'+
        esc(cur&&cur.instruction?cur.instruction:'')+'</textarea></div>'+
      '<div class="field field--full"><label for="as-ev">What to send back</label>'+
        '<input id="as-ev" placeholder="e.g. two photos and the tape measure on the width" value="'+
        esc(cur&&cur.evidence_required?cur.evidence_required:'')+'"></div>'+
      (cur?'<div class="field field--full"><label for="as-why">Why the change (optional)</label>'+
        '<input id="as-why" placeholder="e.g. moved to the bench saw"></div>':'')+
      '<div class="button-row field--full"><button class="button" type="button" id="as-go">'+
        (cur?'Save the change':'Give out this work')+'</button>'+
      '<button class="button button--secondary" type="button" onclick="closeModal()">Cancel</button></div>'+
    '</div>');

  m.m.querySelector('#as-go').onclick=async (e)=>{
    const btn=e.currentTarget;
    const item=$('as-item').value;
    const lead=$('as-lead').value;
    if(!lead){ toast('Choose the person who will do the work.',{err:true}); return; }
    const support=Array.from(m.m.querySelectorAll('#as-support input:checked')).map(x=>x.value);
    const why=$('as-why');
    btn.disabled=true;
    const {error}=await sb.rpc('bt_assign_work',{
      p_item:item,
      p_stage:Number($('as-stage').value),
      p_lead:lead,
      p_support:support.length?support:null,
      p_work_date:null,
      p_target_date:$('as-target').value||null,
      p_instruction:$('as-note').value.trim()||null,
      p_evidence:$('as-ev').value.trim()||null,
      p_reason:why?(why.value.trim()||null):null
    });
    btn.disabled=false;
    if(error){ toast(error.message,{err:true}); return; }
    closeModal();
    await refresh();
    toast(personName(lead)+' has been given this work.');
  };

  // Ticking the lead as a helper is a mistake the server refuses; catch it here
  // so the person sees it before they press Save.
  const sync=()=>{
    const lead=$('as-lead').value;
    m.m.querySelectorAll('#as-support input').forEach(x=>{
      const same = x.value===lead;
      x.disabled = same;
      if(same) x.checked=false;
      x.closest('.pick').classList.toggle('pick--off', same);
    });
  };
  m.m.querySelector('#as-lead').onchange=sync;
  sync();
}

/* The artisan's answer to a task. Cannot-start reports a real blocker — the
   server will not take it without a reason, and neither will this. */
function mAckTask(assignmentId, state){
  const a=(S.assignments||[]).find(x=>x.id===assignmentId);
  if(!a){ toast('That task is no longer there.',{err:true}); return; }
  const it=S.itemsById[a.item_id]||{};
  const stg=S.stagesById[a.stage_id];
  if(state==='accepted'){
    (async()=>{
      const {error}=await sb.rpc('bt_ack_assignment',{p_id:assignmentId,p_state:'accepted',p_note:null});
      if(error){ toast(error.message,{err:true}); return; }
      await refresh();
      toast('Accepted. / स्वीकार किया।');
    })();
    return;
  }
  const cannot = state==='cannot_start';
  const m=modal('<h3>'+(cannot?'Cannot start · शुरू नहीं कर सकता':'Ask a question · सवाल पूछें')+'</h3>'+
    '<div class="sub">'+esc(it.product||'')+(stg?' · '+esc(stg.name):'')+'</div>'+
    '<div class="form-grid">'+
      '<div class="field field--full"><label for="ak-note">'+
        (cannot?'What is stopping you? / क्या रुकावट है?':'What do you need to know? / क्या जानना है?')+'</label>'+
        '<textarea id="ak-note" rows="3" placeholder="'+
        (cannot?'e.g. the lathe belt is broken / लेथ की बेल्ट टूटी है':'e.g. which finish on the base? / बेस पर कौन सा फिनिश?')+
        '"></textarea></div>'+
      '<p class="field-hint field--full">The supervisor sees this straight away. / सुपरवाइज़र को तुरंत दिखेगा।</p>'+
      '<div class="button-row field--full"><button class="button" type="button" id="ak-go">Send · भेजें</button>'+
      '<button class="button button--secondary" type="button" onclick="closeModal()">Cancel · रद्द</button></div>'+
    '</div>');
  m.m.querySelector('#ak-go').onclick=async (e)=>{
    const note=$('ak-note').value.trim();
    if(!note){ toast('Please say what the problem is. / कृपया बताएं क्या दिक्कत है।',{err:true}); return; }
    e.currentTarget.disabled=true;
    const {error}=await sb.rpc('bt_ack_assignment',{p_id:assignmentId,p_state:state,p_note:note});
    e.currentTarget.disabled=false;
    if(error){ toast(error.message,{err:true}); return; }
    closeModal();
    await refresh();
    toast('Sent to the supervisor. / सुपरवाइज़र को भेज दिया।');
  };
}

</script>
<script>
'use strict';
async function boot(){
  if(!sb) return;
  const {data:{session}} = await sb.auth.getSession();
  S.session=session;
  if(session){
    try{ await loadCore(); if(S.profile) await loadData(); }
    catch(e){ console.error(e); toast('Could not load data: '+(e.message||e),{err:true}); }
  }
  S.ready=true;
  $('loading').style.display='none';
  render();

  sb.auth.onAuthStateChange(async (event, sess)=>{
    const had=!!S.session;
    S.session=sess;
    if(event==='SIGNED_IN' && sess && !S.profile){
      try{ await loadCore(); if(S.profile) await loadData(); }
      catch(e){ console.error(e); }
      $('loading').style.display='none';
      render();
    }
    if(event==='SIGNED_OUT'){ S.profile=null; S.pos=[]; S.items=[]; render(); }
  });

  window.addEventListener('hashchange', render);
  checkForUpdate();
  setInterval(()=>{
    if(S.session && S.profile && document.visibilityState==='visible' && Date.now()-S.lastLoad>55000) refresh();
  }, 60000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && S.session && S.profile && Date.now()-S.lastLoad>30000) refresh();
    if(document.visibilityState==='visible') checkForUpdate();
  });
}

/* ---- staying current ------------------------------------------------------
   GitHub Pages serves this file with max-age=600, so after a deploy a browser
   can keep handing back the old app for some time — and the person using it has
   no way to tell. version.json is tiny and fetched with cache:'no-store', so a
   stale page can notice it is stale and say so instead of quietly misbehaving. */
let _updateSeen = false, _updateAt = 0;
async function checkForUpdate(){
  if(_updateSeen) return;
  // file:// has no origin, so the fetch below would log a CORS error even though
  // it is caught — that is noise in the console during local testing
  if(location.protocol !== 'http:' && location.protocol !== 'https:') return;
  if(Date.now() - _updateAt < 120000) return;   // at most once every two minutes
  _updateAt = Date.now();
  try{
    const base = location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
    const r = await fetch(base + 'version.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const v = await r.json();
    if(v && v.build && typeof BUILD_ID === 'string' && v.build !== BUILD_ID){
      _updateSeen = true;
      // Asking someone to notice a bar and press Reload is asking them to know
      // about browser caching. Take the newer build ourselves — once per build,
      // so a page that cannot update itself falls back to telling the person
      // instead of reloading forever.
      let tried = null;
      try{ tried = sessionStorage.getItem('sf-reload-for'); }catch(e){}
      if(tried !== v.build){
        try{ sessionStorage.setItem('sf-reload-for', v.build); }catch(e){}
        const u = location.href.replace(/[?&]v=\d+/,'').replace(/#.*$/,'');
        location.replace(u + (u.indexOf('?')<0?'?':'&') + 'v=' + Date.now() + location.hash);
        return;
      }
      showUpdateBar();
    }
  }catch(e){ /* offline, or the file is not there yet — never block the app */ }
}

function showUpdateBar(){
  if(document.getElementById('update-bar')) return;
  const d = document.createElement('div');
  d.id = 'update-bar';
  d.className = 'update-bar';
  d.innerHTML = '<span>A newer version of StoneFlow is ready.</span>' +
    '<button class="button button--secondary" type="button" id="update-go">Reload</button>';
  document.body.appendChild(d);
  d.querySelector('#update-go').onclick = ()=>{
    // cache-bust the document itself, otherwise the browser may serve the old
    // copy straight back and the bar returns
    const u = location.href.replace(/[?&]v=\d+/,'');
    location.replace(u + (u.indexOf('?')<0?'?':'&') + 'v=' + Date.now() + location.hash);
  };
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
