function vFinance(){
  if(!isAdmin()) return vHome();
  const buyers = S.buyers.filter(b=>S.pos.some(p=>p.buyer_id===b.id) || (S.payByBuyer[b.id]||[]).length);

  let h = '<div class="page-heading"><div>'+eyebrow('Statement of account')+
    '<h1 class="display-title">Finance</h1>'+
    '<p class="lede">What each buyer has ordered, what they have paid, and what is still owed. '+
    'Only you can see this — buyers and floor staff cannot, at the database level.</p></div></div>';

  if(!buyers.length){ $('app').innerHTML = h+'<div class="empty-state">No buyers with orders yet.</div>'; return; }

  // headline totals across every buyer, grouped by currency
  const all = {};
  buyers.forEach(b=>buyerMoney(b.id).forEach(g=>{
    const t = all[g.cur] = all[g.cur] || {cur:g.cur, due:0, paid:0};
    t.due += g.due; t.paid += g.paid;
  }));
  const tot = Object.values(all);
  if(tot.length){
    h += '<section class="summary-grid">'+
      tot.slice(0,2).map(t=>
        statCard('Ordered'+(tot.length>1?' ('+t.cur+')':''), money(t.due, t.cur), 'Including freight and packing') +
        statCard('Received'+(tot.length>1?' ('+t.cur+')':''), money(t.paid, t.cur), '') +
        statCard('Outstanding'+(tot.length>1?' ('+t.cur+')':''), money(t.due - t.paid, t.cur),
                 t.due - t.paid > 0 ? 'Across all buyers' : 'Nothing outstanding')
      ).join('') + '</section>';
  }

  h += '<div class="utility-stack">';
  buyers.forEach(b=>{
    const groups = buyerMoney(b.id);
    const pos = S.pos.filter(p=>p.buyer_id===b.id && p.status!=='cancelled');
    const onAccount = (S.payByBuyer[b.id]||[]).filter(x=>!x.po_id);

    h += '<section class="panel"><div class="panel__head"><div>'+
      eyebrow(pos.length+' order'+(pos.length!==1?'s':''))+
      '<h3 class="panel__title">'+esc(b.company)+'</h3>'+
      '<p class="panel__description">'+
        (groups.length
          ? groups.map(g=>esc(money(g.balance,g.cur))+' outstanding of '+esc(money(g.due,g.cur))).join(' · ')
          : 'No values recorded yet.')+
      '</p></div>'+
      '<div class="button-row">'+
        (groups.some(g=>g.balance>0.005) ? badge('Owes you','alert')
          : groups.some(g=>g.balance<-0.005) ? badge('In credit','pending')
          : badge('Settled','success'))+
        '<button class="button" type="button" onclick="mPayment(\''+b.id+'\',null)">+ Record payment</button>'+
      '</div></div>'+
      '<div class="panel__body">';

    // per-PO breakdown
    h += '<div class="data-table-wrap"><table class="data-table">'+
      '<tr><th>Purchase order</th><th>Value</th><th>Freight &amp; packing</th><th>Received</th><th>Balance</th><th></th></tr>'+
      (pos.length ? pos.map(p=>{
        const m = poMoney(p);
        const extras = (S.chgByPo[p.id]||[]);
        return '<tr>'+
          '<td><strong style="cursor:pointer;text-decoration:underline" onclick="go(\'#/po/'+p.id+'\')">'+esc(p.po_number)+'</strong>'+
            '<small>'+esc([p.project, p.payment_terms].filter(Boolean).join(' · ')||'—')+'</small></td>'+
          '<td>'+(m.hasValue?esc(money(m.value,m.cur)):'<small>not set</small>')+'</td>'+
          '<td>'+(extras.length
              ? esc(money(m.extras,m.cur))+'<small>'+esc(extras.map(c=>c.label).join(', '))+'</small>'
              : '<small>—</small>')+'</td>'+
          '<td>'+(m.paid?esc(money(m.paid,m.cur)):'<small>—</small>')+'</td>'+
          '<td><strong>'+esc(money(m.balance,m.cur))+'</strong>'+
            (m.balance>0.005?'<small style="color:var(--rust)">outstanding</small>'
             :m.balance<-0.005?'<small>overpaid</small>':'<small>settled</small>')+'</td>'+
          '<td class="nowrap">'+
            '<button class="button button--quiet" type="button" onclick="mPayment(\''+b.id+'\',\''+p.id+'\')">Payment</button> '+
            '<button class="button button--quiet" type="button" onclick="mCharge(\''+p.id+'\')">Extra</button>'+
          '</td></tr>';
      }).join('') : '<tr><td colspan="6"><small>No orders yet.</small></td></tr>')+
      '</table></div>';

    if(onAccount.length){
      h += '<p class="field-hint space-top-12">On account, not tied to an order: '+
        onAccount.map(x=>esc(money(x.amount,x.currency))+' on '+esc(fdate(x.paid_on))).join(' · ')+'</p>';
    }

    // payment history
    const pays = (S.payByBuyer[b.id]||[]).slice().sort((x,y)=>String(y.paid_on).localeCompare(String(x.paid_on)));
    if(pays.length){
      h += '<div class="side-card__rows space-top-12">'+pays.map(x=>{
        const po = x.po_id ? S.posById[x.po_id] : null;
        return '<div class="side-row"><span>'+esc(fdate(x.paid_on))+' · '+
          esc([x.method, x.reference, po?po.po_number:'on account'].filter(Boolean).join(' · '))+
          (x.note?' — '+esc(x.note):'')+'</span>'+
          '<strong>'+esc(money(x.amount,x.currency))+
          ' <button class="button button--quiet" type="button" style="min-height:28px;padding:0 8px" '+
          'onclick="delPayment(\''+x.id+'\')">✕</button></strong></div>';
      }).join('')+'</div>';
    }

    h += '</div></section>';
  });
  h += '</div>';
  h += '<p class="field-hint space-top-12">This is a statement of account, not a ledger. '+
       'Freight, packing and any other charge sit on their own named line — a figure with no reason beside it is what starts a telephone call. A negative amount is a discount.</p>';
  $('app').innerHTML = h;
}

   Router
--------------------------------------------------------------------------- */

function render(){
  if(!S.ready) return;
  if(!S.session){ vLogin(); return; }
  if(!S.profile){
    $('shell').hidden=true;
    const root=$('login-root'); root.hidden=false;
    root.innerHTML='<div class="login-screen"><aside class="login-story"><div class="login-story__content">'+
      '<div class="wordmark"><span class="wordmark__mark wordmark__mark--inverse">'+icon('i-mark','icon--lg')+'</span>'+
      '<span><span class="wordmark__title">StoneFlow</span><span class="wordmark__byline">by Gujraj Impex</span></span></div>'+
      '<p class="login-story__quote">Craft in progress.</p></div></aside>'+
      '<main class="login-form-wrap"><div class="login-form"><h2>No access yet</h2>'+
      '<p class="login-form__tagline">This login has not been given access. Please contact Gujraj Impex.</p>'+
      '<div class="button-row"><button class="button" type="button" onclick="signOut()">Sign out</button></div></div></main></div>';
    return;
  }
  updateHeader();
  const hash=location.hash||'#/home';
  const parts=hash.slice(2).split('/');
  window.scrollTo(0,0);
  if(isStaff()){
    if(parts[0]==='item' && parts[1]) vItem(parts[1]);
    else vStaffHome();
    return;
  }
  if(!isAdmin()){
    // the buyer's workspace
    if(parts[0]==='po' && parts[1]) vPO(parts[1]);
    else if(parts[0]==='item' && parts[1]) vItem(parts[1]);
    else if(parts[0]==='orders') vBuyerOrders();
    else if(parts[0]==='approvals') vBuyerApprovals();
    else if(parts[0]==='photos') vBuyerPhotos();
    else if(parts[0]==='documents') vBuyerDocuments();
    else if(parts[0]==='finance') vBuyerFinance();
    else if(parts[0]==='messages') vBuyerMessages();
    else vBuyerHome();
    return;
  }
  if(parts[0]==='po' && parts[1]) vPO(parts[1]);
  else if(parts[0]==='item' && parts[1]) vItem(parts[1]);
  // the console's routes
  else if(parts[0]==='orders') vOrders();
  else if(parts[0]==='production') vProduction(parts[1]||'priority');
  else if(parts[0]==='clients') vClients(parts[1]);
  else if(parts[0]==='reports') vReports(parts[1]);
  else if(parts[0]==='admin') vAdmin(parts[1]);
  // the routes that existed before the console, still honoured so that a
  // bookmark, a WhatsApp link or an old habit never lands on a blank page
  else if(parts[0]==='updates') vClients('updates');
  else if(parts[0]==='approvals') vProduction('review');
  else if(parts[0]==='review') vProduction('review');
  else if(parts[0]==='finance') vFinance();
  else if(parts[0]==='accounts') vAccounts();
  else if(parts[0]==='daily') vReports('log');
  else if(parts[0]==='buyers') vClients('logins');
  else if(parts[0]==='settings') vAdmin('settings');
  else if(parts[0]==='activity') vReports('activity');
  else if(parts[0]==='import') vAdmin('import');
  else vCommandCentre();
}

/* ---------------------------------------------------------------------------
   The buyer's workspace.

   Built from the ChatGPT BUYER handoff. Chitranjan gets a sidebar with the six
   things he ever wants — orders, decisions, photographs, documents, his account
   and the conversation — instead of one long scrolling page. Everything he sees
   is already approved; the database, not this file, is what makes that true.
--------------------------------------------------------------------------- */

function buyerCounts(){
  const bid=S.profile?S.profile.buyer_id:null;
  const open=(S.pos||[]).filter(p=>p.status!=='cancelled' && p.status!=='completed').length;
  const decisions=pendingApprovals().length;
  const photos=visiblePhotos((S.photos||[]).filter(p=>!p.log_date)).length;
  const docs=bid?buyerDocs(bid).length:0;
  const msgs=(S.comments||[]).filter(c=>c.author_role==='admin' && !c.resolved_at).length;
  const fin=bid?((latestStatement(bid)?1:0)+((S.invByBuyer[bid]||[]).length?1:0)):0;
  return {open, decisions, photos, docs, msgs, fin};
}

// Money, the way it is actually owed. A bare "amount due" to a buyer on 100%
// advance terms is a bill for money he has already sent, and it produces the
// telephone call this whole product exists to stop.
function buyerStanding(){
  const bid=S.profile?S.profile.buyer_id:null;
  if(!bid) return null;
  const sn=latestStatement(bid);
  const st=statementStanding(sn);
  if(st) return {label:st.label, value:money(st.amount, st.currency),
                 note:'As at '+fdate(st.as_of), credit:st.credit};
  const inv=(S.invByBuyer[bid]||[]).filter(i=>i.published_at);
  if(inv.length) return {label:'Invoiced to date', value:money(inv.reduce((a,i)=>a+(+i.total||0),0), inv[0].currency||'INR'),
                 note:inv.length+' posted invoice'+(inv.length===1?'':'s'), credit:false};
  return {label:'Your account', value:'—', note:'No statement published yet', credit:false, muted:true};
}

// The menu is not the boundary — the database is — but there is no sense showing
// a login a section it will only ever find empty.
function financeVisible(){
  const bid=S.profile?S.profile.buyer_id:null;
  if(!bid) return false;
  if(S.profile.finance_access===false) return false;
  return true;
}

}

      esc(b?b.company:'your orders')+', in one place.</p>'+

    {k:'New photographs', v:String(c.photos),
     s:newest?('Latest '+fdate(newest.update.work_date)):'None released yet', go:"go('#/photos')"}
  ];
  if(financeVisible() && st) tiles.push({k:st.label, v:st.value, s:st.note, go:"go('#/finance')", credit:st.credit});
  h+='<div class="kpi-grid">'+tiles.map(t=>
    '<button class="kpi'+(t.warn?' kpi--warn':'')+(t.credit?' kpi--credit':'')+'" type="button" onclick="'+t.go+'">'+
    '<span class="kpi__label">'+esc(t.k)+'</span>'+
    '<strong class="kpi__value">'+esc(t.v)+'</strong>'+
    '<span class="kpi__note">'+esc(t.s)+'</span></button>').join('')+'</div>';

  // The question that makes a buyer telephone is "where is my work today", so the
  // newest dated photographs answer it before anything else on the page.
  h+=workshopToday();

  h+='<div class="console-grid">';

  /* active orders */
  h+='<section class="panel"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Your active orders</h3>'+
    '<p class="panel__description">Current stage, progress and delivery target at a glance.</p></div>'+
    '<button class="button button--quiet" type="button" onclick="go(\'#/orders\')">View all</button></div>'+
    '<div class="panel__body">';
  if(!openPos.length) h+='<div class="empty-state">No open orders at the moment.</div>';
  else h+=openPos.slice(0,4).map(p=>{
    const items=(p.items||[]);
    const prog=items.length?items.reduce((a,i)=>a+i.progress,0)/items.length:0;
    const cur=items.map(i=>S.stagesById[i.current_stage_id]).filter(Boolean)
      .sort((a,x)=>a.sort_order-x.sort_order)[0];
    return '<article class="order-row" onclick="go(\'#/po/'+p.id+'\')">'+
      '<div class="order-row__main">'+eyebrow(p.po_number)+
      '<h4>'+esc(p.project||p.po_number)+'</h4>'+
      '<p class="order-row__sub">'+items.length+' product'+(items.length===1?'':'s')+
        (p.expected_ship_date?' · delivery '+fdate(p.expected_ship_date):' · delivery to be confirmed')+'</p>'+
      progressBar(prog)+'</div>'+
      '<div class="order-row__side"><span>Current stage</span>'+
      '<strong>'+esc(cur?cur.name:'Order confirmed')+'</strong>'+
      '<small>'+Math.round(prog*100)+'% complete</small></div>'+
      '<button class="button button--secondary" type="button">Open order</button></article>';
  }).join('');
  h+='</div></section>';

  /* right rail */
  h+='<div>';
  const waiting=pendingApprovals();
  h+='<section class="panel"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Needs your attention</h3>'+
    '<p class="panel__description">Decisions that can hold up production.</p></div></div>'+
    '<div class="panel__body">'+
    (waiting.length?waiting.slice(0,4).map(a=>
      '<article class="att"><div><strong>'+esc(a.stage.name)+' · '+esc(a.item.product)+'</strong>'+
      '<span>'+esc(a.row.approval_note||'Your approval has been requested')+'</span></div>'+
      '<button class="button button--secondary" type="button" onclick="go(\'#/item/'+a.item.id+'\')">Review</button>'+
      '</article>').join('')
      :'<div class="empty-state">Nothing needs your decision right now.</div>')+
    '</div></section>';

  h+='</div></div>';
  paintPlain(h);
}

function vBuyerOrders(){
  const pos=(S.pos||[]).slice().sort((a,b)=>String(b.po_date).localeCompare(String(a.po_date)));
  let body='<section class="panel"><div class="panel__body">';

    const items=(p.items||[]);

function vBuyerApprovals(){
  const waiting=pendingApprovals();
  const decided=[];
  (S.items||[]).forEach(it=>(S.stByItem[it.id]||[]).forEach(r=>{
    if(r.approval==='approved'||r.approval==='changes_requested')
      decided.push({item:it,row:r,stage:S.stagesById[r.stage_id]});
  }));
  decided.sort((a,b)=>String(b.row.approval_at).localeCompare(String(a.row.approval_at)));

  let body='<section class="panel"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Awaiting your decision</h3>'+
    '<p class="panel__description">'+(waiting.length?waiting.length+' active approval'+(waiting.length===1?'':'s'):'Nothing open')+'</p></div>'+
    (waiting.length?badge('Please review','pending'):badge('All clear','success'))+'</div><div class="panel__body">'+
    (waiting.length?waiting.map(a=>{
      const pics=visiblePhotos((S.photosByItem[a.item.id]||[]).filter(x=>x.stage_id===a.row.stage_id));
      return '<article class="approval-row"><div>'+
        '<strong>'+esc(a.stage.name)+' · '+esc(a.item.product)+'</strong>'+
        '<span>'+esc(a.row.approval_note||'Approval requested')+
        (pics.length?(' · '+pics.length+' photograph'+(pics.length===1?'':'s')):'')+'</span></div>'+
        '<button class="button" type="button" onclick="go(\'#/item/'+a.item.id+'\')">Review</button></article>';
    }).join('')

    '</div></section>';

  if(decided.length){
    body+='<section class="panel space-top-16"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Already decided</h3>'+
      '<p class="panel__description">Your past decisions, and what you said.</p></div></div>'+
      '<div class="panel__body">'+decided.slice(0,10).map(a=>
        '<article class="approval-row"><div><strong>'+esc(a.stage.name)+' · '+esc(a.item.product)+'</strong>'+
        '<span>'+esc((a.row.approval==='approved'?'Approved':'Changes requested')+
          (a.row.approval_at?(' · '+fdate(a.row.approval_at)):''))+
          (a.row.approval_note?(' · '+a.row.approval_note):'')+'</span></div>'+
        badge(a.row.approval==='approved'?'Approved':'Changes asked', a.row.approval==='approved'?'success':'pending')+
        '</article>').join('')+'</div></section>';
  }
  paintPlain(buyerPage('Approvals.','Decisions assigned to you',
    'Review the photographs and the note before deciding. Every response is recorded.', '', body));
}

function vBuyerPhotos(){
  const byItem={};
  visiblePhotos((S.photos||[]).filter(p=>!p.log_date)).forEach(p=>{

      '<h3 class="panel__title">'+esc(it.product)+'</h3>'+
      '<p class="panel__description">'+esc([it.stone, dimsOf(it)].filter(Boolean).join(' · '))+'</p></div>'+
      badge(list.length+' photograph'+(list.length===1?'':'s'))+'</div>'+
      '<div class="panel__body">'+photoGridOf(list)+
      '<div class="button-row space-top-12"><button class="button button--quiet" type="button" onclick="go(\'#/item/'+it.id+'\')">Open the piece</button></div>'+

  }).join('');
  paintPlain(buyerPage('Photographs.','Released to you',

}

function vBuyerDocuments(){
  const bid=S.profile.buyer_id;

  if(!docs.length) body+='<div class="empty-state">No documents yet. Invoices, e-way bills and drawings appear here as they are issued.</div>';

  body+='</div></section>';
  paintPlain(buyerPage('Documents.','Issued to you',
    'Invoices, e-way bills and the drawings we have shared.', '', body));
}

function vBuyerFinance(){
  if(!financeVisible()){
    paintPlain(buyerPage('Your account.','','',
      '', '<section class="panel"><div class="panel__body"><div class="empty-state">'+
      'This login does not have access to invoices and balances. Ask us to enable it if you need it.'+
      '</div></div></section>'));
    return;
  }
  const bid=S.profile.buyer_id;
  const st=buyerStanding();
  const inv=(S.invByBuyer[bid]||[]).filter(i=>i.published_at)
    .sort((a,b)=>String(b.invoice_date).localeCompare(String(a.invoice_date)));
  let body='';
  const panel=statementPanel(bid);
  // The statement panel leads with the standing and its direction. Repeating the
  // same figure in a tile above it just makes the reader check whether the two
  // agree, so the tiles only carry what the panel does not say.
  if(!panel && st) body+='<div class="kpi-grid"><div class="kpi'+(st.credit?' kpi--credit':'')+'">'+
    '<span class="kpi__label">'+esc(st.label)+'</span><strong class="kpi__value">'+esc(st.value)+'</strong>'+
    '<span class="kpi__note">'+esc(st.note)+'</span></div></div>';
  body+=panel;
  if(inv.length) body+='<section class="panel space-top-16"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Invoices</h3>'+
    '<p class="panel__description">As posted in our books. The original PDF is attached to each one.</p></div></div>'+
    '<div class="panel__body"><div class="data-table-wrap"><table class="data-table">'+
    '<tr><th>Invoice</th><th>Date</th><th>Total</th><th></th></tr>'+
    inv.map(i=>'<tr><td>'+esc(i.invoice_no||'—')+'</td><td>'+esc(fdate(i.invoice_date))+'</td>'+
      '<td>'+esc(money(i.total, i.currency||'INR'))+'</td>'+
      '<td>'+(i.path?'<button class="button button--quiet" type="button" onclick="openDoc(\''+esc(i.path)+'\')">Open</button>':'')+'</td></tr>').join('')+
    '</table></div></div></section>';
  if(!st && !inv.length) body='<section class="panel"><div class="panel__body"><div class="empty-state">'+
    'Nothing has been published to your account yet.</div></div></section>';
  paintPlain(buyerPage('Your account.','Your ledger with us',
    'Copied from our books on the date shown, never recalculated here.', '', body));
}

function vBuyerMessages(){
  const threads={};
  (S.comments||[]).forEach(c=>{ (threads[c.item_id]=threads[c.item_id]||[]).push(c); });
  const ids=Object.keys(threads).filter(id=>S.itemsById[id]);
  let body='';
  if(!ids.length) body='<section class="panel"><div class="panel__body"><div class="empty-state">'+
    'No conversation yet. Open any piece and leave a comment against the stage you are asking about — '+
    'that way the question stays attached to the work.</div></div></section>';
  else body=ids.map(id=>{
    const it=S.itemsById[id];
    const list=threads[id].slice().sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
    const last=list[list.length-1];
    return '<section class="panel space-top-14"><div class="panel__head"><div>'+
      '<h3 class="panel__title">'+esc(it.product)+'</h3>'+
      '<p class="panel__description">'+list.length+' message'+(list.length===1?'':'s')+
      ' · last '+esc(ftime(last.created_at))+'</p></div>'+
      (last.author_role==='admin'?badge('Reply from us','pending'):'')+'</div>'+
      '<div class="panel__body">'+list.slice(-3).map(c=>
        '<article class="comment"><div class="comment__head">'+
        '<strong>'+esc(c.author_role==='admin'?(S.settings.company_name||'Gujraj Impex'):(c.author_name||'You'))+'</strong>'+
        '<span>'+esc(ftime(c.created_at))+'</span></div>'+
        '<p>'+esc(c.body)+'</p></article>').join('')+
      '<div class="button-row space-top-12"><button class="button button--secondary" type="button" onclick="go(\'#/item/'+it.id+'\')">Open the piece and reply</button></div>'+
      '</div></section>';
  }).join('');
  paintPlain(buyerPage('Messages.','Your conversation with us',
    'Every question stays attached to the piece it is about.', '', body));
}

</script>
<script>
'use strict';
window.__openStages={};
function toggleStage(itemId, stageId){
  const k=itemId+'-'+stageId;
  window.__openStages[k]=!window.__openStages[k];
  render();
}

async function doLogin(){
  const email=normLogin($('li-email').value), pass=$('li-pass').value;
  if(!email||!pass) return;
  $('loading').style.display='flex';
  const {error} = await sb.auth.signInWithPassword({email, password:pass});
  if(error){ $('loading').style.display='none'; vLogin(error.message==='Invalid login credentials'?'Incorrect email or password.':error.message); return; }
}
async function signOut(){ await sb.auth.signOut(); location.hash='#/home'; }

function setBuyerFilter(v){ S.buyerFilter=v; refreshHard(); }
async function refreshHard(){ $('loading').style.display='flex'; try{ await loadData(); }catch(e){ toast('Could not refresh: '+(e.message||e), {err:true}); }
  $('loading').style.display='none'; render(); }

async function markRead(itemId){
  if(unreadCount(itemId)===0 && S.readMarks[itemId]) return;
  try{ await sb.rpc('bt_mark_read', {p_item:itemId}); S.readMarks[itemId]=new Date().toISOString(); updateHeader(); }catch(e){}
}

async function sendComment(itemId, stageId){
  const ta=$('cmt-'+stageId); if(!ta) return;
  const body=ta.value.trim(); if(!body){ toast('Write a comment first'); return; }
  const attach=window.__cmtAttach && window.__cmtAttach.key===itemId+'-'+stageId ? window.__cmtAttach.path : null;
  const {error} = await sb.from('bt_comments').insert({
    item_id:itemId, stage_id:stageId, author_id:uid(),
    author_role:isAdmin()?'admin':'buyer',
    author_name:S.profile.full_name||S.profile.email||'',
    body, attachment_path:attach
  });
  if(error){ toast('Could not send: '+error.message, {err:true}); return; }
  window.__cmtAttach=null;
  window.__openStages[itemId+'-'+stageId]=true;
  await loadData(); render();
  if(isAdmin()){
    const it=S.itemsById[itemId];
    offerWhatsApp(it, 'New note on '+it.product+' ('+(it.po?it.po.po_number:'')+'): '+body);
  }
}

async function attachToComment(itemId, stageId){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async ()=>{
    const f=inp.files[0]; if(!f) return;
    toast('Uploading photo…');
    const blob=await resizeImage(f);
    const buyerId=isAdmin()?(S.itemsById[itemId].po.buyer_id):(S.profile.buyer_id);
    const path=buyerId+'/comments/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
    const {error}=await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
    if(error){ toast('Upload failed: '+error.message,{err:true}); return; }
    window.__cmtAttach={key:itemId+'-'+stageId, path};
    toast('Photo attached — it will be sent with your comment.');
  };
  inp.click();
}

async function respondApproval(itemId, stageId, decision){
  let note=null;
  if(decision==='changes_requested'){ note=prompt('What changes are needed?'); if(note===null) return; }
  const {error}=await sb.rpc('bt_respond_approval',{p_item:itemId,p_stage:stageId,p_decision:decision,p_note:note});
  if(error){ toast(error.message,{err:true}); return; }
  toast(decision==='approved'?'Approved. Thank you!':'Sent to the workshop.');
  await loadData(); render();
}
async function requestApproval(itemId, stageId, on){
  let note=null;
  if(on){ note=prompt('Note for the buyer (optional):','Please review and approve.'); if(note===null) return; }
  const {error}=await sb.rpc('bt_request_approval',{p_item:itemId,p_stage:stageId,p_on:on,p_note:note});
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
  if(on){
    const it=S.itemsById[itemId]; const st=S.stagesById[stageId];
    offerWhatsApp(it, waMsgApproval(it, st));
  }
}

function gSearch(v){ window.__gq=v; render(); }

async function markUpdateSent(buyerId){
  const {error}=await sb.rpc('bt_mark_update_sent',{p_buyer:buyerId});
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
}
function sendBuyerUpdate(buyerId){
  const b=S.buyersById[buyerId];
  if(!b.phone){ toast('Add a WhatsApp number for this buyer first',{err:true}); go('#/buyers'); return; }
  window.open(waLink(b.phone, buyerUpdateText(buyerId)),'_blank');
  markUpdateSent(buyerId);
}

// One tap from any list: finish the running stage, or start the next one.
async function quickAdvance(itemId){
  const it=S.itemsById[itemId]; const nx=nextStageFor(it);
  if(!nx){ toast('All stages are complete for this item'); return; }
  const {error}=await sb.rpc('bt_advance',{p_item:itemId,p_stage:nx.stage.id,p_date:today(),p_complete:nx.complete});
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
  offerWhatsApp(S.itemsById[itemId], waMsgStage(S.itemsById[itemId], nx.stage, nx.complete));
}

// Staff: photos of the day's work, not tied to one order. Internal only.
function pickDaily(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange=async ()=>{
    const files=[...inp.files]; if(!files.length) return;
    const note=prompt('What is this? (optional, e.g. "Moulding bay — 3 blocks dressed")')||null;
    toast('Uploading '+files.length+' photo'+(files.length>1?'s':'')+'…');
    const d=today(); let ok=0;
    for(let i=0;i<files.length;i++){
      const blob=await resizeImage(files[i]);
      const path='staff/daily/'+d+'/'+Date.now()+'-'+i+'.jpg';
      const up=await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
      if(up.error){ toast('Upload failed: '+up.error.message,{err:true}); continue; }
      const ins=await sb.from('bt_photos').insert({log_date:d, note, path, uploaded_by:uid(),
        status: isStaff()?'pending':'approved'});
      if(!ins.error) ok++;
    }
    await loadData(); render();
    if(ok) toast(ok+' photo'+(ok>1?'s':'')+' added to today\'s production log');
  };
  inp.click();
}

async function advance(itemId, stageId, complete){
  const {error}=await sb.rpc('bt_advance',{p_item:itemId,p_stage:stageId,p_date:today(),p_complete:complete});
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
  const it=S.itemsById[itemId]; const st=S.stagesById[stageId];
  offerWhatsApp(it, waMsgStage(it, st, complete));
}
async function setStage(itemId, stageId, status){
  const row=(S.stByItem[itemId]||[]).find(r=>r.stage_id===stageId)||{};
  const {error}=await sb.rpc('bt_stage_set',{p_item:itemId,p_stage:stageId,p_status:status,
    p_started:row.started_at||today(), p_completed:status==='completed'?(row.completed_at||today()):null, p_note:row.note||null});
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
}
function mNote(itemId, stageId){
  const row=(S.stByItem[itemId]||[]).find(r=>r.stage_id===stageId)||{};
  const m=modal('<h3>Workshop note</h3><div class="sub">Visible to the buyer on the timeline.</div>'+
    '<div class="form-grid"><div class="field field--full"><label for="nt">Note</label><textarea id="nt" rows="3">'+esc(row.note||'')+'</textarea></div>'+
    '<div class="button-row field--full"><button class="button" type="button" id="nt-save">Save</button>'+
    '<button class="button button--secondary" type="button" onclick="closeModal()">Cancel</button></div></div>');
  m.m.querySelector('#nt-save').onclick=async ()=>{
    const {error}=await sb.rpc('bt_stage_set',{p_item:itemId,p_stage:stageId,p_status:row.status||'pending',
      p_started:row.started_at, p_completed:row.completed_at, p_note:$('nt').value.trim()||null});
    if(error){ toast(error.message,{err:true}); return; }
    closeModal(); await loadData(); render();
  };
}

// ---- Planned dates, holds and conditional stages ------------------------
// All of this writes to bt_stage_internal, which the buyer has no policy on.

async function saveStageInternal(itemId, stageId, patch){
  const row = Object.assign({ item_id:itemId, stage_id:stageId, updated_by:uid(),
                              updated_at:new Date().toISOString() }, patch);
  const {error} = await sb.from('bt_stage_internal').upsert(row, {onConflict:'item_id,stage_id'});
  return error;
}

function mPlan(itemId, stageId){
  const st = S.stagesById[stageId] || {};
  const si = stageInternal(itemId, stageId) || {};
  const m = modal('<h3>Planned date</h3><div class="sub">'+esc(st.name||'Stage')+
    ' — for the workshop. The buyer never sees this; he sees the delivery date.</div>'+
    '<div class="form-grid"><div class="field field--full"><label for="pl-d">Planned completion</label>'+
    '<input id="pl-d" type="date" value="'+esc(si.planned_date||'')+'"></div>'+
    '<div class="button-row field--full"><button class="button" type="button" id="pl-save">Save</button>'+
    (si.planned_date?'<button class="button button--quiet" type="button" id="pl-clear">Clear</button>':'')+
    '<button class="button button--secondary" type="button" onclick="closeModal()">Cancel</button></div></div>');
  const write = async (v)=>{
    const err = await saveStageInternal(itemId, stageId, { planned_date: v || null });
    if(err){ toast(err.message,{err:true}); return; }
    closeModal(); await loadData(); render();
  };
  m.m.querySelector('#pl-save').onclick = ()=> write($('pl-d').value || null);
  const c = m.m.querySelector('#pl-clear'); if(c) c.onclick = ()=> write(null);
}

// A hold without a reason, an owner and a revised date is just a stalled job
// nobody is accountable for, so all three are asked for here.
function mHold(itemId, stageId){
  const st = S.stagesById[stageId] || {};
  const si = stageInternal(itemId, stageId) || {};
  const m = modal('<h3>Put on hold</h3><div class="sub">'+esc(st.name||'Stage')+
    ' — workshop only. Nothing here reaches the buyer.</div>'+
    '<div class="form-grid">'+
    '<div class="field field--full"><label for="hd-r">Why is it held</label>'+
    '<input id="hd-r" placeholder="Tool repair pending" value="'+esc(si.hold_reason||'')+'"></div>'+
    '<div class="field"><label for="hd-o">Who is on it</label>'+

  m.m.querySelector('#hd-save').onclick = async ()=>{

      hold_revised_date: $('hd-d').value || null
    });

async function liftHold(itemId, stageId){
  const err = await saveStageInternal(itemId, stageId,
    { hold_reason:null, hold_owner:null, hold_revised_date:null });
  if(err){ toast(err.message,{err:true}); return; }
  // A stage held before it ever started goes back to pending, not in progress —
  // otherwise lifting a hold silently claims work has begun.
  const row = (S.stByItem[itemId]||[]).find(r=>r.stage_id===stageId) || {};
  await setStage(itemId, stageId, row.started_at ? 'in_progress' : 'pending');
  toast('Hold lifted.');
}

// Conditional stages: a plain slab is never moulded, and the timeline should

// Closing a buyer's question so the "what needs you" panel empties.
// This goes through bt_comment_resolve rather than a plain update: the UPDATE
// policy on bt_comments is "author_id = auth.uid()", so an admin updating a
// buyer's row matched nothing and failed silently. The RPC also means an admin
// can close a comment but never rewrite what the buyer actually wrote.
async function setCommentResolved(commentId, resolved){
  const {error} = await sb.rpc('bt_comment_resolve', {p_id: commentId, p_resolved: resolved});
  if(error){ toast(error.message,{err:true}); return false; }
  await loadData(); render();
  return true;
}
async function resolveComment(commentId){
  if(await setCommentResolved(commentId, true)) toast('Marked as dealt with.');
}
async function reopenComment(commentId){
  await setCommentResolved(commentId, false);
}

// Reference media for a piece: the approved drawing, a 3D model, photographs of
// the block that was signed off, and a picture of what it should end up as.
// Images become photos (so they follow the ordinary approval rules); CAD and 3D
// files become documents, because there is nothing to look at in a browser.
const MEDIA_KINDS = {
  drawing:   { label:'Production drawing', hint:'PDF or image of the approved drawing',
               accept:'application/pdf,image/*,.pdf,.dwg,.dxf' },
  model:     { label:'3D model', hint:'STEP, STL, OBJ, 3DM, SKP — for the workshop',
               accept:'.step,.stp,.stl,.obj,.3dm,.skp,.igs,.iges,.fbx,.glb,.gltf,.zip' },
  block:     { label:'Approved block', hint:'The block the buyer signed off',
               accept:'image/*' },
  reference: { label:'Target product', hint:'What the finished piece should look like',
               accept:'image/*' }
};
const _isImage = f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(f.name);

function mMedia(itemId){
  const it = S.itemsById[itemId]; if(!it) return;
  const m = modal('<h3>Reference media</h3><div class="sub">'+esc(it.product)+
    ' — drawings, 3D models and reference photographs for this piece.</div>'+
    '<div class="panel__body">'+
    Object.keys(MEDIA_KINDS).map(k=>{
      const d = MEDIA_KINDS[k];
      return '<div class="login-row"><div class="grow"><strong>'+esc(d.label)+'</strong>'+
        '<p class="field-hint">'+esc(d.hint)+'</p></div>'+
        '<div class="button-row"><button class="button button--secondary" type="button" data-mk="'+k+'">Upload</button></div></div>';
    }).join('')+'</div>'+
    '<p class="field-hint">Files here are visible to the workshop straight away. The buyer sees an image only once you approve it, and a drawing only if you tick it for him.</p>'+
    '<div class="button-row"><button class="button button--secondary" type="button" onclick="closeModal()">Done</button></div>');
  m.m.querySelectorAll('[data-mk]').forEach(b=>{
    b.onclick = ()=> pickMedia(itemId, b.getAttribute('data-mk'));
  });
}

function pickMedia(itemId, kind){
  const spec = MEDIA_KINDS[kind] || MEDIA_KINDS.reference;
  const inp = document.createElement('input');
  inp.type='file'; inp.accept=spec.accept; inp.multiple=true;
  inp.onchange = async ()=>{
    const files=[...inp.files]; if(!files.length) return;
    const it = S.itemsById[itemId]; if(!it) return;
    const buyerId = it.po && it.po.buyer_id;
    closeModal();
    $('loading').style.display='flex';
    let ok=0, failed=0;
    for(let i=0;i<files.length;i++){
      const f = files[i];
      try{
        if(_isImage(f)){
          const blob = await resizeImage(f);
          const path = buyerId+'/items/'+itemId+'/'+kind+'-'+Date.now()+'-'+i+'.jpg';
          const up = await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
          if(up.error) throw up.error;
          const ins = await sb.from('bt_photos').insert({
            item_id:itemId, po_id:it.po_id, path, uploaded_by:uid(),
            status: isStaff()?'pending':'approved', photo_type:kind,
            caption: MEDIA_KINDS[kind].label });
          if(ins.error) throw ins.error;
        } else {
          const safe = f.name.replace(/[^A-Za-z0-9._-]/g,'_').slice(-80);
          const path = buyerId+'/items/'+itemId+'/'+kind+'-'+Date.now()+'-'+safe;
          const up = await sb.storage.from(CONFIG.bucket).upload(path, f, {contentType: f.type||'application/octet-stream'});
          if(up.error) throw up.error;
          // po_id is set as well as item_id so the existing document policy,
          // which reasons about the order, keeps working unchanged
          const ins = await sb.from('bt_documents').insert({
            po_id: it.po_id, item_id: itemId, name: f.name, doc_type: kind, path,
            uploaded_by: uid(), for_staff: true, for_buyer: kind==='drawing' });
          if(ins.error) throw ins.error;
        }
        ok++;
      }catch(e){ failed++; }
    }
    await loadData();
    $('loading').style.display='none';
    render();
    if(ok) toast(ok+' file'+(ok===1?'':'s')+' added'+(failed?', '+failed+' failed':'')+'.', failed?{err:true}:undefined);
    else toast('Nothing uploaded — check the connection and try again.',{err:true});
  };
  inp.click();
}

function pickPhotos(itemId, stageId, poId){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange=async ()=>{
    const files=[...inp.files]; if(!files.length) return;
    toast('Uploading '+files.length+' photo'+(files.length>1?'s':'')+'…');
    const it=itemId?S.itemsById[itemId]:null;
    const staff=isStaff();
    const buyerId=staff?null:(it?it.po.buyer_id:(S.posById[poId]||{}).buyer_id);
    const stKey=stageId?((S.stagesById[stageId]||{}).key||'stage'):(itemId?'item':'order');
    const base=staff?('staff/'+(itemId||poId)+'/')
                    :(itemId?(buyerId+'/items/'+itemId+'/'):(buyerId+'/po/'+poId+'/'));
    let ok=0;
    for(let i=0;i<files.length;i++){
      const blob=await resizeImage(files[i]);
      const path=base+stKey+'-'+Date.now()+'-'+i+'.jpg';
      const up=await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
      if(up.error){ toast('Upload failed: '+up.error.message,{err:true}); continue; }
      const ins=await sb.from('bt_photos').insert({item_id:itemId||null, stage_id:stageId||null, po_id:poId||null,
        path, uploaded_by:uid(), status: staff?'pending':'approved'});
      if(!ins.error) ok++;
    }
    if(itemId&&stageId) window.__openStages[itemId+'-'+stageId]=true;
    await loadData(); render();
    if(ok) toast(staff? (ok+' photo'+(ok>1?'s':'')+' sent to the office for approval') : (ok+' photo'+(ok>1?'s':'')+' added'));
  };
  inp.click();
}

async function setPhotoStatus(ids, status){
  if(!isAdmin()) return;
  if(status==='rejected' && !confirm('Send these photos back to the staff? The client will not see them.')) return;
  const {error}=await sb.from('bt_photos').update({status}).in('id', ids);
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
  if(status==='approved'){
    const first=S.photos.find(p=>p.id===ids[0]);
    const it=first&&first.item_id?S.itemsById[first.item_id]:null;
    if(it) offerWhatsApp(it, (S.settings.company_name||'Gujraj Impex')+' — new photos\n'+it.product+' ('+(it.po?it.po.po_number:'')+')\nPlease see the latest photos on your tracker: '+trackerUrl());
    else toast(ids.length+' photo'+(ids.length>1?'s':'')+' approved and now visible to the client');
  } else toast('Sent back to staff');
}
async function delPhoto(ev, id, path){
  ev.stopPropagation();
  if(!confirm('Delete this photo?')) return;
  // The file goes first, then the row. Storage permission for a staff member is
  // granted by the photo row still being there and still unapproved, so deleting
  // the row first would leave the image stranded in the bucket for ever.
  if(path){
    const {error}=await sb.storage.from(CONFIG.bucket).remove([path]);
    if(error){ toast('Could not remove the file: '+error.message,{err:true}); return; }
  }
  const {error}=await sb.from('bt_photos').delete().eq('id', id);
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
}
async function openPhoto(ev, node){
  if(ev) ev.stopPropagation();
  const u=node.getAttribute('data-ph-url')||await signedUrl(node.getAttribute('data-ph-path'));
  if(u) lightbox(u, node.getAttribute('data-cap')||'');
}
async function openDoc(path){
  const u=await signedUrl(path);
  if(u) window.open(u, '_blank');
}
function pickDoc(poId){
  const inp=document.createElement('input'); inp.type='file';
  inp.onchange=async ()=>{
    const f=inp.files[0]; if(!f) return;
    const p=S.posById[poId];
    toast('Uploading…');
    const clean=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=p.buyer_id+'/po/'+poId+'/'+Date.now()+'-'+clean;
    const up=await sb.storage.from(CONFIG.bucket).upload(path, f, {contentType:f.type||'application/octet-stream'});
    if(up.error){ toast('Upload failed: '+up.error.message,{err:true}); return; }
    const type=prompt('Document type (e.g. PO copy, Drawing, Packing list, Invoice, BL/LR):','')||null;
    const isDwg=/draw/i.test(type||'');
    await sb.from('bt_documents').insert({po_id:poId, name:f.name, doc_type:type, path, uploaded_by:uid(),
      for_staff:isDwg||confirm('Show this document to the production staff?'),
      for_buyer:confirm('Show this document to the buyer?')});
    await loadData(); render();
  };
  inp.click();
}
async function delDoc(id, path){
  if(!confirm('Remove this document?')) return;
  await sb.from('bt_documents').delete().eq('id', id);
  await sb.storage.from(CONFIG.bucket).remove([path]);
  await loadData(); render();
}

/* ---------------------------------------------------------------------------
   Daily workshop update — submission (staff and admin).

   Camera-first: the file input carries capture="environment" so a phone opens
   straight into the camera. Photos are resized through a canvas, which also
   strips EXIF, so no GPS ever reaches a buyer. Nothing is buyer-visible until
   the owner publishes: photos go in as 'pending' and the update as 'pending'.
--------------------------------------------------------------------------- */

window.__du = { files: [], itemId: null, stageId: null };

function mDailyUpdate(itemId, stageId){
  const it = S.itemsById[itemId];
  if(!it) return;
  const stage = S.stagesById[stageId || it.current_stage_id];
  const existing = updateToday(itemId);

  const stages = S.stages.filter(s=>s.active);
  const prompts = promptsFor(stage);

  modal('<h3>Today’s update</h3><div class="sub">'+esc(it.product)+
      (it.item_ref?' · '+esc(it.item_ref):'')+' · '+esc(fdate(today()))+'</div>'+
    (existing ? '<div class="attn attn--warn attn--flat"><span>An update for today already exists ('+
        esc(existing.review_status.replace(/_/g,' '))+'). Adding another keeps both — nothing is overwritten.</span></div>' : '')+
    '<div class="form-grid">'+
      '<div class="field field--full"><label for="du-stage">Stage worked on</label><select id="du-stage">'+
        stages.map(s=>'<option value="'+s.id+'"'+(stage&&s.id===stage.id?' selected':'')+'>'+esc(s.name)+'</option>').join('')+
      '</select></div>'+

      '<div class="upload-drop field--full" id="du-drop">'+
        '<div>'+icon('i-camera','icon--lg')+
        '<strong>Add today’s photos</strong>'+
        '<p>'+prompts.map(p=>esc(p)).join(' · ')+'</p>'+
        '<div class="button-row" style="justify-content:center">'+
          '<button class="button button--workshop" type="button" id="du-cam">'+icon('i-camera','icon--sm')+'Take photos</button>'+
          '<button class="button button--secondary" type="button" id="du-pick">Choose images</button>'+
        '</div>'+
        '<input id="du-cam-input" type="file" accept="image/*" capture="environment" multiple hidden>'+
        '<input id="du-file-input" type="file" accept="image/*" multiple hidden>'+
      '</div></div>'+
      '<div class="field--full" id="du-previews"></div>'+

      '<div class="field field--full"><label for="du-summary">What was done today</label>'+
        '<textarea id="du-summary" rows="3" placeholder="e.g. First block dressed on four faces. Dimensions checked against the approved drawing."></textarea>'+
        '<p class="field-hint">The office may edit this before the client sees it.</p></div>'+

      '<div class="field field--full"><label for="du-internal">Internal note <span class="muted">(the client never sees this)</span></label>'+
        '<textarea id="du-internal" rows="2" placeholder="Workshop or quality note"></textarea></div>'+

      '<label class="check-row field--full"><input type="checkbox" id="du-blocked" onchange="duToggle()">'+
        '<span>Work is blocked or delayed</span></label>'+
      '<div class="field field--full" id="du-blocker" hidden><label for="du-blocker-why">What is blocking it</label>'+
        '<input id="du-blocker-why" placeholder="Waiting for drawing approval, tool repair, material…">'+
        '<label for="du-blocker-who" class="space-top-10">Who is chasing it</label><input id="du-blocker-who">'+
        '<label for="du-blocker-date" class="space-top-10">Revised completion date</label><input id="du-blocker-date" type="date"></div>'+

      '<label class="check-row field--full"><input type="checkbox" id="du-nowork" onchange="duToggle()">'+
        '<span>No work today</span></label>'+
      '<div class="field field--full" id="du-nowork-why" hidden><label for="du-nowork-reason">Why</label>'+
        '<select id="du-nowork-reason"><option value="">Choose a reason</option>'+
        ['Curing / drying time','Waiting for buyer approval','Waiting for material','Planned workshop pause','Holiday / non-working day','Other']
          .map(x=>'<option>'+x+'</option>').join('')+'</select></div>'+

      '<div class="button-row field--full"><button class="button button--wide button--workshop" type="button" id="du-save">Submit for review</button>'+
      '<button class="button button--secondary" type="button" onclick="closeModal()">Cancel</button></div>'+
    '</div>');

  const pick = cap => { const i = document.getElementById(cap ? 'du-cam-input' : 'du-file-input'); i.value=''; i.click(); };
  document.getElementById('du-cam').onclick  = e => { e.preventDefault(); pick(true); };
  document.getElementById('du-pick').onclick = e => { e.preventDefault(); pick(false); };
  ['du-cam-input','du-file-input'].forEach(id=>{
    document.getElementById(id).onchange = ev => duAdd(ev.target.files);
  });
  const drop = document.getElementById('du-drop');
  drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('is-over'); });
  drop.addEventListener('dragleave', ()=>drop.classList.remove('is-over'));
  drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('is-over'); duAdd(e.dataTransfer.files); });
  document.getElementById('du-save').onclick = duSubmit;
}

function duToggle(){
  const b=document.getElementById('du-blocked'), n=document.getElementById('du-nowork');
  document.getElementById('du-blocker').hidden = !b.checked;
  document.getElementById('du-nowork-why').hidden = !n.checked;
  // a no-work day needs no photos and no summary
  document.getElementById('du-summary').disabled = n.checked;
  document.getElementById('du-cam').disabled = n.checked;
  document.getElementById('du-pick').disabled = n.checked;
}

function duAdd(list){
  const imgs=[...(list||[])].filter(f=>/^image\//.test(f.type));
  if(!imgs.length) return;
  imgs.forEach(f=>{
    // same name + size + modified time in one submission is an accidental double-pick
    if(window.__du.files.some(x=>x.file.name===f.name && x.file.size===f.size && x.file.lastModified===f.lastModified)) return;
    window.__du.files.push({ file:f, url:URL.createObjectURL(f), id:'f'+Math.random().toString(36).slice(2,9) });
  });
  duRenderPreviews();
}
function duRemove(id){
  const f=window.__du.files.find(x=>x.id===id);
  if(f) URL.revokeObjectURL(f.url);
  window.__du.files=window.__du.files.filter(x=>x.id!==id);
  duRenderPreviews();
}
function duRenderPreviews(){
  const el=document.getElementById('du-previews'); if(!el) return;
  const fs=window.__du.files;
  el.innerHTML = !fs.length ? '' :
    '<p class="field-hint">'+fs.length+' photo'+(fs.length===1?'':'s')+' ready. Remove anything blurred or duplicated.</p>'+
    '<div class="photo-grid">'+fs.map(f=>
      '<div class="photo-card"><div class="photo-placeholder is-loaded" style="cursor:zoom-in" onclick="lightbox(\''+f.url+'\',\''+esc(f.file.name)+'\')">'+
      '<img alt="" src="'+f.url+'">'+
      '<button class="ph-del" type="button" title="Remove" onclick="event.stopPropagation();duRemove(\''+f.id+'\')">✕</button>'+
      '</div></div>').join('')+'</div>';
}

async function duSubmit(){
  const d=window.__du;
  const noWork=document.getElementById('du-nowork').checked;
  const blocked=document.getElementById('du-blocked').checked;
  const summary=document.getElementById('du-summary').value.trim();
  const stageId=Number(document.getElementById('du-stage').value)||null;

  if(noWork && !document.getElementById('du-nowork-reason').value){ toast('Choose a reason for no work today',{err:true}); return; }
  if(!noWork && !d.files.length){ toast('Add at least one photo of today’s work',{err:true}); return; }
  if(!noWork && !summary){ toast('Write one line about what was done',{err:true}); return; }
  if(blocked && !document.getElementById('du-blocker-why').value.trim()){ toast('Say what is blocking it',{err:true}); return; }

  const btn=document.getElementById('du-save');
  btn.disabled=true; btn.textContent='Uploading…';
  const staff=isStaff();
  try{
    const ins=await sb.from('bt_updates').insert({
      item_id:d.itemId, stage_id:stageId, work_date:today(),
      work_status: noWork?'no_work':(blocked?'blocked':'worked'),
      public_summary: noWork?null:summary,
      no_work_reason: noWork?document.getElementById('du-nowork-reason').value:null,
      review_status:'pending', submitted_by:uid()
    }).select().single();
    if(ins.error) throw ins.error;
    const updateId=ins.data.id;

    const internal=document.getElementById('du-internal').value.trim();
    if(internal || blocked){
      await sb.from('bt_update_internal').insert({
        update_id:updateId, internal_note:internal||null,
        blocker_reason: blocked?document.getElementById('du-blocker-why').value.trim():null,
        blocker_owner: blocked?(document.getElementById('du-blocker-who').value.trim()||null):null,
        revised_completion_date: blocked?(document.getElementById('du-blocker-date').value||null):null });
    }

    let done=0, failed=0;
    for(let i=0;i<d.files.length;i++){
      btn.textContent='Uploading '+(i+1)+' of '+d.files.length+'…';
      try{
        const blob=await resizeImage(d.files[i].file);   // canvas redraw: strips EXIF/GPS
        const path=(staff?'staff/':'')+'daily/'+d.itemId+'/'+updateId+'-'+i+'.jpg';
        const up=await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
        if(up.error) throw up.error;
        const pi=await sb.from('bt_photos').insert({ item_id:d.itemId, stage_id:stageId, update_id:updateId,
          path, uploaded_by:uid(), status:'pending', display_order:i });
        if(pi.error) throw pi.error;
        done++;
      }catch(e){ failed++; }
    }
    if(failed && !done){
      // keep the chosen photos so a bad connection does not lose the work
      btn.disabled=false; btn.textContent='Retry upload';
      toast('No photos uploaded — check the connection and press Retry. Your photos are still here.',{err:true});
      return;
    }
    d.files.forEach(f=>URL.revokeObjectURL(f.url));
    window.__du={files:[],itemId:null,stageId:null};
    closeModal();
    await loadData(); render();
    toast(noWork ? 'Recorded: no work today.'
      : done+' photo'+(done===1?'':'s')+' sent to the office for approval'+(failed?' ('+failed+' failed)':''));
  }catch(e){
    btn.disabled=false; btn.textContent='Submit for review';
    toast('Could not save: '+(e.message||e),{err:true});
  }
}

function ruToggle(el){ const on=el.getAttribute('data-on')==='1'; el.setAttribute('data-on', on?'0':'1');
  const b=el.querySelector('.badge');
  b.className='badge badge--'+(on?'alert':'success'); b.textContent=on?'Excluded':'Included'; }

async function ruPublish(updateId){
  const u=(S.updates||[]).find(x=>x.id===updateId); if(!u) return;
  const cards=[...document.querySelectorAll('#ru-photos .photo-card')];
  const keep=cards.filter(c=>c.getAttribute('data-on')==='1').map(c=>c.getAttribute('data-id'));
  const drop=cards.filter(c=>c.getAttribute('data-on')!=='1').map(c=>c.getAttribute('data-id'));
  const el=document.getElementById('ru-summary');
  const summary=el?el.value.trim():null;
  try{
    if(keep.length){ const r=await sb.from('bt_photos').update({status:'approved', rejection_reason:null}).in('id',keep); if(r.error) throw r.error; }
    if(drop.length){ const r=await sb.from('bt_photos').update({status:'rejected'}).in('id',drop); if(r.error) throw r.error; }
    const patch={ review_status: drop.length?'partially_approved':'approved',
                  published_at:new Date().toISOString(), reviewed_by:uid(), reviewed_at:new Date().toISOString(),
                  updated_at:new Date().toISOString() };
    if(el && summary!==u.public_summary){
      if(!u.public_summary_original) patch.public_summary_original = u.public_summary;
      patch.public_summary = summary;
    }
    const r=await sb.from('bt_updates').update(patch).eq('id',updateId);
    if(r.error) throw r.error;
    closeModal(); await loadData(); render();
    const it=S.itemsById[u.item_id];
    if(it) offerWhatsApp(it, (S.settings.company_name||'Gujraj Impex')+' — progress on '+it.product+
      '\n'+(summary||'')+'\nPhotos on your tracker: '+trackerUrl());
    else toast('Published to the client');
  }catch(e){ toast(e.message||String(e),{err:true}); }
}

async function ruChanges(updateId){
  const why=prompt('What should the workshop reshoot?','Please retake the full view — it is out of focus.');
  if(why===null) return;
  try{
    const ids=(S.photosByUpdate[updateId]||[]).map(p=>p.id);
    if(ids.length) await sb.from('bt_photos').update({status:'rejected', rejection_reason:why||null}).in('id',ids);
    const r=await sb.from('bt_updates').update({review_status:'changes_requested', reviewed_by:uid(),
      reviewed_at:new Date().toISOString(), updated_at:new Date().toISOString()}).eq('id',updateId);
    if(r.error) throw r.error;
    closeModal(); await loadData(); render();
    toast('Sent back to the workshop');
  }catch(e){ toast(e.message||String(e),{err:true}); }
}

// One message listing everything still missing, rather than one tap per piece.
function remindAll(){
  const missing = itemsMissingToday();
  if(!missing.length){ toast('Every active piece has today’s update.'); return; }
  const lines = missing.map(it=>'• '+it.product).join('\n');
  const text = 'StoneFlow — still missing today’s update:\n'+lines+
    '\n\nPlease add a photo and a line for each.';

// A WhatsApp deep link opens one chat, so with several people on the floor the
// recipient has to be chosen rather than silently assumed to be the first one.
// The window is opened synchronously in the click; the logging happens after.
function sendReminder(text, logFn){
  const who = staffPhones();
  if(!who.length){
    toast('No staff has a WhatsApp number yet — add one from Buyers & logins.',{err:true});
    return;
  }
  if(who.length === 1){
    window.open(waLink(who[0].phone, text), '_blank');
    toast('Opening WhatsApp for '+who[0].name+'.');
    if(logFn) Promise.resolve(logFn()).catch(()=>{});
    return;
  }
  const m = modal('<h3>Send to whom?</h3><div class="sub">WhatsApp opens one chat at a time.</div>'+
    '<div class="panel__body">'+who.map((w,i)=>
      '<div class="login-row"><div class="grow"><strong>'+esc(w.name)+'</strong>'+
      '<p class="field-hint">'+esc(w.phone)+'</p></div>'+
      '<div class="button-row"><button class="button" type="button" data-rm="'+i+'">Send</button></div></div>'
    ).join('')+'</div>');
  m.m.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.onclick = ()=>{
      const w = who[+btn.getAttribute('data-rm')];
      window.open(waLink(w.phone, text), '_blank');
      closeModal();
      toast('Opening WhatsApp for '+w.name+'.');
      if(logFn) Promise.resolve(logFn()).catch(()=>{});
    };
  });
}

async function adminApi(body){
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(CONFIG.url+'/functions/v1/admin-api',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':CONFIG.anon,'Authorization':'Bearer '+session.access_token},
