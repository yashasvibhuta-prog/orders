      (it.item_ref?' · '+esc(it.item_ref):'')+' · '+esc(fdate(today()))+'</div>'+
    (existing ? '<div class="attn attn--warn attn--flat"><span>An update for today already exists ('+
        esc(existing.review_status.replace(/_/g,' '))+'). Adding another keeps both — nothing is overwritten.</span></div>' : '')+
    '<div class="form-grid">'+
      '<div class="field field--full"><label for="du-stage">Stage worked on</label><select id="du-stage">'+
        stages.map(s=>'<option value="'+s.id+'"'+(stage&&s.id===stage.id?' selected':'')+'>'+esc(s.name)+'</option>').join('')+
      '</select></div>'+

      '<div class="upload-drop field--full" id="du-drop">'+
        '<div>'+icon('i-camera','icon--lg')+
        '<strong>Add today’s photos</strong>'+
        '<p>'+prompts.map(p=>esc(p)).join(' · ')+'</p>'+
        '<div class="button-row" style="justify-content:center">'+
          '<button class="button button--workshop" type="button" id="du-cam">'+icon('i-camera','icon--sm')+'Take photos</button>'+
          '<button class="button button--secondary" type="button" id="du-pick">Choose images</button>'+
        '</div>'+
        '<input id="du-cam-input" type="file" accept="image/*" capture="environment" multiple hidden>'+
        '<input id="du-file-input" type="file" accept="image/*" multiple hidden>'+
      '</div></div>'+
      '<div class="field--full" id="du-previews"></div>'+

      '<div class="field field--full"><label for="du-summary">What was done today</label>'+
        '<textarea id="du-summary" rows="3" placeholder="e.g. First block dressed on four faces. Dimensions checked against the approved drawing."></textarea>'+
        '<p class="field-hint">The office may edit this before the client sees it.</p></div>'+

      '<div class="field field--full"><label for="du-internal">Internal note <span class="muted">(the client never sees this)</span></label>'+
        '<textarea id="du-internal" rows="2" placeholder="Workshop or quality note"></textarea></div>'+

      '<label class="check-row field--full"><input type="checkbox" id="du-blocked" onchange="duToggle()">'+
        '<span>Work is blocked or delayed</span></label>'+
      '<div class="field field--full" id="du-blocker" hidden><label for="du-blocker-why">What is blocking it</label>'+
        '<input id="du-blocker-why" placeholder="Waiting for drawing approval, tool repair, material…">'+
        '<label for="du-blocker-who" class="space-top-10">Who is chasing it</label><input id="du-blocker-who">'+
        '<label for="du-blocker-date" class="space-top-10">Revised completion date</label><input id="du-blocker-date" type="date"></div>'+

      '<label class="check-row field--full"><input type="checkbox" id="du-nowork" onchange="duToggle()">'+
        '<span>No work today</span></label>'+
      '<div class="field field--full" id="du-nowork-why" hidden><label for="du-nowork-reason">Why</label>'+
        '<select id="du-nowork-reason"><option value="">Choose a reason</option>'+
        ['Curing / drying time','Waiting for buyer approval','Waiting for material','Planned workshop pause','Holiday / non-working day','Other']
          .map(x=>'<option>'+x+'</option>').join('')+'</select></div>'+

      '<div class="button-row field--full"><button class="button button--wide button--workshop" type="button" id="du-save">Submit for review</button>'+
      '<button class="button button--secondary" type="button" onclick="closeModal()">Cancel</button></div>'+
    '</div>');

  const pick = cap => { const i = document.getElementById(cap ? 'du-cam-input' : 'du-file-input'); i.value=''; i.click(); };
  document.getElementById('du-cam').onclick  = e => { e.preventDefault(); pick(true); };
  document.getElementById('du-pick').onclick = e => { e.preventDefault(); pick(false); };
  ['du-cam-input','du-file-input'].forEach(id=>{
    document.getElementById(id).onchange = ev => duAdd(ev.target.files);
  });
  const drop = document.getElementById('du-drop');
  drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('is-over'); });
  drop.addEventListener('dragleave', ()=>drop.classList.remove('is-over'));
  drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('is-over'); duAdd(e.dataTransfer.files); });
  document.getElementById('du-save').onclick = duSubmit;

function duToggle(){
  const b=document.getElementById('du-blocked'), n=document.getElementById('du-nowork');
  document.getElementById('du-blocker').hidden = !b.checked;
  document.getElementById('du-nowork-why').hidden = !n.checked;
  // a no-work day needs no photos and no summary
  document.getElementById('du-summary').disabled = n.checked;
  document.getElementById('du-cam').disabled = n.checked;
  document.getElementById('du-pick').disabled = n.checked;
}

function duAdd(list){
  const imgs=[...(list||[])].filter(f=>/^image\//.test(f.type));
  if(!imgs.length) return;
  imgs.forEach(f=>{
    // same name + size + modified time in one submission is an accidental double-pick
    if(window.__du.files.some(x=>x.file.name===f.name && x.file.size===f.size && x.file.lastModified===f.lastModified)) return;
    window.__du.files.push({ file:f, url:URL.createObjectURL(f), id:'f'+Math.random().toString(36).slice(2,9) });
  });
  duRenderPreviews();
}
function duRemove(id){
  const f=window.__du.files.find(x=>x.id===id);
  if(f) URL.revokeObjectURL(f.url);
  window.__du.files=window.__du.files.filter(x=>x.id!==id);
  duRenderPreviews();
}
function duRenderPreviews(){
  const el=document.getElementById('du-previews'); if(!el) return;
  const fs=window.__du.files;
  el.innerHTML = !fs.length ? '' :
    '<p class="field-hint">'+fs.length+' photo'+(fs.length===1?'':'s')+' ready. Remove anything blurred or duplicated.</p>'+
    '<div class="photo-grid">'+fs.map(f=>
      '<div class="photo-card"><div class="photo-placeholder is-loaded" style="cursor:zoom-in" onclick="lightbox(\''+f.url+'\',\''+jsq(f.file.name)+'\')">'+
      '<img alt="" src="'+f.url+'">'+
      '<button class="ph-del" type="button" title="Remove" onclick="event.stopPropagation();duRemove(\''+f.id+'\')">✕</button>'+
      '</div></div>').join('')+'</div>';
}

async function duSubmit(){
  const d=window.__du;
  const noWork=document.getElementById('du-nowork').checked;
  const blocked=document.getElementById('du-blocked').checked;
  const summary=document.getElementById('du-summary').value.trim();
  const stageId=Number(document.getElementById('du-stage').value)||null;

  if(noWork && !document.getElementById('du-nowork-reason').value){ toast('Choose a reason for no work today',{err:true}); return; }
  if(!noWork && !d.files.length){ toast('Add at least one photo of today’s work',{err:true}); return; }
  if(!noWork && !summary){ toast('Write one line about what was done',{err:true}); return; }
  if(blocked && !document.getElementById('du-blocker-why').value.trim()){ toast('Say what is blocking it',{err:true}); return; }

  const btn=document.getElementById('du-save');
  btn.disabled=true; btn.textContent='Uploading…';
  const staff=isStaff();
  try{
    const ins=await sb.from('bt_updates').insert({
      item_id:d.itemId, stage_id:stageId, work_date:today(),
      work_status: noWork?'no_work':(blocked?'blocked':'worked'),
      public_summary: noWork?null:summary,
      no_work_reason: noWork?document.getElementById('du-nowork-reason').value:null,
      review_status:'pending', submitted_by:uid()
    }).select().single();
    if(ins.error) throw ins.error;
    const updateId=ins.data.id;

    const internal=document.getElementById('du-internal').value.trim();
    if(internal || blocked){
      await sb.from('bt_update_internal').insert({
        update_id:updateId, internal_note:internal||null,
        blocker_reason: blocked?document.getElementById('du-blocker-why').value.trim():null,
        blocker_owner: blocked?(document.getElementById('du-blocker-who').value.trim()||null):null,
        revised_completion_date: blocked?(document.getElementById('du-blocker-date').value||null):null });
    }

    let done=0, failed=0;
    for(let i=0;i<d.files.length;i++){
      btn.textContent='Uploading '+(i+1)+' of '+d.files.length+'…';
      try{
        const blob=await resizeImage(d.files[i].file);   // canvas redraw: strips EXIF/GPS
        const path=(staff?'staff/':'')+'daily/'+d.itemId+'/'+updateId+'-'+i+'.jpg';
        const up=await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
        if(up.error) throw up.error;
        const pi=await sb.from('bt_photos').insert({ item_id:d.itemId, stage_id:stageId, update_id:updateId,
          path, uploaded_by:uid(), status:'pending', display_order:i });
        if(pi.error) throw pi.error;
        done++;
      }catch(e){ failed++; }
    }
    if(failed && !done){
      // keep the chosen photos so a bad connection does not lose the work
      btn.disabled=false; btn.textContent='Retry upload';
      toast('No photos uploaded — check the connection and press Retry. Your photos are still here.',{err:true});
      return;
    }
    d.files.forEach(f=>URL.revokeObjectURL(f.url));
    window.__du={files:[],itemId:null,stageId:null};
    closeModal();
    await loadData(); render();
    toast(noWork ? 'Recorded: no work today.'
      : done+' photo'+(done===1?'':'s')+' sent to the office for approval'+(failed?' ('+failed+' failed)':''));
  }catch(e){
    btn.disabled=false; btn.textContent='Submit for review';
    toast('Could not save: '+(e.message||e),{err:true});
  }
}

async function ruPublish(updateId){
  const u=(S.updates||[]).find(x=>x.id===updateId); if(!u) return;
  const cards=[...document.querySelectorAll('#ru-photos .photo-card')];
  const keep=cards.filter(c=>c.getAttribute('data-on')==='1').map(c=>c.getAttribute('data-id'));
  const drop=cards.filter(c=>c.getAttribute('data-on')!=='1').map(c=>c.getAttribute('data-id'));
  const el=document.getElementById('ru-summary');
  const summary=el?el.value.trim():null;
  try{
    if(keep.length){ const r=await sb.from('bt_photos').update({status:'approved', rejection_reason:null}).in('id',keep); if(r.error) throw r.error; }
    if(drop.length){ const r=await sb.from('bt_photos').update({status:'rejected'}).in('id',drop); if(r.error) throw r.error; }
    const patch={ review_status: drop.length?'partially_approved':'approved',
                  published_at:new Date().toISOString(), reviewed_by:uid(), reviewed_at:new Date().toISOString(),
                  updated_at:new Date().toISOString() };
    if(el && summary!==u.public_summary){
      if(!u.public_summary_original) patch.public_summary_original = u.public_summary;
      patch.public_summary = summary;
    }
    const r=await sb.from('bt_updates').update(patch).eq('id',updateId);
    if(r.error) throw r.error;
    closeModal(); await loadData(); render();
    const it=S.itemsById[u.item_id];
    if(it) offerWhatsApp(it, (S.settings.company_name||'Gujraj Impex')+' — progress on '+it.product+
      '\n'+(summary||'')+'\nPhotos on your tracker: '+trackerUrl());
    else toast('Published to the client');
  }catch(e){ toast(e.message||String(e),{err:true}); }
}

async function ruChanges(updateId){
  const why=prompt('What should the workshop reshoot?','Please retake the full view — it is out of focus.');

  try{
    const ids=(S.photosByUpdate[updateId]||[]).map(p=>p.id);

}

// A WhatsApp deep link opens one chat, so with several people on the floor the
// recipient has to be chosen rather than silently assumed to be the first one.
// The window is opened synchronously in the click; the logging happens after.
function sendReminder(text, logFn){
  const who = staffPhones();
  if(!who.length){
    toast('No staff has a WhatsApp number yet — add one from Buyers & logins.',{err:true});
    return;
  }
  if(who.length === 1){
    window.open(waLink(who[0].phone, text), '_blank');
    toast('Opening WhatsApp for '+who[0].name+'.');
    if(logFn) Promise.resolve(logFn()).catch(()=>{});
    return;
  }
  const m = modal('<h3>Send to whom?</h3><div class="sub">WhatsApp opens one chat at a time.</div>'+
    '<div class="panel__body">'+who.map((w,i)=>
      '<div class="login-row"><div class="grow"><strong>'+esc(w.name)+'</strong>'+
      '<p class="field-hint">'+esc(w.phone)+'</p></div>'+
      '<div class="button-row"><button class="button" type="button" data-rm="'+i+'">Send</button></div></div>'
    ).join('')+'</div>');
  m.m.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.onclick = ()=>{
      const w = who[+btn.getAttribute('data-rm')];
      window.open(waLink(w.phone, text), '_blank');
      closeModal();
      toast('Opening WhatsApp for '+w.name+'.');
      if(logFn) Promise.resolve(logFn()).catch(()=>{});
    };
  });
}

// The buyer company record from the brief: legal and Tally identity, billing
// contact and terms, billing address. Until now every Edit button on the company
// panel opened the same six boxes, so eleven of the fields the panel asks for
// could never be filled and billing readiness could never reach 100%.
// Each section of the panel now opens its own group; the plain Edit buttons open
// the whole record.
const GST_STATES={'01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh',
 '05':'Uttarakhand','06':'Haryana','07':'Delhi','08':'Rajasthan','09':'Uttar Pradesh','10':'Bihar',
 '11':'Sikkim','12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura',
 '17':'Meghalaya','18':'Assam','19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh',
 '23':'Madhya Pradesh','24':'Gujarat','26':'Dadra & Nagar Haveli and Daman & Diu','27':'Maharashtra',
 '29':'Karnataka','30':'Goa','31':'Lakshadweep','32':'Kerala','33':'Tamil Nadu','34':'Puducherry',
 '35':'Andaman & Nicobar Islands','36':'Telangana','37':'Andhra Pradesh','38':'Ladakh','97':'Other Territory'};
// A GSTIN carries its state in the first two digits, so the state, its code and
// usually the place of supply are already known once the GSTIN is entered.
function gstStateCode(g){ const s=String(g||'').trim(); return /^[0-9]{2}/.test(s)?s.slice(0,2):''; }
function gstStateName(g){ return GST_STATES[gstStateCode(g)]||''; }

const BUYER_GROUPS={
  basics:{title:'Company details', fields:[
    {k:'company', label:'Company *', full:true},
    {k:'contact_name', label:'Contact person'},
    {k:'city', label:'City'},
    {k:'phone', label:'WhatsApp (with country code)', mode:'numeric', digits:true},
    {k:'email', label:'Email'},
    {k:'notes', label:'Notes', area:true, full:true}
  ]},
  legal:{title:'Legal &amp; Tally identity', fields:[
    {k:'legal_name', label:'Legal business name', full:true, hint:'Exactly as registered — this is what the invoice must say.'},
    {k:'invoice_name', label:'Billing name on the invoice', full:true},
    {k:'tally_ledger_name', label:'Tally ledger name', full:true, hint:'Must match the ledger in Tally character for character.'},
    {k:'constitution', label:'Constitution', opts:['Private Limited','Public Limited','LLP','Partnership','Proprietorship','HUF','Trust or Society','Government','Individual','Other']},
    {k:'customer_code', label:'Internal customer code'},
    {k:'gstin', label:'GSTIN', hint:'15 characters. The first two digits give the state.'},
    {k:'pan', label:'PAN'},
    {k:'tax_treatment', label:'Tax treatment', opts:['Registered — regular','Composition','Unregistered','SEZ','Overseas / export','Deemed export']},
    {k:'place_of_supply', label:'Place of supply', full:true}
  ]},
  contact:{title:'Billing contact &amp; terms', fields:[
    {k:'accounts_name', label:'Accounts contact name'},
    {k:'accounts_email', label:'Accounts email'},
    {k:'accounts_phone', label:'Accounts WhatsApp / phone', mode:'numeric', digits:true},
    {k:'portal_contact', label:'Primary portal contact'},
    {k:'payment_terms', label:'Payment terms', full:true, hint:'For example: 100% advance, or 50% advance and balance before dispatch.'},
    {k:'currency', label:'Currency', opts:['INR','USD','EUR','GBP','AED']}
  ]},
  address:{title:'Billing address', fields:[
    {k:'address_line1', label:'Address line 1', full:true},
    {k:'address_line2', label:'Address line 2', full:true},
    {k:'city', label:'City'},
    {k:'state', label:'State'},
    {k:'state_code', label:'State code', mode:'numeric', hint:'The first two digits of the GSTIN.'},
    {k:'postal_code', label:'PIN / postal code', mode:'numeric'},
    {k:'country', label:'Country'},
    {k:'default_ship_to', label:'Default shipping rule', full:true, hint:'The purchase order still decides the actual ship-to address.'}
  ]}
};

function byInput(fl, b){
  const v = b[fl.k]==null?'':b[fl.k];
  const cls='field'+(fl.full?' field--full':'');
  const id='by-'+fl.k;
  const hint = fl.hint?'<p class="field-hint">'+esc(fl.hint)+'</p>':'';
  if(fl.opts) return '<div class="'+cls+'"><label for="'+id+'">'+fl.label+'</label><select id="'+id+'">'+
    [''].concat(fl.opts).map(o=>'<option value="'+esc(o)+'"'+(String(v)===o?' selected':'')+'>'+
      esc(o||'— not set —')+'</option>').join('')+'</select>'+hint+'</div>';
  if(fl.area) return '<div class="'+cls+'"><label for="'+id+'">'+fl.label+'</label>'+
    '<textarea id="'+id+'" rows="2">'+esc(v)+'</textarea>'+hint+'</div>';
  return '<div class="'+cls+'"><label for="'+id+'">'+fl.label+'</label>'+
    '<input id="'+id+'"'+(fl.mode?' inputmode="'+fl.mode+'"':'')+' value="'+esc(v)+'">'+hint+'</div>';
}

function mBuyer(id, section){
  const b=id?Object.assign({}, S.buyersById[id]):{active:true, currency:'INR', country:'India'};
  const keys = (section && BUYER_GROUPS[section]) ? [section] : ['basics','legal','contact','address'];
  const one = keys.length===1;

  // A GSTIN already answers the state questions; fill them in rather than making
  // him look them up, but never overwrite something he has already recorded.
  if(!id || keys.indexOf('address')>=0){
    if(!b.state_code && b.gstin) b.state_code=gstStateCode(b.gstin);
    if(!b.state && b.gstin) b.state=gstStateName(b.gstin);
  }
  if(keys.indexOf('legal')>=0 && !b.place_of_supply && b.gstin) b.place_of_supply=gstStateName(b.gstin);

  const body = keys.map(k=>{
    const g=BUYER_GROUPS[k];
    return (one?'':'<h4 class="form-section-title field--full">'+g.title+'</h4>')+
      g.fields.map(fl=>byInput(fl,b)).join('');
  }).join('');

  const title = id ? (one?BUYER_GROUPS[section].title:'Buyer company record') : 'Add buyer company';
  const m=modal('<h3>'+title+'</h3>'+
    (id?'<div class="sub">'+esc(b.company||'')+'</div>':'')+
    '<div class="form-grid" style="max-height:70vh;overflow:auto">'+ body +
    (id&&keys.indexOf('basics')>=0?'<label class="check-row field--full"><input type="checkbox" id="by-active" '+
      (b.active!==false?'checked':'')+'><span>Active</span></label>':'')+
    '</div>'+
    '<div class="button-row field--full"><button class="button" type="button" id="by-save">Save</button>'+
    (id&&!one?'<button class="button button--danger" type="button" id="by-del">Delete buyer</button>':'')+
    '<button class="button button--secondary" type="button" onclick="closeModal()">Cancel</button></div>');

  m.m.querySelector('#by-save').onclick=async ()=>{
    const rec={};
    keys.forEach(k=>BUYER_GROUPS[k].fields.forEach(fl=>{
      const el=$('by-'+fl.k); if(!el) return;
      let v=String(el.value||'').trim();
      if(fl.digits) v=v.replace(/[^0-9]/g,'');
      rec[fl.k]= v===''?null:v;
    }));
    if(keys.indexOf('basics')>=0){
      if(!rec.company){ toast('Company name is required',{err:true}); return; }
      if(id) rec.active=$('by-active').checked;
    }
    if(rec.gstin) rec.gstin=rec.gstin.toUpperCase();
    if(rec.pan) rec.pan=rec.pan.toUpperCase();
    const q=id?sb.from('bt_buyers').update(rec).eq('id',id):sb.from('bt_buyers').insert(rec);
    const {error}=await q;
    if(error){ toast(error.message,{err:true}); return; }
    closeModal(); await loadData(); render();
    toast(id?'Saved':'Buyer added. Fill in the billing details next.');
  };

  if(id&&!one) m.m.querySelector('#by-del').onclick=async ()=>{
    if(!confirm('Delete this buyer with ALL its POs, items, photos and comments? This cannot be undone.')) return;
    const logins=S.profilesAll.filter(x=>x.buyer_id===id);
    for(const l of logins){ await adminApi({action:'delete_user', user_id:l.user_id}); }
    const {error}=await sb.from('bt_buyers').delete().eq('id',id);
    if(error){ toast(error.message,{err:true}); return; }
    closeModal(); await loadData(); go('#/buyers');
  };
}
async function adminApi(body){
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(CONFIG.url+'/functions/v1/admin-api',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':CONFIG.anon,'Authorization':'Bearer '+session.access_token},
    body:JSON.stringify(body)});
  const out=await res.json().catch(()=>({}));
  if(!res.ok||out.error) throw new Error(out.error||('HTTP '+res.status));
  return out;
}
// A buyer login belongs to a company, so ask which one before opening the login
// form. Without this the only route was the bottom of a company panel, which is
// not where anyone goes looking for "add this buyer's colleague".
// The buyer sends his own legal and billing details. They land in a queue, not
// in the billing record — the database whitelist decides which fields may ever
// be copied across, and only the owner may copy them.
async function submitBuyerDetails(){
  const b = S.buyersById[S.profile&&S.profile.buyer_id];
  if(!b) return;
  const payload={};
  BUYER_OWN_FIELDS.forEach(f=>{
    const el=$('bc-'+f.k); if(!el) return;
    let v=String(el.value||'').trim();
    if(f.mode==='numeric' && f.k!=='state_code' && f.k!=='postal_code') v=v.replace(/[^0-9]/g,'');
    if(f.k==='gstin'||f.k==='pan') v=v.toUpperCase();
    if(v) payload[f.k]=v;
  });
  if(!Object.keys(payload).length){ toast('Fill in at least one detail first.',{err:true}); return; }
  const {error}=await sb.from('bt_buyer_submissions').insert({
    buyer_id:b.id, submitted_by:uid(), payload, status:'pending'});
  if(error){
    toast(/duplicate|unique/i.test(error.message)
      ? 'You already have details waiting to be checked.' : error.message, {err:true});
    return;
  }
  await loadData(); render();
  toast('Sent. Gujraj Impex will check these against your GST certificate.');
}

// The owner's side: every submitted field beside what is on record now, each one
// editable and individually selectable, so a typo is corrected before it lands.
function mReviewSubmission(buyerId){
  const s = S.subPending && S.subPending[buyerId];
  const b = S.buyersById[buyerId];
  if(!s || !b){ toast('Nothing waiting for this company.'); return; }
  const rows = BUYER_OWN_FIELDS.filter(f=>String((s.payload||{})[f.k]||'').trim());
  const who = (S.profilesAll||[]).find(p=>p.user_id===s.submitted_by);

  const m=modal('<h3>Details sent by the buyer</h3>'+
    '<div class="sub">'+esc(b.company)+' · '+esc(who?(who.full_name||who.email):'buyer')+
      ' · '+esc(fdate(String(s.submitted_at).slice(0,10)))+'</div>'+
    '<div class="attn attn--warn attn--flat"><span>Check these against their GST certificate. '+
      'Nothing here can change your Tally ledger name, customer code, payment terms or currency.</span></div>'+
    '<div class="form-grid" style="max-height:60vh;overflow:auto">'+
    rows.map(f=>{
      const now=String(b[f.k]||'');
      const sent=String((s.payload||{})[f.k]||'');
      const same=now===sent;
      return '<div class="field field--full">'+
        '<label class="check-row" style="margin-bottom:4px"><input type="checkbox" id="rv-on-'+f.k+'"'+
          (same?'':' checked')+'><span><strong>'+esc(f.label)+'</strong>'+
          (same?' — already matches':'')+'</span></label>'+
        (now?'<p class="field-hint">On record now: '+esc(now)+'</p>'
            :'<p class="field-hint">Nothing on record yet.</p>')+
        '<input id="rv-'+f.k+'" value="'+esc(sent)+'">'+
      '</div>';
    }).join('')+
    '</div>'+
    '<div class="button-row field--full">'+
      '<button class="button" type="button" id="rv-accept">Accept selected</button>'+
      '<button class="button button--secondary" type="button" id="rv-decline">Send back</button>'+
      '<button class="button button--quiet" type="button" onclick="closeModal()">Close</button></div>');

  m.m.querySelector('#rv-accept').onclick=async ()=>{
    const fields={};
    rows.forEach(f=>{ if($('rv-on-'+f.k) && $('rv-on-'+f.k).checked) fields[f.k]=$('rv-'+f.k).value.trim(); });
    if(!Object.keys(fields).length){ toast('Tick at least one field.',{err:true}); return; }
    const {error}=await sb.rpc('bt_accept_buyer_submission',{p_id:s.id, p_fields:fields});
    if(error){ toast(error.message,{err:true}); return; }
    closeModal(); await loadData(); render();
    toast(Object.keys(fields).length+' field'+(Object.keys(fields).length===1?'':'s')+' accepted.');
  };
  m.m.querySelector('#rv-decline').onclick=async ()=>{
    const why=prompt('What should they correct? This is sent back to them.');
    if(why===null) return;
    const {error}=await sb.rpc('bt_decline_buyer_submission',{p_id:s.id, p_note:why});
    if(error){ toast(error.message,{err:true}); return; }
    closeModal(); await loadData(); render();
    toast('Sent back to the buyer.');
  };
}

/* ---------------------------------------------------------------------------
   Drop-a-PDF purchase order import.

   Reads the text layer of a PO with pdf.js, reconstructs lines by their y
   position (naive concatenation destroys tables), then guesses the header
   fields and the item rows. Every guess lands in an editable preview and
   NOTHING is written until Yash presses Import — a wrong PO is worse than no
   PO. Scanned/photographed PDFs have no text layer and are told so plainly
   rather than silently importing nothing.
--------------------------------------------------------------------------- */

const PDFJS_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(window.__pdfjsLoading) return window.__pdfjsLoading;
  window.__pdfjsLoading = new Promise((res, rej)=>{
    const s=document.createElement('script');
    s.src=PDFJS_SRC;
    s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; }catch(e){}
      res(window.pdfjsLib); };
    s.onerror=()=>rej(new Error('Could not load the PDF reader. Check your internet connection.'));
    document.head.appendChild(s);
  });
  return window.__pdfjsLoading;
}

async function pdfLines(file){
  const lib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({data:buf}).promise;
  const lines=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    const rows={};
    tc.items.forEach(it=>{
      const y=it.transform[5], key=Math.round(y/3);
      (rows[key]=rows[key]||[]).push({x:it.transform[4], s:it.str});
    });
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(k=>{
      const t=rows[k].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim();
      if(t) lines.push(t);
    });
  }
  return lines;
}

const _num = t => { const n=Number(String(t).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:null; };

// dd/mm/yyyy, dd-mm-yy, 27 Aug 2026, 2026-08-27 -> yyyy-mm-dd
function _date(t){
  if(!t) return null;
  const s=String(t).trim();
  let m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  m=s.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000;
    return y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'); }
  m=s.match(/(\d{1,2})\s*[-\s\/]\s*([A-Za-z]{3,9})\.?\,?\s*[-\s\/]?\s*(\d{2,4})/);
  if(m){ const i=MON.findIndex(x=>m[2].toLowerCase().startsWith(x.toLowerCase()));
    // Tally prints two-digit years — "27-Aug-26"
    if(i>=0){ let y=+m[3]; if(y<100) y+=2000;
      return y+'-'+String(i+1).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'); } }
  return null;
}

// value that follows a label, on the same line or the next one
function _after(lines, res){
  for(let i=0;i<lines.length;i++){
    for(const re of res){
      const m=lines[i].match(re);
      if(m){
        const tail=(m[1]||'').trim().replace(/^[:\-–—\s]+/,'').trim();
        if(tail) return tail;
        if(lines[i+1] && lines[i+1].length<90) return lines[i+1].trim();
      }
    }
  }
  return null;
}

// Purchase-order parsing. Developed against a real Essentia PO (ED/PO/2026-27/1146)
// whose text is kept as a fixture in test/po-fixture.json, because the first
// version of this read that order as zero line items and a shipping address
// lifted out of the terms and conditions.

// The terms and conditions run for pages and are full of words like "delivery",
// "shipping" and "terms" that the field matchers would otherwise latch onto.
function _orderPages(lines){
  const cut = lines.findIndex(l=>/^\s*terms\s*(and|&)\s*conditions\b/i.test(l));
  return cut > 0 ? lines.slice(0, cut) : lines;
}

// Return the first match whose extracted value actually passes `ok` — the old
// version returned the first textual match, so "Shipping Details" won the race
// against "Delivery Date 20/09/2026" and the delivery date came out blank.
function _pick(lines, res, ok){
  for(let i=0;i<lines.length;i++){
    for(const re of res){
      const m=lines[i].match(re);
      if(!m) continue;
      const tail=(m[1]||'').trim().replace(/^[:\-–—\s]+/,'').trim();
      if(tail){ const v=ok(tail); if(v) return v; }
      if(lines[i+1] && lines[i+1].length<90){ const v=ok(lines[i+1].trim()); if(v) return v; }
    }
  }
  return null;
}
const _text = t => t || null;

function parsePoText(rawLines){
  const lines = _orderPages(rawLines);
  const all = lines.join('\n');
  const out = { po_number:null, po_date:null, project:null, reference:null,
                expected_ship_date:null, amount_total:null, currency:'INR',
                payment_terms:null, ship_to:null, items:[], charges:[], lines:rawLines };

  out.po_number = _pick(lines, [
    /\bpo\s*(?:no\.?|number|#)\s*[:\-]?\s*(.*)$/i,
    /\b(?:purchase\s*order)\s*(?:no\.?|number|#)\s*[:\-]?\s*(.*)$/i,
    /\border\s*(?:no\.?|number)\s*[:\-]?\s*(.*)$/i ], t=>{
    // "ED/PO/2026-27/1146 PO Date 25/08/2026" → stop at the next field label
    let v = t.split(/\s+(?:po\s+)?date\b/i)[0].trim();
    v = v.replace(/\s+po$/i,'').trim();          // a dangling "PO" from "PO Date"
    return /[A-Za-z0-9]/.test(v) ? v : null;
  });
  if(!out.po_number){ const m=all.match(/\b([A-Z]{2,6}[\/\-][A-Z]{0,4}[\/\-]?[0-9]{2,4}[\-\/][0-9]{2,4}[\/\-][0-9]{2,6})\b/); if(m) out.po_number=m[1]; }

  out.po_date = _pick(lines, [/\bpo\s*date\b\s*[:\-]?\s*(.*)$/i,
                              /\b(?:order|invoice)?\s*date[d]?\s*[:\-]?\s*(.*)$/i], _date);
  out.expected_ship_date = _pick(lines, [
    /\bdelivery\s*date\b\s*[:\-]?\s*(.*)$/i,
    /\b(?:delivery|despatch|dispatch|shipment)\s*(?:date|by|on|schedule)?\s*[:\-]?\s*(.*)$/i,
    /\bexpected\s*(?:delivery|ship)\w*\s*[:\-]?\s*(.*)$/i ], _date);

  out.project   = _pick(lines, [/\bproject\s*[:\-]\s*(.*)$/i, /\b(?:site|job)\s*(?:name)?\s*[:\-]\s*(.*)$/i],
                        t=>t.split(/\s{2,}/)[0].trim()||null);
  out.reference = _pick(lines, [/\b(?:ref(?:erence)?|indent\s*number|enquiry|quotation|quote)\s*(?:no\.?)?\s*[:\-]?\s*(.*)$/i],
                        t=>t.split(/\s+indent\s*date\b/i)[0].trim()||null);
  out.payment_terms = _pick(lines, [/\bpayment\s*terms?\s*[:\-]?\s*(.*)$/i,
                                    /\bterms\s*of\s*payment\s*[:\-]?\s*(.*)$/i], _text);
  // Only an explicit label counts: loose prose matching is how "buyer replacement
  // goods." from clause 22 ended up in the shipping address.
  out.ship_to = _pick(lines, [/\b(?:ship\s*to|consignee|delivery\s*address)\s*[:\-]\s*(.*)$/i], _text);

  if(/\bUSD\b|\$|US\s*Dollar/i.test(all)) out.currency='USD';
  else if(/\bEUR\b|€/i.test(all)) out.currency='EUR';
  else if(/\bGBP\b|£/i.test(all)) out.currency='GBP';

  const totLine = lines.filter(l=>/\b(grand\s*total|total\s*\(after\s*tax\)|po\s*amount|total\s*amount|net\s*(payable|amount)|amount\s*payable)\b/i.test(l)).pop();
  if(totLine){ const nums=(totLine.match(/[\d,]+\.?\d*/g)||[]).map(_num).filter(n=>n!==null); if(nums.length) out.amount_total=Math.max.apply(null,nums); }

  const parsed = parsePoItems(lines);
  out.items   = parsed.items;
  out.charges = parsed.charges;
  return out;
}

// Freight, crating and the like are money, not something the workshop makes.
// They belong in the finance module as charges against the order.
// A qualified stone name ("Silver Travertine") beats the bare material word,
// which in these orders is usually part of the generic heading "MARBLE
// HANDICRAFT ITEM" rather than the stone actually being cut.
const _STONE_WORDS = 'travertine|marble|granite|onyx|limestone|quartzite|sandstone|slate|basalt';
const _STONE_SKIP = /^(item|items|stone|block|blocks|the|and|of|for|no|nos|pcs|handicrfat|handicraft|handicrafts|marble|size)$/i;
function _stoneOf(text){
  const qualified = new RegExp('\\b([A-Za-z]{3,14})\\s+(' + _STONE_WORDS + ')\\b', 'gi');
  let m;
  while((m = qualified.exec(text))){
    if(!_STONE_SKIP.test(m[1])) return (m[1] + ' ' + m[2]).replace(/\s+/g,' ').trim();
  }
  const bare = text.match(new RegExp('\\b(' + _STONE_WORDS + ')\\b', 'i'));
  return bare ? bare[1] : null;
}

const _CHARGE_RE = /^(freight|packing|packaging|wooden\s*crates?|crates?|carriage|transport|transportation|insurance|loading|unloading|courier|shipping|handling|delivery\s*charges?)\b/i;

function parsePoItems(lines){
  const items=[], charges=[];

  // A real table header names the description column. Requiring that stops
  // "No of Items 1 PO Amount ₹2,48,390.00" from being mistaken for the header —
  // which is what happened, and the very next line ("Payment Terms …") then hit
  // the end-of-table test and the table was read as empty.
  const isHead = l => {
    const s=l.toLowerCase();
    if(/\bno\.?\s*of\s*items\b/.test(s)) return false;
    if(!/\b(description|particulars?|product|material)\b/.test(s)) return false;
    let n=0;
    if(/\b(qty|quantity|nos|pcs)\b/.test(s)) n++;
    if(/\b(rate|price|unit)\b/.test(s)) n++;
    if(/\b(amount|value|total|taxable)\b/.test(s)) n++;
    if(/\bhsn\b/.test(s)) n++;
    return n>=1;
  };
  const isEnd = l => /^\s*(total\s*quantity|grand\s*total|sub\s*total|extra\s*charges|total\s*\(|total\s*tax|po\s*amount|amount\s*in\s*words|igst\b|cgst\b|payment\s*terms|for\s+[A-Z]|authorised)/i.test(l);

  let start = lines.findIndex(isHead);
  if(start < 0) return { items, charges };

  // Rows are numbered. A row begins with its serial; everything after it, until
  // the next serial, is continuation text belonging to the same row.
  const rows=[];
  for(let i=start+1;i<lines.length;i++){
    const l=lines[i];
    if(isEnd(l)) break;
    const m = l.match(/^\s*(\d{1,2})\s*(?=[A-Za-z])(.*)$/);
    if(m) rows.push({ no:+m[1], head:m[2].trim(), extra:[] });
    else if(rows.length) rows[rows.length-1].extra.push(l.trim());
  }
  if(!rows.length) return { items, charges };

  rows.forEach(r=>{
    const full = [r.head].concat(r.extra).join(' ').replace(/\s+/g,' ').trim();
    let money = (r.head.match(/(?:₹|Rs\.?|\$|€|£)\s*[\d,]+\.\d{2}/g)||[]).map(_num).filter(n=>n!==null);
    if(!money.length) money = (r.head.match(/\b\d{1,3}(?:,\d{2,3})+\.\d{2}\b/g)||[]).map(_num).filter(n=>n!==null);

    // strip the numeric tail so the name is words, not columns
    let name = r.head
      .replace(/₹\s*[\d,]+\.\d{2}/g,' ')
      .replace(/\b\d{1,3}\s*%/g,' ')
      .replace(/\b\d{6,8}\b/g,' ')                       // HSN code
      .replace(/\b\d+(?:\.\d+)?\s*(nos?|pcs?|pieces?|sets?|pairs?|sqft|cft)\b/ig,' ')
      .replace(/\s{2,}/g,' ').trim();

    if(_CHARGE_RE.test(name)){
      charges.push({ label: name.replace(/[\s:,-]+$/,'').slice(0,60) || 'Charge',
                     amount: money.length ? money[0] : null, _raw: r.head });
      return;
    }

    const it = { product:'', description:null, item_ref:null, stone:null, finish:null,
                 qty:1, unit:'pcs', l_mm:null, w_mm:null, h_mm:null, dims_text:null,
                 rate:null, taxable_amount:null, _raw: full };

    const q = r.head.match(/\b(\d{1,4}(?:\.\d+)?)\s*(nos?|pcs?|pieces?|sets?|pairs?|sqft|sq\.?\s*ft|cft)\b/i);
    if(q){ it.qty=+q[1]; it.unit=q[2].toLowerCase().replace(/[.\s]/g,''); }
    if(money.length){ it.rate = money[0]; if(money.length>1) it.taxable_amount = money[1]; }

    // "330MMX335MMX1240MM" as well as "1234 × 329 × 331"
    let d = full.match(/(\d+(?:\.\d+)?)\s*MM\s*[x×X]\s*(\d+(?:\.\d+)?)\s*MM\s*[x×X]\s*(\d+(?:\.\d+)?)\s*MM/i)
         || full.match(/(\d{2,5}(?:\.\d+)?)\s*[x×X]\s*(\d{2,5}(?:\.\d+)?)\s*[x×X]\s*(\d{2,5}(?:\.\d+)?)/);
    if(d){ it.l_mm=+d[1]; it.w_mm=+d[2]; it.h_mm=+d[3]; }

    // the label may be any case but the code itself is upper-case, and matching
    // case-insensitively here ran the capture on into the sentence that follows
    // tokens of two or more upper-case characters: a lone capital is the start of
    // the next sentence ("Coffee table legs …"), not part of the code
    const ref = full.match(/[Ii]tem\s*[Ii][Dd]\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-\/]+(?:\s+[A-Z0-9][A-Z0-9\-\/]+)*)/);
    if(ref) it.item_ref = ref[1].trim().replace(/\s{2,}/g,' ').slice(0,40);

    it.stone = _stoneOf(full);
    const fin = full.match(/\b(honed|polished|matte|matt|leather(?:ed)?|brushed|flamed|bush\s*hammered|open[- ]pore)\b/i);
    if(fin) it.finish = fin[1];

    it.product = (name.replace(/\bSIZE\s*[-:]?\s*$/i,'').replace(/[\s:,-]+$/,'').trim() || 'Item').slice(0,140);
    // everything the head line could not hold is worth keeping as the description
    const desc = r.extra.filter(x=>!/^item\s*id/i.test(x)).join(' ').replace(/\s+/g,' ').trim();
    if(desc) it.description = desc.slice(0,600);
    if(d && !it.dims_text) it.dims_text = null;
    items.push(it);
  });

  return { items: items.slice(0,60), charges: charges.slice(0,20) };
}

/* ---------------------------------------------------------------------------
   Accounting and dispatch documents.

   Three kinds arrive as PDFs and each says what it is on the first line, so the
   person dropping one never has to choose a type:

     Tax Invoice   — what was billed
     e-Way Bill    — how it travelled: vehicle, dates, and the invoice it covers
     Ledger Account— Tally's statement of the account, as at a date

   Tally and the GST portal stay the source of truth. StoneFlow keeps a dated
   copy so the buyer can see it, and never recalculates it.
--------------------------------------------------------------------------- */

const _clean = t => String(t||'').replace(/\s+/g,' ').trim();
const _gstin = t => { const m=String(t||'').toUpperCase().replace(/\s+/g,'').match(/[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]{3}/); return m?m[0]:null; };

// pdf.js emits a row's amount on its own line when the columns sit at slightly
// different heights — "FREIGHT ON SALE 68022190" then "6,500.00". A line whose
// only content is money (with at most a quantity and a currency mark) belongs to
// the line above it.
const _moneyOnly = l => /[\d,]+\.\d{2}/.test(l) &&
  /^[\d\s,.]*(nos?|pcs?|pieces?|kg|sqft|cft)?[\s₹$€£]*$/i
    .test(String(l).replace(/[\d,]+\.\d{2}/g,'').replace(/[₹$€£]/g,'').trim()
      ? String(l).replace(/[\d,]+\.\d{2}/g,'').replace(/[₹$€£]/g,'').trim() : '');

function _joinOrphanAmounts(lines){
  const out=[];
  for(let i=0;i<lines.length;i++){
    const cur=String(lines[i]||'');
    const next=lines[i+1];
    if(next && !/[\d,]+\.\d{2}/.test(cur) && /[A-Za-z]/.test(cur) && _moneyOnly(next)){
      out.push(_clean(cur+' '+next)); i++;
    } else out.push(cur);
  }
  return out;
}

function detectDocType(lines){
  const head = lines.slice(0, 12).join(' ').toLowerCase();
  if(/e-?way\s*bill/.test(head)) return 'eway';
  if(/ledger\s*account/.test(head)) return 'ledger';
  if(/tax\s*invoice|invoice\s*no/.test(head)) return 'invoice';
  return null;
}

// ---- e-Way Bill -----------------------------------------------------------
function parseEway(lines){
  const all = lines.join('\n');
  const grab = re => { const m = all.match(re); return m ? _clean(m[1]) : null; };
  const out = { kind:'eway' };

  // the number often wraps onto its own line, and is printed in groups of four
  let no = grab(/E-?Way\s*Bill\s*No\.?\s*:?\s*([\d\s]{10,20})/i);
  if(!no){ const i=lines.findIndex(l=>/E-?Way\s*Bill\s*No/i.test(l));
           if(i>=0 && lines[i+1]) no=lines[i+1]; }
  out.eway_no = no ? no.replace(/\D/g,'') : null;

  out.eway_date   = _date(grab(/E-?Way\s*Bill\s*Date\s*:?\s*([\d\/\-.]+)/i));
  out.valid_from  = _date(grab(/Valid\s*From\s*:?\s*([\d\/\-.]+)/i));
  out.valid_until = _date(grab(/Valid\s*Until\s*:?\s*([\d\/\-.]+)/i));
  const km = grab(/\[\s*(\d+)\s*Kms?\s*\]/i); out.distance_km = km?+km:null;

  const sup = grab(/GSTIN\s*of\s*Supplier[ \t]*(.+)$/im) || '';
  out.supplier_gstin = _gstin(sup);
  const rec = grab(/GSTIN\s*of\s*Recipient[ \t]*(.+)$/im) || '';
  out.recipient_gstin = _gstin(rec);
  // the name follows the GSTIN after a comma
  out.recipient_name = _clean((rec.split(',')[1]||'').replace(/\(.*?\)/g,'')) || null;

  out.place_of_dispatch = grab(/Place\s*of\s*Dispatch[ \t]*(.+)$/im);
  out.place_of_delivery = grab(/Place\s*of\s*Delivery[ \t]*(.+)$/im);
  // the invoice this consignment covers — the join back to the billing side
  out.document_no   = grab(/Document\s*No\.?\s*([^\s]+)/i);
  out.document_date = _date(grab(/Document\s*Date\s*([\d\/\-.]+)/i));
  const val = grab(/Value\s*of\s*Goods\s*([\d,]+(?:\.\d+)?)/i);
  out.value = val ? _num(val) : null;
  out.reason = grab(/Reason\s*for\s*Transportation[ \t]*(.+)$/im);

  // Part B carries the vehicle: "Road RJ14GR1357 & 617 & 27/10/2024 Udaipur …"
  const partB = lines.find(l=>/^\s*(Road|Rail|Air|Ship)\b/i.test(l)) || '';
  const mode = partB.match(/^\s*(Road|Rail|Air|Ship)\b/i);
  out.mode = mode ? mode[1] : null;
  const veh = partB.match(/\b([A-Z]{2}\s?\d{1,2}\s?[A-Z]{1,3}\s?\d{3,4})\b/);
  out.vehicle = veh ? veh[1].replace(/\s+/g,'') : null;
  out.transporter = grab(/^Transporter[ \t]+(\S.*)$/im);
  return out;
}

// ---- Tax invoice ----------------------------------------------------------
const _INV_CHARGE = /(packag|packing|freight|carriage|transport|insurance|loading|crate)/i;

function parseInvoice(rawLines){
  const lines = _joinOrphanAmounts(rawLines);
  const all = lines.join('\n');
  const out = { kind:'invoice', charges:[], items:[] };

  // The invoice number and date share a line with the supplier address block,
  // so they are found by shape rather than by position.
  const numLine = lines.find(l=>/\b\d{2}-\d{2}\/\d{1,5}\b/.test(l) && !/GSTIN/i.test(l)) || '';
  const num = numLine.match(/\b(\d{2}-\d{2}\/\d{1,5})\b/);
  out.invoice_no = num ? num[1] : null;
  out.invoice_date = _date(numLine.replace(out.invoice_no||'','')) ||
                     _date((all.match(/Dated\s*\n?\s*([0-9]{1,2}[-\/][A-Za-z0-9]{2,9}[-\/][0-9]{2,4})/i)||[])[1]);

  // "Buyer (Bill to)" is the one that owes the money; the consignee may differ
  const bIdx = lines.findIndex(l=>/Buyer\s*\(Bill\s*to\)/i.test(l));
  if(bIdx>=0){
    for(let i=bIdx+1;i<Math.min(bIdx+4,lines.length);i++){
      const t=_clean(lines[i]);
      if(t && !/^\d+$/.test(t) && !/GSTIN|State Name/i.test(t)){ out.buyer_name=t; break; }
    }
    out.buyer_gstin = _gstin(lines.slice(bIdx, bIdx+8).join(' '));
  }
  if(!out.buyer_name){
    const cIdx = lines.findIndex(l=>/Consignee\s*\(Ship\s*to\)/i.test(l));
    if(cIdx>=0 && lines[cIdx+1]) out.buyer_name=_clean(lines[cIdx+1]);
  }
  if(!out.buyer_gstin){
    // the supplier's own GSTIN appears first; the buyer's is the other one
    const all_g = (all.toUpperCase().replace(/\s+/g,' ').match(/[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]{3}/g)||[]);
    const other = all_g.find(g=>g!==all_g[0]);
    out.buyer_gstin = other || null;
  }
  const poRef = (all.match(/Buyer'?s?\s*Order\s*No\.?[ \t]*(?:Dated)?[ \t]*([A-Z0-9][A-Z0-9\/\-]{3,29})/i)||[])[1];
  out.po_ref = (poRef && /\d/.test(poRef)) ? poRef : null;

  // amounts
  // there are several "Total" rows — the invoice total and the tax summary. The
  // grand total is the largest figure across them.
  const totals = lines.filter(l=>/^\s*Total\b/i.test(l))
    .flatMap(l=>(l.match(/[\d,]+\.\d{2}/g)||[]).map(_num)).filter(n=>n!=null);
  out.total = totals.length ? Math.max.apply(null, totals) : null;
  const taxRow = lines.find(l=>/^\s*Total\s+[\d,]+\.\d{2}\s+[\d,]+\.\d{2}/.test(l));
  if(taxRow){
    const n=(taxRow.match(/[\d,]+\.\d{2}/g)||[]).map(_num);
    out.taxable = n[0]!=null?n[0]:null;
    out.tax = n[1]!=null?n[1]:null;
  }
  if(out.taxable==null){
    const tv = all.match(/Taxable[\s\S]{0,80}?([\d,]+\.\d{2})/i);
    if(tv) out.taxable=_num(tv[1]);
  }
  if(out.tax==null){
    const tx = all.match(/(?:IGST|CGST|SGST)\s*(?:Payable)?[^\d]{0,20}([\d,]+\.\d{2})/i);
    if(tx) out.tax=_num(tx[1]);
  }

  // line rows: a serial, a description, then money
  lines.forEach(l=>{
    const money=(l.match(/[\d,]+\.\d{2}/g)||[]).map(_num);
    if(!money.length) return;
    if(/^\s*(Total|Amount|HSN|Tax Amount|Company|Bank|A\/c|Branch|Declaration|IGST\s*Payable)/i.test(l)) return;
    const name=_clean(l.replace(/[\d,]+\.\d{2}/g,' ').replace(/\b\d{6,8}\b/g,' ')
                       .replace(/^\s*\d{1,2}\s+/,'').replace(/\b\d+\s*Nos\b/ig,' ')
                       .replace(/\bNos\b/ig,' '));
    if(name.length<3) return;
    if(_INV_CHARGE.test(name)) out.charges.push({label:name, amount:money[0]});
    else out.items.push({product:name, amount:money[money.length-1], rate:money[0]});
  });
  return out;
}

// ---- Tally ledger ---------------------------------------------------------
function parseLedger(lines){
  const out = { kind:'ledger', rows:[] };
  const li = lines.findIndex(l=>/^Ledger\s*Account$/i.test(_clean(l)));
  // Tally prints the account name immediately above the words "Ledger Account"
  if(li>0) out.account = _clean(lines[li-1]);
  const per = lines.find(l=>/\d{1,2}-[A-Za-z]{3}-\d{2,4}\s*to\s*\d{1,2}-[A-Za-z]{3}-\d{2,4}/i.test(l));
  if(per){
    const m = per.match(/(\d{1,2}-[A-Za-z]{3}-\d{2,4})\s*to\s*(\d{1,2}-[A-Za-z]{3}-\d{2,4})/i);
    out.from = _date(m[1]); out.to = _date(m[2]);
  }

  // pdf.js splits a Tally row across two lines when the columns sit at slightly
  // different heights, so a date-only line is joined to the line that follows.
  const hdr = lines.findIndex(l=>/Date\s+Particulars/i.test(l));
  const body = _joinOrphanAmounts(lines.slice(hdr<0?0:hdr+1));
  const merged=[];
  for(let i=0;i<body.length;i++){
    const l=_clean(body[i]);
    const isDate=/^\d{1,2}-[A-Za-z]{3}-\d{2,4}\b/.test(l);
    const hasMoney=/[\d,]+\.\d{2}/.test(l);
    if(isDate && !hasMoney && body[i+1]){ merged.push(l+' '+_clean(body[i+1])); i++; }
    else merged.push(l);
  }

  merged.forEach(l=>{
    const money=(l.match(/[\d,]+\.\d{2}/g)||[]).map(_num);
    if(!money.length) return;
    const d=l.match(/^(\d{1,2}-[A-Za-z]{3}-\d{2,4})/);
    const vch=(l.match(/\b(\d{2}-\d{2}\/\d{1,5})\b/)||[])[1]||null;
    // Tally's To/By tells us which side a balance sits on, and that is the whole
    // meaning of the figure. On a customer account "By Opening Balance" is money
    // they had already paid; "To Closing Balance" balancing the debit column
    // means the account is still in credit — an advance we hold, not a bill.
    if(/opening\s*balance/i.test(l)){
      out.opening = money[0];
      out.opening_side = /\bBy\b/i.test(l) ? 'credit' : 'debit';
      return;
    }
    if(/closing\s*balance/i.test(l)){
      out.closing = money[0];
      out.closing_side = /\bTo\b/i.test(l) ? 'credit' : 'debit';
      return;
    }
    if(!d) return;                       // totals rows carry no date
    const label=_clean(l.replace(/^\d{1,2}-[A-Za-z]{3}-\d{2,4}/,'')
                        .replace(/[\d,]+\.\d{2}/g,' ').replace(vch||'',''));
    // Tally writes "By" for what the customer paid and "To" for what was billed;
    // after the row merge the prefix is no longer necessarily first
    const tidy = (label.match(/\b(To|By)\b\s*(.*)$/i) || [null,null,label]);
    out.rows.push({ date:_date(d[1]), ref:vch,
                    label:_clean((tidy[1]?tidy[1]+' ':'')+tidy[2]),
                    amount:money[0],
                    side: /\bBy\b/i.test(label) ? 'credit' : 'debit' });
  });
  // State it in words, because "Balance 1,24,660" read by a buyer on 100%
  // advance terms is ambiguous in the most expensive possible way.
  if(out.closing != null){
    out.standing = out.closing_side === 'credit' ? 'advance_held' : 'due_from_buyer';
    out.standing_label = out.closing_side === 'credit'
      ? 'Advance held against future orders'
      : 'Outstanding and payable';
  }
  return out;
}

function parseAccountingDoc(lines){
  const kind = detectDocType(lines);
  if(kind==='eway')    return parseEway(lines);
  if(kind==='invoice') return parseInvoice(lines);
  if(kind==='ledger')  return parseLedger(lines);
  return { kind:null };
}

/* ---------------------------------------------------------------------------
   Spreadsheet import.

   Some buyers send a workbook rather than a PDF, and a workbook is the better
   input: cells already have structure, so nothing has to be reconstructed from
   text positions the way a PDF does. Every buyer lays theirs out differently, so
   rather than guessing, the columns are mapped once and remembered against the
   buyer — the second order from them needs no explaining.

   Photographs sitting beside a row are pulled out of the file too. An .xlsx is a
   zip: the pictures are in xl/media, and xl/drawings tells us which row each one
   is anchored to.
--------------------------------------------------------------------------- */

const XLSX_SRC  = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const JSZIP_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';

function _loadScript(src, global, label){
  if(window[global]) return Promise.resolve(window[global]);
  const key='__loading_'+global;
  if(window[key]) return window[key];
  window[key]=new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=src;
    el.onload=()=>res(window[global]);
    el.onerror=()=>rej(new Error('Could not load the '+label+'. Check your internet connection.'));
    document.head.appendChild(el);
  });
  return window[key];
}
const loadXlsx  = ()=>_loadScript(XLSX_SRC,'XLSX','spreadsheet reader');
const loadJsZip = ()=>_loadScript(JSZIP_SRC,'JSZip','file reader');

// The fields StoneFlow can fill from a column. product is the only one required.
const SHEET_FIELDS = [
  ['product',   'Product name', ['product','description','item name','particular','name','item']],
  ['item_ref',  'Item code',    ['item code','code','sku','item id','ref','item ref','article']],
  ['stone',     'Stone',        ['stone','material','marble','granite']],
  ['finish',    'Finish',       ['finish','surface','polish']],
  ['qty',       'Quantity',     ['qty','quantity','nos','pcs','pieces']],
  ['unit',      'Unit',         ['unit','uom','units']],
  ['l_mm',      'Length (mm)',  ['length','l mm','l(mm)','long']],
  ['w_mm',      'Width (mm)',   ['width','w mm','w(mm)','breadth','depth']],
  ['h_mm',      'Height (mm)',  ['height','h mm','h(mm)','thickness','thk']],
  ['dims_text', 'Size as text', ['dimensions','dimension','size','measurement']],
  // Rate and Amount are different columns on a quotation. Keeping 'amount' as a
  // synonym for rate put the line total in the rate field on the Rosabagh sheet.
  ['rate',      'Rate (each)',  ['rate','unit price','price per','price']],
  ['line_total','Line total',   ['amount','line total','total','value']],
  ['target_date','Target date', ['target','delivery','due','completion']],
  ['notes',     'Notes',        ['remarks','remark','notes','note','description','comment']]
];

const _norm = v => String(v==null?'':v).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();

// 0 -> A, 25 -> Z, 26 -> AA: people name spreadsheet columns by letter
function _colLetter(i){
  let s=''; i=Number(i)||0;
  do { s=String.fromCharCode(65+(i%26))+s; i=Math.floor(i/26)-1; } while(i>=0);
  return s;
}

// The header row is the one whose cells look most like field names.
function _guessHeaderRow(rows){
  let best=-1, bestScore=1;
  const limit=Math.min(rows.length, 25);
  for(let r=0;r<limit;r++){
    const cells=(rows[r]||[]).map(_norm).filter(Boolean);
    if(cells.length<2) continue;
    let score=0;
    SHEET_FIELDS.forEach(([,,words])=>{
      if(cells.some(c=>words.some(w=>c===w||c.indexOf(w)>=0))) score++;
    });
    if(score>bestScore){ bestScore=score; best=r; }
  }
  return best;
}

// Two passes. A header that matches a word exactly wins over one that merely
// contains it, so a sheet carrying both "Rate (₹)" and "Amount (₹)" does not
// put the amount in the rate column. Within a field, earlier words rank higher.
function _guessMap(header){
  const used={}, map={};
  [true,false].forEach(exact=>{
    SHEET_FIELDS.forEach(([key,,words])=>{
      if(map[key]!=null) return;
      let hit=-1, hitRank=1e9;
      header.forEach((h,i)=>{
        if(used[i]) return;
        const c=_norm(h); if(!c) return;
        words.forEach((w,rank)=>{
          const ok = exact ? (c===w) : (c.indexOf(w)>=0);
          if(ok && rank<hitRank){ hit=i; hitRank=rank; }
        });
      });
      if(hit>=0){ map[key]=hit; used[hit]=1; }
    });
  });
  return map;
}

// "L 72 in × D 18 in × H 33 in" or "Top Ø 24 in · H 24 in" or plain "600x400x900".
// Yash works in a mix of mm and inches, so whatever the sheet says we store mm
// and the page renders both. Returns null when the text is not really a size.
function _dimsFromText(txt){
  const s=String(txt||'');
  if(!s.trim()) return null;
  const unit=(u)=>/^f/i.test(u)?304.8:/^i|^"/.test(u)?25.4:/^c/i.test(u)?10:1;
  const grab=(re)=>{ const m=s.match(re); return m?Math.round(parseFloat(m[1])*unit(m[2]||'mm')):null; };
  const U='\\s*(mm|cm|m|in|inch|inches|"|ft|feet|\')?';
  const L=grab(new RegExp('\\bL\\s*[:.]?\\s*([\\d.]+)'+U,'i'));
  const W=grab(new RegExp('\\b(?:W|D|B)\\s*[:.]?\\s*([\\d.]+)'+U,'i'));
  const H=grab(new RegExp('\\bH\\s*[:.]?\\s*([\\d.]+)'+U,'i'));
  const DIA=grab(new RegExp('[ØøΦ⌀]\\s*([\\d.]+)'+U,'i'));
  if(L!=null||W!=null||H!=null||DIA!=null){
    // a round piece has no length and width of its own; the diameter is both
    return { l_mm: L!=null?L:DIA, w_mm: W!=null?W:DIA, h_mm: H };
  }
  const three=s.match(new RegExp('([\\d.]+)\\s*[x×*]\\s*([\\d.]+)\\s*[x×*]\\s*([\\d.]+)'+U,'i'));
  if(three){
    const k=unit(three[4]||'mm');
    return { l_mm:Math.round(+three[1]*k), w_mm:Math.round(+three[2]*k), h_mm:Math.round(+three[3]*k) };
  }
  return null;
}

// row index (0-based, as the sheet counts it) -> [{name, blob}]
async function sheetImages(file){
  const out={};
  try{
    const JSZipLib = await loadJsZip();
    const zip = await JSZipLib.loadAsync(file);
    const drawings = Object.keys(zip.files).filter(n=>/^xl\/drawings\/drawing\d+\.xml$/.test(n));
    for(const dname of drawings){
      const relName = dname.replace(/drawings\/(drawing\d+\.xml)$/, 'drawings/_rels/$1.rels');
      if(!zip.files[relName]) continue;
      const relXml = await zip.file(relName).async('string');
      const relDoc = new DOMParser().parseFromString(relXml,'application/xml');
      const rels={};
      [...relDoc.getElementsByTagName('*')].forEach(el=>{
        if(el.localName!=='Relationship') return;
        let t=el.getAttribute('Target')||'';
        t=t.replace(/^\/?/,'').replace(/^\.\.\//,'xl/');
        if(t.indexOf('xl/')!==0) t='xl/'+t.replace(/^xl\//,'');
        rels[el.getAttribute('Id')]=t;
      });
      const dXml = await zip.file(dname).async('string');
      const dDoc = new DOMParser().parseFromString(dXml,'application/xml');
      const anchors=[...dDoc.getElementsByTagName('*')].filter(el=>
        el.localName==='oneCellAnchor'||el.localName==='twoCellAnchor');
      for(const a of anchors){
        const from=[...a.getElementsByTagName('*')].find(el=>el.localName==='from');
        if(!from) continue;
        const rowEl=[...from.getElementsByTagName('*')].find(el=>el.localName==='row');
        if(!rowEl) continue;
        const row=parseInt(rowEl.textContent,10);
        const blip=[...a.getElementsByTagName('*')].find(el=>el.localName==='blip');
        if(!blip) continue;
        const id = blip.getAttribute('r:embed') ||
                   blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed');
        const path = rels[id];
        if(!path || !zip.files[path]) continue;
        const blob = await zip.file(path).async('blob');
        (out[row]=out[row]||[]).push({ name: path.split('/').pop(), blob });
      }
    }
  }catch(e){ /* a workbook with no pictures is perfectly normal */ }
  return out;
}

function pickSheet(){
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='.xlsx,.xls,.xlsm,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  inp.onchange=()=>{ if(inp.files[0]) readSheetFile(inp.files[0]); };
  inp.click();
}
function dropSheet(ev){
  ev.preventDefault();
  const el=document.getElementById('sheet-drop'); if(el) el.classList.remove('is-over');
  const f=[...(ev.dataTransfer&&ev.dataTransfer.files||[])]
    .find(x=>/\.(xlsx|xlsm|xls|csv)$/i.test(x.name));
  if(!f){ toast('Drop a spreadsheet (.xlsx or .csv)',{err:true}); return; }
  readSheetFile(f);
}

async function readSheetFile(file){
  const out=$('imp-out');
  if(out) out.innerHTML='<p class="field-hint">Reading '+esc(file.name)+'…</p>';
  try{
    const X = await loadXlsx();
    const buf = await file.arrayBuffer();
    const wb = X.read(buf, {type:'array', cellDates:true});
    const sheetName = wb.SheetNames[0];
    const rows = X.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, raw:false, defval:''});
    if(!rows.length){ if(out) out.innerHTML='<div class="attn attn--warn attn--flat"><span>That sheet is empty.</span></div>'; return; }

    const images = /\.(xlsx|xlsm)$/i.test(file.name) ? await sheetImages(file) : {};
    const headerRow = _guessHeaderRow(rows);

    // The lines above the table often carry the PO number and dates, and the PDF
    // header parser already knows how to read exactly that kind of text.
    const preamble = rows.slice(0, headerRow<0?Math.min(rows.length,8):headerRow)
      .map(r=>(r||[]).filter(c=>String(c).trim()).join('  ')).filter(Boolean);
    const head = parsePoText(preamble);

    const buyerId = (S.buyers.find(b=>b.id===S.buyerFilter)||S.buyers[0]||{}).id || null;
    const saved = (S.buyersById[buyerId]||{}).import_map;

    window.__sheet = {
      fileName:file.name, sheetName, sheetNames:wb.SheetNames, rows, images,
      headerRow: headerRow<0?0:headerRow,
      map: (saved && saved.map) ? Object.assign({}, saved.map) : null,
      head, buyerId
    };
    if(!window.__sheet.map) window.__sheet.map = _guessMap(rows[window.__sheet.headerRow]||[]);
    renderSheetMapper();
  }catch(e){
    if(out) out.innerHTML='<div class="attn attn--error attn--flat"><span>Could not read that file: '+esc(e.message||String(e))+'</span></div>';
    else toast('Could not read that file: '+(e.message||e),{err:true});
  }
}

function sheetSetHeaderRow(v){
  const d=window.__sheet; if(!d) return;
  d.headerRow=Math.max(0,parseInt(v,10)||0);
  d.map=_guessMap(d.rows[d.headerRow]||[]);
  renderSheetMapper();
}
function sheetSetCol(field, v){
  const d=window.__sheet; if(!d) return;
  if(v==='') delete d.map[field]; else d.map[field]=parseInt(v,10);
  renderSheetMapper();
}

// Where the item table ends is the whole problem. A quotation carries its terms,
// payment milestones and notes in the SAME column as the product names, so a
// name on its own is not enough — twenty paragraphs of small print arrived as
// products on the Rosabagh sheet. A real line also carries a number: a quantity,
// a rate, or an amount. Section headings ("CONSOLES") carry neither and are
// skipped without ending the table.
function sheetDataRows(){
  const d=window.__sheet; if(!d) return [];
  const prodCol=d.map.product;
  if(prodCol==null) return [];
  const named = d.rows.map((r,i)=>({r,i}))
    .filter(x=>x.i>d.headerRow)
    .filter(x=>String((x.r||[])[prodCol]||'').trim().length>1);

  const num = v => {
    const n=parseFloat(String(v==null?'':v).replace(/[^\d.-]/g,''));
    return isFinite(n) && n>0;
  };
  const cols=[d.map.qty, d.map.rate, d.map.line_total].filter(c=>c!=null);
  if(!cols.length) return named;              // nothing numeric mapped: keep the old behaviour

  const out=[]; let miss=0;
  for(const x of named){
    if(cols.some(c=>num((x.r||[])[c]))){ out.push(x); miss=0; }
    else if(out.length && ++miss>=12) break;  // well past the end of the table
  }
  // If the numeric test finds nothing at all the sheet is shaped differently,
  // so fall back rather than silently importing zero lines.
  return out.length?out:named;
}

function sheetPickBuyer(id){
  const d=window.__sheet; if(!d) return;
  if(id==='__new'){ d.newBuyer=true; renderSheetMapper(); return; }
  d.newBuyer=false;
  d.buyerId=id;
  const saved=(S.buyersById[id]||{}).import_map;
  if(saved && saved.map){ d.headerRow = saved.headerRow!=null?saved.headerRow:d.headerRow; d.map=Object.assign({},saved.map); }
  renderSheetMapper();
}

// A quotation from a customer who is not in the system yet is the normal way a
// buyer first appears. Sending Yash away to create the buyer, then back to start
// the import again, is why the Rosabagh sheet went nowhere.
async function sheetAddBuyer(){
  const el=$('sh-newbuyer');
  const company=el?el.value.trim():'';
  if(!company){ toast('Type the company name first',{err:true}); if(el) el.focus(); return; }
  const clash=(S.buyers||[]).find(b=>_norm(b.company)===_norm(company));
  if(clash){ sheetPickBuyer(clash.id); toast(clash.company+' already exists, selected it.'); return; }
  const ins=await sb.from('bt_buyers').insert({company}).select().single();
  if(ins.error){ toast(ins.error.message,{err:true}); return; }
  await loadData();
  const d=window.__sheet;
  if(d){ d.newBuyer=false; d.buyerId=ins.data.id; renderSheetMapper(); }
  toast(company+' added. Give them a login later from Buyers & logins.');
}

async function commitSheetImport(){
  const d=window.__sheet; if(!d) return;
  const po_number=$('sh-po').value.trim();
  if(!po_number){ toast('A PO number is required',{err:true}); return; }
  const buyer_id=$('sh-buyer').value;
  if(!buyer_id || buyer_id==='__new'){
    toast('Type the company name and press Add buyer first',{err:true});
    const el=$('sh-newbuyer'); if(el) el.focus();
    return;
  }
  const rows=[...document.querySelectorAll('#sh-items tr[data-row]')].filter(tr=>tr.querySelector('.sh-use').checked);
  if(!rows.length){ toast('Nothing ticked to import',{err:true}); return; }

  const val=$('sh-val').value;
  const rec={ buyer_id, po_number,
    po_date:$('sh-date').value||today(), project:$('sh-proj').value.trim()||null,
    expected_ship_date:$('sh-esd').value||null,
    amount_total: val?Number(val):null, currency:$('sh-cur').value };

  $('loading').style.display='flex';
  try{
    const dup=S.pos.find(p=>p.buyer_id===buyer_id && p.po_number===po_number);
    if(dup && !confirm(po_number+' already exists for this buyer. Add these products to it?')){
      $('loading').style.display='none'; return; }
    let poId;
    if(dup) poId=dup.id;
    else{
      const ins=await sb.from('bt_purchase_orders').insert(rec).select().single();
      if(ins.error) throw ins.error;
      poId=ins.data.id;
    }
    let line=dup?(dup.items||[]).reduce((m,i)=>Math.max(m,i.line_no||0),0):0;
    let nPhoto=0;
    for(const tr of rows){
      line++;
      const g=c=>{ const el=tr.querySelector('.'+c); return el?el.value.trim():''; };
      const n=c=>{ const v=g(c); return v?Number(v):null; };
      const srcRow=+tr.getAttribute('data-row');
      const extra=k=>d.map[k]==null?null:(String((d.rows[srcRow]||[])[d.map[k]]||'').trim()||null);
      const ins=await sb.from('bt_order_items').insert({
        po_id:poId, line_no:line, product:g('sh-prod')||'Item',
        item_ref:g('sh-ref')||null, stone:g('sh-stone')||null,
        finish:extra('finish'), unit:extra('unit')||'pcs',
        qty:n('sh-qty')||1, l_mm:n('sh-l'), w_mm:n('sh-w'), h_mm:n('sh-h'),
        dims_text:extra('dims_text'), notes:extra('notes'),
        rate: extra('rate')?_num(extra('rate')):null,
        line_total: extra('line_total')?_num(extra('line_total')):null,
        target_date: _date(extra('target_date')) || rec.expected_ship_date
      }).select().single();
      if(ins.error) throw ins.error;

      // a photograph anchored beside the row belongs to the product on that row
      const pics=(d.images||{})[srcRow]||[];
      for(let i=0;i<pics.length;i++){
        try{
          const blob=await resizeImage(new File([pics[i].blob], pics[i].name, {type:pics[i].blob.type||'image/png'}));
          const path=buyer_id+'/items/'+ins.data.id+'/reference-'+Date.now()+'-'+i+'.jpg';
          const up=await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
          if(up.error) continue;
          await sb.from('bt_photos').insert({ item_id:ins.data.id, po_id:poId, path,
            uploaded_by:uid(), status:'approved', photo_type:'reference', caption:'From the buyer’s sheet' });
          nPhoto++;
        }catch(e){ /* one bad picture must not lose the order */ }
      }
    }

    // Remember the layout so this buyer's next sheet needs no explaining.
    // A Supabase query builder is thenable but has no .catch, so calling one
    // threw right here and reported "Import failed" after the order had in fact
    // been created. Convenience must never be able to fail the import.
    try{
      await sb.from('bt_buyers').update({ import_map:{ map:d.map, headerRow:d.headerRow } })
        .eq('id', buyer_id);
    }catch(e){ /* the mapping is a nicety; the order is what matters */ }

    window.__sheet=null;
    await loadData();
    $('loading').style.display='none';
    toast(rows.length+' product'+(rows.length===1?'':'s')+
      (nPhoto?' and '+nPhoto+' photo'+(nPhoto===1?'':'s'):'')+' imported into '+po_number);
    go('#/po/'+poId);
  }catch(e){
    $('loading').style.display='none';
    toast('Import failed: '+(e.message||e),{err:true});
  }
}

// Arrow keys move between the section tabs, which is what a tablist is expected
// to do and what a row of clickable spans could never do.
function poTabKey(ev){
  const keys = {ArrowLeft:-1, ArrowRight:1, Home:'first', End:'last'};
  if(!(ev.key in keys)) return;
  ev.preventDefault();
  const tabs = [...document.querySelectorAll('.content-tabs [role="tab"]')];
  if(!tabs.length) return;
  const i = tabs.indexOf(ev.currentTarget);
  let next;
  if(keys[ev.key]==='first') next = 0;
  else if(keys[ev.key]==='last') next = tabs.length-1;
  else next = (i + keys[ev.key] + tabs.length) % tabs.length;
  tabs[next].focus();
  tabs[next].click();
}

function pickAcctPdf(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='application/pdf,.pdf'; inp.multiple=true;
  inp.onchange=async ()=>{ const f=[...inp.files]; if(f.length) await readAcctPdfs(f); };
  inp.click();
}
function dropAcctPdf(ev){
  ev.preventDefault();
  const el=document.getElementById('acct-drop'); if(el) el.classList.remove('is-over');
  const f=[...(ev.dataTransfer&&ev.dataTransfer.files||[])].filter(x=>/pdf$/i.test(x.name)||x.type==='application/pdf');
  if(!f.length){ toast('Drop a PDF — an invoice, an e-way bill or a Tally ledger',{err:true}); return; }
  readAcctPdfs(f);
}

async function readAcctPdfs(files){
  const out=$('acct-out');
  if(out) out.innerHTML='<p class="field-hint">Reading '+files.length+' file'+(files.length>1?'s':'')+'…</p>';
  const parsed=[];
  for(const f of files){
    try{
      const lines = await pdfLines(f);
      const d = parseAccountingDoc(lines);
      d.file = f; d.fileName = f.name; d.lines = lines;
      if(!d.kind) d.error = 'Not recognised as an invoice, e-way bill or ledger.';
      parsed.push(d);
    }catch(e){ parsed.push({ kind:null, fileName:f.name, error:e.message||String(e) }); }
  }
  window.__acct = parsed;
  renderAcctPreview();
}

// Match the document to a buyer: GSTIN first because it cannot be mistyped,
// then the company name.
function matchBuyer(d){
  const g = d.buyer_gstin || d.recipient_gstin;
  if(g){ const byG=(S.buyers||[]).find(b=>b.gstin && b.gstin.toUpperCase().replace(/\s/g,'')===g); if(byG) return byG.id; }
  const name = _clean(d.buyer_name || d.recipient_name || d.account || '').toLowerCase();
  if(name){
    const norm = t => String(t||'').toLowerCase().replace(/\b(private|pvt|limited|ltd|llp|inc|co)\b/g,'').replace(/[^a-z0-9]/g,'');
    const n = norm(name);
    const hit=(S.buyers||[]).find(b=>n && norm(b.company)===n);
    if(hit) return hit.id;
  }
  return '';
}

async function commitAcctImport(){
  const list=(window.__acct||[]).filter(d=>d.kind && !d.error);
  if(!list.length) return;
  $('loading').style.display='flex';
  let saved=0; const failed=[];
  try{
    for(const d of list){
      const buyer_id = d.buyer_id || matchBuyer(d) || null;
      if(!buyer_id && d.kind!=='eway'){ failed.push(d.fileName+' — no buyer chosen'); continue; }

      // keep the original PDF: a figure without its document is hard to trust
      let docPath=null;
      try{
        const safe=d.fileName.replace(/[^A-Za-z0-9._-]/g,'_').slice(-70);
        docPath=(buyer_id||'unassigned')+'/accounts/'+d.kind+'-'+Date.now()+'-'+safe;
        const up=await sb.storage.from(CONFIG.bucket).upload(docPath, d.file, {contentType:'application/pdf'});
        if(up.error) docPath=null;
      }catch(e){ docPath=null; }

      if(d.kind==='invoice'){
        const r=await sb.from('bt_invoices').upsert({
          buyer_id, po_id:d.po_id||null, invoice_no:d.invoice_no, invoice_date:d.invoice_date,
          taxable:d.taxable, tax:d.tax, total:d.total, currency:'INR',
          doc_path:docPath, source_file:d.fileName, created_by:uid()
        }, {onConflict:'buyer_id,invoice_no'});
        if(r.error){ failed.push(d.fileName+' — '+r.error.message); continue; }
      } else if(d.kind==='eway'){
        const r=await sb.from('bt_ewaybills').upsert({
          buyer_id, po_id:d.po_id||null, eway_no:d.eway_no, eway_date:d.eway_date,
          valid_until:d.valid_until, distance_km:d.distance_km, mode:d.mode, vehicle:d.vehicle,
          transporter:d.transporter, place_of_dispatch:d.place_of_dispatch,
          place_of_delivery:d.place_of_delivery, document_no:d.document_no,
          document_date:d.document_date, value:d.value, doc_path:docPath, created_by:uid()
        }, {onConflict:'eway_no'});
        if(r.error){ failed.push(d.fileName+' — '+r.error.message); continue; }
      } else if(d.kind==='ledger'){
        const ins=await sb.from('bt_ledger_snapshots').insert({
          buyer_id, from_date:d.from, as_of:d.to||today(),
          opening:d.opening, opening_side:d.opening_side,
          closing:d.closing, closing_side:d.closing_side, standing:d.standing,
          currency:'INR', source_file:d.fileName, created_by:uid()
        }).select().single();
        if(ins.error){ failed.push(d.fileName+' — '+ins.error.message); continue; }
        const rows=(d.rows||[]).map((r,ix)=>({ snapshot_id:ins.data.id, entry_date:r.date,
          ref:r.ref, label:r.label, amount:r.amount, side:r.side, sort_order:ix }));
        if(rows.length){ const lr=await sb.from('bt_ledger_lines').insert(rows); if(lr.error) failed.push(d.fileName+' — lines: '+lr.error.message); }
      }
      saved++;
    }
    window.__acct=null;
    await loadData();
    $('loading').style.display='none';
    const el=$('acct-out'); if(el) el.innerHTML='';
    render();
    toast(saved+' document'+(saved===1?'':'s')+' saved'+(failed.length?', '+failed.length+' failed':'')+'.', failed.length?{err:true}:undefined);
    if(failed.length) console.warn('Accounting import problems:', failed);
  }catch(e){
    $('loading').style.display='none';
    toast('Import failed: '+(e.message||e),{err:true});
  }
}

// Publishing is the only thing that lets a buyer see any of this.
async function publishAcct(table, id, on){
  const {error}=await sb.from(table).update({published_at: on?new Date().toISOString():null}).eq('id', id);
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();

}

function dropPoPdf(ev){
  ev.preventDefault();
  const el=document.getElementById('pdf-drop'); if(el) el.classList.remove('is-over');
  const f=[...(ev.dataTransfer&&ev.dataTransfer.files||[])].find(x=>/pdf$/i.test(x.name)||x.type==='application/pdf');
  if(!f){ toast('Drop a PDF file',{err:true}); return; }

function pickPoPdf(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/pdf,.pdf';
  inp.onchange=async ()=>{
    const f=inp.files[0]; if(!f) return;
    await readPoPdf(f);
  };
  inp.click();
}

async function readPoPdf(file){
  const out=$('imp-out'); if(out) out.innerHTML='<p class="field-hint">Reading '+esc(file.name)+'…</p>';
  try{
    const lines = await pdfLines(file);
    if(!lines.length || lines.join('').replace(/\s/g,'').length < 40){
      out.innerHTML='<div class="attn attn--warn attn--flat"><span><strong>No text in this PDF.</strong> '+
        'It looks like a scan or a photograph, so there is nothing to read. Send it to me in the chat and I will '+
        'type it in, or paste the details into the CSV box below.</span></div>';
      return;
    }
    window.__poParse = parsePoText(lines);
    window.__poParse.fileName = file.name;
    renderPoPreview();
  }catch(e){
    out.innerHTML='<div class="attn attn--error attn--flat"><span>Could not read that PDF: '+esc(e.message||String(e))+'</span></div>';
  }
}
