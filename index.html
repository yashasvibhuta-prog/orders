/* ---------------------------------------------------------------------------
   Drop-a-PDF purchase order import.

   Reads the text layer of a PO with pdf.js, reconstructs lines by their y
   position (naive concatenation destroys tables), then guesses the header
   fields and the item rows. Every guess lands in an editable preview and
   NOTHING is written until Yash presses Import — a wrong PO is worse than no
   PO. Scanned/photographed PDFs have no text layer and are told so plainly
   rather than silently importing nothing.
--------------------------------------------------------------------------- */

const PDFJS_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(window.__pdfjsLoading) return window.__pdfjsLoading;
  window.__pdfjsLoading = new Promise((res, rej)=>{
    const s=document.createElement('script');
    s.src=PDFJS_SRC;
    s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; }catch(e){}
      res(window.pdfjsLib); };
    s.onerror=()=>rej(new Error('Could not load the PDF reader. Check your internet connection.'));
    document.head.appendChild(s);
  });
  return window.__pdfjsLoading;
}

async function pdfLines(file){
  const lib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({data:buf}).promise;
  const lines=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    const rows={};
    tc.items.forEach(it=>{
      const y=it.transform[5], key=Math.round(y/3);
      (rows[key]=rows[key]||[]).push({x:it.transform[4], s:it.str});
    });
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(k=>{
      const t=rows[k].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim();
      if(t) lines.push(t);
    });
  }
  return lines;
}

const _num = t => { const n=Number(String(t).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:null; };

// dd/mm/yyyy, dd-mm-yy, 27 Aug 2026, 2026-08-27 -> yyyy-mm-dd
function _date(t){
  if(!t) return null;
  const s=String(t).trim();
  let m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  m=s.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000;
    return y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'); }
  m=s.match(/(\d{1,2})\s*([A-Za-z]{3,9})\.?\,?\s*(\d{4})/);
  if(m){ const i=MON.findIndex(x=>m[2].toLowerCase().startsWith(x.toLowerCase()));
    if(i>=0) return m[3]+'-'+String(i+1).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'); }
  return null;
}

// value that follows a label, on the same line or the next one
function _after(lines, res){
  for(let i=0;i<lines.length;i++){
    for(const re of res){
      const m=lines[i].match(re);
      if(m){
        const tail=(m[1]||'').trim().replace(/^[:\-–—\s]+/,'').trim();
        if(tail) return tail;
        if(lines[i+1] && lines[i+1].length<90) return lines[i+1].trim();
      }
    }
  }
  return null;
}

// Purchase-order parsing. Developed against a real Essentia PO (ED/PO/2026-27/1146)
// whose text is kept as a fixture in test/po-fixture.json, because the first
// version of this read that order as zero line items and a shipping address
// lifted out of the terms and conditions.

// The terms and conditions run for pages and are full of words like "delivery",
// "shipping" and "terms" that the field matchers would otherwise latch onto.
function _orderPages(lines){
  const cut = lines.findIndex(l=>/^\s*terms\s*(and|&)\s*conditions\b/i.test(l));
  return cut > 0 ? lines.slice(0, cut) : lines;
}

// Return the first match whose extracted value actually passes `ok` — the old
// version returned the first textual match, so "Shipping Details" won the race
// against "Delivery Date 20/09/2026" and the delivery date came out blank.
function _pick(lines, res, ok){
  for(let i=0;i<lines.length;i++){
    for(const re of res){
      const m=lines[i].match(re);
      if(!m) continue;
      const tail=(m[1]||'').trim().replace(/^[:\-–—\s]+/,'').trim();
      if(tail){ const v=ok(tail); if(v) return v; }
      if(lines[i+1] && lines[i+1].length<90){ const v=ok(lines[i+1].trim()); if(v) return v; }
    }
  }
  return null;
}
const _text = t => t || null;

function parsePoText(rawLines){
  const lines = _orderPages(rawLines);
  const all = lines.join('\n');
  const out = { po_number:null, po_date:null, project:null, reference:null,
                expected_ship_date:null, amount_total:null, currency:'INR',
                payment_terms:null, ship_to:null, items:[], charges:[], lines:rawLines };

  out.po_number = _pick(lines, [
    /\bpo\s*(?:no\.?|number|#)\s*[:\-]?\s*(.*)$/i,
    /\b(?:purchase\s*order)\s*(?:no\.?|number|#)\s*[:\-]?\s*(.*)$/i,
    /\border\s*(?:no\.?|number)\s*[:\-]?\s*(.*)$/i ], t=>{
    // "ED/PO/2026-27/1146 PO Date 25/08/2026" → stop at the next field label
    let v = t.split(/\s+(?:po\s+)?date\b/i)[0].trim();
    v = v.replace(/\s+po$/i,'').trim();          // a dangling "PO" from "PO Date"
    return /[A-Za-z0-9]/.test(v) ? v : null;
  });
  if(!out.po_number){ const m=all.match(/\b([A-Z]{2,6}[\/\-][A-Z]{0,4}[\/\-]?[0-9]{2,4}[\-\/][0-9]{2,4}[\/\-][0-9]{2,6})\b/); if(m) out.po_number=m[1]; }

  out.po_date = _pick(lines, [/\bpo\s*date\b\s*[:\-]?\s*(.*)$/i,
                              /\b(?:order|invoice)?\s*date[d]?\s*[:\-]?\s*(.*)$/i], _date);
  out.expected_ship_date = _pick(lines, [
    /\bdelivery\s*date\b\s*[:\-]?\s*(.*)$/i,
    /\b(?:delivery|despatch|dispatch|shipment)\s*(?:date|by|on|schedule)?\s*[:\-]?\s*(.*)$/i,
    /\bexpected\s*(?:delivery|ship)\w*\s*[:\-]?\s*(.*)$/i ], _date);

  out.project   = _pick(lines, [/\bproject\s*[:\-]\s*(.*)$/i, /\b(?:site|job)\s*(?:name)?\s*[:\-]\s*(.*)$/i],
                        t=>t.split(/\s{2,}/)[0].trim()||null);
  out.reference = _pick(lines, [/\b(?:ref(?:erence)?|indent\s*number|enquiry|quotation|quote)\s*(?:no\.?)?\s*[:\-]?\s*(.*)$/i],
                        t=>t.split(/\s+indent\s*date\b/i)[0].trim()||null);
  out.payment_terms = _pick(lines, [/\bpayment\s*terms?\s*[:\-]?\s*(.*)$/i,
                                    /\bterms\s*of\s*payment\s*[:\-]?\s*(.*)$/i], _text);
  // Only an explicit label counts: loose prose matching is how "buyer replacement
  // goods." from clause 22 ended up in the shipping address.
  out.ship_to = _pick(lines, [/\b(?:ship\s*to|consignee|delivery\s*address)\s*[:\-]\s*(.*)$/i], _text);

  if(/\bUSD\b|\$|US\s*Dollar/i.test(all)) out.currency='USD';
  else if(/\bEUR\b|€/i.test(all)) out.currency='EUR';
  else if(/\bGBP\b|£/i.test(all)) out.currency='GBP';

  const totLine = lines.filter(l=>/\b(grand\s*total|total\s*\(after\s*tax\)|po\s*amount|total\s*amount|net\s*(payable|amount)|amount\s*payable)\b/i.test(l)).pop();
  if(totLine){ const nums=(totLine.match(/[\d,]+\.?\d*/g)||[]).map(_num).filter(n=>n!==null); if(nums.length) out.amount_total=Math.max.apply(null,nums); }

  const parsed = parsePoItems(lines);
  out.items   = parsed.items;
  out.charges = parsed.charges;
  return out;
}

// Freight, crating and the like are money, not something the workshop makes.
// They belong in the finance module as charges against the order.
// A qualified stone name ("Silver Travertine") beats the bare material word,
// which in these orders is usually part of the generic heading "MARBLE
// HANDICRAFT ITEM" rather than the stone actually being cut.
const _STONE_WORDS = 'travertine|marble|granite|onyx|limestone|quartzite|sandstone|slate|basalt';
const _STONE_SKIP = /^(item|items|stone|block|blocks|the|and|of|for|no|nos|pcs|handicrfat|handicraft|handicrafts|marble|size)$/i;
function _stoneOf(text){
  const qualified = new RegExp('\\b([A-Za-z]{3,14})\\s+(' + _STONE_WORDS + ')\\b', 'gi');
  let m;
  while((m = qualified.exec(text))){
    if(!_STONE_SKIP.test(m[1])) return (m[1] + ' ' + m[2]).replace(/\s+/g,' ').trim();
  }
  const bare = text.match(new RegExp('\\b(' + _STONE_WORDS + ')\\b', 'i'));
  return bare ? bare[1] : null;
}

const _CHARGE_RE = /^(freight|packing|packaging|wooden\s*crates?|crates?|carriage|transport|transportation|insurance|loading|unloading|courier|shipping|handling|delivery\s*charges?)\b/i;

function parsePoItems(lines){
  const items=[], charges=[];

  // A real table header names the description column. Requiring that stops
  // "No of Items 1 PO Amount ₹2,48,390.00" from being mistaken for the header —
  // which is what happened, and the very next line ("Payment Terms …") then hit
  // the end-of-table test and the table was read as empty.
  const isHead = l => {
    const s=l.toLowerCase();
    if(/\bno\.?\s*of\s*items\b/.test(s)) return false;
    if(!/\b(description|particulars?|product|material)\b/.test(s)) return false;
    let n=0;
    if(/\b(qty|quantity|nos|pcs)\b/.test(s)) n++;
    if(/\b(rate|price|unit)\b/.test(s)) n++;
    if(/\b(amount|value|total|taxable)\b/.test(s)) n++;
    if(/\bhsn\b/.test(s)) n++;
    return n>=1;
  };
  const isEnd = l => /^\s*(total\s*quantity|grand\s*total|sub\s*total|extra\s*charges|total\s*\(|total\s*tax|po\s*amount|amount\s*in\s*words|igst\b|cgst\b|payment\s*terms|for\s+[A-Z]|authorised)/i.test(l);

  let start = lines.findIndex(isHead);
  if(start < 0) return { items, charges };

  // Rows are numbered. A row begins with its serial; everything after it, until
  // the next serial, is continuation text belonging to the same row.
  const rows=[];
  for(let i=start+1;i<lines.length;i++){
    const l=lines[i];
    if(isEnd(l)) break;
    const m = l.match(/^\s*(\d{1,2})\s*(?=[A-Za-z])(.*)$/);
    if(m) rows.push({ no:+m[1], head:m[2].trim(), extra:[] });
    else if(rows.length) rows[rows.length-1].extra.push(l.trim());
  }
  if(!rows.length) return { items, charges };

  rows.forEach(r=>{
    const full = [r.head].concat(r.extra).join(' ').replace(/\s+/g,' ').trim();
    let money = (r.head.match(/(?:₹|Rs\.?|\$|€|£)\s*[\d,]+\.\d{2}/g)||[]).map(_num).filter(n=>n!==null);
    if(!money.length) money = (r.head.match(/\b\d{1,3}(?:,\d{2,3})+\.\d{2}\b/g)||[]).map(_num).filter(n=>n!==null);

    // strip the numeric tail so the name is words, not columns
    let name = r.head
      .replace(/₹\s*[\d,]+\.\d{2}/g,' ')
      .replace(/\b\d{1,3}\s*%/g,' ')
      .replace(/\b\d{6,8}\b/g,' ')                       // HSN code
      .replace(/\b\d+(?:\.\d+)?\s*(nos?|pcs?|pieces?|sets?|pairs?|sqft|cft)\b/ig,' ')
      .replace(/\s{2,}/g,' ').trim();

    if(_CHARGE_RE.test(name)){
      charges.push({ label: name.replace(/[\s:,-]+$/,'').slice(0,60) || 'Charge',
                     amount: money.length ? money[0] : null, _raw: r.head });
      return;
    }

    const it = { product:'', description:null, item_ref:null, stone:null, finish:null,
                 qty:1, unit:'pcs', l_mm:null, w_mm:null, h_mm:null, dims_text:null,
                 rate:null, taxable_amount:null, _raw: full };

    const q = r.head.match(/\b(\d{1,4}(?:\.\d+)?)\s*(nos?|pcs?|pieces?|sets?|pairs?|sqft|sq\.?\s*ft|cft)\b/i);
    if(q){ it.qty=+q[1]; it.unit=q[2].toLowerCase().replace(/[.\s]/g,''); }
    if(money.length){ it.rate = money[0]; if(money.length>1) it.taxable_amount = money[1]; }

    // "330MMX335MMX1240MM" as well as "1234 × 329 × 331"
    let d = full.match(/(\d+(?:\.\d+)?)\s*MM\s*[x×X]\s*(\d+(?:\.\d+)?)\s*MM\s*[x×X]\s*(\d+(?:\.\d+)?)\s*MM/i)
         || full.match(/(\d{2,5}(?:\.\d+)?)\s*[x×X]\s*(\d{2,5}(?:\.\d+)?)\s*[x×X]\s*(\d{2,5}(?:\.\d+)?)/);
    if(d){ it.l_mm=+d[1]; it.w_mm=+d[2]; it.h_mm=+d[3]; }

    // the label may be any case but the code itself is upper-case, and matching
    // case-insensitively here ran the capture on into the sentence that follows
    // tokens of two or more upper-case characters: a lone capital is the start of
    // the next sentence ("Coffee table legs …"), not part of the code
    const ref = full.match(/[Ii]tem\s*[Ii][Dd]\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-\/]+(?:\s+[A-Z0-9][A-Z0-9\-\/]+)*)/);
    if(ref) it.item_ref = ref[1].trim().replace(/\s{2,}/g,' ').slice(0,40);

    it.stone = _stoneOf(full);
    const fin = full.match(/\b(honed|polished|matte|matt|leather(?:ed)?|brushed|flamed|bush\s*hammered|open[- ]pore)\b/i);
    if(fin) it.finish = fin[1];

    it.product = (name.replace(/\bSIZE\s*[-:]?\s*$/i,'').replace(/[\s:,-]+$/,'').trim() || 'Item').slice(0,140);
    // everything the head line could not hold is worth keeping as the description
    const desc = r.extra.filter(x=>!/^item\s*id/i.test(x)).join(' ').replace(/\s+/g,' ').trim();
    if(desc) it.description = desc.slice(0,600);
    if(d && !it.dims_text) it.dims_text = null;
    items.push(it);
  });

  return { items: items.slice(0,60), charges: charges.slice(0,20) };
}

/* ---- UI ---- */
function dropPoPdf(ev){
  ev.preventDefault();
  const el=document.getElementById('pdf-drop'); if(el) el.classList.remove('is-over');
  const f=[...(ev.dataTransfer&&ev.dataTransfer.files||[])].find(x=>/pdf$/i.test(x.name)||x.type==='application/pdf');
  if(!f){ toast('Drop a PDF file',{err:true}); return; }
  readPoPdf(f);
}

function pickPoPdf(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/pdf,.pdf';
  inp.onchange=async ()=>{
    const f=inp.files[0]; if(!f) return;
    await readPoPdf(f);
  };
  inp.click();
}

async function readPoPdf(file){
  const out=$('imp-out'); if(out) out.innerHTML='<p class="field-hint">Reading '+esc(file.name)+'…</p>';
  try{
    const lines = await pdfLines(file);
    if(!lines.length || lines.join('').replace(/\s/g,'').length < 40){
      out.innerHTML='<div class="attn attn--warn attn--flat"><span><strong>No text in this PDF.</strong> '+
        'It looks like a scan or a photograph, so there is nothing to read. Send it to me in the chat and I will '+
        'type it in, or paste the details into the CSV box below.</span></div>';
      return;
    }
    window.__poParse = parsePoText(lines);
    window.__poParse.fileName = file.name;
    renderPoPreview();
  }catch(e){
    out.innerHTML='<div class="attn attn--error attn--flat"><span>Could not read that PDF: '+esc(e.message||String(e))+'</span></div>';
  }
}

function showPoText(){

    '<p class="stage-note pre-wrap" style="max-height:50vh;overflow:auto">'+esc(d.lines.join('\n'))+'</p>'+

async function commitPoImport(){
  const d=window.__poParse; if(!d) return;
  const po_number=$('pi-po').value.trim();
  if(!po_number){ toast('A PO number is required',{err:true}); return; }
  const buyer_id=$('pi-buyer').value;
  if(!buyer_id){ toast('Add a buyer first from Buyers & logins',{err:true}); return; }

  const rows=[...document.querySelectorAll('#pi-items tr[data-i]')].filter(tr=>tr.querySelector('.pi-use').checked);
  const val=$('pi-val').value;
  const rec={ buyer_id, po_number,
    po_date:$('pi-date').value||today(), project:$('pi-proj').value.trim()||null,
    reference:$('pi-ref').value.trim()||null, expected_ship_date:$('pi-esd').value||null,
    amount_total: val?Number(val):null, currency:$('pi-cur').value,
    payment_terms:$('pi-pay').value.trim()||null, ship_to:$('pi-ship').value.trim()||null };

  $('loading').style.display='flex';
  try{
    const dup=S.pos.find(p=>p.buyer_id===buyer_id && p.po_number===po_number);
    if(dup && !confirm(po_number+' already exists for this buyer. Add these products to it?')){
      $('loading').style.display='none'; return; }
    let poId;
    if(dup){ poId=dup.id; }
    else{
      const ins=await sb.from('bt_purchase_orders').insert(rec).select().single();
      if(ins.error) throw ins.error;
      poId=ins.data.id;
    }
    let line=dup?(dup.items||[]).reduce((m,i)=>Math.max(m,i.line_no||0),0):0;
    for(const tr of rows){
      line++;
      const g=c=>tr.querySelector('.'+c).value.trim();
      const n=c=>{ const v=tr.querySelector('.'+c).value; return v?Number(v):null; };
      const ins=await sb.from('bt_order_items').insert({
        po_id:poId, line_no:line, product:g('pi-prod')||'Item',
        item_ref:g('pi-ref')||null, stone:g('pi-stone')||null,
        qty:n('pi-qty')||1, unit:g('pi-unit')||'pcs',
        l_mm:n('pi-l'), w_mm:n('pi-w'), h_mm:n('pi-h'),
        description:(d.items[+tr.getAttribute('data-i')]||{}).description||null,
        rate:(d.items[+tr.getAttribute('data-i')]||{}).rate||null,
        target_date:rec.expected_ship_date });
      if(ins.error) throw ins.error;
    }

    const crows=[...document.querySelectorAll('#pi-charges tr[data-c]')].filter(tr=>tr.querySelector('.pc-use').checked);
    let nCharge=0;
    for(const tr of crows){
      const label=tr.querySelector('.pc-label').value.trim();
      const amt=tr.querySelector('.pc-amt').value;
      if(!label || !amt) continue;
      const ins=await sb.from('bt_charges').insert({ po_id:poId, label, amount:Number(amt), currency:rec.currency });
      if(ins.error) throw ins.error;
      nCharge++;
    }
    window.__poParse=null;
    await loadData();
    $('loading').style.display='none';
    toast(rows.length+' product'+(rows.length===1?'':'s')+
      (nCharge?' and '+nCharge+' charge'+(nCharge===1?'':'s'):'')+' imported into '+po_number);
    go('#/po/'+poId);
  }catch(e){
    $('loading').style.display='none';
    toast('Import failed: '+(e.message||e),{err:true});
  }
}

/* ---------- import ---------- */
function impFile(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ $('imp-csv').value=String(r.result); };
  r.readAsText(f);
}
function impPreview(){
  const text=$('imp-csv').value.trim();
  if(!text){ toast('Paste CSV first',{err:true}); return; }
  const rows=csvParse(text);
  if(rows.length<2){ toast('Need a header row and at least one data row',{err:true}); return; }
  const hdr=rows[0].map(x=>x.trim().toLowerCase());
  const need=['po_number','product'];
  for(const n of need){ if(hdr.indexOf(n)<0){ toast('Missing column: '+n,{err:true}); return; } }
  const recs=rows.slice(1).map(r=>{ const o={}; hdr.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o; }).filter(o=>o.po_number&&o.product);
  const pos=[...new Set(recs.map(r=>r.po_number))];
  $('imp-out').innerHTML='<div class="attn attn--ok attn--flat"><span>'+recs.length+' item lines across '+pos.length+' PO(s): '+pos.map(esc).join(', ')+
    '</span></div><div class="button-row"><button class="button" type="button" onclick="impCommit()">Import now</button></div>';
  window.__impRecs=recs;
}
async function impCommit(){
  const recs=window.__impRecs||[]; if(!recs.length) return;
  const buyerId=$('imp-buyer').value;
  $('loading').style.display='flex';
  try{
    const byPo={};
    for(const r of recs){ (byPo[r.po_number]=byPo[r.po_number]||[]).push(r); }
    for(const poNum of Object.keys(byPo)){
      let po=S.pos.find(p=>p.buyer_id===buyerId && p.po_number===poNum);
      if(!po){
        const first=byPo[poNum][0];
        const ins=await sb.from('bt_purchase_orders').insert({buyer_id:buyerId, po_number:poNum, po_date:first.po_date||today()}).select().single();
        if(ins.error) throw ins.error;
        po=ins.data; po.items=[];
      }
      let line=(po.items||[]).reduce((m,i)=>Math.max(m,i.line_no||0),0);
      for(const r of byPo[poNum]){
        line++;
        const ins=await sb.from('bt_order_items').insert({po_id:po.id, line_no:line, product:r.product,
          stone:r.stone||null, finish:r.finish||null, qty:Number(r.qty)||1, unit:r.unit||'pcs',
          l_mm:r.l_mm?Number(r.l_mm):null, w_mm:r.w_mm?Number(r.w_mm):null, h_mm:r.h_mm?Number(r.h_mm):null,
          dims_text:r.dims_text||null, target_date:r.target_date||null, notes:r.notes||null});
        if(ins.error) throw ins.error;
      }
    }
    await loadData();
    $('loading').style.display='none';
    toast('Imported '+recs.length+' items.');
    go('#/home');
  }catch(e){
    $('loading').style.display='none';
    toast('Import failed: '+(e.message||e),{err:true});
  }
}
</script>
<script>
'use strict';
async function boot(){
  if(!sb) return;
  const {data:{session}} = await sb.auth.getSession();
  S.session=session;
  if(session){
    try{ await loadCore(); if(S.profile) await loadData(); }
    catch(e){ console.error(e); toast('Could not load data: '+(e.message||e),{err:true}); }
  }
  S.ready=true;
  $('loading').style.display='none';
  render();

  sb.auth.onAuthStateChange(async (event, sess)=>{
    const had=!!S.session;
    S.session=sess;
    if(event==='SIGNED_IN' && sess && !S.profile){
      try{ await loadCore(); if(S.profile) await loadData(); }
      catch(e){ console.error(e); }
      $('loading').style.display='none';
      render();
    }
    if(event==='SIGNED_OUT'){ S.profile=null; S.pos=[]; S.items=[]; render(); }
  });

  window.addEventListener('hashchange', render);
  setInterval(()=>{
    if(S.session && S.profile && document.visibilityState==='visible' && Date.now()-S.lastLoad>55000) refresh();
  }, 60000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && S.session && S.profile && Date.now()-S.lastLoad>30000) refresh();
  });
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
