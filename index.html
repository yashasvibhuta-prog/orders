}
function itemsMissingToday(){ return activeItems().filter(it=>!updateToday(it.id)); }
function pendingUpdates(){ return (S.updates||[]).filter(u=>u.review_status==='pending' || u.review_status==='changes_requested'); }
function blockedItems(){

            owner:int_?int_.blocker_owner:null, revised:int_?int_.revised_completion_date:null};
  }).filter(Boolean);

// what the buyer is allowed to see for one update: approved photos only

// stage-specific prompts. Guidance, not gates.
const PHOTO_PROMPTS = {
  stone_selection:['Full block or slab','Vein detail','Any defect or repair'],
  dressing_sizing:['Complete product','The face worked today','Dimension check'],
  prod_sizing:['Overall form','Readable measuring tape or caliper'],
  moulding:['Full profile','Detail of the carving'],
  finishing:['Full product','Surface close-up','Edge or corner detail'],
  sealing:['Application coverage','Completed surface'],
  final_photos:['All sides','Dimensions','Finish and any accessories'],
  packing:['Protected product','Closed crate','Shipping label'],
  production_drawing_79:['The drawing as issued','Marked stone against the drawing']
};
function promptsFor(stage){
  if(!stage) return ['Full product','Detail of today\'s work'];
  if(PHOTO_PROMPTS[stage.key]) return PHOTO_PROMPTS[stage.key];
  const n=(stage.name||'').toLowerCase();
  if(n.indexOf('pack')>=0) return PHOTO_PROMPTS.packing;
  if(n.indexOf('finish')>=0||n.indexOf('polish')>=0) return PHOTO_PROMPTS.finishing;
  if(n.indexOf('siz')>=0) return PHOTO_PROMPTS.prod_sizing;
  if(n.indexOf('mould')>=0||n.indexOf('carv')>=0) return PHOTO_PROMPTS.moulding;
  if(n.indexOf('seal')>=0) return PHOTO_PROMPTS.sealing;

// ---- next action: the single most useful thing to do about an item, right now ----
function nextAction(it){
  const rows=S.stByItem[it.id]||[];
  const appr=rows.find(r=>r.approval==='requested');
  if(appr) return isAdmin()||isStaff()
    ? {t:'Waiting on buyer', k:'wait', stage:S.stagesById[appr.stage_id]}
    : {t:'Your approval needed', k:'you', stage:S.stagesById[appr.stage_id]};
  const chg=rows.find(r=>r.approval==='changes_requested');
  if(chg) return {t:'Changes requested', k:'you', stage:S.stagesById[chg.stage_id]};
  if(!isAdmin()&&!isStaff()){
    if(unreadCount(it.id)) return {t:unreadCount(it.id)+' new message'+(unreadCount(it.id)>1?'s':''), k:'you'};
    const cur=S.stagesById[it.current_stage_id];
    return {t:cur?('In '+cur.name):'Scheduled', k:'ok'};
  }
  if(pendingPhotos().some(p=>p.item_id===it.id)) return {t:'Photos to approve', k:'you'};
  if(unreadCount(it.id)) return {t:unreadCount(it.id)+' new message'+(unreadCount(it.id)>1?'s':''), k:'you'};
  const active=S.stages.filter(s=>s.active);
  const byId={}; rows.forEach(r=>byId[r.stage_id]=r);
  const running=active.find(s=>byId[s.id]&&byId[s.id].status==='in_progress');
  if(running) return {t:'In '+running.name.replace(/^Production — /,'')+' — mark done when finished', k:'do', stage:running, mark:true};
  const next=active.find(s=>!byId[s.id]||byId[s.id].status==='pending');
  if(next) return {t:'Ready to move to '+next.name.replace(/^Production — /,''), k:'do', stage:next, mark:false};
  return {t:'All stages complete', k:'ok'};
}
function nextStageFor(it){
  const rows=S.stByItem[it.id]||[]; const byId={}; rows.forEach(r=>byId[r.stage_id]=r);
  const active=S.stages.filter(s=>s.active);
  const running=active.find(s=>byId[s.id]&&byId[s.id].status==='in_progress');
  if(running) return {stage:running, complete:true, label:'Mark '+running.name+' complete', short:'Mark done'};
  const next=active.find(s=>!byId[s.id]||byId[s.id].status==='pending');
  if(!next) return null;
  return {stage:next, complete:false, label:'Move to '+next.name, short:'Move to '+next.name.replace(/^Production — /,'')};
}

// ---- is this item running late, and by how much ----
function lateness(it){
  const due = it.target_date || (it.po && it.po.expected_ship_date);
  if(!due) return null;
  if(it.status==='delivered'||it.status==='shipped') return null;
  const n = daysUntil(due);
  if(n===null) return null;
  if(n < 0) return {days:Math.abs(n), state:'late'};
  if(n <= 7) return {days:n, state:'soon'};
  return null;
}

// ---- compose the weekly progress message for one buyer ----
function buyerUpdateText(buyerId){
  const b=S.buyersById[buyerId];
  const pos=S.pos.filter(p=>p.buyer_id===buyerId && p.status!=='cancelled' && p.status!=='completed' && p.items.length);
  const co=S.settings.company_name||'Gujraj Impex';
  let lines=[co+' — order update, '+fdate(today())];
  if(!pos.length) return lines.concat(['No open orders at present.']).join('\n');
  pos.forEach(p=>{
    lines.push('');
    lines.push(p.po_number+(p.project?' · '+p.project:''));
    p.items.forEach(it=>{
      const st=S.stagesById[it.current_stage_id];
      const late=lateness(it);
      let l='• '+it.product+(it.qty>1?' ×'+(+it.qty):'')+' — '+(st?st.name:'scheduled');
      lines.push(l);
      const due=it.target_date||p.expected_ship_date;
      if(due){
        const n=daysUntil(due);
        lines.push('   '+(late&&late.state==='late'
            ? 'Running '+late.days+' day'+(late.days===1?'':'s')+' past the planned date'
            : (n<=7? 'On track · '+n+' day'+(n===1?'':'s')+' to go' : 'On track'))
          +' · planned '+fdate(due));
      }
    });
    const nph=(S.photosByPo[p.id]||[]).filter(x=>x.status==='approved').length
      + p.items.reduce((a,it)=>a+(S.photosByItem[it.id]||[]).filter(x=>x.status==='approved').length,0);
    if(nph) lines.push('   '+nph+' photo'+(nph>1?'s':'')+' on your tracker');
  });
  const waiting=pendingApprovals().filter(a=>a.item.po && a.item.po.buyer_id===buyerId);
  if(waiting.length){
    lines.push('');
    lines.push('Waiting for your approval:');
    waiting.forEach(a=>lines.push('• '+a.item.product+' — '+(a.stage?a.stage.name:'')));
  }
  lines.push('');
  lines.push('Photos and full detail: '+trackerUrl());
  return lines.join('\n');
}

function updateAge(b){
  if(!b.last_update_sent) return {t:'never sent', k:'you'};
  const d=Math.floor((Date.now()-new Date(b.last_update_sent).getTime())/86400000);
  if(d>=7) return {t:'last sent '+d+' days ago', k:'you'};
  if(d===0) return {t:'sent today', k:'ok'};
  return {t:'sent '+d+' day'+(d===1?'':'s')+' ago', k:'ok'};
}

// ---- global search across POs and products ----
function searchHits(q){

  if(!q) return null;
  const pos=S.pos.filter(p=>{
    const b=S.buyersById[p.buyer_id];

  });
  const items=S.items.filter(it=>((it.product||'')+' '+(it.stone||'')+' '+(it.finish||'')).toLowerCase().indexOf(q)>=0);

/* ---- money: what a PO is worth, what came in, what is still owed ----
   Admin-only. S.payments and S.charges are empty for every other role, and the
   database refuses to return them anyway, so these helpers degrade to zero. */
function indexFinance(){
  S.payByPo={}; S.chgByPo={}; S.payByBuyer={};
  (S.payments||[]).forEach(x=>{
    if(x.po_id) (S.payByPo[x.po_id]=S.payByPo[x.po_id]||[]).push(x);
    (S.payByBuyer[x.buyer_id]=S.payByBuyer[x.buyer_id]||[]).push(x);
  });
  (S.charges||[]).forEach(x=>{ (S.chgByPo[x.po_id]=S.chgByPo[x.po_id]||[]).push(x); });
}
function num(v){ const n=Number(v); return isFinite(n)?n:0; }

// One PO's money. Extras are added on top of the PO value; a negative extra is a discount.
function poMoney(p){
  const cur = p.currency || 'INR';
  const value = num(p.amount_total);
  const extras = (S.chgByPo[p.id]||[]).reduce((a,c)=>a+num(c.amount),0);
  const paid = (S.payByPo[p.id]||[]).reduce((a,c)=>a+num(c.amount),0);
  const due = value + extras;
  return { cur, value, extras, paid, due, balance: due - paid,
           hasValue: p.amount_total != null };
}

// A buyer's account, grouped by currency — adding rupees to dollars would be a lie.
function buyerMoney(buyerId){
  const byCur = {};
  const touch = c => (byCur[c] = byCur[c] || { cur:c, due:0, paid:0, balance:0, orders:0, unallocated:0 });
  S.pos.filter(p=>p.buyer_id===buyerId && p.status!=='cancelled').forEach(p=>{
    const m = poMoney(p);
    if(!m.hasValue && !m.extras && !m.paid) return;
    const g = touch(m.cur);
    g.due += m.due; g.paid += m.paid; g.orders++;
  });
  // payments not tied to a PO still reduce what the buyer owes
  (S.payByBuyer[buyerId]||[]).filter(x=>!x.po_id).forEach(x=>{
    const g = touch(x.currency||'INR');
    g.paid += num(x.amount); g.unallocated += num(x.amount);
  });
  Object.values(byCur).forEach(g=>{ g.balance = g.due - g.paid; });
  return Object.values(byCur).sort((a,b)=>b.due-a.due);
}

/* ---- accounting documents -------------------------------------------------
   Copies of what Tally and the GST portal already hold. Nothing here is
   recalculated; the buyer's own policies decide what arrives. */
function indexAccounts(invoices, ewaybills, snapshots, lines){
  S.invoices = invoices||[];
  S.ewaybills = ewaybills||[];
  S.ledgerSnaps = snapshots||[];
  S.ledgerLines = {};
  (lines||[]).forEach(l=>{ (S.ledgerLines[l.snapshot_id]=S.ledgerLines[l.snapshot_id]||[]).push(l); });
  S.invByBuyer = {}; S.ewbByDoc = {};
  S.invoices.forEach(i=>{ (S.invByBuyer[i.buyer_id]=S.invByBuyer[i.buyer_id]||[]).push(i); });
  // an e-way bill names the invoice it dispatches, which is how a consignment
  // finds its way onto the right order without anyone typing a reference
  S.ewaybills.forEach(e=>{ if(e.document_no) S.ewbByDoc[e.document_no]=e; });
}

// The most recent statement for a buyer that the reader is allowed to see.
function latestStatement(buyerId){
  return (S.ledgerSnaps||[]).filter(s=>s.buyer_id===buyerId)
    .sort((a,b)=>String(b.as_of).localeCompare(String(a.as_of)))[0] || null;
}

// A figure with a direction. "Balance" on its own is the ambiguity we are
// trying to remove: on 100% advance terms a buyer is normally in credit, and
// that money is held by us, not owed by them.
function statementStanding(sn){
  if(!sn || sn.closing == null) return null;
  const credit = sn.standing === 'advance_held' || sn.closing_side === 'credit';
  return {
    credit,
    amount: sn.closing,
    currency: sn.currency || 'INR',
    label: credit ? 'Advance held with Gujraj Impex' : 'Outstanding and payable',
    note: credit
      ? 'Paid in advance and not yet drawn against. Nothing is due from you.'
      : 'This amount is payable to Gujraj Impex.',
    as_of: sn.as_of
  };
}

// e-way bills that belong to an order: matched through the invoices raised on it
function ewaybillsForPo(poId){
  const direct = (S.ewaybills||[]).filter(e=>e.po_id===poId);
  const viaInvoice = (S.invoices||[]).filter(i=>i.po_id===poId)
    .map(i=>S.ewbByDoc[i.invoice_no]).filter(Boolean);
  const seen={}; return direct.concat(viaInvoice).filter(e=>!seen[e.id]&&(seen[e.id]=1));
}

function unreadCount(itemId){
  const mark = S.readMarks[itemId] || '1970-01-01';
  return (S.commentsByItem[itemId]||[]).filter(c=>c.author_id!==uid() && c.created_at>mark).length;
}
function pendingApprovals(){
  const out=[];
  S.items.forEach(it=>{
    (S.stByItem[it.id]||[]).forEach(r=>{
      if(r.approval==='requested') out.push({item:it, row:r, stage:S.stagesById[r.stage_id]});
    });
  });
  return out;
}
function itemsWithUnread(){ return S.items.filter(it=>unreadCount(it.id)>0); }
// Photos attached to a daily update are reviewed in Daily updates, not here —
// approving one in isolation would publish an image without its wording.
function pendingPhotos(){ return S.photos.filter(p=>p.status==='pending' && !p.update_id); }

/* ---- the console's counters -----------------------------------------------
   Every badge on the sidebar comes from here, so a number on the nav and the
   number of rows on the screen it opens can never disagree. */
function queueCounts(){
  const approvals = pendingUpdates().length + pendingPhotos().length;
  const missing   = itemsMissingToday().length;
  const blocked   = blockedItems().length + heldStages().length;
  const decisions = openDecisions().length + pendingApprovals().length;
  const clientUpdates = (S.buyers||[]).filter(b=>b.active &&
    updateAge(b).k==='you' && (S.pos||[]).some(p=>p.buyer_id===b.id && p.status==='open')).length;
  const late = lateStages().length;
  const owed = overdueBuyers();
  return {
    approvals, missing, blocked, decisions, clientUpdates, late,
    workshop: approvals + missing + blocked,
    urgent: decisions + blocked + owed.length,
    overdue: owed.reduce((s,x)=>s+x.amount,0),
    overdueCount: owed.length
  };
}

// A buyer sits "overdue" when a published statement says they owe us. Nothing is
// inferred from a PO value: money owed comes from the books or not at all.
function overdueBuyers(){
  return (S.buyers||[]).map(b=>{
    const sn=latestStatement(b.id);
    const st=statementStanding(sn);
    if(!st || st.credit || !st.amount) return null;
    return { buyer:b, amount:Number(st.amount)||0, as_of:st.as_of, currency:st.currency };
  }).filter(Boolean).sort((a,b)=>b.amount-a.amount);
}

/* One prioritised list of everything waiting on Yash, drawn from the queues that
   used to live on four separate screens. Each row knows its own urgency, which
   filter chip it belongs to, and the single button that deals with it.
     urgency 0 = urgent now, 1 = due today, 2 = waiting on others            */
function ownerActions(){
  const rows=[];
  const push=(o)=>rows.push(o);

  // Money the books say is owed. Never inferred from a PO value.
  overdueBuyers().forEach(o=>{
    const days=dayGap(o.as_of, today());
    push({ urgency:0, chip:'finance', chipLabel:'Finance', icon:'stage-planning',
      title:'Outstanding on the latest statement',
      meta:o.buyer.company+' · '+money(o.amount,o.currency)+' · as at '+fdate(o.as_of),
      sort:-o.amount, action:{label:'Open', go:"go('#/finance')"},
      note:days>0?('Statement is '+days+' day'+(days===1?'':'s')+' old'):'' });
  });

  // The floor has reported a piece stuck.
  blockedItems().forEach(b=>{
    push({ urgency:0, chip:'blocked', chipLabel:'Blocked', icon:'stage-sealing',
      title:b.item.product+' reported blocked',
      meta:poRef(b.item)+' · '+(b.reason||'no reason recorded'),
      action:{label:'Open', go:"go('#/item/"+b.item.id+"')"},
      note:b.owner?('With '+b.owner):'' });
  });

  // A hold Yash placed himself, still not lifted.
  heldStages().forEach(hd=>{
    push({ urgency:0, chip:'blocked', chipLabel:'Blocked', icon:'stage-sealing',
      title:(hd.stage?hd.stage.name:'A stage')+' on hold',
      meta:hd.item.product+' · '+poRef(hd.item)+(hd.hold.reason?' · '+hd.hold.reason:''),
      action:{label:'Lift hold', go:"go('#/item/"+hd.item.id+"')"} });
  });

  // Photographs and daily updates the buyer cannot see until reviewed.
  const nu=pendingUpdates().length, np=pendingPhotos().length;
  if(nu) push({ urgency:1, chip:'approval', chipLabel:'Approvals', icon:'i-camera',
    title:'Review '+nu+' workshop update'+(nu===1?'':'s'),
    meta:'Submitted by the floor and not yet published to the buyer',
    action:{label:'Review', go:"go('#/production/review')"} });
  if(np) push({ urgency:1, chip:'approval', chipLabel:'Approvals', icon:'i-camera',
    title:'Approve '+np+' photograph'+(np===1?'':'s'),
    meta:'The client cannot see them until you approve',
    action:{label:'Review', go:"go('#/production/review')"} });

  // Pieces with nothing recorded today.
  const miss=itemsMissingToday();
  if(miss.length) push({ urgency:1, chip:'missing', chipLabel:'Missing', icon:'stage-planning',
    title:'Daily update missing on '+miss.length+' piece'+(miss.length===1?'':'s'),
    meta:miss.slice(0,2).map(i=>i.product).join(', ')+(miss.length>2?' and '+(miss.length-2)+' more':''),
    action:{label:'Remind', go:"go('#/production/missing')"} });

  // Stages past the date they were planned to finish.
  lateStages().slice(0,4).forEach(l=>{
    push({ urgency:1, chip:'late', chipLabel:'Running late', icon:'stage-shipped',
      title:(l.stage?l.stage.name:'A stage')+' is '+l.delay.days+' day'+(l.delay.days===1?'':'s')+' over',
      meta:l.item.product+' · '+poRef(l.item),
      sort:-l.delay.days, action:{label:'Re-plan', go:"go('#/item/"+l.item.id+"')"} });
  });

  // Buyers who have not had an update in a while.
  const due=(S.buyers||[]).filter(b=>b.active && updateAge(b).k==='you' &&
    (S.pos||[]).some(p=>p.buyer_id===b.id && p.status==='open'));
  due.forEach(b=>push({ urgency:1, chip:'client', chipLabel:'Client updates', icon:'stage-selection',
    title:'Approved progress not sent to '+b.company,
    meta:updateAge(b).label,
    action:{label:'Preview', go:"go('#/clients/updates')"} }));

  // A buyer asked something and nobody has closed it.
  openDecisions().forEach(c=>{
    const it=S.itemsById[c.item_id];
    push({ urgency:1, chip:'decision', chipLabel:'Questions', icon:'stage-selection',
      title:'Question from the buyer',
      meta:(it?it.product+' · ':'')+String(c.body||'').slice(0,90),
      action:{label:'Open', go:"go('#/item/"+c.item_id+"')"} });
  });

  // Sent to the buyer and now his move, so it sits below Yash's own work.
  pendingApprovals().forEach(a=>{
    push({ urgency:2, chip:'waiting', chipLabel:'With the buyer', icon:'i-check',
      title:'Waiting on '+(a.item.po?(S.buyersById[a.item.po.buyer_id]||{}).company||'the buyer':'the buyer'),
      meta:a.item.product+' · '+(a.stage?a.stage.name:''),
      action:{label:'Open', go:"go('#/item/"+a.item.id+"')"} });
  });

  return rows.sort((a,b)=>(a.urgency-b.urgency)||((a.sort||0)-(b.sort||0)));
}

function poRef(item){ return item && item.po ? item.po.po_number : ''; }

// Dated commitments for the week ahead: deliveries, planned stages, nothing invented.
function nextSevenDays(){
  const out=[], t=today();
  (S.pos||[]).forEach(p=>{
    const d=p.expected_ship_date||p.delivery_date;
    if(!d || d<t || dayGap(t,d)>7) return;
    out.push({ date:d, title:'Planned dispatch', meta:p.po_number+' · '+(p.project||''), go:"go('#/po/"+p.id+"')" });
  });
  (S.items||[]).forEach(it=>{
    (S.stByItem[it.id]||[]).forEach(r=>{
      const int_=(S.stInternal||{})[it.id+'|'+r.stage_id];
      if(!int_ || !int_.planned_date) return;
      if(int_.planned_date<t || dayGap(t,int_.planned_date)>7) return;
      if(r.status==='completed'||r.status==='skipped') return;
      out.push({ date:int_.planned_date, title:(S.stagesById[r.stage_id]||{}).name+' planned',
        meta:it.product+' · '+poRef(it), go:"go('#/item/"+it.id+"')" });
    });
  });
  return out.sort((a,b)=>String(a.date).localeCompare(String(b.date))).slice(0,6);
}


/* Which orders need something doing about them. Each bucket answers a question
   Yash actually asks: what is stuck, what is late, what is sitting with the
   buyer, what can go out. */
function poBuckets(open){
  const risk=[], buyer=[], ship=[], attention=[];
  const lateByItem={}; lateStages().forEach(l=>{ lateByItem[l.item.id]=true; });
  const heldByItem={}; heldStages().forEach(h=>{ heldByItem[h.item.id]=true; });
  const blockedByItem={}; blockedItems().forEach(b=>{ blockedByItem[b.item.id]=true; });
  const waitingByItem={}; pendingApprovals().forEach(a=>{ waitingByItem[a.item.id]=true; });
  const decidingPo={}; openDecisions().forEach(c=>{
    const it=S.itemsById[c.item_id]; if(it) decidingPo[it.po_id]=true; });

  (open||[]).forEach(p=>{
    const items=p.items||[];
    const isLate=items.some(i=>lateByItem[i.id]) ||
      (p.expected_ship_date && p.expected_ship_date < today() && p.status!=='completed');
    const isStuck=items.some(i=>heldByItem[i.id]||blockedByItem[i.id]);
    const withBuyer=items.some(i=>waitingByItem[i.id]) || decidingPo[p.id];
    const readyToShip=items.length && items.every(i=>
      i.status==='ready' || i.status==='shipped' || i.status==='delivered' ||
      (S.stagesById[i.current_stage_id]||{}).key==='packing');
    if(isLate||isStuck) risk.push(p);
    if(withBuyer) buyer.push(p);
    if(readyToShip) ship.push(p);
    if(isLate||isStuck||withBuyer) attention.push(p);
  });
  return { open:open||[], attention, risk, buyer, ship };
}


/* What the buyer's home page is really answering: where is my work today. The
   most recent published updates across all his pieces, newest first, so the
   first thing he sees is a dated photograph rather than a dashboard. */
function buyerLatest(n){
  const out=[];
  (S.items||[]).forEach(it=>{
    (updatesFor(it.id)||[]).forEach(u=>{

      out.push({ item:it, update:u, stage:S.stagesById[u.stage_id], photos:updatePhotos(u.id) });

  out.sort((a,b)=>String(b.update.work_date).localeCompare(String(a.update.work_date)) ||
    String(b.update.published_at).localeCompare(String(a.update.published_at)));
  return out.slice(0, n||6);
}

// Everything published to this buyer that he can download.
function buyerDocs(buyerId){

async function signedUrl(path){
  const c=S.urlCache[path];
  if(c && c.exp>Date.now()) return c.url;
  const {data,error} = await sb.storage.from(CONFIG.bucket).createSignedUrl(path, 3600);
  if(error||!data) return '';
  S.urlCache[path]={url:data.signedUrl, exp:Date.now()+50*60*1000};
  return data.signedUrl;
}
async function hydrateImages(root){
  const nodes=(root||document).querySelectorAll('[data-ph-path]');
  for(const n of nodes){
    const p=n.getAttribute('data-ph-path');
    const u=await signedUrl(p);
    if(!u) continue;
    if(n.tagName==='IMG') n.src=u; else n.style.backgroundImage='url('+u+')';
    n.setAttribute('data-ph-url', u);
  }
}

async function resizeImage(file, maxDim, quality){
  maxDim=maxDim||1600; quality=quality||0.82;
  try{
    const bmp=await createImageBitmap(file);
    const scale=Math.min(1, maxDim/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*scale), h=Math.round(bmp.height*scale);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h);
    const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',quality));
    return blob||file;
  }catch(e){ return file; }
}

function trackerUrl(){
  return (S.settings && S.settings.tracker_url) || (location.origin+location.pathname);

/* ---------------------------------------------------------------------------
   The owner's product page — the five questions, and the panels behind them.

   The old page was a timeline with controls attached to it, which answers
   "what are the stages" rather than the questions Yash is actually holding when
   he opens a piece. Everything below is derived from real rows; where the data
   does not exist the answer says so rather than inventing a value.
--------------------------------------------------------------------------- */

// The stage the piece is on right now: the running one, else the last completed.
function stageNow(it){
  const rows=S.stByItem[it.id]||[]; const by={}; rows.forEach(r=>by[r.stage_id]=r);
  const active=S.stages.filter(s=>s.active);
  const running=active.find(s=>by[s.id]&&by[s.id].status==='in_progress');
  const held=active.find(s=>by[s.id]&&by[s.id].status==='on_hold');
  const s=running||held||active.slice().reverse().find(s=>by[s.id]&&by[s.id].status==='completed')||active[0];
  if(!s) return null;
  const idx=active.findIndex(x=>x.id===s.id);
  const row=by[s.id]||{status:'pending',approval:'none',stage_id:s.id};
  // running / held describe THIS stage, not "is anything anywhere held" — the
  // first cut of this asked the wrong question and reported a piece on hold
  // because a later stage was.
  return { stage:s, row:row,
           internal:stageInternal(it.id, s.id), number:idx+1, total:active.length,
           running:row.status==='in_progress', held:row.status==='on_hold' };
}

// Photographs waiting on Yash for this piece, and the update they belong to.
function itemPending(it){
  return (S.photosByItem[it.id]||[]).filter(p=>p.status==='pending');
}
function itemUpdatesWaiting(it){
  return (S.updByItem[it.id]||[]).filter(u=>u.review_status==='pending');
}
function itemApprovedUnsent(it){
  return (S.updByItem[it.id]||[]).filter(u=>
    (u.review_status==='approved'||u.review_status==='partially_approved') && !u.published_at);
}

// The five answers. Each is {q, a, sub} — and `sub` is allowed to be empty.
function itemAnswers(it){
  const now=stageNow(it);
  const pend=itemPending(it);
  const waiting=itemUpdatesWaiting(it);
  const late=lateness(it);
  const nxt=nextStageFor(it);
  const feed=(S.updByItem[it.id]||[]);
  const lastUpd=feed[0];
  const lastPhoto=(S.photosByItem[it.id]||[]).slice()
    .sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0];

  // Where is it
  const where = now
    ? { a: now.stage.name, sub: 'Stage '+now.number+' of '+now.total+
        (now.held?' · on hold':(now.row.started_at?' · started '+fdate(now.row.started_at):' · not started')) }
    : { a:'Not started', sub:'' };

  // What happened
  let happened={a:'Nothing yet', sub:'No update or photograph on this piece'};
  if(lastUpd || lastPhoto){
    const updNewer = lastUpd && (!lastPhoto ||
      String(lastUpd.submitted_at||lastUpd.work_date) >= String(lastPhoto.created_at));
    if(updNewer){
      happened={ a: workStatusLabel(lastUpd),
        sub: fdate(lastUpd.work_date)+' · '+(staffName(lastUpd.submitted_by)||'the workshop') };
    } else {
      const n=(S.photosByItem[it.id]||[]).filter(p=>p.created_at&&p.created_at.slice(0,10)===String(lastPhoto.created_at).slice(0,10)).length;
      happened={ a: n+' photograph'+(n===1?'':'s')+' added', sub: ftime(lastPhoto.created_at) };
    }
  }

  // Is it delayed
  let delayed={a:'On track', sub:''};
  const plan = now && now.internal && now.internal.planned_date;
  if(now && now.held) delayed={a:'On hold', sub:(now.internal&&now.internal.hold_reason)||'Reason not recorded'};
  else if(late && late.state==='late') delayed={a:late.days+' day'+(late.days===1?'':'s')+' late', sub:'Against '+(it.target_date?'the target date':'the ship date')};
  else if(plan && daysUntil(plan)<0 && now.row.status!=='completed')
    delayed={a:'Behind plan', sub:'This stage was planned for '+fdate(plan)};
  else {
    const due=it.target_date||(it.po&&it.po.expected_ship_date);
    delayed={a:'On track', sub:plan?('Stage planned '+fdate(plan)):(due?('Piece due '+fdate(due)):'')};
  }

  // What needs approval
  let appr={a:'Nothing waiting', sub:''};
  const gate = now && now.row.approval==='requested';
  if(waiting.length) appr={a:waiting.length+' update'+(waiting.length===1?'':'s'), sub:'Submitted by the workshop, not yet reviewed'};
  else if(pend.length) appr={a:pend.length+' photograph'+(pend.length===1?'':'s'), sub:'Waiting on your review'};
  else if(gate) appr={a:'Buyer decision', sub:'Approval requested at '+now.stage.name};
  else if(itemApprovedUnsent(it).length) appr={a:'Approved, not sent', sub:'The buyer cannot see it until you publish'};

  // What happens next
  const next = nxt
    ? { a: nxt.complete?('Complete '+nxt.stage.name):nxt.stage.name,
        sub: nxt.complete?'Then the piece moves on':'Once this stage is finished' }
    : { a:'Nothing left', sub:'Every stage is done' };

  return [
    {q:'Where is it?',           a:where.a,     sub:where.sub},
    {q:'What happened?',         a:happened.a,  sub:happened.sub},
    {q:'Is it delayed?',         a:delayed.a,   sub:delayed.sub, warn:/late|hold|Behind/i.test(delayed.a)},
    {q:'What needs approval?',   a:appr.a,      sub:appr.sub,    warn:appr.a!=='Nothing waiting'},
    {q:'What happens next?',     a:next.a,      sub:next.sub}
  ];
}

function workStatusLabel(u){
  if(!u) return '';
  if(u.work_status==='no_work')  return 'No work logged';
  if(u.work_status==='blocked')  return 'Reported blocked';
  return 'Work logged';
}

// Staff names never leave the admin's screen; this is only ever called there.
function staffName(userId){
  if(!userId || !isAdmin()) return '';
  const p=(S.profilesAll||[]).find(x=>x.user_id===userId);
  return p ? shortLogin(p.full_name||p.email||'') : '';
}

// Only the things that can actually hold this piece up.
function itemAttention(it){
  const out=[];
  const now=stageNow(it);
  const waiting=itemUpdatesWaiting(it);
  const pend=itemPending(it);
  const unsent=itemApprovedUnsent(it);
  if(waiting.length) out.push({ title:'Review '+waiting.length+' workshop update'+(waiting.length===1?'':'s'),
    sub:'Submitted '+fdate(waiting[0].work_date)+' · nothing reaches the buyer until you approve it',
    action:'Review', run:"go('#/production/review')" });
  if(pend.length) out.push({ title:'Review '+pend.length+' photograph'+(pend.length===1?'':'s'),
    sub:'Uploaded by the workshop · the buyer cannot see them yet',
    action:'Review', run:"go('#/production/photos')" });
  if(unsent.length) out.push({ title:'Approved work not sent to the buyer',
    sub:unsent.length+' update'+(unsent.length===1?' is':'s are')+' approved but unpublished',
    action:'Publish', run:"go('#/production/review')" });
  if(now && now.held) out.push({ title:'This stage is on hold',
    sub:((now.internal&&now.internal.hold_reason)||'No reason recorded')+
        ((now.internal&&now.internal.hold_revised_date)?(' · revised to '+fdate(now.internal.hold_revised_date)):''),
    action:'Open', run:"toggleStage('"+it.id+"',"+now.stage.id+")" });
  if(now && now.row.approval==='requested') out.push({ title:'Waiting on the buyer',
    sub:'Approval requested at '+now.stage.name, action:'', run:'' });
  const cmt=(S.commentsByItem[it.id]||[]).filter(c=>c.author_role==='buyer' && !c.resolved_at);
  if(cmt.length) out.push({ title:cmt.length+' unanswered buyer question'+(cmt.length===1?'':'s'),
    sub:'Left against a stage on this piece', action:'Open', run:"go('#/item/"+it.id+"')" });
  if(!out.length) out.push({ title:'Nothing is holding this piece up',
    sub:(now && now.internal && now.internal.planned_date)
        ? ('Next checkpoint: '+now.stage.name+' by '+fdate(now.internal.planned_date))
        : 'No decision is waiting on you', action:'', run:'', calm:true });
  return out;
}

// What the workshop should be comparing its work against.
function itemReferences(it){
  const docs=(S.docsByItem&&S.docsByItem[it.id])||[];
  const poDocs=(S.docsByPo&&S.docsByPo[it.po_id])||[];
  const pics=(S.photosByItem[it.id]||[]).filter(x=>!x.stage_id);
  const kind=k=>pics.filter(p=>p.photo_type===k);
  const drawing=docs.concat(poDocs).filter(d=>d.doc_type==='drawing').slice(-1)[0];
  const out=[];
  out.push({ k:'Production drawing', v: drawing?(drawing.name||'On file'):'None on file',
             miss:!drawing, open: drawing?("openDoc('"+esc(drawing.path)+"')"):'' });
  out.push({ k:'Target product', v: kind('reference').length?(kind('reference').length+' image'+(kind('reference').length===1?'':'s')):'None', miss:!kind('reference').length });
  out.push({ k:'Approved block', v: kind('block').length?(kind('block').length+' photograph'+(kind('block').length===1?'':'s')):'None', miss:!kind('block').length });
  out.push({ k:'3D model', v: kind('model').length?'On file':(docs.some(d=>d.doc_type==='model')?'On file':'None'), miss:!kind('model').length && !docs.some(d=>d.doc_type==='model') });
  out.push({ k:'Specification', v: (it.dims_text||dimsOf(it))?'Recorded':'Not recorded', miss:!(it.dims_text||dimsOf(it)) });
  return out;
}

// The activity log for one piece, in words rather than system events.
function itemActivity(it, n){
  return (S.activity||[]).filter(a=>a.item_id===it.id)
    .filter(a=>!/^photo_submitted$/.test(a.action))
    .slice(0, n||8);
}

<script>
'use strict';

/* ---------------------------------------------------------------------------
   Small presentational helpers, all speaking the handoff's class vocabulary.
--------------------------------------------------------------------------- */

const STAGE_ICONS = {
  order_confirmed:'stage-confirmed', stone_selection:'stage-selection',
  dressing_sizing:'stage-dressing', production_planning:'stage-planning',
  prod_sizing:'stage-sizing', moulding:'stage-moulding', finishing:'stage-finishing',
  sealing:'stage-sealing', final_photos:'stage-photos', packing:'stage-packing',
  shipped:'stage-shipped', delivered:'stage-delivered'
};
function stageSymbol(st){
  if(!st) return 'stage-confirmed';
  if(STAGE_ICONS[st.key]) return STAGE_ICONS[st.key];
  const n=(st.name||'').toLowerCase();
  if(n.indexOf('drawing')>=0||n.indexOf('planning')>=0) return 'stage-planning';
  if(n.indexOf('select')>=0) return 'stage-selection';
  if(n.indexOf('dress')>=0) return 'stage-dressing';
  if(n.indexOf('siz')>=0) return 'stage-sizing';
  if(n.indexOf('mould')>=0||n.indexOf('mold')>=0) return 'stage-moulding';
  if(n.indexOf('finish')>=0||n.indexOf('polish')>=0) return 'stage-finishing';
  if(n.indexOf('seal')>=0) return 'stage-sealing';
  if(n.indexOf('photo')>=0) return 'stage-photos';
  if(n.indexOf('pack')>=0||n.indexOf('crat')>=0) return 'stage-packing';
  if(n.indexOf('ship')>=0||n.indexOf('dispatch')>=0) return 'stage-shipped';
  if(n.indexOf('deliver')>=0) return 'stage-delivered';
  return 'stage-confirmed';
}
function icon(id, cls){ return '<svg class="icon'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#'+id+'"/></svg>'; }

function badge(text, kind){ return '<span class="badge'+(kind?' badge--'+kind:'')+'">'+esc(text)+'</span>'; }
// compact form for badges and list rows; the timeline and settings keep the full name
function shortStage(n){ return String(n||'').replace(/^\s*Production\s*[—–-]\s*/i,'').trim(); }
function statusBadge(it){
  const map={in_production:['In production','pending'], on_hold:['On hold','alert'], ready:['Ready','success'],
    shipped:['Shipped','success'], delivered:['Delivered','success'], cancelled:['Cancelled',''], not_started:['Not started','']};
  const m=map[it.status]||[it.status,''];
  return badge(m[0], m[1]);
}
function poStatusBadge(p){
  const map={open:['Open',''], on_hold:['On hold','alert'], completed:['Completed','success'], cancelled:['Cancelled','']};
  const m=map[p.status]||[p.status,''];
  return badge(m[0], m[1]);
}
function stageBadge(it){
  const s=S.stagesById[it.current_stage_id];
  return s?badge(shortStage(s.name),'pending'):'';
}
function progressBar(v){ return '<div class="progress"><div class="progress__bar" style="width:'+Math.round((v||0)*100)+'%"></div></div>'; }
function eyebrow(t){ return t?'<p class="eyebrow">'+esc(t)+'</p>':''; }

/* a photo slot: the handoff's .photo-placeholder with a real image laid over it */
function photoSlot(p, opts){
  opts=opts||{};
  const cap=opts.caption!=null?opts.caption:(p.caption||'');
  const mod=opts.mod?(' '+opts.mod):'';
  const canDel = opts.del!==false && (isAdmin() || (isStaff() && p.uploaded_by===uid() && p.status!=='approved'));
  let h='<div class="photo-card">';
  if(p.status==='pending') h+=badge('Awaiting approval','pending');
  else if(p.status==='rejected') h+=badge('Sent back','alert');
  else if(opts.showApproved) h+=badge('Approved','success');
  h+='<div class="photo-placeholder'+mod+'" role="img" aria-label="'+esc(cap||'Photo')+'" '+
     'onclick="openPhoto(event,this)" data-ph-path="'+esc(p.path)+'" data-cap="'+esc(cap)+'" style="cursor:zoom-in">'+
     '<img alt="" data-ph-path="'+esc(p.path)+'" onload="this.parentNode.classList.add(\'is-loaded\')">'+
     '<span>'+esc(cap||'Photo')+'</span>';
  if(isAdmin()&&p.status==='pending')
    h+='<button class="ph-del ph-ok" title="Approve" onclick="event.stopPropagation();setPhotoStatus([\''+p.id+'\'],\'approved\')">✓</button>';
  if(canDel)
    h+='<button class="ph-del" title="Delete" onclick="delPhoto(event,\''+p.id+'\',\''+esc(p.path)+'\')">✕</button>';
  h+='</div></div>';
  return h;
}
function photoGridOf(list, opts){
  list=list||[];
  if(!list.length) return '';
  return '<div class="photo-grid">'+list.map(p=>photoSlot(p,opts)).join('')+'</div>';
}
// Every thumbnail doubles as a way to add a picture. An empty slot is the most
// obvious place to reach for when a piece has no photograph, so it takes the tap
// rather than making someone hunt for an upload button elsewhere.
function thumbOf(list, itemId, stageId, poId){
  const p=(list||[])[0];
  const canAdd = (isAdmin()||isStaff()) && (itemId||poId);
  const hook = canAdd
    ? ' data-add-photo="1" tabindex="0" role="button" title="Add a photo"'+
      ' onclick="event.stopPropagation();pickPhotos('+
        (itemId?"'"+itemId+"'":'null')+','+(stageId||'null')+','+(poId?"'"+poId+"'":'null')+')"'+
      ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();event.stopPropagation();'+
        'pickPhotos('+(itemId?"'"+itemId+"'":'null')+','+(stageId||'null')+','+(poId?"'"+poId+"'":'null')+');}"'
    : '';
  if(!p) return '<div class="photo-placeholder'+(canAdd?' photo-placeholder--add':'')+'"'+
    (canAdd?'':' role="img"')+' aria-label="'+(canAdd?'Add a photo':'No photo yet')+'"'+hook+'>'+
    '<span>'+(canAdd?'Add a photo':'No photo yet')+'</span></div>';
  return '<div class="photo-placeholder'+(canAdd?' photo-placeholder--add':'')+'"'+
    (canAdd?'':' role="img"')+' aria-label="Product photo"'+hook+' data-ph-path="'+esc(p.path)+'">'+
    '<img alt="" data-ph-path="'+esc(p.path)+'" onload="this.parentNode.classList.add(\'is-loaded\')">'+
    '<span>'+(canAdd?'Add a photo':'Product image')+'</span></div>';
}

    nav.className='side-nav';

   Sign in

  $('shell').hidden=true;

  root.hidden=false;
  root.innerHTML=

      '<div class="wordmark"><span class="wordmark__mark wordmark__mark--inverse">'+icon('i-mark','icon--lg')+'</span>'+

function attentionItem(iconId, title, meta, count, onclick, kind){
  return '<article class="attention-item"'+(onclick?' style="cursor:pointer" onclick="'+onclick+'"':'')+'>'+
    '<span class="attention-item__icon">'+icon(iconId)+'</span>'+
    '<div><p class="attention-item__title">'+esc(title)+'</p><p class="attention-item__meta">'+esc(meta)+'</p></div>'+
    (count?'<span class="attention-item__count'+(kind?' '+kind:'')+'">'+count+'</span>':'')+
  '</article>';

function attentionRows(){
  const rows=[];
  if(isAdmin()){
    const np=pendingPhotos().length;
    if(np) rows.push(attentionItem('i-camera','Photos awaiting your approval',
      'The client cannot see them until you approve', np, "go('#/production/photos')"));
  }
  const appr=pendingApprovals();
  if(appr.length){
    if(isAdmin()) rows.push(attentionItem('i-check','Waiting on buyer sign-off',
      appr.slice(0,2).map(a=>a.item.product).join(', ')+(appr.length>2?'…':''), appr.length, "go('#/item/"+appr[0].item.id+"')"));
    else appr.forEach(a=>rows.push(attentionItem('i-check','Your approval is requested',
      a.item.product+' — '+(a.stage?a.stage.name:''), '', "go('#/item/"+a.item.id+"')")));
  }
  const unread=itemsWithUnread();
  if(unread.length) rows.push(attentionItem('stage-selection','New comments',
    unread.slice(0,2).map(it=>it.product).join(', ')+(unread.length>2?'…':''),
    unread.reduce((a,it)=>a+unreadCount(it.id),0), "go('#/item/"+unread[0].id+"')"));
  const late=S.items.filter(it=>{ const l=lateness(it); return l&&l.state==='late'; });
  if(late.length) rows.push(attentionItem('stage-shipped','Past the planned date',
    late.slice(0,2).map(it=>it.product).join(', ')+(late.length>2?'…':''), late.length, "go('#/item/"+late[0].id+"')"));
  if(isAdmin()){
    const stale=S.items.filter(it=>it.status==='in_production' && it.lastUpdate &&
      (Date.now()-new Date(it.lastUpdate).getTime())>7*86400000);
    if(stale.length) rows.push(attentionItem('stage-planning','No update for over a week',
      stale.slice(0,2).map(it=>it.product).join(', ')+(stale.length>2?'…':''), stale.length, "go('#/item/"+stale[0].id+"')"));
  }
  return rows;
}

function poRail(activeId){
  const hits=searchHits(window.__gq);
  const pool=hits ? S.pos.filter(p=>hits.pos.indexOf(p)>=0 || hits.items.some(i=>i.po_id===p.id)) : S.pos;
  const open=pool.filter(p=>p.status!=='completed'&&p.status!=='cancelled');
  const done=pool.filter(p=>p.status==='completed'||p.status==='cancelled');
  const b=p=>S.buyersById[p.buyer_id];
  const cur=p=>{ const s=p.items.map(i=>S.stagesById[i.current_stage_id]).filter(Boolean).sort((a,c)=>a.sort_order-c.sort_order)[0]; return s?shortStage(s.name):'Not started'; };
  // A real link, so it can be tabbed to, opened in a new tab, and announced —
  // this was a clickable <article> with no semantics at all.
  const row=p=>'<a class="po-rail__item'+(p.id===activeId?' po-rail__item--active':'')+'" '+
      'href="#/po/'+p.id+'"'+(p.id===activeId?' aria-current="page"':'')+
      ' aria-label="'+esc(p.po_number+' · '+(p.project||''))+'">'+
    '<p class="po-rail__number">'+esc(p.po_number)+'</p>'+
    '<p class="po-rail__name">'+esc(p.project||(p.items[0]?p.items[0].product:'—'))+'</p>'+
    '<p class="po-rail__meta">'+esc([isAdmin()&&b(p)?b(p).company:'', cur(p)].filter(Boolean).join(' · '))+'</p>'+
    progressBar(p.progress)+
  '</a>';
  // Filters, so a long order book can be cut down to the ones that need doing
  // something about rather than scrolled through.
  let list=open, filterUI='';
  if(isAdmin()){
    const f=window.__poFilter||'open';
    const buckets=poBuckets(open);
    list=buckets[f]||open;
    filterUI='<div class="po-filter">'+[
      ['open','All open'],['attention','Needs attention'],['risk','At risk / late'],
      ['buyer','Awaiting buyer'],['ship','Ready to ship']
    ].map(x=>'<button class="po-filter__btn'+(f===x[0]?' po-filter__btn--on':'')+'" type="button" '+
      'onclick="setPoFilter(\''+x[0]+'\')"><span>'+x[1]+'</span><span>'+(buckets[x[0]]||[]).length+'</span></button>').join('')+'</div>';
  }
  return '<aside class="po-rail" aria-label="Purchase order list">'+
    '<p class="po-rail__title">Purchase orders'+(isAdmin()?' · '+S.pos.length:'')+'</p>'+
    (isAdmin()?'<button class="button button--secondary button--wide space-top-10" type="button" style="margin-bottom:12px" onclick="mNewPO()">+ New PO</button>':'')+
    filterUI+
    '<div class="po-rail__list">'+
      (list.length?list.map(row).join(''):'<p class="po-rail__meta">'+(hits?'No match in open orders.':'Nothing in this filter.')+'</p>')+
      (done.length&&(window.__poFilter||'open')==='open'?'<p class="po-rail__title">Completed</p>'+done.map(row).join(''):'')+
    '</div></aside>';
}

// What the buyer is told about money. A bare "balance" is the ambiguity we are
// removing: on 100% advance terms the buyer is normally in credit, and that is
// money we hold, not money they owe.
function statementPanel(buyerId){
  const sn = latestStatement(buyerId);
  const st = statementStanding(sn);
  if(!st) return '';
  const lines = (S.ledgerLines[sn.id]||[]);
  return '<section class="panel space-top-18"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Statement</h3>'+
    '<p class="panel__description">A copy of your ledger with '+esc(S.settings.company_name||'Gujraj Impex')+'.</p></div>'+
    badge('as at '+fdate(st.as_of))+'</div><div class="panel__body">'+
    '<div class="statement-headline'+(st.credit?' statement-headline--credit':'')+'">'+
      '<p class="statement-headline__label">'+esc(st.label)+'</p>'+
      '<p class="statement-headline__value">'+esc(money(st.amount, st.currency))+'</p>'+
      '<p class="statement-headline__note">'+esc(st.note)+'</p>'+
    '</div>'+
    // An amount with no direction is the same ambiguity the headline removes, so
    // every line says which way it went. "In your favour" is true of a receipt and
    // of a credit note alike; "charged to you" of an invoice or a debit note.
    (lines.length?'<div class="data-table-wrap space-top-12"><table class="data-table">'+
      '<tr><th>Date</th><th>Reference</th><th>Detail</th><th>Amount</th></tr>'+
      lines.map(l=>{
        const dir = l.side==='credit' ? 'In your favour' : l.side==='debit' ? 'Charged to you' : '';
        return '<tr><td>'+esc(fdate(l.entry_date))+'</td><td>'+esc(l.ref||'—')+'</td>'+
        '<td>'+esc(l.label||'')+'</td><td>'+esc(money(l.amount,sn.currency))+
        (dir?'<span class="ledger-dir">'+dir+'</span>':'')+'</td></tr>';
      }).join('')+
      '</table></div>':'')+
    '<p class="field-hint space-top-10">This is a copy of our books taken on '+esc(fdate(st.as_of))+
    '. If anything looks wrong, reply here and we will check it against Tally.</p>'+
    '</div></section>';
}

function vCommandCentre(){
  if(!isAdmin()) return vHome();
  const q=queueCounts();
  const acts=ownerActions();
  const chip=window.__ccChip||'priority';
  const shown=chip==='priority'?acts:acts.filter(a=>a.chip===chip);
  const d=new Date();
  const updTotal=activeItems().length, updGot=updTotal-q.missing;
  const risk=lateStages().length + q.blocked;

  // One sentence, so the first thing read is the shape of the day.
  const bits=[];
  if(q.decisions) bits.push(q.decisions+' decision'+(q.decisions===1?'':'s')+' waiting');
  bits.push(updGot+' of '+updTotal+' updates received');
  if(risk) bits.push(risk+' piece'+(risk===1?'':'s')+' at risk');
  if(q.overdueCount) bits.push(q.overdueCount+' buyer'+(q.overdueCount===1?'':'s')+' outstanding');

  let h='<div class="page-heading"><div>'+
    eyebrow(['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+
      ', '+d.getDate()+' '+MON[d.getMonth()]+' · owner workspace')+
    '<h1 class="display-title">Today.</h1>'+
    '<p class="lede">'+esc(bits.join(' · '))+'.</p></div></div>';

  h+='<section class="kpi-grid" aria-label="Today at a glance">'+
    kpi('Urgent decisions', q.decisions+q.blocked, q.blocked?'Includes '+q.blocked+' blocked':'Nothing stuck', "go('#/production/blocked')")+
    kpi('Updates today', updGot+' / '+updTotal, q.missing?q.missing+' still missing':'All in', "go('#/production/missing')")+
    kpi('Running late', lateStages().length, 'Past their planned date', "go('#/production')")+
    kpi('Outstanding', q.overdue?money(q.overdue,'INR'):'—', q.overdueCount?q.overdueCount+' buyer'+(q.overdueCount===1?'':'s'):'Nothing owed on the books', "go('#/finance')")+
  '</section>';

  const chips=[['priority','Priority',acts.length],['approval','Approvals',q.approvals],
    ['missing','Missing',q.missing],['blocked','Blocked',q.blocked],
    ['client','Client updates',q.clientUpdates],['finance','Finance',q.overdueCount]];

  h+='<div class="console-grid">';
  h+='<section class="panel console-grid__main"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Owner actions</h3>'+
    '<p class="panel__description">Urgent first, then due today, then what is waiting on other people.</p></div>'+
    '<div class="chip-row">'+chips.map(c=>'<button class="chip'+(chip===c[0]?' chip--on':'')+
      '" type="button" onclick="ccChip(\''+c[0]+'\')">'+esc(c[1])+(c[2]?' · '+c[2]:'')+'</button>').join('')+
    '</div></div><div class="panel__body">';

  if(!shown.length){
    h+='<div class="empty-state">Nothing is waiting on you.</div>';
  } else {
    [[0,'Urgent now'],[1,'Due today'],[2,'Waiting on others']].forEach(g=>{
      const rows=shown.filter(a=>a.urgency===g[0]);
      if(!rows.length) return;
      h+='<div class="act-group"><span>'+g[1]+'</span><span>'+rows.length+'</span></div>'+
        rows.map(actionRow).join('');
    });
  }
  h+='</div></section>';

  const week=nextSevenDays();
  h+='<section class="panel console-grid__side"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Next seven days</h3>'+
    '<p class="panel__description">Dispatch and planned stages.</p></div>'+
    badge(week.length+' milestone'+(week.length===1?'':'s'))+'</div><div class="panel__body">'+
    (week.length?week.map(w=>{
      const dt=new Date(w.date+'T00:00:00');
      return '<button class="milestone" type="button" onclick="'+w.go+'">'+
        '<span class="milestone__date"><em>'+['SUN','MON','TUE','WED','THU','FRI','SAT'][dt.getDay()]+'</em>'+dt.getDate()+'</span>'+
        '<span><strong>'+esc(w.title)+'</strong><small>'+esc(w.meta)+'</small></span></button>';
    }).join(''):'<div class="empty-state">Nothing dated in the next week.</div>')+
    '</div></section>';
  h+='</div>';

  paintPlain(h);
}

/* Each console section is a small set of tabs over screens that already work.
   The tab strip is prepended after the screen has drawn itself, so none of the
   tested screens had to be pulled apart to gain the new navigation. */
function tabStrip(tabs, active){
  return '<div class="console-tabs" role="tablist">'+tabs.map(t=>
    '<button class="console-tab'+(t[0]===active?' console-tab--on':'')+'" type="button" role="tab"'+
    ' aria-selected="'+(t[0]===active?'true':'false')+'" onclick="go(\''+t[2]+'\')">'+esc(t[1])+
    (t[3]?' <span class="badge badge--alert">'+t[3]+'</span>':'')+'</button>').join('')+'</div>';
}
function withTabs(render0, tabs, active){
  render0();
  const el=$('app');
  if(el) el.insertAdjacentHTML('afterbegin', tabStrip(tabs, active));
}

      '<div class="panel__body"><div class="empty-state">Nothing published yet. '+
      'You will see a photograph and a line about the work on the day it happens.</div></div></section>';
  }
  const top=feed[0];
  const rest=feed.slice(1);
  const card=(f,big)=>{
    const ph=f.photos;

/* The whole fourteen-stage sequence on one line, so where a piece sits is read
   at a glance rather than counted down a list. A PO can hold several products at
   different stages, so this tracks the earliest one and says so. */
function stageStepper(p){
  const stages=(S.stages||[]).filter(s=>s.active).sort((a,b)=>a.sort_order-b.sort_order);
  if(!stages.length || !p.items.length) return '';
  const cur=p.items.map(i=>S.stagesById[i.current_stage_id]).filter(Boolean)
    .sort((a,c)=>a.sort_order-c.sort_order)[0];
  const at=cur?cur.sort_order:-1;
  // a step counts as done when every product on the order has passed it
  const doneFor=(st)=>p.items.every(it=>{
    const r=(S.stByItem[it.id]||[]).find(x=>x.stage_id===st.id);
    return r && (r.status==='completed'||r.status==='skipped');
  });
  const steps=stages.map((st,i)=>{
    const done=doneFor(st);
    const now=cur && st.id===cur.id;
    return '<li class="step'+(done?' step--done':'')+(now?' step--now':'')+'"'+(now?' aria-current="step"':'')+'>'+
      '<span class="step__dot">'+(done?icon('i-check','icon--sm'):(i+1))+'</span>'+
      '<span class="step__label">'+esc(shortStage(st.name))+'</span></li>';
  }).join('');
  const pos=stages.findIndex(st=>cur && st.id===cur.id);
  return '<section class="panel space-top-14"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Workshop journey</h3>'+
    '<p class="panel__description">All '+stages.length+' stages on the floor. '+
      (p.items.length>1?'Shown at the earliest of the '+p.items.length+' products.':'')+
    '</p></div>'+(cur?badge(cur.name):'')+'</div>'+
    '<div class="panel__body"><ol class="stepper">'+steps+'</ol>'+
    (cur?'<div class="stepper__foot"><div><strong>'+esc(cur.name)+'</strong>'+
      '<small>Stage '+(pos+1)+' of '+stages.length+'</small></div>'+
      '<button class="button button--secondary" type="button" onclick="go(\'#/item/'+
        (p.items.find(i=>i.current_stage_id===cur.id)||p.items[0]).id+'\')">Open current stage</button></div>':'')+
    '</div></section>';
}

  if(compact) return '';
  const list = ewaybillsForPo(p.id);
  if(!list.length) return '';
  return '<div class="space-top-12"><p class="eyebrow">Consignment</p>'+
    list.map(e=>'<div class="side-card__rows">'+
      sideRows([['e-Way bill', e.eway_no],
                ['Vehicle', [e.mode, e.vehicle].filter(Boolean).join(' · ')],
                ['Transporter', e.transporter],
                ['Dispatched from', e.place_of_dispatch],
                ['Delivering to', e.place_of_delivery],
                ['Dated', fdate(e.eway_date)],
                ['Valid until', fdate(e.valid_until)],
                ['Distance', e.distance_km ? e.distance_km+' km' : ''],
                ['Against invoice', e.document_no]])+
      (e.doc_path?'<div class="button-row space-top-10"><button class="button button--secondary" type="button" onclick="openDoc(\''+esc(e.doc_path)+'\')">Open the e-way bill</button></div>':'')+
      '</div>').join('')+'</div>';
}

// How a piece was crated is the thing a buyer asks about when it arrives, so
// the packing and dispatch photographs belong on the shipping panel rather than
// buried in the general gallery. Approval rules are unchanged.
function packingPhotos(p, compact){
  if(compact) return '';
  const dispatchIds = (S.stages||[])
    .filter(s=>['packing','shipped','delivered'].includes(s.key))
    .map(s=>s.id);
  if(!dispatchIds.length) return '';
  let list = [];
  (p.items||[]).forEach(it=>{
    list = list.concat((S.photosByItem[it.id]||[]).filter(x=>dispatchIds.includes(x.stage_id)));
  });
  list = visiblePhotos(list);
  if(!list.length) return '';
  return '<div class="space-top-12"><p class="eyebrow">Packing and dispatch</p>'+photoGridOf(list)+'</div>';
}

function shipPanel(p, compact){
  const admin=isAdmin();
  const rows=[['Ship to',p.ship_to],['Mode',p.ship_mode],['Forwarder',p.forwarder],['Container / LR no.',p.container_no],
    ['Vessel',p.vessel],['Port of loading',p.port_loading],['Port of discharge',p.port_discharge],
    ['ETD',fdate(p.etd)],['ETA',fdate(p.eta)],['Shipped on',fdate(p.shipped_at)],['Delivered on',fdate(p.delivered_at)]];

  if(compact && !any && !admin) return '';

    (p.tracking_url?'<div class="button-row space-top-12"><a class="button button--secondary" href="'+esc(p.tracking_url)+'" target="_blank" rel="noopener">Track consignment ↗</a></div>':'')+
    (p.shipping_notes?'<p class="stage-note space-top-10">'+esc(p.shipping_notes)+'</p>':'')+
    ewayRows(p, compact)+
    packingPhotos(p, compact)+
    (admin?'<div class="button-row space-top-12"><button class="button button--secondary" type="button" onclick="mShip(\''+p.id+'\')">Edit shipping</button></div>':'');
  if(compact) return '<section class="side-card"><h3 class="side-card__title">Shipping</h3>'+body+'</section>';
  return '<section class="panel"><div class="panel__head"><div><h3 class="panel__title">Shipping details</h3>'+
    '<p class="panel__description">Forwarder, container and tracking for this consignment.</p></div></div>'+
    '<div class="panel__body">'+body+'</div></section>';
}

function docsPanel(p, compact){
  const admin=isAdmin();
  const docs=S.docsByPo[p.id]||[];
  if(compact && !docs.length && !admin) return '';
  const body=(docs.length
    ? '<div class="side-card__rows">'+docs.map(d=>'<div class="side-row"><span style="cursor:pointer;text-decoration:underline" onclick="openDoc(\''+esc(d.path)+'\')">'+esc(d.name)+'</span>'+
        '<strong>'+esc(d.doc_type||'')+(admin?((d.for_staff?' · floor':'')+(d.for_buyer?' · buyer':'')):'')+
        (admin?' <button class="button button--quiet" type="button" style="min-height:28px;padding:0 8px" onclick="delDoc(\''+d.id+'\',\''+esc(d.path)+'\')">✕</button>':'')+'</strong></div>').join('')+'</div>'
    : '<p class="panel__description space-top-12">No documents yet.</p>')+

/* ---------------------------------------------------------------------------
   Product journey — the twelve-stage timeline
--------------------------------------------------------------------------- */

function commentThread(it, stageId){
  const list=(S.commentsByItem[it.id]||[]).filter(c=>c.stage_id===stageId);
  let h='';
  if(list.length){
    h+='<div class="comment-thread">'+list.map(c=>{
      const me=c.author_id===uid();
      return '<div class="comment"><span class="comment__avatar">'+esc(initials(c.author_name||c.author_role||'?'))+'</span>'+
        '<div class="comment__bubble"><strong>'+esc(c.author_name||c.author_role)+(me?' · you':'')+'</strong>'+esc(c.body)+
        (c.attachment_path?'<div class="photo-placeholder space-top-10" style="min-height:120px;cursor:zoom-in" onclick="openPhoto(event,this)" data-ph-path="'+esc(c.attachment_path)+'" data-cap="">'+
          '<img alt="" data-ph-path="'+esc(c.attachment_path)+'" onload="this.parentNode.classList.add(\'is-loaded\')"><span>Attachment</span></div>':'')+
        '<div class="field-hint space-top-10">'+ftime(c.created_at)+
        (c.resolved_at?' · dealt with':'')+
        // A buyer's question stays open until somebody closes it, so the panel
        // of things needing attention empties instead of growing for ever.
        (isAdmin()&&c.author_role==='buyer'
          ? (c.resolved_at
              ? ' · <a href="#" onclick="event.preventDefault();reopenComment(\''+c.id+'\')">reopen</a>'
              : ' · <a href="#" onclick="event.preventDefault();resolveComment(\''+c.id+'\')">mark dealt with</a>')
          : '')+
        '</div></div></div>';
    }).join('')+'</div>';
  }
  h+='<div class="comment-composer"><input type="text" id="cmt-'+stageId+'" placeholder="Leave a comment on this stage" '+
     'onkeydown="if(event.key===\'Enter\')sendComment(\''+it.id+'\','+stageId+')">'+
     '<button class="button" type="button" onclick="sendComment(\''+it.id+'\','+stageId+')">Send</button></div>';
  return h;
}

function approvalGate(it, row, st){
  if(!row) return '';
  if(row.approval==='requested'){
    if(!isAdmin()) return '<div class="approval-gate"><div>'+
      '<p class="approval-gate__title">'+icon('i-check')+' Approve '+esc(st.name.toLowerCase())+'?</p>'+
      '<p class="approval-gate__copy">'+esc(row.approval_note||'Your sign-off lets the workshop move to the next stage.')+'</p></div>'+
      '<div class="button-row"><button class="button button--success" type="button" onclick="respondApproval(\''+it.id+'\','+st.id+',\'approved\')">Approve</button>'+
      '<button class="button button--secondary" type="button" onclick="respondApproval(\''+it.id+'\','+st.id+',\'changes_requested\')">Request changes</button></div></div>';
    return '<div class="approval-gate"><div>'+
      '<p class="approval-gate__title">'+icon('i-check')+' Waiting on the buyer</p>'+
      '<p class="approval-gate__copy">Approval requested'+(row.approval_at?' '+ftime(row.approval_at):'')+'. The stage stays open until they respond.</p></div>'+
      '<div class="button-row"><button class="button button--secondary" type="button" onclick="requestApproval(\''+it.id+'\','+st.id+',false)">Withdraw request</button></div></div>';
  }
  if(row.approval==='approved')
    return '<div class="approval-gate"><div><p class="approval-gate__title">'+icon('i-check')+' Approved by the buyer</p>'+
      '<p class="approval-gate__copy">'+esc([row.approval_at?ftime(row.approval_at):'', row.approval_note].filter(Boolean).join(' · '))+'</p></div></div>';
  if(row.approval==='changes_requested')
    return '<div class="approval-gate"><div><p class="approval-gate__title">'+icon('i-check')+' Changes requested</p>'+
      '<p class="approval-gate__copy">'+esc(row.approval_note||'The buyer has asked for changes at this stage.')+'</p></div>'+
      (isAdmin()?'<div class="button-row"><button class="button" type="button" onclick="requestApproval(\''+it.id+'\','+st.id+',true)">Re-request approval</button></div>':'')+
      '</div>';
  return '';
}

function stageActions(it, row, st){
  if(isStaff()) return '<div class="button-row"><button class="button button--workshop" type="button" onclick="pickPhotos(\''+it.id+'\','+st.id+')">'+
    icon('i-camera')+'Add photos</button></div>';
  if(!isAdmin()) return '';
  let h='<div class="button-row">';
  if(row.status!=='in_progress') h+='<button class="button button--secondary" type="button" onclick="advance(\''+it.id+'\','+st.id+',false)">Start stage</button>';
  if(row.status!=='completed') h+='<button class="button button--success" type="button" onclick="advance(\''+it.id+'\','+st.id+',true)">Mark complete</button>';
  if(row.status==='completed') h+='<button class="button button--secondary" type="button" onclick="setStage(\''+it.id+'\','+st.id+',\'in_progress\')">Reopen</button>';
  h+='<button class="button button--secondary" type="button" onclick="pickPhotos(\''+it.id+'\','+st.id+')">'+icon('i-camera','icon--sm')+'Add photos</button>';
  h+='<button class="button button--secondary" type="button" onclick="mNote(\''+it.id+'\','+st.id+')">Workshop note</button>';
  h+='<button class="button button--secondary" type="button" onclick="mPlan(\''+it.id+'\','+st.id+')">Planned date</button>';
  if(row.status==='on_hold')
    h+='<button class="button button--success" type="button" onclick="liftHold(\''+it.id+'\','+st.id+')">Lift hold</button>';
  else
    h+='<button class="button button--secondary" type="button" onclick="mHold(\''+it.id+'\','+st.id+')">Put on hold</button>';
  // Not every piece needs every stage — a plain slab never gets moulded.
  if(row.status==='skipped')
    h+='<button class="button button--quiet" type="button" onclick="setStage(\''+it.id+'\','+st.id+',\'pending\')">Needed after all</button>';
  else if(row.status!=='completed')
    h+='<button class="button button--quiet" type="button" onclick="skipStage(\''+it.id+'\','+st.id+')">Not needed</button>';
  if(row.approval==='none'||row.approval==='approved'||!row.approval)
    h+='<button class="button button--secondary" type="button" onclick="requestApproval(\''+it.id+'\','+st.id+',true)">Ask buyer to approve</button>';
  h+='</div>';
  return h;
}

// A one-word slip warning on the collapsed row, workshop-side only.
function lateChip(it, row){
  if(!isAdmin() && !isStaff()) return '';
  const d = stageDelay(it.id, row);
  if(!d || d.state !== 'overdue') return '';
  return badge(d.days+' day'+(d.days===1?'':'s')+' over', 'alert');
}

// Planned dates, delays and hold detail are shown to the workshop only. A buyer
// reading "planned 5 Sep" and then watching it pass is the phone call we are
// trying to stop; what he sees is the delivery date and what has actually happened.
function stageInternalPanel(it, row){
  if(!isAdmin() && !isStaff()) return '';
  const d = stageDelay(it.id, row);
  const hold = holdOf(it.id, row);
  if(!d && !hold) return '';
  let h = '<div class="internal-strip"><span class="internal-strip__tag">Workshop only</span>';
  if(d){
    const label = d.state==='late'    ? Math.abs(d.days)+' day'+(Math.abs(d.days)===1?'':'s')+' late'
                : d.state==='ontime'  ? (d.days===0?'On time':Math.abs(d.days)+' day'+(Math.abs(d.days)===1?'':'s')+' early')
                : d.state==='overdue' ? d.days+' day'+(d.days===1?'':'s')+' over'
                : 'Due '+fdate(d.planned);
    const tone = (d.state==='late'||d.state==='overdue') ? 'alert' : 'success';
    h += '<span>Planned '+esc(fdate(d.planned))+'</span>'+badge(label, tone);
  }
  if(hold){
    h += '<span class="internal-strip__hold">'+
      esc([hold.hold_reason, hold.hold_owner, hold.hold_revised_date?('revised to '+fdate(hold.hold_revised_date)):'']
        .filter(Boolean).join(' · '))+'</span>';
  }
  return h + '</div>';
}

function vItem(id){
  const it=S.itemsById[id];
  if(!it){ const m='<div class="empty-state">Product not found.</div>';
    if(isStaff()) $('app').innerHTML=m; else paint(m,null); return; }
  // The owner gets the question-led page; the buyer and the workshop keep the
  // views they already have, which are built for different jobs.
  if(isAdmin()) return vItemOwner(it);
  const p=it.po;
  const staff=isStaff();
  const admin=isAdmin();
  const due=it.target_date||(p&&p.expected_ship_date);
  const itDone=it.status==='delivered';

  let h='';
  if(!staff){
    h+='<nav class="breadcrumb" aria-label="Breadcrumb"><a href="#/home">Orders</a>'+icon('i-chevron','icon--sm')+
      '<a href="#/po/'+p.id+'">'+esc(p.po_number)+'</a>'+icon('i-chevron','icon--sm')+
      '<strong aria-current="page">'+esc(it.product)+'</strong></nav>';
  } else {
    h+='<div class="button-row"><button class="button button--secondary" type="button" onclick="go(\'#/home\')">← Production floor</button></div>';
  }
  h+='<div class="page-heading"><div>'+
    eyebrow([it.item_ref, (+it.qty||1)+' '+(it.unit||'pcs')].filter(Boolean).join(' · '))+
    '<h1 class="detail-title">'+esc(it.product)+'</h1>'+
    '<p class="detail-subtitle">'+esc([it.stone, it.finish, dimsOf(it)].filter(Boolean).join(' · '))+
      (due?esc((it.target_date?' · target ':' · expected ')+fdate(due)):'')+'</p></div>'+
    (admin?'<div class="page-heading__actions">'+
      '<button class="button button--quiet" type="button" onclick="waItem(\''+it.id+'\')">WhatsApp update</button>'+
      '<button class="button button--secondary" type="button" onclick="mItem(\''+p.id+'\',\''+it.id+'\')">Edit product</button>'+
      '<button class="button" type="button" onclick="quickAdvance(\''+it.id+'\')">'+esc((nextStageFor(it)||{short:'Advance stage'}).short)+'</button></div>':'')+
  '</div>';

  h+='<div class="button-row space-top-12">'+statusBadge(it)+stageBadge(it)+
    (due?countdown(due,itDone):'')+'</div>';

  if(it.description) h+='<p class="stage-note space-top-12">'+esc(it.description)+'</p>';

  h+='<div class="buyer-progress space-top-14"><div>'+
    '<div class="buyer-progress__row"><span>Production progress</span><strong>'+Math.round(it.progress*100)+'%</strong></div>'+
    progressBar(it.progress)+'</div></div>';

  if(!isAdmin()&&!isStaff())
    h+='<div class="buyer-safe-note">'+icon('stage-sealing','icon--sm')+
      '<span>This portal shows client-ready updates. Workshop photos appear only after '+esc(S.settings.company_name||'Gujraj Impex')+' approves them.</span></div>';

  /* reference media — the drawing, the 3D model, the approved block and the
     target product, grouped so the floor can find what it needs at a glance */
  const gen=visiblePhotos((S.photosByItem[it.id]||[]).filter(x=>!x.stage_id));
  const itemDocs=(admin?(S.docsByItem&&S.docsByItem[it.id])
                       :(S.staffDocs||[]).filter(d=>d.item_id===it.id))||[];
  const poDocs=staff?(S.staffDocs||[]).filter(d=>d.po_id===it.po_id && !d.item_id):[];
  const docs=itemDocs.concat(poDocs);
  const KIND_LABEL={drawing:'Production drawing',model:'3D model',block:'Approved block',reference:'Target product'};
  const groupOf=p=>KIND_LABEL[p.photo_type]||'Reference';
  if(gen.length||docs.length||admin||staff){
    h+='<section class="panel space-top-18"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Reference media</h3>'+
      '<p class="panel__description">The drawing, the 3D model, the approved block and what the finished piece should look like.</p></div>'+
      ((admin||staff)?'<button class="button'+(staff?' button--workshop':' button--secondary')+'" type="button" onclick="mMedia(\''+it.id+'\')">'+
        icon('i-camera','icon--sm')+'Add media</button>':'')+'</div>'+
      '<div class="panel__body">';
    if(gen.length){
      const groups={};
      gen.forEach(p=>{ (groups[groupOf(p)]=groups[groupOf(p)]||[]).push(p); });
      h+=Object.keys(groups).map(g=>'<div class="space-top-12"><p class="eyebrow">'+esc(g)+'</p>'+
        photoGridOf(groups[g])+'</div>').join('');
    } else {
      h+='<div class="empty-state">No reference media yet.</div>';
    }
    if(docs.length){
      h+='<div class="side-card__rows space-top-12">'+docs.map(d=>
        '<div class="side-row"><span style="cursor:pointer;text-decoration:underline" onclick="openDoc(\''+esc(d.path)+'\')">'+esc(d.name)+'</span>'+
        '<strong>'+esc(KIND_LABEL[d.doc_type]||'File')+'</strong></div>').join('')+'</div>';
    }
    h+=(staff?'<p class="field-hint space-top-10">Your photos are checked by the office before the client sees them.</p>':'')+
      '</div></section>';
  }

  h+=progressFeed(it);

  /* the timeline */
  const rows=S.stByItem[it.id]||[];
  const byStage={}; rows.forEach(r=>byStage[r.stage_id]=r);
  const stages=S.stages.filter(s=>s.active||byStage[s.id]);
  h+='<section class="timeline-card space-top-18"><div class="timeline">';
  let grp=null, openGroup=false;
  stages.forEach(st=>{
    const g=st.grp||'Production';
    if(g.toLowerCase()!==String(grp||'').toLowerCase()){
      if(openGroup) h+='</div>';
      h+='<div class="timeline-group"><p class="timeline-group__title">'+esc(g)+'</p>';
      grp=g; openGroup=true;
    }
    h+=stageRow(it, st, byStage[st.id]||{status:'pending',approval:'none',stage_id:st.id});
  });
  if(openGroup) h+='</div>';
  h+='</div></section><div style="height:24px"></div>';

  if(staff) $('app').innerHTML=h; else paint(h, p.id);
  hydrateImages();
  if(!staff) markRead(it.id);
}

function stageRow(it, st, row){
  const staff=isStaff(), admin=isAdmin();
  const cls = row.status==='completed'?' stage-row--done'
            : row.status==='in_progress'?' stage-row--current'
            : row.status==='on_hold'?' stage-row--hold':'';
  const open = row.status==='in_progress' || row.approval==='requested' ||
    (window.__openStages && window.__openStages[it.id+'-'+st.id]);
  const photos=visiblePhotos((S.photosByItem[it.id]||[]).filter(x=>x.stage_id===st.id));
  const nCmt=(S.commentsByItem[it.id]||[]).filter(c=>c.stage_id===st.id).length;

  let stateBadge;
  if(row.status==='completed') stateBadge=badge(row.approval==='approved'?'Buyer approved':'Complete','success');
  else if(row.status==='in_progress') stateBadge=badge('Current','pending');
  else if(row.status==='on_hold') stateBadge=badge('On hold','alert');
  else if(row.status==='skipped') stateBadge=badge('Skipped');
  else if(st.approval_gate) stateBadge=badge('Approval gate');
  else stateBadge=badge('Pending');

  const meta = row.status==='completed'?('Completed '+fdate(row.completed_at))
    : row.status==='in_progress'?('Started '+fdate(row.started_at))
    : row.status==='on_hold'?'On hold'
    : row.status==='skipped'?'Skipped'
    : (st.approval_gate?'Needs the buyer’s sign-off when reached':'');

  let h='<article class="stage-row'+cls+'">'+
    '<span class="stage-row__icon">'+icon(stageSymbol(st))+'</span>'+
    '<div style="min-width:0">'+
      '<div class="stage-row__top" style="cursor:pointer" onclick="toggleStage(\''+it.id+'\','+st.id+')">'+
        '<p class="stage-row__name">'+esc(st.name)+'</p>'+stateBadge+'</div>'+
      ((meta||(row.note&&!open))?'<p class="stage-row__meta">'+esc(meta)+
        esc(row.note&&!open?(meta?' · ':'')+row.note.slice(0,60):'')+'</p>':'')+
      (open?'':'<div class="stage-row__media">'+
        (photos.length?badge(photos.length+' photo'+(photos.length>1?'s':'')):'')+
        (nCmt&&!staff?badge(nCmt+' comment'+(nCmt>1?'s':'')):'')+
        lateChip(it,row)+
        ((admin||staff)?'<button class="button button--secondary" type="button" onclick="event.stopPropagation();pickPhotos(\''+it.id+'\','+st.id+')">'+
          icon('i-camera','icon--sm')+'Add photos</button>':'')+
        '<button class="button button--quiet" type="button" onclick="toggleStage(\''+it.id+'\','+st.id+')">Open</button>'+
      '</div>')+
    '</div>';
  if(open){
    h+='<div class="stage-expanded">'+
      stageInternalPanel(it,row)+
      (row.note?'<p class="stage-note"><strong>Workshop note:</strong> '+esc(row.note)+'</p>':'')+
      ((st.description&&!admin)?'<p class="stage-note">'+esc(st.description)+'</p>':'')+
      (photos.length?photoGridOf(photos):'<p class="panel__description">No photos on this stage yet.</p>')+
      (staff?'':approvalGate(it,row,st))+
      stageActions(it,row,st)+
      (staff?'':commentThread(it, st.id))+
      '<div class="button-row">'+
        (staff?'':'<button class="button button--secondary" type="button" onclick="attachToComment(\''+it.id+'\','+st.id+')">Attach a photo</button>')+
        '<button class="button button--secondary" type="button" onclick="toggleStage(\''+it.id+'\','+st.id+')">Close stage</button></div>'+
    '</div>';
  }
  h+='</article>';
  return h;
}

function vStaffHome(){
  const q=(window.__staffQ||'').toLowerCase();
  let items=S.items.slice();
  if(q) items=items.filter(it=>((it.product||'')+' '+(it.stone||'')+' '+(it.finish||'')+' '+(it.item_ref||'')).toLowerCase().indexOf(q)>=0);
  const open=items.filter(it=>it.status!=='delivered'&&it.status!=='cancelled');
  const done=items.filter(it=>it.status==='delivered'||it.status==='cancelled');
  const mine=S.photos.filter(p=>p.uploaded_by===uid());
  const pend=mine.filter(p=>p.status==='pending').length;
  const rej=mine.filter(p=>p.status==='rejected').length;

  let h='';
  if(rej) h+='<div class="attn attn--error attn--flat"><span>'+rej+' photo'+(rej>1?'s were':' was')+
    ' sent back by the office. Please reshoot and upload again.</span></div>';
  if(pend) h+='<div class="attn attn--warn attn--flat"><span>'+pend+' photo'+(pend>1?'s are':' is')+
    ' waiting for approval. They reach the client only after the office approves them.</span></div>';

  h+=(open.length?open.map(staffProduct).join(''):'<div class="empty-state">'+(q?'Nothing matches that search.':'No products in the workshop.')+'</div>');

/* daily log — a shift handover, grouped by day */
function staffDailyLog(){
  const dates=Object.keys(S.dailyByDate||{}).sort().reverse().slice(0,10);
  const t=today();
  const list=(S.dailyByDate||{})[t]||[];
  let h='<section class="daily-log">'+
    eyebrow(['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()]+', '+fdate(t))+
    '<h3 class="daily-log__title">Today’s workshop log</h3>'+
    '<p class="panel__description">A short handover for the next shift. Product updates stay attached to each item above.</p>'+

      '<div class="button-row"><button class="button button--workshop" type="button" onclick="pickDaily()">'+icon('i-camera')+'Add today’s photos</button>'+
      (list.length?badge(list.length+' logged today','success'):'')+'</div>';

    const l=S.dailyByDate[d];

function updStatusBadge(u){
  const m={pending:['Awaiting review','pending'], partially_approved:['Published','success'],
           approved:['Published','success'], changes_requested:['Reshoot asked','alert']};
  const x=m[u.review_status]||[u.review_status,''];
  return badge(x[0], x[1]);
}

/* ---- buyer + admin: the progress feed on a product page ---- */
function progressFeed(it){
  const buyer = !isAdmin() && !isStaff();

    return '<section class="panel space-top-18"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Latest progress</h3>'+

        ? 'Workshop photographs appear here as the piece is made.'
        : 'No daily updates recorded yet.')+'</p></div></div>'+
      '<div class="panel__body"><div class="empty-state">'+(buyer
        ? 'Nothing published yet for this piece.'

  }
  let h='<section class="panel space-top-18"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Latest progress</h3>'+
    '<p class="panel__description">Photographs from the workshop, newest first.</p></div>'+
    badge(list.length+' update'+(list.length===1?'':'s'))+'</div><div class="panel__body">';

        (buyer ? (ph.length?badge(ph.length+' photo'+(ph.length===1?'':'s'),'success'):'') : updStatusBadge(u))+
      '</div>'+
      (u.work_status==='no_work'
        ? '<p class="stage-note space-top-10">No work today — '+esc(u.no_work_reason||'')+'</p>'

      (int_ && int_.blocker_reason ? '<div class="attn attn--error attn--flat"><span><strong>Blocked:</strong> '+

          (int_.revised_completion_date?' · revised to '+esc(fdate(int_.revised_completion_date)):'')+'</span></div>':'')+
      (ph.length?photoGridOf(ph,{del:!buyer}):'')+

        '<div class="comment"><span class="comment__avatar">'+esc(initials(c.author_name||'?'))+'</span>'+
        '<div class="comment__bubble"><strong>'+esc(c.author_name||c.author_role)+'</strong>'+esc(c.body)+
        '<div class="field-hint space-top-10">'+ftime(c.created_at)+'</div></div></div>').join('')+'</div>':'')+
      (isStaff()?'':'<div class="comment-composer space-top-12">'+

        'onkeydown="if(event.key===\'Enter\')sendUpdateComment(\''+it.id+'\',\''+u.id+'\')">'+

    '<div class="page-heading__actions">'+
      '<button class="button button--secondary" type="button" onclick="remindAll()">Remind missing</button>'+
      '<button class="button" type="button" onclick="pickDaily()">Add update</button></div></div>';

  h+='<section class="summary-grid">'+

    statCard('Updated today', todayDone.length+' of '+activeItems().length, '')+
    statCard('Missing today', missing.length, missing.length?'Active pieces with no record':'All recorded')+
    statCard('Blocked', blocked.length, blocked.length?'Needs your attention':'Nothing blocked')+
  '</section>';

    '<div class="panel__head"><div><h3 class="panel__title">Awaiting review</h3>'+
    '<p class="panel__description">Only approved photographs and published text reach the buyer.</p></div>'+

  if(!pend.length) h+='<div class="empty-state">Nothing waiting. Submissions from the floor appear here.</div>';

      '<p class="approval-group__meta">'+esc([ph.length+' photo'+(ph.length===1?'':'s'),

      (u.public_summary?'<p class="stage-note space-top-10">'+esc(u.public_summary)+'</p>':'')+

    '<div class="panel__body">';

    h+='<section class="panel dashboard-grid__wide"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Reported blocked</h3><p class="panel__description">Raised by the floor in a daily update. The buyer does not see any of this.</p></div>'+

      '</div></section>';
  }

  // A stage held with a reason and an owner, and a stage running past its plan,

        '<button class="button button--quiet" type="button" onclick="go(\'#/item/'+x.item.id+'\')">Open</button></div></div>').join('')+
      '</div></section>';
  }

  const late = lateStages();
  if(late.length){
    h+='<section class="panel dashboard-grid__wide"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Running late</h3><p class="panel__description">Past their planned date. The buyer sees the delivery date, not this.</p></div>'+
      badge(late.length+'','alert')+'</div><div class="panel__body">'+
      late.map(x=>'<div class="login-row"><div class="grow"><strong>'+esc(x.item.product)+'</strong>'+
        '<p class="field-hint">'+esc((x.stage?x.stage.name+' · ':'')+'planned '+fdate(x.delay.planned)+' · '+
          x.delay.days+' day'+(x.delay.days===1?'':'s')+' over')+'</p></div>'+
        '<div class="button-row"><button class="button button--secondary" type="button" onclick="mPlan(\''+x.item.id+'\','+x.row.stage_id+')">Re-plan</button>'+
        '<button class="button button--quiet" type="button" onclick="go(\'#/item/'+x.item.id+'\')">Open</button></div></div>').join('')+
      '</div></section>';
  }
  h+='</div>';
  $('app').innerHTML=h;
  hydrateImages();
}

/* ---------------------------------------------------------------------------
   Finance — admin only.

   Deliberately a statement of account, not accounting: purchase orders, extras
   added later, money received, what is still owed. No invoicing, no tax
   ledgers, nothing that pretends to be Tally. Buyers cannot see any of it yet;
   the database refuses them the rows, not just the screen.
