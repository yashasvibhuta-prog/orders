<!doctype html>
<html lang="en">

<title>StoneFlow · Gujraj Impex</title>

<style>

    :root {
      /* Apple-influenced system palette (handoff v2, 28 Aug 2026) */
      --bg-primary: #F5F5F7;
      --surface-primary: #FFFFFF;
      --surface-secondary: #E8E8ED;
      --surface-subtle: #FBFBFD;
      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-muted: #86868B;
      --graphite: #424245;
      --mineral-grey: #86868B;
      --border-subtle: #E5E5EA;
      --border-strong: #D2D2D7;
      --action-primary: #0071E3;
      --action-primary-hover: #0066CC;
      --action-soft: rgba(0, 113, 227, .08);
      --focus-ring: rgba(0, 125, 250, .32);
      --status-success: #1E7A34;
      --status-warning: #B55C00;
      --status-error: #D70015;
      --status-success-soft: rgba(30, 122, 52, .08);
      --status-warning-soft: rgba(181, 92, 0, .08);
      --status-error-soft: rgba(215, 0, 21, .07);

      /* Existing component aliases */
      --canvas: var(--bg-primary);
      --surface: var(--surface-primary);
      --surface-soft: var(--surface-subtle);
      --surface-warm: var(--surface-secondary);
      --ink: var(--text-primary);
      --ink-soft: var(--graphite);
      --ink-faint: var(--text-secondary);
      --line: var(--border-subtle);
      --line-strong: var(--border-strong);
      --umber: var(--action-primary-hover);
      --umber-dark: var(--text-primary);
      --sand: var(--mineral-grey);
      --sage: var(--status-success);
      --sage-soft: var(--status-success-soft);
      --rust: var(--status-error);
      --rust-soft: var(--status-error-soft);
      --amber: var(--status-warning);
      --amber-soft: var(--status-warning-soft);
      --blue: var(--graphite);
      --blue-soft: var(--surface-subtle);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .035);
      --shadow-lg: 0 12px 34px rgba(0, 0, 0, .075);
      --radius-sm:5px;
      --radius-md:10px;
      --radius-lg:12.5px;
      --radius-xl:12.5px;
      --font-ui: "Manrope", Arial, sans-serif;
      --font-display: "DM Serif Display", Georgia, serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin:0; background: var(--canvas); color: var(--ink); font-family: var(--font-ui); font-size:19.3px; line-height:1.5; }
    button, input, select, textarea { font: inherit; }
    button, a, input, select, textarea { outline: none; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { box-shadow: 0 0 0 3px var(--focus-ring); border-color: var(--action-primary); }
    button, .button, .nav-link, .order-card { min-height:60.7px; }
    a { color: inherit; }
    img, svg { display: block; }
    h1, h2, h3, h4, p { margin:0; }
    h1, h2, h3 { text-wrap: balance; }
    .svg-sprite { position: absolute; width:0; height:0; overflow: hidden; }
    .icon { width:27.6px; height:27.6px; fill: none; stroke: currentColor; stroke-width:1.75; stroke-linecap: round; stroke-linejoin: round; }
    .icon--sm { width:22.1px; height:22.1px; }
    .icon--lg { width:35.9px; height:35.9px; }







    .screen-label { color: var(--umber); }
    .screen-note { color: var(--ink-soft); font-size:15.2px; text-align: right; }


    .wordmark { display: flex; align-items: center; gap:13.8px; }
    .wordmark__mark { display: grid; width:52.4px; height:52.4px; place-items: center; border-radius:var(--radius-md); background: var(--umber-dark); color: var(--surface); }
    .wordmark__mark--inverse { background: var(--surface); color: var(--umber-dark); }
    .wordmark__title { font-family: var(--font-display); font-size:30.4px; font-weight: 600; line-height:.9; letter-spacing: -.02em; }
    .wordmark__byline { margin-top:6.9px; color: var(--ink-faint); font-size:12.4px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .app-shell { min-height:760px; background: var(--surface-soft); }
    .topbar { display: flex; min-height:99.4px; align-items: center; justify-content: space-between; gap:22.1px; padding:16.6px 22.1px; border-bottom:1.4px solid var(--line); background: rgba(255,255,255,.96); }
    .topbar__tools { display: flex; align-items: center; gap:11px; }
    .role-chip, .badge { display: inline-flex; align-items: center; justify-content: center; gap:8.3px; width:fit-content; border-radius:var(--radius-sm); font-weight: 700; white-space: nowrap; }
    .role-chip { min-height:46.9px; padding:0 15.2px; background: var(--surface-warm); color: var(--umber-dark); font-size:15.2px; }
    .avatar { display: grid; width:52.4px; height:52.4px; place-items: center; border-radius:50%; background: var(--sand); color: var(--umber-dark); font-size:15.2px; font-weight: 800; }
    .desktop-nav { display: none; align-items: stretch; gap:2.8px; padding:0 22.1px; border-bottom:1.4px solid var(--line); background: var(--surface); overflow-x: auto; }
    .nav-link { display: inline-flex; align-items: center; gap:9.7px; padding:0 16.6px; border-bottom:2.8px solid transparent; color: var(--ink-soft); font-size:16.6px; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .nav-link--active { border-bottom-color: var(--umber); color: var(--ink); }
    .badge { min-height:27.6px; padding:2.8px 9.7px; background: var(--surface-warm); color: var(--umber); font-size:13.8px; }
    .badge--alert { background: var(--rust-soft); color: var(--rust); }
    .badge--success { background: var(--sage-soft); color: var(--sage); }
    .badge--pending { background: var(--amber-soft); color: var(--amber); }
    .page { width:min(100%, 1320px); margin:auto; padding:30.4px 22.1px 99.4px; }
    .page-heading { display: flex; flex-direction: column; gap:19.3px; margin-bottom:27.6px; }
    .eyebrow { color: var(--ink-faint); font-size:13.8px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .display-title { margin-top:6.9px; font-family: var(--font-display); font-size:clamp(41.4px, 5vw, 60.7px); font-weight: 500; line-height:1.02; letter-spacing: -.028em; }
    .lede { max-width:680px; margin-top:11px; color: var(--ink-soft); font-size:17.9px; }
    .search { position: relative; width:100%; }
    .search .icon { position: absolute; left:17.9px; top:50%; width:23.5px; height:23.5px; transform: translateY(-50%); color: var(--ink-faint); }
    .search input { width:100%; min-height:63.5px; padding:0 19.3px 0 55.2px; border: 1px solid var(--line-strong); border-radius:var(--radius-md); background: var(--surface); color: var(--ink); }
    .button { display: inline-flex; min-height:60.7px; align-items: center; justify-content: center; gap:11px; padding:0 20.7px; border: 1px solid transparent; border-radius:12.5px; background: var(--umber-dark); color: var(--surface); font-weight: 700; text-decoration: none; cursor: pointer; }
    .button--secondary { border-color: var(--line-strong); background: var(--surface); color: var(--ink); }
    .button--quiet { background: transparent; color: var(--ink-soft); }
    .button--danger { background: var(--rust); color: white; }
    .button--success { background: var(--sage); color: white; }
    .button--wide { width:100%; }
    .summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:13.8px; margin-bottom:27.6px; }
    .stat-card { min-width:0; padding:20.7px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
    .stat-card__label { color: var(--ink-soft); font-size:13.8px; font-weight: 700; }
    .stat-card__value { margin-top:12.4px; font-family: var(--font-display); font-size:38.6px; font-weight: 600; line-height:1; }
    .stat-card__foot { margin-top:11px; color: var(--ink-faint); font-size:13.8px; }
    .dashboard-grid { display: grid; gap:19.3px; }
    .panel { border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
    .panel__head { display: flex; align-items: flex-start; justify-content: space-between; gap:19.3px; padding:23.5px; border-bottom:1.4px solid var(--line); }
    .panel__title { font-family: var(--font-display); font-size:29px; font-weight: 600; line-height:1.1; }
    .panel__description { margin-top:6.9px; color: var(--ink-soft); font-size:15.2px; }
    .panel__body { padding:16.6px; }
    .attention-list, .activity-list, .order-list { display: grid; gap:11px; }
    .attention-item, .activity-item { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: start; gap:13.8px; padding:15.2px; border: 1px solid var(--line); border-radius:var(--radius-md); }
    .attention-item__icon { display: grid; width:46.9px; height:46.9px; place-items: center; border-radius:12.5px; background: var(--amber-soft); color: var(--amber); }
    .attention-item__title, .order-card__title { font-size:16.6px; font-weight: 700; }
    .attention-item__meta, .activity-item__meta { margin-top:4.1px; color: var(--ink-faint); font-size:13.8px; }
    .attention-item__count { min-width:33.1px; height:33.1px; padding:5.5px; border-radius:8.8px; background: var(--ink); color: white; font-size:13.8px; font-weight: 800; text-align: center; }
    .order-card { display: grid; gap:16.6px; padding:19.3px; border: 1px solid var(--line); border-radius:var(--radius-md); background: var(--surface); text-decoration: none; }
    .order-card:hover { border-color: var(--sand); }
    .order-card__top, .order-card__meta, .order-card__progress-row { display: flex; align-items: center; justify-content: space-between; gap:13.8px; }
    .order-card__po { color: var(--umber); font-size:13.8px; font-weight: 800; }
    .order-card__meta { color: var(--ink-soft); font-size:13.8px; }
    .progress { height:9.7px; overflow: hidden; border-radius:1248.8px; background: rgba(134,134,139,.22); }
    .progress__bar { height:100%; border-radius:inherit; background: var(--umber); }
    .activity-item { grid-template-columns: auto minmax(0,1fr); border-color: transparent; padding:11px 8.3px; }
    .activity-item__dot { width:12.4px; height:12.4px; margin-top:6.9px; border: 2px solid var(--surface); border-radius:50%; background: var(--sage); box-shadow: 0 0 0 1px var(--line-strong); }
    .mobile-dock { position: sticky; bottom:0; z-index: 5; display: grid; grid-template-columns: repeat(4,1fr); min-height:85.6px; border-top:1.4px solid var(--line); background: rgba(255,255,255,.97); backdrop-filter: blur(12px); }
    .mobile-dock__item { display: grid; place-items: center; align-content: center; gap:4.1px; color: var(--ink-faint); font-size:12.4px; font-weight: 700; text-decoration: none; }
    .mobile-dock__item--active { color: var(--umber-dark); }

    .login-screen { display: grid; min-height:760px; background: var(--surface); }
    .login-story { position: relative; display: none; overflow: hidden; padding:88.3px; background: var(--umber-dark); color: white; }
    .login-story::before { content: ""; position: absolute; inset:0; background: radial-gradient(circle at 20% 15%, rgba(156,155,145,.32), transparent 28%), radial-gradient(circle at 82% 88%, rgba(69,74,69,.24), transparent 26%); }
    .login-story__content { position: relative; z-index: 1; display: flex; max-width:520px; flex-direction: column; justify-content: space-between; }
    .login-story__quote { font-family: var(--font-display); font-size:clamp(49.7px, 5vw, 88.3px); font-weight: 500; line-height:.98; letter-spacing: -.035em; }
    .login-story__note { max-width:420px; color: #86868B; }
    .login-form-wrap { display: grid; place-items: center; padding:38.6px 27.6px; }
    .login-form { width:min(100%, 410px); }
    .login-form__tagline { margin-top:38.6px; color: var(--action-primary); font-size:15.2px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .login-form h2 { margin-top:11px; font-family: var(--font-display); font-size:52.4px; font-weight: 500; letter-spacing: -.025em; }
    .form-stack { display: grid; gap:19.3px; margin-top:38.6px; }
    .field { display: grid; gap:9.7px; }
    .field label { color: var(--ink-soft); font-size:15.2px; font-weight: 700; }
    .field input, .field select, .field textarea { width:100%; min-height:63.5px; padding:13.8px 16.6px; border: 1px solid var(--line-strong); border-radius:12.5px; background: var(--surface); color: var(--ink); }
    .field textarea { min-height:132.5px; resize: vertical; }
    .form-error { display: flex; gap:12.4px; padding:15.2px 16.6px; border: 1px solid var(--line-strong); border-radius:12.5px; background: var(--rust-soft); color: var(--ink); font-size:15.2px; }
    .login-form__fineprint { margin-top:22.1px; color: var(--ink-faint); font-size:13.8px; text-align: center; }

    .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap:9.7px; margin-bottom:15.2px; color: var(--ink-faint); font-size:13.8px; font-weight: 700; }
    .breadcrumb strong { color: var(--ink); }
    .section-actions, .inline-actions, .button-row { display: flex; flex-wrap: wrap; gap:11px; }
    .space-top-10 { margin-top:13.8px; }
    .space-top-12 { margin-top:16.6px; }
    .space-top-14 { margin-top:19.3px; }
    .space-top-18 { margin-top:24.8px; }
    .page-heading__actions { display: flex; flex-wrap: wrap; gap:11px; }
    .detail-title { font-family: var(--font-display); font-size:clamp(38.6px, 5vw, 63.5px); font-weight: 500; line-height:1; letter-spacing: -.03em; }
    .detail-subtitle { margin-top:11px; color: var(--ink-soft); font-size:16.6px; }
    .order-workspace { display: grid; gap:19.3px; }
    .po-rail { min-width:0; padding:16.6px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface); }
    .po-rail__title { padding:5.5px 5.5px 13.8px; color: var(--ink-faint); font-size:12.4px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .po-rail__list { display: flex; gap:11px; overflow-x: auto; }
    .po-rail__item { min-width:220px; padding:15.2px; border: 1px solid var(--line); border-radius:12.5px; background: var(--surface); }
    .po-rail__item--active { border-color: var(--sand); background: var(--surface-warm); }
    .po-rail__number { color: var(--umber); font-size:12.4px; font-weight: 800; }
    .po-rail__name { margin-top:5.5px; font-size:15.2px; font-weight: 700; }
    .po-rail__meta { margin-top:6.9px; color: var(--ink-faint); font-size:12.4px; }
    .order-main { min-width:0; }
    .order-hero { padding:24.8px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface); }
    .order-hero__top { display: flex; flex-direction: column; gap:22.1px; }
    .order-stats { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:11px; margin-top:24.8px; }
    .mini-stat { padding:15.2px; border-radius:12.5px; background: var(--surface-soft); }
    .mini-stat__label { color: var(--ink-soft); font-size:12.4px; font-weight: 700; text-transform: uppercase; }
    .mini-stat__value { margin-top:6.9px; font-size:16.6px; font-weight: 700; }
    .content-tabs { display: flex; gap:5.5px; margin:19.3px 0; padding:5.5px; overflow-x: auto; border: 1px solid var(--line); border-radius:var(--radius-md); background: var(--surface); }
    .content-tab { display: inline-flex; min-height:55.2px; align-items: center; gap:9.7px; padding:0 17.9px; border-radius:10px; color: var(--ink-soft); font-size:15.2px; font-weight: 700; white-space: nowrap; }
    .content-tab--active { background: var(--umber-dark); color: white; }
    .detail-grid { display: grid; gap:19.3px; }
    .product-list, .timeline, .utility-stack { display: grid; gap:16.6px; }
    .product-card { display: grid; grid-template-columns: 78px minmax(0,1fr); gap:17.9px; padding:17.9px; border: 1px solid var(--line); border-radius:var(--radius-md); background: var(--surface); }
    .product-card__content { min-width:0; }
    .product-card__top { display: flex; flex-direction: column; align-items: flex-start; gap:9.7px; }
    .product-card__name { font-family: var(--font-display); font-size:26.2px; font-weight: 600; line-height:1.05; }
    .product-card__name--large { margin-top:6.9px; font-size:38.6px; }
    .product-card__meta { display: flex; flex-wrap: wrap; gap:5.5px 16.6px; margin-top:9.7px; color: var(--ink-soft); font-size:12.4px; }
    .product-card__stage { display: flex; align-items: center; justify-content: space-between; gap:13.8px; margin-top:16.6px; }
    .product-card__actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap:11px; }
    .photo-placeholder { position: relative; display: grid; min-height:104.9px; place-items: end start; overflow: hidden; border: 1px solid rgba(66,66,69,.14); border-radius:12.5px; background: linear-gradient(145deg, #86868B, #424245 52%, #6E6E73); color: var(--surface); }
    .photo-placeholder::before { content: ""; position: absolute; inset:0; background: linear-gradient(30deg, transparent 37%, rgba(255,255,255,.14) 38%, transparent 40%), linear-gradient(115deg, transparent 62%, rgba(32,33,31,.18) 63%, transparent 66%); }
    .photo-placeholder--white { background: linear-gradient(145deg, #F5F5F7, #FFFFFF 48%, #D2D2D7); color: var(--ink); }
    .photo-placeholder--grey { background: linear-gradient(145deg, #86868B, #D2D2D7 53%, #424245); }
    .photo-placeholder--drawing { background-color: #F5F5F7; background-image: linear-gradient(rgba(134,134,139,.32) 1px, transparent 1px), linear-gradient(90deg,rgba(134,134,139,.32) 1px,transparent 1px); background-size: 16px 16px; color: var(--umber-dark); }
    .photo-placeholder span { position: relative; z-index: 1; padding:9.7px 11px; font-size:11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .product-gallery { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:11px; }
    .product-gallery .photo-placeholder:first-child { grid-column: 1 / -1; min-height:207px; }
    .side-card { padding:20.7px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface); }
    .side-card__title { font-family: var(--font-display); font-size:26.2px; font-weight: 600; }
    .side-card__rows { display: grid; gap:13.8px; margin-top:17.9px; }
    .side-row { display: flex; align-items: flex-start; justify-content: space-between; gap:16.6px; padding-bottom:12.4px; border-bottom:1.4px solid var(--line); font-size:13.8px; }
    .side-row:last-child { padding-bottom:0; border-bottom:0; }
    .side-row span { color: var(--ink-faint); }
    .timeline-card { padding:19.3px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface); }
    .timeline-group { display: grid; gap:9.7px; }
    .timeline-group + .timeline-group { margin-top:24.8px; }
    .timeline-group__title { display: flex; align-items: center; gap:13.8px; color: var(--ink-faint); font-size:12.4px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .timeline-group__title::after { content: ""; height:1.4px; flex: 1; background: var(--line); }
    .stage-row { position: relative; display: grid; grid-template-columns: 42px minmax(0,1fr); gap:13.8px; min-height:91.1px; padding:13.8px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface); }
    .stage-row__icon { display: grid; width:58px; height:58px; place-items: center; border: 1px solid var(--line); border-radius:var(--radius-md); background: var(--surface-soft); color: var(--ink-faint); }
    .stage-row__top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap:8.3px; }
    .stage-row__name { font-size:15.2px; font-weight: 800; }
    .stage-row__meta { margin-top:5.5px; color: var(--ink-faint); font-size:12.4px; }
    .stage-row__media { display: flex; flex-wrap: wrap; gap:9.7px; margin-top:11px; }
    .stage-row__media .button { min-height:60.7px; padding-inline:15.2px; font-size:12.4px; }
    .stage-row--done .stage-row__icon { border-color: transparent; background: var(--sage-soft); color: var(--sage); }
    .stage-row--current { border-color: var(--action-primary); box-shadow: 0 0 0 1px var(--action-soft); }
    .stage-row--current .stage-row__icon { border-color: transparent; background: var(--surface-warm); color: var(--umber); }
    .stage-row--hold { border-color: var(--ink); border-style: dashed; background: var(--surface); }
    .stage-row--hold .stage-row__icon { border-color: transparent; background: var(--rust-soft); color: var(--rust); }
    .stage-expanded { grid-column: 1 / -1; display: grid; gap:16.6px; margin-top:2.8px; padding:17.9px; border-radius:12.5px; background: var(--surface-soft); }
    .stage-note { color: var(--ink-soft); font-size:13.8px; }
    .stage-note strong { color: var(--ink); }
    .photo-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:9.7px; }
    .photo-grid .photo-placeholder { min-height:144.9px; }
    .photo-card { position: relative; }
    .photo-card .badge { position: absolute; top:9.7px; right:9.7px; z-index: 2; }
    .comment-thread { display: grid; gap:11px; }
    .comment { display: grid; grid-template-columns: 28px minmax(0,1fr); gap:11px; }
    .comment__avatar { display: grid; width:38.6px; height:38.6px; place-items: center; border-radius:50%; background: var(--surface-warm); color: var(--umber); font-size:11px; font-weight: 800; }
    .comment__bubble { padding:12.4px 13.8px; border: 1px solid var(--line); border-radius:5px 12.5px 12.5px; background: var(--surface); color: var(--ink-soft); font-size:12.4px; }
    .comment__bubble strong { display: block; margin-bottom:4.1px; color: var(--ink); font-size:12.4px; }
    .comment-composer { display: grid; grid-template-columns: minmax(0,1fr) auto; gap:9.7px; }
    .comment-composer input { min-width:0; min-height:60.7px; padding:0 15.2px; border: 1px solid var(--line-strong); border-radius:11.2px; background: var(--surface); }
    .approval-gate { display: grid; gap:15.2px; padding:17.9px; border: 1px solid var(--line-strong); border-radius:var(--radius-md); background: var(--amber-soft); }
    .approval-gate__title { display: flex; align-items: center; gap:11px; font-size:15.2px; font-weight: 800; }
    .approval-gate__copy { color: var(--ink-soft); font-size:12.4px; }
    .buyer-welcome { padding:27.6px; border-radius:var(--radius-lg); background: var(--umber-dark); color: white; }
    .buyer-welcome .eyebrow { color: #86868B; }
    .buyer-welcome .detail-subtitle { color: #F5F5F7; }
    .buyer-progress { display: grid; gap:13.8px; margin-top:24.8px; }
    .buyer-progress__row { display: flex; align-items: center; justify-content: space-between; gap:16.6px; font-size:13.8px; }
    .buyer-safe-note { display: flex; gap:12.4px; margin-top:16.6px; color: var(--ink-faint); font-size:12.4px; }
    .staff-shell { background: var(--canvas); }
    .staff-header { display: flex; flex-direction: column; gap:19.3px; padding:24.8px 22.1px; border-bottom:1.4px solid var(--line-strong); background: var(--umber-dark); color: white; }
    .staff-header .wordmark__byline { color: #86868B; }
    .staff-header .search input { border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: white; }
    .staff-header .search input::placeholder { color: #86868B; }
    .staff-header .search .icon { color: #F5F5F7; }
    .staff-list { display: grid; gap:16.6px; padding:19.3px; }
    .staff-product { padding:20.7px; border: 1px solid var(--line-strong); border-radius:var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
    .staff-product__thumb { min-height:173.9px; margin-bottom:17.9px; }
    .staff-product__top { display: flex; align-items: flex-start; justify-content: space-between; gap:13.8px; }
    .staff-product__name { font-family: var(--font-display); font-size:30.4px; font-weight: 600; line-height:1.05; }
    .staff-product__spec { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:11px; margin-top:17.9px; }
    .staff-spec { padding:13.8px; border-radius:11.2px; background: var(--surface-soft); }
    .staff-spec span { display: block; color: var(--ink-soft); font-size:11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .staff-spec strong { display: block; margin-top:5.5px; font-size:13.8px; }
    .ship-alert { color: var(--rust); font-weight: 800; }
    .staff-product__actions { display: grid; grid-template-columns: 1fr auto; gap:11px; margin-top:17.9px; }
    .button--workshop { min-height:74.5px; font-size:17.9px; }
    .daily-log { padding:22.1px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface-warm); }
    .daily-log__title { font-family: var(--font-display); font-size:29px; font-weight: 600; }
    .daily-log__grid { display: grid; gap:12.4px; margin-top:16.6px; }
    .approval-list { display: grid; gap:16.6px; }
    .approval-group { padding:19.3px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface); }
    .approval-group__head { display: flex; flex-direction: column; gap:12.4px; margin-bottom:16.6px; }
    .approval-group__name { font-family: var(--font-display); font-size:30.4px; font-weight: 600; }
    .approval-group__meta { color: var(--ink-faint); font-size:12.4px; }
    .selection-check { position: absolute; left:11px; top:11px; z-index: 2; display: grid; width:35.9px; height:35.9px; place-items: center; border: 1px solid rgba(255,255,255,.6); border-radius:10px; background: rgba(255,255,255,.92); color: var(--sage); }
    .utility-grid { display: grid; gap:19.3px; }
    .form-card { padding:22.1px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface); }
    .form-card__head { display: flex; flex-direction: column; gap:13.8px; padding-bottom:19.3px; border-bottom:1.4px solid var(--line); }
    .form-card__title { font-family: var(--font-display); font-size:33.1px; font-weight: 600; }
    .form-card__description { color: var(--ink-soft); font-size:13.8px; }
    .form-grid { display: grid; gap:16.6px; margin-top:22.1px; }
    .field-hint { color: var(--ink-faint); font-size:11px; }
    .field--full { grid-column: 1 / -1; }
    .upload-drop { display: grid; min-height:207px; place-items: center; padding:27.6px; border: 1.5px dashed var(--line-strong); border-radius:var(--radius-md); background: var(--surface-soft); text-align: center; }
    .upload-drop .icon { margin:auto; color: var(--umber); }
    .upload-drop strong { display: block; margin-top:13.8px; }
    .upload-drop p { margin-top:6.9px; color: var(--ink-soft); font-size:12.4px; }
    .data-table-wrap { overflow-x: auto; }
    .data-table { width:100%; min-width:650px; border-collapse: collapse; }
    .data-table th { padding:13.8px; border-bottom:1.4px solid var(--line-strong); color: var(--ink-faint); font-size:11px; letter-spacing: .08em; text-align: left; text-transform: uppercase; }
    .data-table td { padding:16.6px 13.8px; border-bottom:1.4px solid var(--line); font-size:13.8px; vertical-align: middle; }
    .data-table td strong { display: block; }
    .data-table td small { color: var(--ink-faint); }
    .activity-log { display: grid; gap:0; }
    .activity-log__item { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap:15.2px; padding:17.9px 0; border-bottom:1.4px solid var(--line); }
    .activity-log__item:last-child { border-bottom:0; }
    .activity-log__marker { width:12.4px; height:12.4px; margin-top:5.5px; border-radius:50%; background: var(--sand); }
    .activity-log__title { font-size:13.8px; font-weight: 700; }
    .activity-log__meta { margin-top:4.1px; color: var(--ink-faint); font-size:12.4px; }

    .icon-swatch { display: flex; align-items: center; gap:13.8px; padding:16.6px; border: 1px solid var(--line); border-radius:var(--radius-md); background: var(--surface); }
    .icon-swatch__icon { display: grid; width:58px; height:58px; flex: 0 0 auto; place-items: center; border-radius:var(--radius-md); background: var(--surface-warm); color: var(--umber); }
    .icon-swatch strong { display: block; font-size:13.8px; }
    .icon-swatch code { color: var(--ink-faint); font-size:11px; }
    .photo-viewer { min-height:720px; padding:19.3px; background: #1D1D1F; color: #FFFFFF; }
    .photo-viewer__bar { display: flex; align-items: center; justify-content: space-between; gap:13.8px; min-height:69px; }
    .photo-viewer__title { font-size:15.2px; font-weight: 700; }
    .photo-viewer__meta { margin-top:4.1px; color: #86868B; font-size:11px; }
    .photo-viewer__canvas { display: grid; min-height:520px; place-items: center; margin-top:13.8px; border-radius:var(--radius-lg); background: #424245; }
    .photo-viewer__image { width:min(88%, 820px); aspect-ratio: 4 / 3; border-radius:12.5px; }
    .photo-viewer__filmstrip { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap:9.7px; margin-top:13.8px; }
    .photo-viewer__filmstrip .photo-placeholder { min-height:88.3px; opacity: .62; }
    .photo-viewer__filmstrip .photo-placeholder:first-child { outline: 2px solid var(--sand); opacity: 1; }

    /* Apple-influenced component treatment */

    .role-chip { border: 1px solid var(--border-subtle); background: var(--surface-subtle); }
    .badge { border: 1px solid transparent; background: var(--surface-subtle); color: var(--text-secondary); }
    .badge--success { border-color: rgba(30,122,52,.18); background: var(--status-success-soft); color: var(--text-primary); }
    .badge--pending { border-color: rgba(181,92,0,.24); background: var(--status-warning-soft); color: var(--text-primary); }
    .badge--alert { border-color: rgba(215,0,21,.18); background: var(--status-error-soft); color: var(--status-error); }
    .eyebrow,
    .breadcrumb,
    .screen-note { color: var(--graphite); }
    .buyer-welcome .badge--pending { border-color: var(--border-strong); background: var(--surface-primary); color: var(--text-primary); }
    .photo-viewer .button--quiet { color: var(--surface-primary); }
    .wordmark__mark,
    .icon-swatch__icon,
    .photo-viewer__canvas { border-radius:var(--radius-md); }
    .login-story::before { display: none; }
    .stat-card,
    .panel,
    .staff-product { box-shadow: none; }
    .stat-card { padding:27.6px; }
    .panel__head { padding:27.6px 33.1px; }
    .panel__body { padding:22.1px 33.1px 33.1px; }
    .attention-list { gap:0; }
    .attention-item { padding:22.1px 0; border-width:0 0 1.4px; border-radius:0; }
    .attention-item:last-child { border-bottom:0; }
    .attention-item__icon { border-radius:var(--radius-md); }
    .button,
    .nav-link,
    .order-card,
    .content-tab { transition: color 180ms ease, background-color 180ms ease, border-color 180ms ease, opacity 180ms ease; }
    .button { border-radius:10px; background: var(--action-primary); }
    .button:hover { background: var(--action-primary-hover); }
    /* the repaint above re-set .button's background, so restate the modifiers after it */
    .button--secondary { border-color: var(--line-strong); background: var(--surface-primary); color: var(--ink); }
    .button--quiet { background: transparent; color: var(--ink-soft); }
    .button--quiet:hover { background: var(--action-soft); color: var(--action-primary); }
    .button--danger { background: var(--rust); color: #fff; }
    .button--success { background: var(--sage); color: #fff; }
    .data-table td small { display: block; }
    .upload-drop.is-over { border-color: var(--action-primary); background: var(--action-soft); }
    .daily-entry { padding: 18px 0; border-top: 1px solid var(--line); }
    .daily-entry:first-child { padding-top: 0; border-top: 0; }
    .daily-entry:last-child { padding-bottom: 0; }
    .photo-card[data-on='0'] .photo-placeholder { opacity: .38; filter: grayscale(1); }
    .photo-card[data-on='1'] .photo-placeholder { outline: 3px solid var(--action-soft); outline-offset: 1px; }
    .upload-drop .button--quiet { min-height: 0; padding: 0 4px; text-decoration: underline; }
    .button--secondary:hover { border-color: var(--graphite); background: var(--surface-subtle); color: var(--text-primary); }
    .button--quiet:hover { background: rgba(255,255,255,.08); }
    .order-card:hover { border-color: var(--border-strong); background: var(--surface-subtle); }
    .search input,
    .field input,
    .field select,
    .field textarea,
    .comment-composer input { border-radius:var(--radius-md); }
    .content-tabs { border-radius:var(--radius-md); background: var(--surface-subtle); }
    .content-tab { border-radius:7.5px; }
    .content-tab--active { background: var(--graphite); }
    .order-hero,
    .product-card,
    .side-card,
    .timeline-card,
    .staff-product,
    .daily-log,
    .approval-group,
    .form-card { border-radius:var(--radius-lg); }
    .photo-placeholder { border-radius:7.5px; }
    .timeline-card { padding:27.6px; box-shadow: none; }
    .stage-row { min-height:99.4px; padding:19.3px 11px; border-width:0 0 1.4px; border-radius:0; }
    .stage-row:last-child { border-bottom-color: transparent; }
    .stage-row--done { border-left:2.8px solid var(--status-success); }
    .stage-row--current { border: 0; border-bottom:1.4px solid var(--border-subtle); border-left:2.8px solid var(--graphite); border-radius:0; background: var(--surface-subtle); box-shadow: none; }
    .stage-row--hold { border: 0; border-bottom:1.4px solid var(--border-subtle); border-left:2.8px solid var(--status-error); border-radius:0; background: var(--status-error-soft); }
    .stage-row__icon { border-radius:var(--radius-md); }
    .stage-expanded { border-radius:var(--radius-md); background: var(--surface-primary); }
    .approval-gate { border-radius:var(--radius-md); }
    .upload-drop { border-radius:var(--radius-md); }
    .data-table th { padding:16.6px 22.1px; font-variant-numeric: tabular-nums; }
    .data-table td { padding:22.1px; font-variant-numeric: tabular-nums; }
    .stat-card__value,
    .mini-stat__value,
    .order-card__po,
    .activity-log__time { font-variant-numeric: tabular-nums; }

    @media (min-width: 700px) {
      .order-hero { padding:33.1px; }
      .order-hero__top, .approval-group__head, .form-card__head { flex-direction: row; align-items: flex-start; justify-content: space-between; }
      .order-stats { grid-template-columns: repeat(4,minmax(0,1fr)); }
      .product-card { grid-template-columns: 104px minmax(0,1fr) auto; align-items: center; }
      .product-card__top { flex-direction: row; align-items: flex-start; justify-content: space-between; }
      .product-card__actions { grid-column: 3; align-self: stretch; flex-direction: column; justify-content: center; }
      .photo-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .stage-expanded { margin-left:71.8px; }
      .buyer-progress { grid-template-columns: minmax(0,1fr) auto; align-items: center; }
      .staff-header { flex-direction: row; align-items: center; justify-content: space-between; padding:24.8px 33.1px; }
      .staff-header .search { max-width:380px; }
      .staff-list { grid-template-columns: repeat(2,minmax(0,1fr)); padding:27.6px; }
      .staff-list .daily-log { grid-column: 1 / -1; }
      .form-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .utility-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .icon-library { grid-template-columns: repeat(4,minmax(0,1fr)); }
    }

    @media (min-width: 700px) {

      .topbar { padding-inline:33.1px; }
      .desktop-nav { display: flex; }
      .page { padding:41.4px 33.1px 82.8px; }
      .page-heading { flex-direction: row; align-items: end; justify-content: space-between; }
      .page-heading .search { max-width:370px; }
      .summary-grid { grid-template-columns: repeat(4,minmax(0,1fr)); }
      .dashboard-grid { grid-template-columns: minmax(0,1.7fr) minmax(280px,.8fr); }
      .dashboard-grid__wide { grid-column: 1; }
      .dashboard-grid__side { grid-column: 2; grid-row: 1 / span 2; }
      .order-list { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .mobile-dock { display: none; }
    }
    @media (min-width: 1100px) {
      .topbar { padding-inline:46.9px; }
      .desktop-nav { padding-inline:46.9px; }
      .page { padding:66.2px 46.9px 110.4px; }
      .login-screen { grid-template-columns: minmax(0,1.1fr) minmax(460px,.9fr); }
      .login-story { display: flex; }
      .login-form-wrap { padding:88.3px; }
      .order-list { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .order-workspace { grid-template-columns: 248px minmax(0,1fr); align-items: start; }
      .po-rail { position: sticky; top:19.3px; }
      .po-rail__list { display: grid; overflow: visible; }
      .po-rail__item { min-width:0; }
      .detail-grid { grid-template-columns: minmax(0,1.75fr) minmax(260px,.65fr); align-items: start; }
      .detail-grid__side { position: sticky; top:19.3px; }
      .timeline-card { padding:27.6px; }
      .staff-list { grid-template-columns: repeat(3,minmax(0,1fr)); padding:33.1px; }
      .staff-list .daily-log { grid-column: span 3; }
      .utility-grid--wide { grid-template-columns: minmax(0,1.4fr) minmax(300px,.6fr); }
      .icon-library { grid-template-columns: repeat(6,minmax(0,1fr)); }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
  

/* ---------------------------------------------------------------
   StoneFlow runtime additions — components the static handoff did
   not need (overlays, transient UI) written in the same token set.
   --------------------------------------------------------------- */
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-primary);color:var(--text-primary);
  font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
img{max-width:100%;display:block}
a{color:var(--text-primary)}
.app-shell{min-height:100vh}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}

/* loading veil */
#loading{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:var(--bg-primary);color:var(--text-secondary);font-size:13px}
.spin{width:26px;height:26px;border:2px solid var(--border-subtle);border-top-color:var(--text-primary);
  border-radius:99px;animation:sf-spin .9s linear infinite}
@keyframes sf-spin{to{transform:rotate(360deg)}}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:150;
  display:flex;flex-direction:column;gap:8px;width:min(94vw,460px)}
.toast{display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:var(--radius-md);
  background:var(--text-primary);color:#fff;font-size:13.5px;box-shadow:var(--shadow-lg);
  animation:sf-in .18s ease-out}
.toast.err{background:var(--status-error)}
.toast > div{flex:1}
.toast .button{min-height:34px;padding:0 12px;border-color:rgba(255,255,255,.28);
  background:rgba(255,255,255,.14);color:#fff;font-size:12.5px}
.toast .button:hover{background:rgba(255,255,255,.24)}
@keyframes sf-in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:120;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(32,33,31,.42);backdrop-filter:blur(2px)}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:24px;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:var(--surface-primary);box-shadow:var(--shadow-lg)}
@media(min-width:700px){.modal{border-radius:var(--radius-lg)}}
.modal h3{margin:0 0 4px;font-family:var(--font-display);font-size:26px;font-weight:400;line-height:1.1}
.modal .sub{margin-bottom:14px;color:var(--text-secondary);font-size:13px}

/* lightbox */
#lightbox{position:fixed;inset:0;z-index:160;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;background:rgba(23,24,22,.95)}
#lightbox img{max-width:96vw;max-height:82vh;object-fit:contain;border-radius:var(--radius-sm)}
#lightbox .cap{padding:0 16px;color:var(--mineral-grey);font-size:13px;text-align:center}

/* real photos sit inside the handoff's placeholder slots */
.photo-placeholder{position:relative;overflow:hidden;background-size:cover;background-position:center}
.photo-placeholder > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-placeholder.is-loaded > span{display:none}
.ph-del{position:absolute;bottom:6px;right:6px;z-index:2;display:flex;align-items:center;justify-content:center;
  width:30px;height:30px;min-height:0;padding:0;border:0;border-radius:var(--radius-sm);background:rgba(32,33,31,.66);
  color:#fff;font-size:14px;line-height:1;cursor:pointer}
.ph-ok{right:42px;background:rgba(95,104,96,.92)}
.thumb-sm{width:64px;height:64px;flex-shrink:0;border-radius:var(--radius-sm);overflow:hidden;
  background:var(--surface-secondary)}
.thumb-sm img{width:100%;height:100%;object-fit:cover}

/* small helpers used by the app */
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack-12{display:grid;gap:12px}
.stack-18{display:grid;gap:18px}
.muted{color:var(--text-secondary)}
.empty-state{padding:44px 16px;color:var(--text-secondary);font-size:14px;text-align:center}
.pre-wrap{white-space:pre-wrap}
.grow{flex:1;min-width:0}
.nowrap{white-space:nowrap}
.attn{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;margin:12px 0;
  border:1px solid var(--border-strong);border-left-width:3px;border-radius:var(--radius-md);
  background:var(--surface-primary);font-size:13.5px;cursor:pointer}
.attn--warn{border-left-color:var(--status-warning);background:var(--status-warning-soft)}
.attn--error{border-left-color:var(--status-error);background:var(--status-error-soft)}
.attn--ok{border-left-color:var(--status-success);background:var(--status-success-soft)}
.attn--flat{cursor:default}
.field textarea{width:100%;min-height:80px;padding:11px 13px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background:var(--surface-primary);color:var(--text-primary);
  font-family:var(--font-ui);font-size:15px;resize:vertical}
.field select{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background:var(--surface-primary);color:var(--text-primary);
  font-family:var(--font-ui);font-size:15px}
.check-row{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:14px}
.check-row input{width:auto;min-height:0}
.button-row{display:flex;gap:9px;flex-wrap:wrap}

/* phone: the top bar has one more control than the static handoff (Sign out),
   so give it room rather than letting the page scroll sideways */
@media (max-width:699px){
  .topbar{flex-wrap:wrap;gap:10px;min-height:0;padding:12px 16px}
  .topbar .role-chip{display:none}
  .topbar__tools{gap:8px}
  .topbar__tools .button{min-height:44px;padding:0 12px;font-size:13px}
  .wordmark__byline{font-size:11px}
  .page-heading__actions,.button-row{width:100%}
  .staff-header{padding:18px 16px}
}
/* the handoff's wordmark stacks its two lines; make that explicit */
.wordmark__title,.wordmark__byline{display:block}
/* long product names and dimension strings must not squeeze or clip */
.staff-product__top{flex-wrap:wrap}
.staff-product__top > div{flex:1 1 auto;min-width:0}
.staff-spec strong,.product-card__meta span,.side-row strong{overflow-wrap:anywhere}
.product-card__top{width:100%}
.order-card__title,.product-card__name,.staff-product__name{overflow-wrap:anywhere}
@media (max-width:1099px){ .order-workspace--home .po-rail{display:none} }
/* the product-card thumbnail is a fixed slot, not a full-height column */
.product-card > .photo-placeholder{align-self:start;aspect-ratio:3/4;min-height:0}
.staff-product__thumb{aspect-ratio:16/10}
/* progress bar has to read on the dark buyer card too */
.buyer-welcome .progress{background:rgba(255,255,255,.18)}
.buyer-welcome .progress__bar{background:#F4F4F1}
.buyer-welcome .buyer-progress__row{color:#F4F4F1}
.buyer-welcome .badge{background:rgba(255,255,255,.92);color:var(--umber-dark)}
/* grid children must be allowed to shrink, or the wide stage table widens the page */
.utility-grid,.utility-stack,.detail-grid,.dashboard-grid,.order-main{min-width:0}
.utility-grid > *,.utility-stack > *,.detail-grid > *,.dashboard-grid > *{min-width:0}
.data-table-wrap{max-width:100%}
.staff-header__top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.login-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line)}
.login-row:last-child{border-bottom:0}
.login-row strong{display:block;font-size:15px;overflow-wrap:anywhere}
.login-row .button{min-height:44px;padding:0 14px;font-size:14px}
/* PO numbers are long; let the card header wrap instead of spilling out of the card */
.order-card__top,.order-card__meta,.order-card__progress-row{flex-wrap:wrap}
.order-card__po{min-width:0;overflow-wrap:anywhere}
.order-card,.po-rail__item,.product-card,.staff-product,.stat-card,.panel{overflow:hidden}
#login-root,.login-screen{min-height:100vh}
.login-form__fineprint{text-align:left}
/* the brand line shows once: hero on desktop, under the wordmark on phone */
@media (min-width:1100px){.login-form__tagline{display:none}}
.staff-header .button--quiet{color:#F4F4F1;border-color:rgba(255,255,255,.28);min-height:44px;padding:0 14px;font-size:14px;white-space:nowrap;flex-shrink:0}
.staff-header .button--quiet:hover{background:rgba(255,255,255,.12)}
.mobile-dock__item .badge{min-height:20px;padding:0 6px;font-size:11px}
.mobile-dock__item .icon{width:22px;height:22px}
/* in a narrow panel the name must push the buttons onto their own line,
   not be squeezed into a three-word-tall column beside them */
.login-row .grow{min-width:190px}
.daily-entry{padding:18px 0;border-top:1px solid var(--line)}
.daily-entry:first-child{border-top:0}

/* the brand mark is a solid traced shape, not line art like the rest of the sprite */
/* solid traced shape, not line art like the rest of the sprite; and it must
   fill more of its tile than a line icon would, or the S-channel closes up */
.wordmark__mark .icon{fill:currentColor;stroke:none;width:64%;height:64%}
/* the workshop-only strip: planned dates, delay and hold detail. It is tinted
   and labelled so nobody mistakes it for something the buyer can read. */
.internal-strip{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:12px;
  padding:10px 13px;border:1px dashed var(--line-strong);border-radius:var(--radius-md);
  background:var(--surface-soft);color:var(--ink-soft);font-size:14px}
.internal-strip__tag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.internal-strip__hold{flex-basis:100%;color:var(--rust);font-weight:600}
.field-hint--warn{color:var(--rust);font-weight:600}
/* the import preview has nine columns; let it keep its width and scroll inside
   its wrapper rather than squeezing every field down to four characters */
#pi-items{min-width:1080px}
#pi-items td .field input{min-width:88px}
#pi-items td:nth-child(2) .field input{min-width:260px}
#pi-charges{min-width:560px}
#sh-items{min-width:1080px}
#sh-items td .field input{min-width:92px}
#sh-items td:nth-child(3) .field input{min-width:220px}
#sh-map{min-width:640px}
#sh-map td:nth-child(2){min-width:280px}
#pi-items td small{display:block;color:var(--ink-faint);font-size:12px;line-height:1.35}
/* a stale page should say so rather than quietly behaving like an old build */
.update-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;
  display:flex;align-items:center;gap:14px;max-width:calc(100% - 28px);
  padding:12px 14px 12px 18px;border-radius:14px;background:var(--umber-dark);color:#fff;
  box-shadow:var(--shadow-lg);font-size:15px}
.update-bar .button{min-height:44px;padding:0 16px;font-size:14px}
@media (max-width:699px){ .update-bar{bottom:86px} }
/* The three-column product card keyed off the VIEWPORT, but on a PO page the
   card sits beside a side panel and is only ~610px wide even on a 1440px screen.
   The actions column then ate the row and a long product name broke one word per
   line. Key it off the card's own width instead. */
.product-card{container-type:inline-size}
@media (min-width:700px){
  .product-card{grid-template-columns:104px minmax(0,1fr)}
  .product-card__actions{grid-column:1 / -1;flex-direction:row;align-self:auto}
}
@container (min-width:720px){
  .product-card{grid-template-columns:104px minmax(0,1fr) minmax(0,232px)}
  .product-card__actions{grid-column:3;flex-direction:column;align-self:stretch;justify-content:center}
  .product-card__actions .button{width:100%}
}
/* an empty thumbnail is the obvious place to reach for when adding a picture */
.photo-placeholder--add{cursor:pointer}
.photo-placeholder--add:hover{border-color:var(--action-primary)}
.photo-placeholder--add:hover > span{color:var(--action-primary)}
.photo-placeholder--add:focus-visible{box-shadow:0 0 0 3px var(--focus-ring)}
/* the name block sits beside the status badge; without flex:1/min-width:0 it
   collapses to min-content and a long product name breaks one word per line */
.product-card__top > div:first-child{flex:1 1 auto;min-width:0}
.product-card__top > .badge{flex:0 0 auto}
/* Semantics repair, 29 Aug 2026: the PO cards, section tabs and wordmark became
   real links and buttons. They must keep their existing look while gaining the
   focus ring and cursor a control is expected to have. */
a.po-rail__item{display:block;text-decoration:none;color:inherit;cursor:pointer}
button.content-tab{border:0;background:transparent;font:inherit;cursor:pointer}
button.content-tab.content-tab--active{background:var(--umber-dark);color:#fff}
@media (min-width:700px){ button.content-tab.content-tab--active{background:var(--graphite)} }
a.wordmark{text-decoration:none;color:inherit;cursor:pointer}
.breadcrumb a{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.breadcrumb a:hover{color:var(--ink)}
/* a focus ring that is actually visible on both light and dark grounds */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--action-primary);outline-offset:2px;border-radius:6px}
/* The account headline. A figure shown to a buyer needs its meaning attached:
   on advance terms a credit balance is money we hold, not a bill. */
.statement-headline{padding:20px;border-radius:var(--radius-lg);border:1px solid var(--line-strong);background:var(--surface-soft)}
.statement-headline--credit{border-color:var(--sage);background:var(--sage-soft)}
.statement-headline__label{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.statement-headline__value{margin-top:8px;font-family:var(--font-display);font-size:40px;line-height:1}
.statement-headline__note{margin-top:8px;color:var(--ink-soft);font-size:15px}
/* direction on every ledger line, so no amount stands there unexplained */
.ledger-dir{display:block;margin-top:2px;font-size:12px;color:var(--ink-faint);white-space:nowrap}
#acct-inv,#acct-ewb{min-width:820px}

/* ---- the owner console --------------------------------------------------- */
.topbar--console{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.cmdbar{display:none;align-items:center;gap:10px;width:100%;max-width:560px;justify-self:center;
  padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);
  color:var(--ink-soft);font:inherit;font-size:14px;cursor:pointer;text-align:left}
.cmdbar:hover{border-color:var(--action-primary)}
.cmdbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdbar__key{font-size:11px;border:1px solid var(--line-strong);border-radius:5px;padding:2px 6px;color:var(--ink-faint)}
@media (min-width:900px){ .cmdbar{display:flex} }
.create-wrap{position:relative}
.create-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:240px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:flex;flex-direction:column}
/* a class rule beats [hidden] at equal specificity, so say it again here or the
   menu stays laid out off the right edge and every page scrolls sideways */
.create-menu[hidden]{display:none}
.create-menu__item{border:0;background:transparent;font:inherit;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}
.create-menu__item:hover{background:var(--surface-soft)}

/* the sidebar replaces eleven top tabs */
.side-nav{display:none}
.side-nav__group{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:18px 0 6px 12px}
.side-nav__link{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:9px;
  color:var(--ink-soft);text-decoration:none;font-size:14.5px;font-weight:600}
.side-nav__link:hover{background:var(--surface-soft);color:var(--ink)}
.side-nav__link--active{background:var(--action-soft);color:var(--ink)}
.side-nav__link--sub{padding-left:30px;font-weight:500;font-size:14px}
@media (min-width:1100px){
  .app-shell--console{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto 1fr}
  .app-shell--console > .topbar{grid-column:1 / -1}
  .app-shell--console > .side-nav{display:block;grid-row:2;border-right:1px solid var(--line);padding:8px 10px 40px;
    position:sticky;top:0;align-self:start;max-height:calc(100vh - 64px);overflow:auto}
  .app-shell--console > .page{grid-row:2;min-width:0}
}

.kpi-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:20px}
.kpi{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:var(--radius-lg);
  background:var(--surface);text-align:left;font:inherit;cursor:pointer}
.kpi:hover{border-color:var(--line-strong)}
.kpi__head{display:flex;align-items:center;justify-content:space-between;color:var(--ink-faint)}
.kpi__label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.kpi__value{font-family:var(--font-display);font-size:34px;line-height:1}
.kpi__foot{font-size:13px;color:var(--ink-soft)}

.console-grid{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:1000px){ .console-grid{grid-template-columns:minmax(0,1fr) 320px} }
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font:inherit;
  font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.chip--on{background:var(--ink);color:#fff;border-color:var(--ink)}
.act-group{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:700;color:var(--ink-faint);padding:14px 0 6px;border-bottom:1px solid var(--line)}
.act{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.act__icon{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--surface-soft);color:var(--ink-soft)}
.act__title{font-weight:650;font-size:15px}
.act__meta{font-size:13px;color:var(--ink-soft);margin-top:2px;overflow-wrap:anywhere}
.act__note{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
.act__chip{display:none;font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
@media (min-width:820px){ .act{grid-template-columns:34px minmax(0,1fr) auto auto} .act__chip{display:inline} }
.milestone{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;width:100%;
  padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;font:inherit;text-align:left;cursor:pointer}
.milestone__date{display:grid;place-items:center;padding:6px 0;border-radius:9px;background:var(--surface-soft);
  font-family:var(--font-display);font-size:19px;line-height:1}
.milestone__date em{font-style:normal;font-family:var(--font-ui);font-size:10px;letter-spacing:.08em;color:var(--ink-faint)}
.milestone strong{display:block;font-size:14.5px}
.milestone small{display:block;font-size:12.5px;color:var(--ink-soft)}

.console-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.console-tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font:inherit;
  font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.console-tab--on{background:var(--ink);color:#fff;border-color:var(--ink)}
.console-tab--on .badge{background:rgba(255,255,255,.22);color:#fff}

.cmd{width:min(680px,92vw)}
.cmd__input{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px}
.cmd__list{max-height:52vh;overflow:auto;margin-top:10px}
.cmd__row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:baseline;width:100%;
  padding:9px 10px;border:0;background:transparent;border-radius:8px;font:inherit;text-align:left;cursor:pointer}
.cmd__row--on,.cmd__row:hover{background:var(--surface-soft)}
.cmd__kind{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.cmd__label{font-weight:600}
.cmd__meta{grid-column:2;font-size:12.5px;color:var(--ink-soft)}
.cmd__hint{margin-top:8px;font-size:12px;color:var(--ink-faint)}

/* The console's header is a three-column grid only where there is room for the
   search bar; below that it wraps like the old one, and the dock keeps carrying
   navigation right up to the width where the sidebar appears. */
@media (max-width:899px){
  .topbar--console{display:flex;flex-wrap:wrap;gap:10px}
  .topbar--console .topbar__tools{margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .topbar--console .role-chip{display:none}
}
.app-shell--console .mobile-dock{display:grid}
@media (min-width:1100px){ .app-shell--console .mobile-dock{display:none} }

/* the owner-actions head stacks its chips under the title rather than fighting
   it for width */
@media (min-width:700px){
  .console-grid__main > .panel__head{align-items:flex-start}
  .console-grid__main > .panel__head .chip-row{justify-content:flex-end;max-width:60%}
}
@media (max-width:699px){ .console-grid__main > .panel__head{flex-direction:column;gap:10px} }

/* order-book filters and the stage stepper */
.po-filter{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.po-filter__btn{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border:0;border-radius:7px;
  background:transparent;font:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer;text-align:left}
.po-filter__btn:hover{background:var(--surface-soft)}
.po-filter__btn--on{background:var(--action-soft);color:var(--ink);font-weight:650}
.stepper{display:flex;gap:0;list-style:none;margin:0;padding:0 0 6px;overflow-x:auto;scrollbar-width:thin}
.step{position:relative;flex:0 0 auto;min-width:82px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step--done::before,.step--now::before{background:var(--ink)}
.step__dot{position:relative;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--line-strong);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint)}
.step--done .step__dot{background:var(--ink);border-color:var(--ink);color:#fff}
.step--now .step__dot{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 4px var(--action-soft)}
.step__label{font-size:11.5px;line-height:1.25;color:var(--ink-soft);padding:0 4px}
.step--now .step__label{color:var(--ink);font-weight:700}
.stepper__foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stepper__foot small{display:block;font-size:12.5px;color:var(--ink-soft)}

/* "From the workshop" on the buyer's home: the newest dated photograph first */
.wt{display:grid;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.wt:last-child{border-bottom:0}
.wt__pics{display:grid;gap:8px;grid-template-columns:1fr}
.wt__pic{width:100%;aspect-ratio:4/3;border:0;padding:0;border-radius:var(--radius-md);overflow:hidden}
.wt__pic img{width:100%;height:100%;object-fit:cover;display:block}
.wt__when{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-faint)}
.wt__title{font-family:var(--font-display);font-size:20px;margin-top:2px}
.wt--big .wt__title{font-size:26px}
.wt__text{font-size:15px;color:var(--ink-soft);margin-top:6px}
.wt__body .button{margin-top:10px}
.wt-list{display:grid;gap:0}
@media (min-width:760px){
  .wt--big{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center;gap:22px}
  .wt--big .wt__pics{grid-template-columns:1fr 1fr}
  .wt--big .wt__pics .wt__pic:first-child{grid-column:1 / -1;aspect-ratio:16/10}
  .wt:not(.wt--big){grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center}
  .wt:not(.wt--big) .wt__pic{aspect-ratio:1}
}

/* ---------------------------------------------------------------------------
   Owner product page — the five answers, the current stage, the journey.
--------------------------------------------------------------------------- */
.prod-hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:22px 22px 18px;margin-top:14px}
.prod-hero__top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.prod-hero .detail-title{margin:2px 0 4px}

.answer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-top:18px}
.answer{background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  display:flex;flex-direction:column;gap:3px;min-width:0}
.answer>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.answer>strong{font-size:15px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.answer>small{font-size:12px;color:var(--ink-faint);line-height:1.35;overflow-wrap:anywhere}
.answer--warn{border-color:var(--status-warning);background:var(--status-warning-soft)}

.prod-layout{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px;align-items:start}
@media (min-width:1100px){ .prod-layout{grid-template-columns:minmax(0,1fr) 320px} }
.prod-main{min-width:0}
.prod-side{min-width:0;display:flex;flex-direction:column}

.stage-now{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
.stage-now__head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stage-now__label{display:flex;align-items:center;gap:12px;min-width:0}
.stage-now__num{width:34px;height:34px;flex:none;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:14px}
.stage-now__label span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.stage-now__label strong{display:block;font-size:17px;color:var(--ink)}
.stage-now__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.stage-now__grid>div{background:var(--canvas);border-radius:10px;padding:10px 12px;min-width:0}
.stage-now__grid span{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:2px}
.stage-now__grid strong{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.stage-now__task{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
  background:var(--canvas);border-radius:10px;padding:12px 13px;margin-top:12px}
.stage-now__task strong{display:block;font-size:13px;margin-bottom:2px}
.stage-now__task p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.45}
.stage-now__actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.jnodes{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.jnode{flex:1 0 68px;min-width:68px;background:none;border:0;padding:4px 2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.jnode i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;
  font-size:12px;font-weight:700;background:var(--canvas);color:var(--ink-faint);border:1px solid var(--line)}
.jnode span{font-size:10px;line-height:1.2;color:var(--ink-faint);overflow-wrap:anywhere}
.jnode--done i{background:var(--ink);color:#fff;border-color:var(--ink)}
.jnode--now  i{background:var(--action-primary);color:#fff;border-color:var(--action-primary)}
.jnode--now  span{color:var(--ink);font-weight:600}
.jnode--hold i{background:var(--status-warning-soft);border-color:var(--status-warning);color:var(--ink)}
.jnode--skip i{opacity:.5}

.jrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;
  border:1px solid transparent}
.jrow:hover{background:var(--canvas)}
.jrow__n{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:var(--canvas);border:1px solid var(--line);color:var(--ink-faint)}
.jrow strong{display:block;font-size:14px;color:var(--ink)}
.jrow small{display:block;font-size:12px;color:var(--ink-faint);margin-top:1px}
.jrow>div{min-width:0;flex:1}
.jrow__count{font-size:12px;color:var(--ink-faint);white-space:nowrap}
.jrow--done .jrow__n{background:var(--ink);color:#fff;border-color:var(--ink)}
.jrow--now{background:var(--canvas);border-color:var(--line)}
.jrow--now .jrow__n{background:var(--action-primary);color:#fff;border-color:var(--action-primary)}
.jrow--hold .jrow__n{background:var(--status-warning-soft);border-color:var(--status-warning);color:var(--ink)}
.future-stages[hidden]{display:none}

.att{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
  padding:11px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0;padding-bottom:0}
.att strong{display:block;font-size:13px;color:var(--ink);line-height:1.35}
.att span{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px;line-height:1.4}
.att--calm strong{color:var(--ink-faint);font-weight:600}
.att>div{min-width:0}
.side-row strong.is-missing{color:var(--ink-faint);font-weight:500}

/* ---------------------------------------------------------------------------
   The buyer's workspace.
--------------------------------------------------------------------------- */
.buyer-who{display:none;text-align:right;line-height:1.25}
.buyer-who strong{display:block;font-size:13px;color:var(--ink)}
.buyer-who small{display:block;font-size:11px;color:var(--ink-faint)}
@media (min-width:760px){ .buyer-who{display:block} }

.buyer-hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 22px;margin-bottom:16px}
.buyer-hero .display-title{margin:2px 0 6px}
.buyer-hero__note{margin:10px 0 0;font-size:12px;color:var(--ink-faint)}

.page-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.page-head .display-title{margin:2px 0 6px}

.order-row{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
.order-row:last-child{border-bottom:0}
.order-row__main{flex:1;min-width:0}
.order-row__main h4{margin:2px 0 4px;font-size:17px;color:var(--ink)}
.order-row__sub{margin:0 0 10px;font-size:12px;color:var(--ink-faint)}
.order-row__side{flex:none;text-align:right;min-width:110px}
.order-row__side span{display:block;font-size:11px;color:var(--ink-faint)}
.order-row__side strong{display:block;font-size:14px;color:var(--ink)}
.order-row__side small{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px}
@media (max-width:620px){
  .order-row{flex-wrap:wrap}
  .order-row__side{text-align:left;min-width:0;width:100%}
  .order-row>.button{width:100%}
}

.approval-row{display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:13px 0;border-bottom:1px solid var(--line)}
.approval-row:last-child{border-bottom:0}
.approval-row strong{display:block;font-size:14px;color:var(--ink)}
.approval-row span{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px}
.approval-row>div{min-width:0}

.side-help{margin-top:auto;padding:14px 12px;background:var(--surface-soft,var(--canvas));
  border:1px solid var(--line);border-radius:12px}
.side-help strong{display:block;font-size:12px;color:var(--ink);margin-bottom:4px}
.side-help p{margin:0;font-size:11px;color:var(--ink-faint);line-height:1.45}

.kpi--credit .kpi__value{color:var(--status-success)}
.kpi--warn{border-color:var(--status-warning);background:var(--status-warning-soft)}

.comment{padding:10px 0;border-bottom:1px solid var(--line)}
.comment:last-child{border-bottom:0}
.comment__head{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px}
.comment__head strong{font-size:13px;color:var(--ink)}
.comment__head span{font-size:11px;color:var(--ink-faint)}
.comment p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5}

<script>
'use strict';
const CONFIG = {
  url: 'https://ooetmikoyqflqajlehtc.supabase.co',
  anon: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vZXRtaWtveXFmbHFhamxlaHRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNjU4MDgsImV4cCI6MjEwMjY0MTgwOH0.19khX0_PajPjXm0Nh6kEAz_1SwNLbZGgAytMat2WPjM',
  bucket: 'tracker-files',
  staffDomain: 'gujraj-impex.local'   // staff sign in with a bare name; this is appended behind the scenes
};

// "kunal.tak" -> "kunal.tak@gujraj-impex.local"; anything already containing @ is left alone.
function normLogin(v){
  v=String(v||'').trim().toLowerCase();
  if(!v) return '';
  return v.indexOf('@')>=0 ? v : (v.replace(/[^a-z0-9._-]/g,'') + '@' + CONFIG.staffDomain);
}
// display the short form back to the user
function shortLogin(v){
  v=String(v||'');
  return v.toLowerCase().endsWith('@'+CONFIG.staffDomain) ? v.slice(0, -(CONFIG.staffDomain.length+1)) : v;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function go(hash){ if(location.hash===hash){ render(); } else location.hash=hash; }

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(d){ if(!d) return ''; const t=new Date(d+(String(d).length===10?'T00:00:00':''));
  if(isNaN(t)) return String(d); return t.getDate()+' '+MON[t.getMonth()]+' '+String(t.getFullYear()).slice(2); }
function ftime(d){ if(!d) return ''; const t=new Date(d); if(isNaN(t)) return '';
  const now=new Date(); const diff=(now-t)/1000;
  if(diff<90) return 'just now';
  if(diff<3600) return Math.round(diff/60)+' min ago';
  if(diff<86400 && now.getDate()===t.getDate()) { let h=t.getHours(), m=String(t.getMinutes()).padStart(2,'0'), ap=h>=12?'pm':'am'; h=h%12||12; return 'today '+h+':'+m+' '+ap; }
  return fdate(t.toISOString().slice(0,10)); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const FRACS = {0:'',1:'⅛',2:'¼',3:'⅜',4:'½',5:'⅝',6:'¾',7:'⅞'};
function mmToIn(mm){
  const v=Number(mm); if(!isFinite(v)) return '';
  const eighths=Math.round(v/25.4*8); const whole=Math.floor(eighths/8); const rem=eighths%8;
  if(whole===0 && rem===0) return '0';
  return (whole||rem===0? whole:'') + (FRACS[rem]||'');
}
function dimsOf(it){
  if(it.l_mm||it.w_mm||it.h_mm){
    const mm=[it.l_mm,it.w_mm,it.h_mm].filter(x=>x!=null&&x!=='').map(x=>Math.round(Number(x))).join(' × ');
    const inch=[it.l_mm,it.w_mm,it.h_mm].filter(x=>x!=null&&x!=='').map(mmToIn).join(' × ');
    return mm+' mm · '+inch+' in';
  }
  if(it.dims_text){
    const t=String(it.dims_text);
    if(/mm/i.test(t)){
      const inch=t.replace(/mm/ig,'in').replace(/\d+(\.\d+)?/g, n=>mmToIn(n));
      return t+' · ≈ '+inch;
    }
    return t;
  }
  return '';
}

function daysUntil(d){
  if(!d) return null;
  const t=new Date(String(d).slice(0,10)+'T00:00:00');
  if(isNaN(t)) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((t-now)/86400000);
}
function countdown(d, done){
  const n=daysUntil(d);
  if(n===null) return '';
  if(done) return '<span class="badge badge--success">Delivered</span>';
  if(n<0) return '<span class="badge badge--alert">'+Math.abs(n)+' day'+(Math.abs(n)===1?'':'s')+' overdue</span>';
  if(n===0) return '<span class="badge badge--pending">Due today</span>';
  return '<span class="badge'+(n<=7?' badge--pending':'')+'">'+n+' day'+(n===1?'':'s')+' to delivery</span>';
}
// plain text version for the mini-stat tiles
function countdownText(d, done){
  const n=daysUntil(d);
  if(n===null) return '—';
  if(done) return 'Delivered';
  if(n<0) return Math.abs(n)+' day'+(Math.abs(n)===1?'':'s')+' overdue';
  if(n===0) return 'Due today';
  return n+' day'+(n===1?'':'s');
}
function initials(s){
  s=String(s||'').replace(/@.*$/,'').replace(/[._-]+/g,' ').trim();
  if(!s) return '··';
  const w=s.split(/\s+/);
  return ((w[0][0]||'')+(w.length>1?(w[w.length-1][0]||''):'')).toUpperCase();
}

function money(v, cur){
  if(v==null||v==='') return '';
  const n=Number(v); if(!isFinite(n)) return '';
  try{ return new Intl.NumberFormat('en-IN',{style:'currency',currency:cur||'INR',maximumFractionDigits:0}).format(n); }
  catch(e){ return (cur||'INR')+' '+n.toLocaleString('en-IN'); }
}

function csvParse(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur='';
      if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); if(row.length>1||row[0]!=='') rows.push(row); }
  return rows;
}

function toast(msg, opts){
  opts=opts||{};
  const t=el('<div class="toast'+(opts.err?' err':'')+'"><div style="flex:1">'+esc(msg)+'</div></div>');
  if(opts.action){ const b=el('<button class="button">'+esc(opts.action)+'</button>');

  const x=el('<button class="button" aria-label="Dismiss">✕</button>'); x.onclick=()=>t.remove(); t.appendChild(x);
  $('toast').appendChild(t);

}

function modal(html){
  const bg=el('<div class="modal-bg"></div>');
  const m=el('<div class="modal">'+html+'</div>');
  bg.appendChild(m);
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
  m.setAttribute('role','dialog');
  m.setAttribute('aria-modal','true');
  const heading = m.querySelector('h3');
  if(heading){
    if(!heading.id) heading.id = 'modal-title-'+Math.random().toString(36).slice(2,8);
    m.setAttribute('aria-labelledby', heading.id);
  }
  $('modal-root').innerHTML=''; $('modal-root').appendChild(bg);
  // put the caret where the person is about to type, or on the dialog itself
  const first = m.querySelector('input:not([type=hidden]),select,textarea,button');
  if(first) first.focus(); else { m.tabIndex=-1; m.focus(); }
  return {bg, m, close:()=>bg.remove()};
}

const S = {

async function loadStaffData(){

  const [it, ist, ph, sp, dc, upd, updi, sti] = await Promise.all([

function indexPhotos(list){

/* ---- daily workshop updates ----------------------------------------------
   A daily update is a record inside a stage, not a new stage. Buyers only ever
   receive rows the database has already published; the pending ones are not
   filtered here, they never arrive. */
function indexUpdates(){
  S.updByItem={}; S.photosByUpdate={};
  (S.updates||[]).forEach(u=>{ (S.updByItem[u.item_id]=S.updByItem[u.item_id]||[]).push(u); });
  Object.values(S.updByItem).forEach(l=>l.sort((a,b)=>String(b.work_date).localeCompare(String(a.work_date))
    || String(b.submitted_at).localeCompare(String(a.submitted_at))));
  (S.photos||[]).forEach(p=>{ if(p.update_id) (S.photosByUpdate[p.update_id]=S.photosByUpdate[p.update_id]||[]).push(p); });
  Object.values(S.photosByUpdate).forEach(l=>l.sort((a,b)=>(a.display_order||0)-(b.display_order||0)));

// Planned dates and hold detail. The buyer has no policy on bt_stage_internal,
// so for a buyer this index is simply empty and every helper below returns null
// — the privacy does not depend on any caller remembering to check the role.
function indexStageInternal(rows){
  S.stInternal = {};
  (rows||[]).forEach(r=>{ S.stInternal[r.item_id+'|'+r.stage_id] = r; });
}
function stageInternal(itemId, stageId){ return (S.stInternal||{})[itemId+'|'+stageId] || null; }

function dayGap(a, b){
  if(!a || !b) return null;
  const ms = new Date(b+'T00:00:00') - new Date(a+'T00:00:00');
  return Math.round(ms / 86400000);
}

// A stage is late against its own plan, not against the delivery date: catching
// a slip at moulding is what stops it becoming a slip at dispatch.
function stageDelay(itemId, row){
  if(!row) return null;
  const si = stageInternal(itemId, row.stage_id);
  const planned = si && si.planned_date;
  if(!planned) return null;
  if(row.status === 'completed'){
    const late = dayGap(planned, row.completed_at || today());
    return { planned, done: row.completed_at, days: late,
             state: late > 0 ? 'late' : 'ontime' };
  }
  if(row.status === 'skipped') return null;
  const over = dayGap(planned, today());
  return { planned, done: null, days: over,
           state: over > 0 ? 'overdue' : 'due' };
}

function holdOf(itemId, row){
  if(!row || row.status !== 'on_hold') return null;
  const si = stageInternal(itemId, row.stage_id);
  if(!si) return null;
  if(!si.hold_reason && !si.hold_owner && !si.hold_revised_date) return null;
  return si;
}

// Every piece currently on hold, for the owner's dashboard.
function heldStages(){
  const out = [];
  (S.items||[]).forEach(it=>{
    (S.stByItem[it.id]||[]).forEach(r=>{
      const h = holdOf(it.id, r);
      if(h) out.push({ item: it, row: r, stage: S.stagesById[r.stage_id], hold: h });
    });
  });
  return out;
}

// Stages running past their planned date, worst first.
function lateStages(){
  const out = [];
  (S.items||[]).forEach(it=>{
    (S.stByItem[it.id]||[]).forEach(r=>{
      if(r.status !== 'in_progress' && r.status !== 'on_hold') return;
      const d = stageDelay(it.id, r);
      if(d && d.state === 'overdue') out.push({ item: it, row: r, stage: S.stagesById[r.stage_id], delay: d });
    });
  });
  return out.sort((a,b)=>b.delay.days - a.delay.days);
}

// A buyer's question counts as open until somebody closes it, so the panel
// empties as things are dealt with instead of growing for ever.
function openDecisions(){

}

function updatesFor(itemId){ return S.updByItem[itemId]||[]; }
function updateToday(itemId){ const t=today(); return updatesFor(itemId).find(u=>u.work_date===t); }
function daysSinceUpdate(itemId){
  const l=updatesFor(itemId)[0];
  if(!l) return null;
  return Math.floor((new Date(today()+'T00:00:00') - new Date(l.work_date+'T00:00:00'))/86400000);
}
// products that should have been recorded today: in the workshop, not finished
function activeItems(){
