<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gujraj Impex · Order Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#211d17; --muted:#71695c; --faint:#9b937f;
  --line:#e6dfd0; --line2:#efe9dc;
  --bronze:#96754a; --bronze-d:#7a5f3c; --bronze-t:#f0e7d8;
  --green:#3e7d54; --green-t:#e4efe7; --amber:#a97f2b; --amber-t:#f5ecd8;
  --red:#a5453c; --red-t:#f4e3e1; --blue:#4a6d8c; --blue-t:#e4ecf2;
  --shadow:0 1px 2px rgba(33,29,23,.05), 0 4px 16px rgba(33,29,23,.06);
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5;
  min-height:100vh; padding-bottom:56px}
img{max-width:100%; display:block}
a{color:var(--bronze-d)}
button{font-family:var(--sans)}
input,select,textarea{font-family:var(--sans); font-size:15px; color:var(--ink); background:#fff;
  border:1px solid var(--line); border-radius:8px; padding:9px 11px; width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--bronze-t); border-color:var(--bronze)}
label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin:12px 0 4px; text-transform:uppercase; letter-spacing:.06em}
.wrap{max-width:980px; margin:0 auto; padding:0 14px}

/* header */
.hdr{position:sticky; top:0; z-index:40; background:rgba(246,243,236,.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.hdr-in{max-width:980px; margin:0 auto; padding:10px 14px; display:flex; align-items:center; gap:12px}
.wordmark{font-family:var(--serif); font-weight:600; font-size:21px; letter-spacing:.14em; white-space:nowrap; cursor:pointer}
.wordmark small{display:block; font-family:var(--sans); font-size:9.5px; font-weight:600; letter-spacing:.32em; color:var(--bronze); margin-top:-2px}
.hdr-sp{flex:1}
.hdr .who{font-size:12.5px; color:var(--muted); text-align:right; line-height:1.3; max-width:44vw; overflow:hidden; text-overflow:ellipsis}
.hdr .who b{display:block; color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* nav tabs (admin) */
.tabs{display:flex; gap:4px; overflow-x:auto; padding:8px 14px 0; max-width:980px; margin:0 auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px; padding:6px 14px;
  font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap}
.tab.on{background:var(--ink); color:#fff; border-color:var(--ink)}

/* cards + layout */
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:16px; margin:14px 0}
.sect{font-family:var(--serif); font-size:22px; font-weight:600; margin:22px 0 2px}
.sub{color:var(--muted); font-size:13px}
.rule{height:1px; background:var(--line); margin:12px 0}
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0}
.kpi{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 8px 10px; text-align:center; cursor:default}
.kpi b{font-family:var(--serif); font-size:26px; font-weight:600; display:block; line-height:1.1}
.kpi span{font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
@media (max-width:560px){ .kpis{grid-template-columns:repeat(2,1fr)} }

/* chips */
.chip{display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap}
.c-bronze{background:var(--bronze-t); color:var(--bronze-d)}
.c-green{background:var(--green-t); color:var(--green)}
.c-amber{background:var(--amber-t); color:var(--amber)}
.c-red{background:var(--red-t); color:var(--red)}
.c-blue{background:var(--blue-t); color:var(--blue)}
.c-grey{background:#eee9de; color:var(--muted)}

/* progress */
.pbar{height:5px; background:var(--line2); border-radius:99px; overflow:hidden}
.pbar i{display:block; height:100%; background:linear-gradient(90deg, var(--bronze), var(--bronze-d)); border-radius:99px}

/* po card */
.po-card{cursor:pointer; transition:transform .06s}
.po-card:active{transform:scale(.995)}
.po-top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.po-num{font-family:var(--serif); font-size:20px; font-weight:700; letter-spacing:.02em}
.meta{color:var(--muted); font-size:12.5px}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.sp{flex:1}

/* item rows */
.item-row{display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line2); cursor:pointer; align-items:center}
.item-row:first-of-type{border-top:0}
.item-main{flex:1; min-width:0}
.item-name{font-weight:600; font-size:14.5px}
.item-sub{font-size:12.5px; color:var(--muted); margin-top:1px}
.badge{min-width:20px; height:20px; border-radius:99px; background:var(--red); color:#fff; font-size:11px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center; padding:0 6px}

/* timeline */
.tl{margin-top:6px}
.tl-grp{font-size:10.5px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--faint); margin:18px 0 4px 34px}
.tl-row{display:flex; gap:12px; position:relative; padding:7px 0}
.tl-rail{width:22px; display:flex; flex-direction:column; align-items:center; flex-shrink:0}
.tl-dot{width:14px; height:14px; border-radius:99px; border:2px solid var(--line); background:#fff; z-index:1; margin-top:3px; flex-shrink:0}
.tl-dot.done{background:var(--bronze); border-color:var(--bronze)}
.tl-dot.now{border-color:var(--bronze); background:#fff; box-shadow:0 0 0 4px var(--bronze-t)}
.tl-dot.skip{background:var(--line); border-color:var(--line)}
.tl-line{width:2px; flex:1; background:var(--line2); margin-top:2px}
.tl-body{flex:1; min-width:0; padding-bottom:6px}
.tl-name{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; cursor:pointer}
.tl-date{font-size:12px; color:var(--muted)}
.tl-note{font-size:13.5px; color:var(--ink); background:var(--bronze-t); border-radius:8px; padding:8px 10px; margin-top:6px}
.tl-desc{font-size:12.5px; color:var(--faint); margin-top:2px}

/* photos */
.ph-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:6px; margin-top:8px}
.ph{aspect-ratio:1; border-radius:8px; background:var(--line2); overflow:hidden; cursor:pointer; position:relative}
.ph img{width:100%; height:100%; object-fit:cover}
.ph .del{position:absolute; top:3px; right:3px; background:rgba(0,0,0,.55); color:#fff; border:0; border-radius:6px;
  width:22px; height:22px; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center}

/* comments */
.cmt{display:flex; gap:8px; margin-top:10px}
.cmt-b{background:#f3efe6; border-radius:10px; padding:8px 11px; flex:1}
.cmt.me .cmt-b{background:var(--blue-t)}
.cmt-who{font-size:11.5px; font-weight:700; color:var(--muted)}
.cmt-txt{font-size:13.5px; white-space:pre-wrap; word-break:break-word}
.cmt-t{font-size:10.5px; color:var(--faint); margin-top:2px}
.composer{display:flex; gap:6px; margin-top:10px; align-items:flex-end}
.composer textarea{flex:1; min-height:38px; max-height:110px; resize:none; border-radius:10px}

/* buttons */
.btn{border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px; padding:8px 14px;
  font-size:13.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--bronze); border-color:var(--bronze); color:#fff}
.btn.dark{background:var(--ink); border-color:var(--ink); color:#fff}
.btn.grn{background:var(--green); border-color:var(--green); color:#fff}
.btn.dgr{color:var(--red); border-color:var(--red-t); background:var(--red-t)}
.btn.sm{padding:5px 10px; font-size:12.5px; border-radius:8px}
.btn.wa{background:#1faa53; border-color:#1faa53; color:#fff}
.btn[disabled]{opacity:.5; pointer-events:none}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}

/* login */
.login{max-width:400px; margin:9vh auto 0; padding:0 18px}
.login .brand{text-align:center; margin-bottom:26px}
.login .brand .bw{font-family:var(--serif); font-weight:600; font-size:34px; letter-spacing:.16em}
.login .brand .bt{font-size:10.5px; font-weight:600; letter-spacing:.38em; color:var(--bronze); text-transform:uppercase}
.login .brand .rule2{width:56px; height:2px; background:var(--bronze); margin:14px auto}

/* shipping grid */
.ship-grid{display:grid; grid-template-columns:1fr 1fr; gap:2px 18px; margin-top:8px}
.ship-grid .lab{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-top:8px}
.ship-grid .val{font-size:14px}

/* modal */
.modal-bg{position:fixed; inset:0; background:rgba(30,26,20,.45); z-index:90; display:flex; align-items:flex-end; justify-content:center}
@media(min-width:640px){ .modal-bg{align-items:center} }
.modal{background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:560px; max-height:92vh; overflow:auto; padding:18px 18px 26px}
@media(min-width:640px){ .modal{border-radius:16px} }
.modal h3{font-family:var(--serif); font-size:22px; margin-bottom:4px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 12px}

/* toast */
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:22px; z-index:120; display:flex; flex-direction:column; gap:8px; width:min(94vw,460px)}
.toast{background:var(--ink); color:#fff; border-radius:10px; padding:11px 14px; font-size:13.5px; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:10px; animation:tin .18s ease-out}
.toast.err{background:var(--red)}
.toast .btn{background:rgba(255,255,255,.14); border:0; color:#fff}
@keyframes tin{from{opacity:0; transform:translateY(8px)}to{opacity:1}}

/* lightbox */
#lightbox{position:fixed; inset:0; background:rgba(15,13,10,.94); z-index:130; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px}
#lightbox img{max-width:96vw; max-height:82vh; object-fit:contain; border-radius:6px}
#lightbox .cap{color:#cfc8ba; font-size:13px; text-align:center; padding:0 16px}

/* activity */
.act{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--line2); font-size:13.5px}
.act:first-of-type{border-top:0}
.act .t{color:var(--faint); font-size:11.5px; white-space:nowrap; padding-top:2px}
.act b{font-weight:600}

/* tables */
.tbl{width:100%; border-collapse:collapse; font-size:13px}
.tbl th{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); text-align:left; padding:7px 8px; border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px; border-bottom:1px solid var(--line2); vertical-align:top}
.tblwrap{overflow-x:auto}

.empty{color:var(--muted); text-align:center; padding:34px 10px; font-size:14px}
.center{text-align:center}
.mt8{margin-top:8px}.mt14{margin-top:14px}
.note-sm{font-size:12px; color:var(--faint)}
.attn{border-left:3px solid var(--amber); background:var(--amber-t); border-radius:10px; padding:10px 12px; margin:8px 0; cursor:pointer; font-size:13.5px}
.attn.red{border-left-color:var(--red); background:var(--red-t)}
.attn.green{border-left-color:var(--green); background:var(--green-t)}
.checkbox-row{display:flex; align-items:center; gap:8px; font-size:13.5px; margin-top:8px}
.checkbox-row input{width:auto}
#loading{position:fixed; inset:0; background:var(--bg); z-index:200; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; color:var(--muted); font-size:13px}
.spin{width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--bronze); border-radius:99px; animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const CONFIG = {
  url: 'https://ooetmikoyqflqajlehtc.supabase.co',
  anon: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vZXRtaWtveXFmbHFhamxlaHRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNjU4MDgsImV4cCI6MjEwMjY0MTgwOH0.19khX0_PajPjXm0Nh6kEAz_1SwNLbZGgAytMat2WPjM',
  bucket: 'tracker-files'
};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function go(hash){ if(location.hash===hash){ render(); } else location.hash=hash; }

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(d){ if(!d) return ''; const t=new Date(d+(String(d).length===10?'T00:00:00':''));
  if(isNaN(t)) return String(d); return t.getDate()+' '+MON[t.getMonth()]+' '+String(t.getFullYear()).slice(2); }
function ftime(d){ if(!d) return ''; const t=new Date(d); if(isNaN(t)) return '';
  const now=new Date(); const diff=(now-t)/1000;
  if(diff<90) return 'just now';
  if(diff<3600) return Math.round(diff/60)+' min ago';
  if(diff<86400 && now.getDate()===t.getDate()) { let h=t.getHours(), m=String(t.getMinutes()).padStart(2,'0'), ap=h>=12?'pm':'am'; h=h%12||12; return 'today '+h+':'+m+' '+ap; }
  return fdate(t.toISOString().slice(0,10)); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const FRACS = {0:'',1:'⅛',2:'¼',3:'⅜',4:'½',5:'⅝',6:'¾',7:'⅞'};
function mmToIn(mm){
  const v=Number(mm); if(!isFinite(v)) return '';
  const eighths=Math.round(v/25.4*8); const whole=Math.floor(eighths/8); const rem=eighths%8;
  if(whole===0 && rem===0) return '0';
  return (whole||rem===0? whole:'') + (FRACS[rem]||'');
}
function dimsOf(it){
  if(it.l_mm||it.w_mm||it.h_mm){
    const mm=[it.l_mm,it.w_mm,it.h_mm].filter(x=>x!=null&&x!=='').map(x=>Math.round(Number(x))).join(' × ');
    const inch=[it.l_mm,it.w_mm,it.h_mm].filter(x=>x!=null&&x!=='').map(mmToIn).join(' × ');
    return mm+' mm · '+inch+' in';
  }
  if(it.dims_text){
    const t=String(it.dims_text);
    if(/mm/i.test(t)){
      const inch=t.replace(/mm/ig,'in').replace(/\d+(\.\d+)?/g, n=>mmToIn(n));
      return t+' · ≈ '+inch;
    }
    return t;
  }
  return '';
}

function csvParse(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur='';
      if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); if(row.length>1||row[0]!=='') rows.push(row); }
  return rows;
}

function toast(msg, opts){
  opts=opts||{};
  const t=el('<div class="toast'+(opts.err?' err':'')+'"><div style="flex:1">'+esc(msg)+'</div></div>');
  if(opts.action){ const b=el('<button class="btn sm">'+esc(opts.action)+'</button>');
    b.onclick=()=>{ opts.onAction&&opts.onAction(); t.remove(); }; t.appendChild(b); }
  const x=el('<button class="btn sm" style="padding:2px 8px">✕</button>'); x.onclick=()=>t.remove(); t.appendChild(x);
  $('toast').appendChild(t);
  setTimeout(()=>t.remove(), opts.action?12000:4200);
}

function modal(html){
  const bg=el('<div class="modal-bg"></div>');
  const m=el('<div class="modal">'+html+'</div>');
  bg.appendChild(m);
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
  $('modal-root').innerHTML=''; $('modal-root').appendChild(bg);
  return {bg, m, close:()=>bg.remove()};
}
function closeModal(){ $('modal-root').innerHTML=''; }

function lightbox(url, cap){
  const lb=$('lightbox');
  lb.innerHTML='<img src="'+esc(url)+'" alt="">'+(cap?'<div class="cap">'+esc(cap)+'</div>':'');
  lb.style.display='flex';
}

function genPassword(){
  const w=['Marble','Onyx','Bronze','Ivory','Chisel','Lathe','Kesar','Aravalli','Mewar','Agate','Quartz','Carve'];
  return w[Math.floor(Math.random()*w.length)]+'.'+w[Math.floor(Math.random()*w.length)]+'.'+(1000+Math.floor(Math.random()*9000));
}
function waLink(phone, text){
  const p=String(phone||'').replace(/[^0-9]/g,'');
  return 'https://wa.me/'+(p?p:'')+'?text='+encodeURIComponent(text);
}
function copyText(t){ try{ navigator.clipboard.writeText(t); toast('Copied'); }catch(e){ toast('Could not copy', {err:true}); } }
</script>
<script>
'use strict';
let sb=null;
try{
  sb = window.__sbOverride || supabase.createClient(CONFIG.url, CONFIG.anon);
}catch(e){
  document.addEventListener('DOMContentLoaded', ()=>{
    $('loading').innerHTML='<div style="max-width:300px;text-align:center;color:var(--muted)">Could not load the app libraries. Please check your internet connection and reload.</div>';
  });
}

const S = {
  session:null, profile:null, settings:{}, stages:[], stagesById:{},
  buyers:[], buyersById:{}, buyerFilter:'',
  pos:[], posById:{}, items:[], itemsById:{}, stByItem:{},
  comments:[], commentsByItem:{}, photos:[], photosByItem:{},
  docsByPo:{}, readMarks:{}, activity:[], profilesAll:[],
  urlCache:{}, lastLoad:0, ready:false
};
function isAdmin(){ return S.profile && S.profile.role==='admin'; }
function uid(){ return S.session && S.session.user.id; }

async function loadCore(){
  const [p,se,st] = await Promise.all([
    sb.from('bt_profiles').select('*').eq('user_id', uid()).maybeSingle(),
    sb.from('bt_settings').select('*').eq('id',1).maybeSingle(),
    sb.from('bt_stages').select('*').order('sort_order')
  ]);
  if(p.error) throw p.error;
  S.profile = p.data;
  S.settings = se.data || {};
  S.stages = (st.data||[]);
  S.stagesById = {}; S.stages.forEach(s=>S.stagesById[s.id]=s);
}

async function loadData(){
  const admin = isAdmin();
  let poQ = sb.from('bt_purchase_orders').select('*, bt_order_items(*, bt_item_stages(*))').order('po_date',{ascending:false}).order('created_at',{ascending:false});
  if(admin && S.buyerFilter) poQ = poQ.eq('buyer_id', S.buyerFilter);
  const [b, po, cm, ph, dc, rm, ac, pr] = await Promise.all([
    sb.from('bt_buyers').select('*').order('company'),
    poQ,
    sb.from('bt_comments').select('*').order('created_at'),
    sb.from('bt_photos').select('*').order('created_at'),
    sb.from('bt_documents').select('*').order('created_at'),
    sb.from('bt_read_marks').select('*'),
    sb.from('bt_activity').select('*').order('created_at',{ascending:false}).limit(200),
    admin ? sb.from('bt_profiles').select('*').order('created_at') : Promise.resolve({data:[]})
  ]);
  const err = [b,po,cm,ph,dc,rm,ac,pr].find(r=>r.error);
  if(err) throw err.error;

  S.buyers = b.data||[]; S.buyersById={}; S.buyers.forEach(x=>S.buyersById[x.id]=x);
  S.pos = po.data||[]; S.posById={}; S.items=[]; S.itemsById={}; S.stByItem={};
  const activeStageIds = S.stages.filter(s=>s.active).map(s=>s.id);
  S.pos.forEach(p=>{
    S.posById[p.id]=p;
    p.items = (p.bt_order_items||[]).slice().sort((x,y)=>(x.line_no||0)-(y.line_no||0)||(x.sort_order||0)-(y.sort_order||0));
    p.items.forEach(it=>{
      it.po = p;
      S.items.push(it); S.itemsById[it.id]=it;
      const rows=(it.bt_item_stages||[]).slice();
      rows.sort((a,c)=>(S.stagesById[a.stage_id]?S.stagesById[a.stage_id].sort_order:999)-(S.stagesById[c.stage_id]?S.stagesById[c.stage_id].sort_order:999));
      S.stByItem[it.id]=rows;
      const done=rows.filter(r=>activeStageIds.includes(r.stage_id)&&(r.status==='completed'||r.status==='skipped')).length;
      const inprog=rows.some(r=>activeStageIds.includes(r.stage_id)&&r.status==='in_progress')?0.5:0;
      it.progress = activeStageIds.length? Math.min(1,(done+inprog)/activeStageIds.length):0;
      const maxUpd = rows.reduce((m,r)=>r.updated_at>m?r.updated_at:m, it.updated_at||it.created_at||'');
      it.lastUpdate = maxUpd;
    });
    p.progress = p.items.length ? p.items.reduce((s,i)=>s+i.progress,0)/p.items.length : 0;
  });

  S.comments = cm.data||[]; S.commentsByItem={};
  S.comments.forEach(c=>{ (S.commentsByItem[c.item_id]=S.commentsByItem[c.item_id]||[]).push(c); });
  S.photos = ph.data||[]; S.photosByItem={};
  S.photos.forEach(x=>{ (S.photosByItem[x.item_id]=S.photosByItem[x.item_id]||[]).push(x); });
  S.docsByPo={};
  (dc.data||[]).forEach(d=>{ (S.docsByPo[d.po_id]=S.docsByPo[d.po_id]||[]).push(d); });
  S.readMarks={};
  (rm.data||[]).forEach(r=>{ if(r.user_id===uid()) S.readMarks[r.item_id]=r.last_read_at; });
  S.activity = ac.data||[];
  S.profilesAll = pr.data||[];
  S.lastLoad = Date.now();
}

function unreadCount(itemId){
  const mark = S.readMarks[itemId] || '1970-01-01';
  return (S.commentsByItem[itemId]||[]).filter(c=>c.author_id!==uid() && c.created_at>mark).length;
}
function pendingApprovals(){
  const out=[];
  S.items.forEach(it=>{
    (S.stByItem[it.id]||[]).forEach(r=>{
      if(r.approval==='requested') out.push({item:it, row:r, stage:S.stagesById[r.stage_id]});
    });
  });
  return out;
}
function itemsWithUnread(){ return S.items.filter(it=>unreadCount(it.id)>0); }

async function signedUrl(path){
  const c=S.urlCache[path];
  if(c && c.exp>Date.now()) return c.url;
  const {data,error} = await sb.storage.from(CONFIG.bucket).createSignedUrl(path, 3600);
  if(error||!data) return '';
  S.urlCache[path]={url:data.signedUrl, exp:Date.now()+50*60*1000};
  return data.signedUrl;
}
async function hydrateImages(root){
  const nodes=(root||document).querySelectorAll('[data-ph-path]');
  for(const n of nodes){
    const p=n.getAttribute('data-ph-path');
    const u=await signedUrl(p);
    if(!u) continue;
    if(n.tagName==='IMG') n.src=u; else n.style.backgroundImage='url('+u+')';
    n.setAttribute('data-ph-url', u);
  }
}

async function resizeImage(file, maxDim, quality){
  maxDim=maxDim||1600; quality=quality||0.82;
  try{
    const bmp=await createImageBitmap(file);
    const scale=Math.min(1, maxDim/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*scale), h=Math.round(bmp.height*scale);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h);
    const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',quality));
    return blob||file;
  }catch(e){ return file; }
}

function trackerUrl(){
  return (S.settings && S.settings.tracker_url) || (location.origin+location.pathname);
}
async function refresh(){ try{ await loadData(); render(); }catch(e){ console.error(e); } }
</script>

  if(row.status==='completed') h+='<button class="btn sm" onclick="setStage(\''+it.id+'\','+st.id+',\'in_progress\')">Reopen</button>';
  h+='<button class="btn sm" onclick="pickPhotos(\''+it.id+'\','+st.id+')">+ Photos</button>';
  h+='<button class="btn sm" onclick="mNote(\''+it.id+'\','+st.id+')">Note</button>';
  if(row.approval==='none'||row.approval==='approved') h+='<button class="btn sm" onclick="requestApproval(\''+it.id+'\','+st.id+',true)">Ask approval</button>';
  h+='</div>';
  return h;
}

function vItem(id){
  const it=S.itemsById[id];
  if(!it){ $('app').innerHTML='<div class="empty">Item not found.</div>'; return; }
  const p=it.po;
  let h='<div class="row" style="margin-top:14px"><button class="btn sm" onclick="go(\'#/po/'+p.id+'\')">← '+esc(p.po_number)+'</button></div>';
  h+='<div class="card"><div class="row"><div style="flex:1"><div class="item-name" style="font-size:18px">'+esc(it.product)+(it.qty>1?' <span class="meta">× '+(+it.qty)+' '+esc(it.unit||'pcs')+'</span>':'')+'</div>'+
    '<div class="item-sub">'+esc([it.stone,it.finish].filter(Boolean).join(' · '))+'</div>'+
    (dimsOf(it)?'<div class="item-sub">'+esc(dimsOf(it))+'</div>':'')+
    (it.target_date?'<div class="item-sub">Target: '+fdate(it.target_date)+'</div>':'')+
    (it.description?'<div class="sub mt8">'+esc(it.description)+'</div>':'')+
    '</div><div>'+statusChip(it)+'</div></div>'+
    '<div class="row mt8"><div class="pbar" style="flex:1"><i style="width:'+Math.round(it.progress*100)+'%"></i></div><span class="meta">'+Math.round(it.progress*100)+'%</span></div>'+
    (isAdmin()?'<div class="btnrow"><button class="btn sm" onclick="mItem(\''+p.id+'\',\''+it.id+'\')">Edit item</button>'+
      '<button class="btn sm wa" onclick="waItem(\''+it.id+'\')">WhatsApp update</button></div>':'')+
  '</div>';

  const rows=S.stByItem[it.id]||[];
  const rowByStage={}; rows.forEach(r=>rowByStage[r.stage_id]=r);
  let lastGrp=null;
  h+='<div class="tl">';
  const stages=S.stages.filter(s=>s.active||rowByStage[s.id]);
  stages.forEach((st,idx)=>{
    const row=rowByStage[st.id]||{status:'pending',approval:'none'};
    if(st.grp!==lastGrp){ h+='<div class="tl-grp">'+esc(st.grp||'')+'</div>'; lastGrp=st.grp; }
    const dotCls=row.status==='completed'?'done':row.status==='in_progress'?'now':row.status==='skipped'?'skip':'';
    const dates=row.status==='completed'?('Completed '+fdate(row.completed_at)):
      row.status==='in_progress'?('In progress since '+fdate(row.started_at)):
      row.status==='skipped'?'Skipped':row.status==='on_hold'?'On hold':'';
    const stagePhotos=(S.photosByItem[it.id]||[]).filter(x=>x.stage_id===st.id).length;
    const stageComments=(S.commentsByItem[it.id]||[]).filter(c=>c.stage_id===st.id).length;
    const open = row.status==='in_progress' || row.approval==='requested' || (window.__openStages&&window.__openStages[it.id+'-'+st.id]);
    h+='<div class="tl-row"><div class="tl-rail"><div class="tl-dot '+dotCls+'"></div>'+(idx<stages.length-1?'<div class="tl-line"></div>':'')+'</div>'+
      '<div class="tl-body">'+
      '<div class="tl-name" onclick="toggleStage(\''+it.id+'\','+st.id+')">'+esc(st.name)+
        (st.approval_gate?' <span class="chip c-amber" style="font-size:10px">Approval gate</span>':'')+
        '<span class="sp"></span>'+
        (stagePhotos?'<span class="meta">📷 '+stagePhotos+'</span>':'')+
        (stageComments?'<span class="meta">💬 '+stageComments+'</span>':'')+
        '<span class="tl-date">'+dates+'</span></div>'+
      (open?
        ((st.description&&!isAdmin())?'<div class="tl-desc">'+esc(st.description)+'</div>':'')+
        (row.note?'<div class="tl-note">'+esc(row.note)+'</div>':'')+
        approvalBlock(it,row,st)+
        photoGrid(it.id, st.id, isAdmin())+
        adminStageControls(it,row,st)+
        commentsBlock(it, st.id)
      :'')+
      '</div></div>';
  });
  h+='</div>';
  h+='<div style="height:30px"></div>';
  $('app').innerHTML=h;
  hydrateImages();
  markRead(it.id);
}

function vActivity(){
  let h='<div class="sect" style="margin-top:18px">Activity</div><div class="card">';
  if(!S.activity.length) h+='<div class="empty">Nothing yet.</div>';
  else h+=S.activity.map(actRow).join('');
  h+='</div>';
  $('app').innerHTML=h;
}

function vBuyers(){
  if(!isAdmin()) return vHome();
  let h='<div class="row" style="margin-top:16px"><div class="sect" style="margin:0">Buyers & logins</div><span class="sp"></span>'+

      '<button class="btn sm" onclick="mBuyer(\''+b.id+'\')">Edit</button></div>'+
      '<div class="meta mt8">'+esc([b.contact_name,b.city,b.phone?('WhatsApp '+b.phone):'',b.email].filter(Boolean).join(' · '))+'</div>'+
      '<div class="rule"></div><div class="meta"><b>Logins</b></div>'+
      (logins.length?logins.map(l=>'<div class="row mt8"><span>'+esc(l.email)+'</span><span class="sp"></span>'+
        '<button class="btn sm" onclick="mResetPw(\''+l.user_id+'\',\''+esc(l.email)+'\')">Reset password</button>'+
        '<button class="btn sm dgr" onclick="delLogin(\''+l.user_id+'\',\''+esc(l.email)+'\')">Remove</button></div>').join(''):
        '<div class="sub mt8">No login yet — the buyer cannot sign in.</div>')+
      '<div class="btnrow"><button class="btn sm" onclick="mNewLogin(\''+b.id+'\')">+ Create login</button></div>'+
    '</div>';
  });
  const admins=S.profilesAll.filter(x=>x.role==='admin');
  h+='<div class="card"><div class="row"><b>Admin logins</b><span class="sp"></span><button class="btn sm" onclick="mNewLogin(null)">+ Add admin</button></div>'+
    admins.map(l=>'<div class="row mt8"><span>'+esc(l.email)+'</span><span class="sp"></span>'+
      (l.user_id!==uid()?'<button class="btn sm" onclick="mResetPw(\''+l.user_id+'\',\''+esc(l.email)+'\')">Reset password</button>':'<span class="chip c-grey">you</span>')+'</div>').join('')+
  '</div>';
  $('app').innerHTML=h;
}

function vSettings(){
  if(!isAdmin()) return vHome();
  const s=S.settings||{};
  let h='<div class="sect" style="margin-top:18px">Settings</div>'+
  '<div class="card">'+
    '<label>Company name</label><input id="set-name" value="'+esc(s.company_name||'')+'">'+
    '<label>Tagline</label><input id="set-tag" value="'+esc(s.tagline||'')+'">'+
    '<label>Your WhatsApp number (with country code, e.g. 9198xxxxxxxx)</label><input id="set-wa" value="'+esc(s.admin_whatsapp||'')+'" inputmode="numeric">'+
    '<label>Tracker link (used in WhatsApp messages)</label><input id="set-url" value="'+esc(s.tracker_url||'')+'" placeholder="'+esc(location.origin+location.pathname)+'">'+
    '<div class="btnrow"><button class="btn pri" onclick="saveSettings()">Save</button></div>'+
  '</div>';
  h+='<div class="card"><div class="row"><b>Stages</b><span class="sp"></span><button class="btn sm" onclick="addStage()">+ Add stage</button></div>'+
    '<div class="note-sm mt8">Renaming applies everywhere. New stages apply to newly created items. Approval gate stages ask the buyer to sign off.</div>'+
    '<div class="tblwrap"><table class="tbl"><tr><th></th><th>Name</th><th>Group</th><th>Gate</th><th>Active</th><th></th></tr>'+
    S.stages.map((st,i)=>'<tr>'+
      '<td style="white-space:nowrap"><button class="btn sm" '+(i===0?'disabled':'')+' onclick="moveStage('+st.id+',-1)">↑</button> <button class="btn sm" '+(i===S.stages.length-1?'disabled':'')+' onclick="moveStage('+st.id+',1)">↓</button></td>'+
      '<td><input value="'+esc(st.name)+'" onchange="updStage('+st.id+',{name:this.value})" style="min-width:150px"></td>'+
      '<td><input value="'+esc(st.grp||'')+'" onchange="updStage('+st.id+',{grp:this.value})" style="min-width:100px"></td>'+
      '<td class="center"><input type="checkbox" '+(st.approval_gate?'checked':'')+' onchange="updStage('+st.id+',{approval_gate:this.checked})" style="width:auto"></td>'+
      '<td class="center"><input type="checkbox" '+(st.active?'checked':'')+' onchange="updStage('+st.id+',{active:this.checked})" style="width:auto"></td>'+
      '<td class="meta">'+esc(st.key)+'</td>'+
    '</tr>').join('')+'</table></div></div>';
  h+='<div class="card"><b>Housekeeping</b><div class="note-sm mt8">The demo buyer and its sample POs can be removed once your real data is in: open Buyers & logins → Demo Buyer Co. → Edit → Delete buyer. Deleting a buyer removes its POs, items, photos and comments.</div></div>';
  $('app').innerHTML=h;
}

function vImport(){
  if(!isAdmin()) return vHome();
  let h='<div class="sect" style="margin-top:18px">Import order lines</div>'+
  '<div class="card">'+
    '<div class="sub">Paste CSV rows or choose a .csv file. Columns (header row required):<br>'+
    '<code style="font-size:12px">po_number, po_date, product, stone, finish, qty, unit, l_mm, w_mm, h_mm, dims_text, target_date, notes</code><br>'+
    'Only <b>po_number</b> and <b>product</b> are compulsory. POs that do not exist yet are created automatically.</div>'+
    '<label>Buyer</label><select id="imp-buyer">'+S.buyers.map(b=>'<option value="'+b.id+'"'+(S.buyerFilter===b.id?' selected':'')+'>'+esc(b.company)+'</option>').join('')+'</select>'+
    '<label>CSV</label><textarea id="imp-csv" rows="8" placeholder="po_number,product,qty..."></textarea>'+
    '<div class="btnrow"><input type="file" id="imp-file" accept=".csv,text/csv" style="display:none" onchange="impFile(this)">'+
    '<button class="btn" onclick="$(\'imp-file\').click()">Choose file</button>'+
    '<button class="btn pri" onclick="impPreview()">Preview import</button></div>'+
    '<div id="imp-out"></div>'+
  '</div>';
  $('app').innerHTML=h;
}

function render(){
  if(!S.ready) return;
  if(!S.session){ vLogin(); return; }
  if(!S.profile){
    $('hdr').style.display='none';
    $('app').innerHTML='<div class="login"><div class="brand"><div class="bw">GUJRAJ IMPEX</div><div class="bt">Order Tracker</div></div>'+
      '<div class="card center">This login has no access yet.<br>Please contact Gujraj Impex.<div class="btnrow" style="justify-content:center"><button class="btn" onclick="signOut()">Sign out</button></div></div></div>';
    return;
  }
  updateHeader();
  const hash=location.hash||'#/home';
  const parts=hash.slice(2).split('/');
  window.scrollTo(0,0);
  if(parts[0]==='po' && parts[1]) vPO(parts[1]);
  else if(parts[0]==='item' && parts[1]) vItem(parts[1]);
  else if(parts[0]==='buyers') vBuyers();
  else if(parts[0]==='settings') vSettings();
  else if(parts[0]==='activity') vActivity();
  else if(parts[0]==='import') vImport();
  else vHome();
}
</script>
<script>
'use strict';
window.__openStages={};
function toggleStage(itemId, stageId){
  const k=itemId+'-'+stageId;
  window.__openStages[k]=!window.__openStages[k];
  render();
}

async function doLogin(){
  const email=$('li-email').value.trim(), pass=$('li-pass').value;
  if(!email||!pass) return;
  $('loading').style.display='flex';
  const {error} = await sb.auth.signInWithPassword({email, password:pass});
  if(error){ $('loading').style.display='none'; vLogin(error.message==='Invalid login credentials'?'Incorrect email or password.':error.message); return; }
}
async function signOut(){ await sb.auth.signOut(); location.hash='#/home'; }

function setBuyerFilter(v){ S.buyerFilter=v; refreshHard(); }
async function refreshHard(){ $('loading').style.display='flex'; try{ await loadData(); }catch(e){ toast('Could not refresh: '+(e.message||e), {err:true}); }
  $('loading').style.display='none'; render(); }

async function markRead(itemId){
  if(unreadCount(itemId)===0 && S.readMarks[itemId]) return;
  try{ await sb.rpc('bt_mark_read', {p_item:itemId}); S.readMarks[itemId]=new Date().toISOString(); updateHeader(); }catch(e){}
}

async function sendComment(itemId, stageId){
  const ta=$('cmt-'+stageId); if(!ta) return;
  const body=ta.value.trim(); if(!body){ toast('Write a comment first'); return; }
  const attach=window.__cmtAttach && window.__cmtAttach.key===itemId+'-'+stageId ? window.__cmtAttach.path : null;
  const {error} = await sb.from('bt_comments').insert({
    item_id:itemId, stage_id:stageId, author_id:uid(),
    author_role:isAdmin()?'admin':'buyer',
    author_name:S.profile.full_name||S.profile.email||'',
    body, attachment_path:attach
  });
  if(error){ toast('Could not send: '+error.message, {err:true}); return; }
  window.__cmtAttach=null;
  window.__openStages[itemId+'-'+stageId]=true;
  await loadData(); render();
  if(isAdmin()){
    const it=S.itemsById[itemId];
    offerWhatsApp(it, 'New note on '+it.product+' ('+(it.po?it.po.po_number:'')+'): '+body);
  }
}

async function attachToComment(itemId, stageId){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async ()=>{
    const f=inp.files[0]; if(!f) return;
    toast('Uploading photo…');
    const blob=await resizeImage(f);
    const buyerId=isAdmin()?(S.itemsById[itemId].po.buyer_id):(S.profile.buyer_id);
    const path=buyerId+'/comments/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
    const {error}=await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
    if(error){ toast('Upload failed: '+error.message,{err:true}); return; }
    window.__cmtAttach={key:itemId+'-'+stageId, path};
    toast('Photo attached — it will be sent with your comment.');
  };
  inp.click();
}

async function respondApproval(itemId, stageId, decision){
  let note=null;
  if(decision==='changes_requested'){ note=prompt('What changes are needed?'); if(note===null) return; }
  const {error}=await sb.rpc('bt_respond_approval',{p_item:itemId,p_stage:stageId,p_decision:decision,p_note:note});
  if(error){ toast(error.message,{err:true}); return; }
  toast(decision==='approved'?'Approved. Thank you!':'Sent to the workshop.');
  await loadData(); render();
}
async function requestApproval(itemId, stageId, on){
  let note=null;
  if(on){ note=prompt('Note for the buyer (optional):','Please review and approve.'); if(note===null) return; }
  const {error}=await sb.rpc('bt_request_approval',{p_item:itemId,p_stage:stageId,p_on:on,p_note:note});
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
  if(on){
    const it=S.itemsById[itemId]; const st=S.stagesById[stageId];
    offerWhatsApp(it, waMsgApproval(it, st));
  }
}

async function advance(itemId, stageId, complete){
  const {error}=await sb.rpc('bt_advance',{p_item:itemId,p_stage:stageId,p_date:today(),p_complete:complete});
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
  const it=S.itemsById[itemId]; const st=S.stagesById[stageId];
  offerWhatsApp(it, waMsgStage(it, st, complete));
}
async function setStage(itemId, stageId, status){
  const row=(S.stByItem[itemId]||[]).find(r=>r.stage_id===stageId)||{};
  const {error}=await sb.rpc('bt_stage_set',{p_item:itemId,p_stage:stageId,p_status:status,
    p_started:row.started_at||today(), p_completed:status==='completed'?(row.completed_at||today()):null, p_note:row.note||null});
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
}
function mNote(itemId, stageId){
  const row=(S.stByItem[itemId]||[]).find(r=>r.stage_id===stageId)||{};
  const m=modal('<h3>Stage note</h3><div class="sub">Visible to the buyer on the timeline.</div>'+
    '<label>Note</label><textarea id="nt" rows="3">'+esc(row.note||'')+'</textarea>'+
    '<div class="btnrow"><button class="btn pri" id="nt-save">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>');
  m.m.querySelector('#nt-save').onclick=async ()=>{
    const {error}=await sb.rpc('bt_stage_set',{p_item:itemId,p_stage:stageId,p_status:row.status||'pending',
      p_started:row.started_at, p_completed:row.completed_at, p_note:$('nt').value.trim()||null});
    if(error){ toast(error.message,{err:true}); return; }
    closeModal(); await loadData(); render();
  };
}

function pickPhotos(itemId, stageId){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange=async ()=>{
    const files=[...inp.files]; if(!files.length) return;
    toast('Uploading '+files.length+' photo'+(files.length>1?'s':'')+'…');
    const it=S.itemsById[itemId];
    const stKey=(S.stagesById[stageId]||{}).key||'stage';
    let ok=0;
    for(let i=0;i<files.length;i++){
      const blob=await resizeImage(files[i]);
      const path=it.po.buyer_id+'/items/'+itemId+'/'+stKey+'-'+Date.now()+'-'+i+'.jpg';
      const up=await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
      if(up.error){ toast('Upload failed: '+up.error.message,{err:true}); continue; }
      const ins=await sb.from('bt_photos').insert({item_id:itemId, stage_id:stageId, path, uploaded_by:uid()});
      if(!ins.error) ok++;
    }
    window.__openStages[itemId+'-'+stageId]=true;
    await loadData(); render();
    if(ok) toast(ok+' photo'+(ok>1?'s':'')+' added');
  };
  inp.click();
}
async function delPhoto(ev, id, path){
  ev.stopPropagation();
  if(!confirm('Delete this photo?')) return;
  await sb.from('bt_photos').delete().eq('id', id);
  await sb.storage.from(CONFIG.bucket).remove([path]);
  await loadData(); render();
}
async function openPhoto(ev, node){
  if(ev) ev.stopPropagation();
  const u=node.getAttribute('data-ph-url')||await signedUrl(node.getAttribute('data-ph-path'));
  if(u) lightbox(u, node.getAttribute('data-cap')||'');
}
async function openDoc(path){
  const u=await signedUrl(path);
  if(u) window.open(u, '_blank');
}
function pickDoc(poId){
  const inp=document.createElement('input'); inp.type='file';
  inp.onchange=async ()=>{
    const f=inp.files[0]; if(!f) return;
    const p=S.posById[poId];
    toast('Uploading…');
    const clean=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=p.buyer_id+'/po/'+poId+'/'+Date.now()+'-'+clean;
    const up=await sb.storage.from(CONFIG.bucket).upload(path, f, {contentType:f.type||'application/octet-stream'});
    if(up.error){ toast('Upload failed: '+up.error.message,{err:true}); return; }
    const type=prompt('Document type (e.g. PO copy, Proforma invoice, Packing list, Invoice, BL/LR):','')||null;
    await sb.from('bt_documents').insert({po_id:poId, name:f.name, doc_type:type, path, uploaded_by:uid()});
    await loadData(); render();
  };
  inp.click();
}
async function delDoc(id, path){
  if(!confirm('Remove this document?')) return;
  await sb.from('bt_documents').delete().eq('id', id);
  await sb.storage.from(CONFIG.bucket).remove([path]);
  await loadData(); render();
}

/* ---------- WhatsApp ---------- */
function waMsgStage(it, st, complete){
  const po=it.po?it.po.po_number:'';
  return (S.settings.company_name||'Gujraj Impex')+' — order update\n'+
    it.product+(it.qty>1?' ×'+(+it.qty):'')+' ('+po+')\n'+
    (complete?'✔ Completed: ':'▶ Now at: ')+st.name+' — '+fdate(today())+'\n'+
    'Track all your orders: '+trackerUrl();
}
function waMsgApproval(it, st){
  return (S.settings.company_name||'Gujraj Impex')+' — approval requested\n'+
    it.product+' ('+(it.po?it.po.po_number:'')+') is ready for your review at '+st.name+'.\n'+
    'Please open the tracker to approve: '+trackerUrl();
}
function offerWhatsApp(it, text){
  const b=it&&it.po?S.buyersById[it.po.buyer_id]:null;
  toast('Updated.', {action:'WhatsApp ▸', onAction:()=>window.open(waLink(b&&b.phone, text),'_blank')});
}
function waItem(itemId){
  const it=S.itemsById[itemId]; const st=S.stagesById[it.current_stage_id]||{name:''};
  const b=S.buyersById[it.po.buyer_id];
  window.open(waLink(b&&b.phone, waMsgStage(it, st, false)),'_blank');
}
function waPO(poId){
  const p=S.posById[poId]; const b=S.buyersById[p.buyer_id];
  let lines=p.items.map(it=>{ const st=S.stagesById[it.current_stage_id]; return '• '+it.product+(it.qty>1?' ×'+(+it.qty):'')+' — '+(st?st.name:''); });
  const text=(S.settings.company_name||'Gujraj Impex')+' — status of '+p.po_number+' ('+fdate(today())+')\n'+lines.join('\n')+'\nDetails: '+trackerUrl();
  window.open(waLink(b&&b.phone, text),'_blank');
}

/* ---------- PO / item CRUD ---------- */
function mNewPO(){
  const m=modal('<h3>New purchase order</h3>'+
    '<label>Buyer</label><select id="po-buyer">'+S.buyers.filter(b=>b.active).map(b=>'<option value="'+b.id+'"'+(S.buyerFilter===b.id?' selected':'')+'>'+esc(b.company)+'</option>').join('')+'</select>'+
    '<div class="grid2"><div><label>PO number</label><input id="po-num"></div><div><label>PO date</label><input id="po-date" type="date" value="'+today()+'"></div></div>'+
    '<label>Project / reference</label><input id="po-proj">'+
    '<label>Expected ship date</label><input id="po-esd" type="date">'+
    '<label>Notes (visible to buyer)</label><textarea id="po-notes" rows="2"></textarea>'+

async function adminApi(body){
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(CONFIG.url+'/functions/v1/admin-api',{method:'POST',

    body:JSON.stringify(body)});
  const out=await res.json().catch(()=>({}));
  if(!res.ok||out.error) throw new Error(out.error||('HTTP '+res.status));
  return out;
}

/* ---------- import ---------- */
function impFile(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ $('imp-csv').value=String(r.result); };
  r.readAsText(f);
}
function impPreview(){
  const text=$('imp-csv').value.trim();
  if(!text){ toast('Paste CSV first',{err:true}); return; }
  const rows=csvParse(text);
  if(rows.length<2){ toast('Need a header row and at least one data row',{err:true}); return; }
  const hdr=rows[0].map(x=>x.trim().toLowerCase());
  const need=['po_number','product'];
  for(const n of need){ if(hdr.indexOf(n)<0){ toast('Missing column: '+n,{err:true}); return; } }
  const recs=rows.slice(1).map(r=>{ const o={}; hdr.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o; }).filter(o=>o.po_number&&o.product);
  const pos=[...new Set(recs.map(r=>r.po_number))];
  $('imp-out').innerHTML='<div class="attn" style="cursor:default">'+recs.length+' item lines across '+pos.length+' PO(s): '+pos.map(esc).join(', ')+
    '</div><div class="btnrow"><button class="btn pri" onclick="impCommit()">Import now</button></div>';
  window.__impRecs=recs;
}
async function impCommit(){
  const recs=window.__impRecs||[]; if(!recs.length) return;
  const buyerId=$('imp-buyer').value;
  $('loading').style.display='flex';
  try{
    const byPo={};
    for(const r of recs){ (byPo[r.po_number]=byPo[r.po_number]||[]).push(r); }
    for(const poNum of Object.keys(byPo)){
      let po=S.pos.find(p=>p.buyer_id===buyerId && p.po_number===poNum);
      if(!po){
        const first=byPo[poNum][0];
        const ins=await sb.from('bt_purchase_orders').insert({buyer_id:buyerId, po_number:poNum, po_date:first.po_date||today()}).select().single();
        if(ins.error) throw ins.error;
        po=ins.data; po.items=[];
      }
      let line=(po.items||[]).reduce((m,i)=>Math.max(m,i.line_no||0),0);
      for(const r of byPo[poNum]){
        line++;
        const ins=await sb.from('bt_order_items').insert({po_id:po.id, line_no:line, product:r.product,
          stone:r.stone||null, finish:r.finish||null, qty:Number(r.qty)||1, unit:r.unit||'pcs',
          l_mm:r.l_mm?Number(r.l_mm):null, w_mm:r.w_mm?Number(r.w_mm):null, h_mm:r.h_mm?Number(r.h_mm):null,
          dims_text:r.dims_text||null, target_date:r.target_date||null, notes:r.notes||null});
        if(ins.error) throw ins.error;
      }
    }
    await loadData();
    $('loading').style.display='none';
    toast('Imported '+recs.length+' items.');
    go('#/home');
  }catch(e){
    $('loading').style.display='none';
    toast('Import failed: '+(e.message||e),{err:true});
  }
}
</script>
<script>
'use strict';
async function boot(){
  if(!sb) return;
  const {data:{session}} = await sb.auth.getSession();
  S.session=session;
  if(session){
    try{ await loadCore(); if(S.profile) await loadData(); }
    catch(e){ console.error(e); toast('Could not load data: '+(e.message||e),{err:true}); }
  }
  S.ready=true;
  $('loading').style.display='none';
  render();

  sb.auth.onAuthStateChange(async (event, sess)=>{
    const had=!!S.session;
    S.session=sess;
    if(event==='SIGNED_IN' && sess && !S.profile){
      try{ await loadCore(); if(S.profile) await loadData(); }
      catch(e){ console.error(e); }
      $('loading').style.display='none';
      render();
    }
    if(event==='SIGNED_OUT'){ S.profile=null; S.pos=[]; S.items=[]; render(); }
  });

  window.addEventListener('hashchange', render);
  setInterval(()=>{
    if(S.session && S.profile && document.visibilityState==='visible' && Date.now()-S.lastLoad>55000) refresh();
  }, 60000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && S.session && S.profile && Date.now()-S.lastLoad>30000) refresh();
  });
}
document.addEventListener('DOMContentLoaded', boot);
</script>
