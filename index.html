// Every open order with its position, promise, evidence and money in one row.
function portfolioRows(){
  const conf={}; deliveryConfidence().forEach(c=>{ conf[c.po.id]=c; });
  return (S.pos||[]).filter(p=>p.status!=='cancelled'&&p.status!=='completed').map(p=>{
    const items=(p.items&&p.items.length)?p.items:(S.items||[]).filter(i=>i.po_id===p.id);
    const prog=items.length?items.reduce((a,i)=>a+i.progress,0)/items.length:0;
    const stage=items.map(i=>curStage(i)).filter(Boolean)
      .sort((a,b)=>a.sort_order-b.sort_order)[0];
    // the newest evidence on any piece of this order
    let ev=null;
    items.forEach(it=>{
      (S.updByItem[it.id]||[]).forEach(u=>{ if(!ev||String(u.work_date)>String(ev.work_date)) ev=u; });
    });
    const evToday = items.some(it=>(S.updByItem[it.id]||[]).some(u=>u.work_date===today()));
    const inv=(S.invoices||[]).filter(i=>i.po_id===p.id).reduce((a,i)=>a+(+i.total||0),0);
    const pay=(S.payByPo&&S.payByPo[p.id]||[]).reduce((a,c)=>a+(+c.amount||0),0);
    const val=(p.amount_total!=null?+p.amount_total:inv);
    const bal=Math.max(0,(inv||val)-pay);
    const c=conf[p.id]||{level:0,label:'On track',why:[]};
    return { po:p, items, prog, stage, ev, evToday, val, pay, bal,
             level:c.level, health:c.label, why:c.why,
             days: p.expected_ship_date?daysUntil(p.expected_ship_date):null };
  }).sort((a,b)=>b.level-a.level || String(a.po.expected_ship_date||'9').localeCompare(String(b.po.expected_ship_date||'9')));
}

// The five things the alert strip carries, each one a real count.
function commandAlerts(){
  const q=queueCounts();
  const held=heldStages();
  const uc=updateCompliance();
  const openQ=(S.comments||[]).filter(c=>c.author_role==='buyer'&&!c.resolved_at);
  const ag=receivableAgeing();
  const overdue=ag.buckets.slice(1).reduce((a,b)=>a+b.v,0);
  return [
    { k:'Production block', v:String(held.length),
      s:held.length?(held[0].item.product+((held[0].hold&&held[0].hold.hold_reason)?(' · '+held[0].hold.hold_reason):'')):'Nothing held',
      warn:held.length>0, run:"go('#/production/blocked')" },

  people.forEach(p=>{ p.pct=Math.round((p.n/max)*100); });
  return { pct: active.length?Math.round((covered/active.length)*100):0,

/* ---------------------------------------------------------------------------
   Dispatch readiness.

   Pieces are made one at a time; an order ships once every piece on it is made,
   packed and paid for. So a piece never carries a shipping state — it carries a
   production state — and the order carries dispatch.

   This mirrors bt_po_readiness() in the database exactly. The database function
   is the authority when dispatch is actually recorded; this one exists so the
   screens can show readiness without a round trip per order. test/run.js asserts
   the two agree, so they cannot drift apart quietly.
--------------------------------------------------------------------------- */

const DISPATCH_LABEL={
  in_production:'In production', ready_to_pack:'Ready to pack', packed:'Packed',
  dispatched:'Dispatched', delivered:'Delivered'
};

// A piece is "made" when its last active stage — Final Photographs — is complete.
function pieceIsMade(it){
  const active=S.stages.filter(s=>s.active);
  const last=active[active.length-1];
  if(!last) return false;
  const row=(S.stByItem[it.id]||[]).find(r=>r.stage_id===last.id);
  return !!(row && row.status==='completed');
}

function poReadiness(po){
  const items=(po.items&&po.items.length)?po.items:(S.items||[]).filter(i=>i.po_id===po.id);
  const active=S.stages.filter(s=>s.active);
  const activeIds=active.map(s=>s.id);
  const made=items.filter(pieceIsMade).length;

  let pct=0;
  if(items.length){
    pct=Math.round(items.reduce((a,it)=>{
      const rows=(S.stByItem[it.id]||[]).filter(r=>activeIds.includes(r.stage_id));
      const done=rows.filter(r=>r.status==='completed'||r.status==='skipped').length;
      return a + (rows.length?done/rows.length:0);
    },0) / items.length * 100);
  }

  const decisions=items.reduce((a,it)=>
    a+(S.stByItem[it.id]||[]).filter(r=>r.approval==='requested').length, 0);
  const finalMissing=items.filter(it=>!pieceIsMade(it)).length;
  const packed=!!po.packed_at;
  const cleared=!!po.finance_cleared;
  const state=po.dispatch_state||'in_production';

  let blocker=null;
  if(!items.length)            blocker='No products on this order yet';
  else if(made<items.length)   blocker=(items.length-made)+' of '+items.length+' pieces still in production';
  else if(decisions>0)         blocker=decisions+' decision'+(decisions===1?'':'s')+' waiting on the buyer';
  else if(finalMissing>0)      blocker='Final photographs not done on '+finalMissing+' piece'+(finalMissing===1?'':'s');
  else if(!packed)             blocker='Not packed yet';
  else if(!cleared)            blocker='Payment for this order is not cleared';

  // the five things that must all be true, in the order they happen.
  // An order with nothing on it has passed nothing: "no decisions outstanding"
  // is trivially true on an empty order and reads as progress that has not
  // happened, so on an empty order every check stays unlit.
  const empty=!items.length;
  const steps=[
    {k:'Production',        ok:made===items.length && items.length>0,
     v:items.length?(made+' of '+items.length+' pieces made'):'No pieces yet'},
    {k:'Buyer decisions',   ok:!empty && decisions===0,
     v:empty?'—':(decisions?(decisions+' waiting'):'None outstanding')},
    {k:'Final photographs', ok:finalMissing===0 && items.length>0,
     v:empty?'—':(finalMissing?('missing on '+finalMissing):'Complete')},
    {k:'Packing',           ok:!empty && packed, v:empty?'—':(packed?('Packed '+fdate(po.packed_at)):'Not started')},
    {k:'Payment cleared',   ok:!empty && cleared, v:empty?'—':(cleared?'Cleared':'Awaiting clearance')}
  ];

  return { items, pieces:items.length, made, pct, decisions, finalMissing,
           packed, cleared, state, stateLabel:DISPATCH_LABEL[state]||state,
           shippable: !blocker, blocker, steps };
}

// Pieces finished since the buyer last looked — the "one piece is done" signal
// Yash asked for, which is separate from the order being shippable.
function piecesMadeOn(po){
  const r=poReadiness(po);
  return r.items.filter(pieceIsMade);
}

function attentionRows(){
  const rows=[];
  if(isAdmin()){
    const np=pendingPhotos().length;
    if(np) rows.push(attentionItem('i-camera','Photos awaiting your approval',
      'The client cannot see them until you approve', np, "go('#/production/photos')"));
  }
  const appr=pendingApprovals();
  if(appr.length){
    if(isAdmin()) rows.push(attentionItem('i-check','Waiting on buyer sign-off',
      appr.slice(0,2).map(a=>a.item.product).join(', ')+(appr.length>2?'…':''), appr.length, "go('#/item/"+appr[0].item.id+"')"));
    else appr.forEach(a=>rows.push(attentionItem('i-check','Your approval is requested',
      a.item.product+' — '+(a.stage?a.stage.name:''), '', "go('#/item/"+a.item.id+"')")));
  }
  const unread=itemsWithUnread();
  if(unread.length) rows.push(attentionItem('stage-selection','New comments',
    unread.slice(0,2).map(it=>it.product).join(', ')+(unread.length>2?'…':''),
    unread.reduce((a,it)=>a+unreadCount(it.id),0), "go('#/item/"+unread[0].id+"')"));
  const late=S.items.filter(it=>{ const l=lateness(it); return l&&l.state==='late'; });
  if(late.length) rows.push(attentionItem('stage-shipped','Past the planned date',
    late.slice(0,2).map(it=>it.product).join(', ')+(late.length>2?'…':''), late.length, "go('#/item/"+late[0].id+"')"));
  if(isAdmin()){

function poRail(activeId){

  const b=p=>S.buyersById[p.buyer_id];
  const cur=p=>{ const s=p.items.map(i=>curStage(i)).filter(Boolean).sort((a,c)=>a.sort_order-c.sort_order)[0]; return s?shortStage(s.name):'Not started'; };

/* ChatGPT's productionView from the final handoff: .prod-head, the five
   .prod-metric tiles, his .prod-filterbar and .prod-queue of .prod-row

const PROD_TYPES=[['all','All decisions'],['blocked','Work stopped'],['review','Review evidence'],

const PROD_LABEL={blocked:'Work stopped',review:'Review evidence',missing:'Missing record',

function productionFilters(){

function productionQueueRows(){

/* --------------------------------------------------- workshop floor (admin) */
/* ChatGPT's workshopView from the final handoff: the .workshop-banner, four
   .metric tiles, his search / status tabs / PO sort, and one <details
   class="po-group"> per purchase order holding .po-product-row cards.
   This is the OWNER's view of the floor, so it names the buyer and the order.
   The floor's own screens never do — that boundary is enforced in the database,
   and the staff views are built from STONEFLOW-WORKSHOP.html instead. */
function setWorkshopFilter(f){ window.__wsFilter=f; render(); }
function setWorkshopSort(v){ window.__wsSort=v; render(); }
function filterWorkshop(v){ window.__wsQuery=v; render(); }
function wsStatusOf(it){
  if((blockedItems()||[]).some(b=>b.item.id===it.id)) return 'blocked';
  const t=today();
  if(!(S.updByItem[it.id]||[]).some(u=>u.work_date===t)) return 'missing';
  const nx=(typeof nextAction==='function')?nextAction(it):null;
  if(nx && /advance|move|complete/i.test(nx.short||'')) return 'ready';
  return 'active';
}
function wsProducts(){
  const q=String(window.__wsQuery||'').toLowerCase().trim();
  const f=window.__wsFilter||'all';
  return (S.items||[]).filter(it=>it.status!=='delivered'&&it.status!=='cancelled')
    .filter(it=>{
      if(f!=='all' && wsStatusOf(it)!==f) return false;
      if(!q) return true;
      const po=S.posById[it.po_id]||{}, st=curStage(it);
      return [it.product,it.item_code,it.stone,po.po_number,po.project,st&&st.name]
        .filter(Boolean).join(' ').toLowerCase().indexOf(q)>=0;
    });
}
function wsGroups(){
  const sort=window.__wsSort||'po';
  const by={};
  wsProducts().forEach(it=>{ (by[it.po_id]=by[it.po_id]||[]).push(it); });
  const groups=Object.keys(by).map(id=>{
    const po=S.posById[id]||{};
    const all=(S.items||[]).filter(i=>i.po_id===id&&i.status!=='delivered'&&i.status!=='cancelled');
    const stones=[...new Set(by[id].map(i=>i.stone).filter(Boolean))];
    return {po, products:by[id].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)), all, stones};
  }).filter(g=>g.po.id);
  if(sort==='delivery') groups.sort((a,b)=>String(a.po.expected_ship_date||'9').localeCompare(String(b.po.expected_ship_date||'9')));
  else if(sort==='stone') groups.sort((a,b)=>String(a.stones[0]||'').localeCompare(String(b.stones[0]||'')));
  else groups.sort((a,b)=>String(b.po.po_date||'').localeCompare(String(a.po.po_date||'')));
  return groups;
}
function wsProductRow(it){
  const st=curStage(it);
  const active=S.stages.filter(s=>s.active);
  const n=st?active.findIndex(s=>s.id===st.id)+1:0;
  const img=targetImage(it);
  const b=S.buyersById[(S.posById[it.po_id]||{}).buyer_id]||{};
  const state=wsStatusOf(it);
  const last=(S.updByItem[it.id]||[])[0];
  const dot=state==='blocked'?'red':state==='missing'?'amber':'green';
  const label=state==='blocked'?'Work stopped':state==='missing'?'No record today'
    :state==='ready'?'Ready for the next stage':'Recorded today';

function selectClientAccount(id){ window.__client=id; render(); }
function filterClientAccounts(q){
  q=String(q||'').toLowerCase().trim();

    b.hidden = !!q && (b.getAttribute('data-search')||'').toLowerCase().indexOf(q)<0;

function clientInitials(n){
  const w=String(n||'').trim().split(/\s+/).filter(Boolean);
  return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase();
}
// What is open on this buyer's account, and nothing from anyone else's.
function clientActions(b){
  const out=[];
  const pos=(S.pos||[]).filter(p=>p.buyer_id===b.id);
  const ids=pos.map(p=>p.id);
  const mine=it=>ids.indexOf(it.po_id)>=0;
  (S.comments||[]).filter(c=>c.author_role==='buyer'&&!c.resolved_at&&S.itemsById[c.item_id]&&mine(S.itemsById[c.item_id]))
    .slice(0,2).forEach(c=>out.push(['warn','Question waiting on a reply',
      String(c.body||'').slice(0,70), 'Answer', "go('#/item/"+c.item_id+"')"]));
  const unsent=(S.updates||[]).filter(u=>(u.review_status==='approved'||u.review_status==='partially_approved')&&
    !u.published_at && S.itemsById[u.item_id] && mine(S.itemsById[u.item_id]));
  if(unsent.length) out.push(['warn', unsent.length+' approved update'+(unsent.length===1?'':'s')+' not published',
    'The buyer cannot see them until you publish', 'Publish', "go('#/production/review')"]);
  const waiting=pendingApprovals().filter(a=>mine(a.item));
  if(waiting.length) out.push(['', waiting.length+' decision'+(waiting.length===1?'':'s')+' with the buyer',
    waiting.map(a=>a.item.product).slice(0,2).join(', '), 'Open', "go('#/item/"+waiting[0].item.id+"')"]);
  if(!(S.profilesAll||[]).some(p=>p.buyer_id===b.id))
    out.push(['warn','No login for this company','They cannot sign in yet','Create login',"mNewLogin('"+b.id+"')"]);
  const fin=(S.invByBuyer[b.id]||[]).filter(i=>i.published_at);
  const st=statementStanding(latestStatement(b.id));
  if(st && !st.credit && +st.amount>0) out.push(['warn','Outstanding on the latest statement',
    money(st.amount,st.currency)+' as at '+fdate(st.as_of), 'Finance', "go('#/finance')"]);
  else if(!fin.length) out.push(['','No invoices posted yet','Nothing has been billed to this account','Finance',"go('#/finance')"]);
  if(!out.length) out.push(['good','Nothing open on this account','Every question answered and every update sent','Open',"go('#/clients')"]);
  return out;
}
function clientActivity(b){
  const ids=(S.pos||[]).filter(p=>p.buyer_id===b.id).map(p=>p.id);
  const mine=id=>{ const it=S.itemsById[id]; return it && ids.indexOf(it.po_id)>=0; };
  const out=[];
  (S.comments||[]).filter(c=>mine(c.item_id)).forEach(c=>out.push([
    (c.author_role==='buyer'?'Question from the buyer':'Reply sent'),
    (S.itemsById[c.item_id]||{}).product+' · '+String(c.body||'').slice(0,60), c.created_at]));
  (S.updates||[]).filter(u=>u.published_at&&mine(u.item_id)).forEach(u=>out.push([
    'Progress published', (S.itemsById[u.item_id]||{}).product+' · '+
      ((S.stagesById[u.stage_id]||{}).name||''), u.published_at]));
  (S.revisions||[]).forEach(r=>{
    const d=S.decisionByRev[r.id]; if(!d||!mine(r.item_id)) return;
    out.push([d.decision==='approved'?'Approved by the buyer':'Changes requested',
      (S.itemsById[r.item_id]||{}).product+' · '+(r.label||('R'+r.rev_no)), d.decided_at]);
  });
  return out.sort((a,b2)=>String(b2[2]).localeCompare(String(a[2]))).slice(0,6);
}

/* ChatGPT's reportsView shell from the final handoff: .report-head with its two

const REPORT_SECTIONS=[['overview','Overview'],['delivery','Orders & delivery'],
  ['production','Production'],['service','Client service'],['finance','Finance'],['activity','Audit log']];
function reportSection(){ return window.__repSec||'overview'; }
function setReportSection(k){

}
function reportPeriodBar(){
  const w=reportWindow();
  return '<div class="report-period" role="tablist" aria-label="Report period">'+
    [[1,'Today'],[7,'7 days'],[30,'30 days'],[90,'Quarter']].map(([n,label])=>

function vReports(tab){

  : sec==='activity'   ? vReportsActivity

function sfaTab(){ return window.__recTab||'overview'; }

// The five saved views his rail offers, each one a real count.
function sfaSavedViews(){
  const all=sfaOrders();
  const rows={}; portfolioRows().forEach(r=>{ rows[r.po.id]=r; });
  const att=all.filter(p=>{ const r=rows[p.id]; return r && (r.level>=1 || !r.evToday); });
  const risk=all.filter(p=>{ const r=rows[p.id]; return r && r.level>=2; });
  const buyer=all.filter(p=>pendingApprovals().some(a=>a.item.po_id===p.id));
  const ship=all.filter(p=>poReadiness(p).shippable);
  return [['all','All open',all],['attention','Needs attention',att],
          ['risk','At risk / late',risk],['buyer','Awaiting buyer',buyer],['ship','Ready to ship',ship]];

function sfaProductCards(p){
  const items=(p.items&&p.items.length)?p.items:(S.items||[]).filter(i=>i.po_id===p.id);
  if(!items.length) return '<div class="empty"><h2>No products on this order yet.</h2>'+

  return items.map(it=>{
    const img=targetImage(it);
    const st=curStage(it);
    const prog=Math.round((it.progress||0)*100);
    const att=itemAttention?itemAttention(it):null;
    const nx=(typeof nextAction==='function')?nextAction(it):null;
    const blocked=(blockedItems()||[]).some(b=>b.item.id===it.id);
    const status=blocked?'Reported blocked by the floor'
      :(att&&att.label)?att.label
      :(st?('At '+st.name):'Not started');
    return '<article class="po-product-card">'+
      '<button class="po-product-image" type="button" aria-label="Open '+esc(it.product)+'" '+
        'onclick="go(\'#/item/'+it.id+'\')">'+

        '<span>Target product</span></button>'+

          '<div><span>Progress</span><strong>'+prog+'%</strong></div></div>'+
        '<div class="po-product-progress"><i style="width:'+prog+'%"></i></div>'+
        '<p class="'+(blocked?'po-product-alert':'')+'" style="margin-top:8px">'+esc(status)+'</p>'+

function sfaOverview(p){

function sfaRecordContent(p){
  const t=sfaTab();
  const items=(p.items&&p.items.length)?p.items:(S.items||[]).filter(i=>i.po_id===p.id);
  if(t==='products') return sfaProductSection(p);
  if(t==='timeline'){
    const feed=[];
    items.forEach(it=>(S.updByItem[it.id]||[]).forEach(u=>feed.push({
      d:u.work_date, t:(S.stagesById[u.stage_id]||{}).name||'Update',
      s:it.product+' · '+(u.published_at?'published to the buyer':'not published yet'),
      ok:!!u.published_at })));
    feed.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
    return '<section class="card"><div class="card-head"><div>'+
      '<h2>'+esc(p.po_number)+' timeline</h2>'+
      '<p>Work, decisions and publications for this purchase order only.</p></div>'+
      sfaBadge(feed.length+' entr'+(feed.length===1?'y':'ies'))+'</div><div class="card-body">'+
      (feed.length?feed.slice(0,20).map(f=>'<div class="exception">'+
        '<span class="status-dot'+(f.ok?' green':'')+'"></span><div>'+
        '<strong>'+esc(f.t)+' recorded</strong><span>'+esc(fdate(f.d)+' · '+f.s)+'</span></div></div>').join('')
       :'<div class="empty"><p>Nothing recorded against this order yet.</p></div>')+
      '</div></section>';
  }
  if(t==='documents'){
    const docs=(S.docsByPo&&S.docsByPo[p.id])||[];
    return '<section class="card"><div class="card-head"><div>'+
      '<h2>'+esc(p.po_number)+' documents</h2>'+
      '<p>The PO file, current product drawings and the order’s own shipment records.</p></div>'+
      '<button class="button secondary small" type="button" onclick="pickDoc(\''+p.id+'\')">Upload</button></div>'+
      '<div class="card-body">'+
      (docs.length?docs.map(d=>'<div class="detail-row"><span>'+esc(d.name||'Document')+'</span>'+
        '<strong><button class="button quiet small" type="button" onclick="openDoc(\''+jsq(d.path)+'\')">Open</button></strong></div>').join('')
       :'<div class="empty"><p>No documents on this order yet.</p></div>')+
      '<div class="detail-row"><span>Current drawings</span><strong>'+
        items.filter(i=>i.drawing_path).length+' of '+items.length+'</strong></div>'+
      '</div></section>';
  }

// His flow draws twelve stages. Yash settled the workflow at nine on 29 August,
// so this walks the active stages — nine today — and would follow the setting if
// it ever changed. Naming a stage the workshop does not run is the bug this
// avoids, and a test guards it.
function ownerProductionFlow(){
  const active=S.stages.filter(s=>s.active);
  const items=(S.items||[]).filter(it=>it.status!=='delivered'&&it.status!=='cancelled');
  const at={}; items.forEach(it=>{ const st=curStage(it); if(st) at[st.id]=(at[st.id]||0)+1; });
  const flow=productionFlow();
  const cid=flow.constraint?flow.constraint.stage.id:null;
  return active.map((s,i)=>{
    const n=at[s.id]||0;
    return '<button class="owner-flow-stage '+(n?'active':'')+' '+(s.id===cid&&n?'warn':'')+'" type="button" '+
      'onclick="go(\'#/production\')" aria-label="'+esc(s.name)+': '+n+' active products">'+
      '<b>'+(i+1)+'</b><span>'+esc(s.name)+'</span>'+
      '<strong>'+n+' '+(n===1?'product':'products')+'</strong></button>';
  }).join('');
}

/* The whole fourteen-stage sequence on one line, so where a piece sits is read
   at a glance rather than counted down a list. A PO can hold several products at
   different stages, so this tracks the earliest one and says so. */
function stageStepper(p){
  const stages=(S.stages||[]).filter(s=>s.active).sort((a,b)=>a.sort_order-b.sort_order);
  if(!stages.length || !p.items.length) return '';
  const cur=p.items.map(i=>curStage(i)).filter(Boolean)
    .sort((a,c)=>a.sort_order-c.sort_order)[0];
  const at=cur?cur.sort_order:-1;
  // a step counts as done when every product on the order has passed it
  const doneFor=(st)=>p.items.every(it=>{
    const r=(S.stByItem[it.id]||[]).find(x=>x.stage_id===st.id);
    return r && (r.status==='completed'||r.status==='skipped');
  });
  const steps=stages.map((st,i)=>{
    const done=doneFor(st);
    const now=cur && st.id===cur.id;
    return '<li class="step'+(done?' step--done':'')+(now?' step--now':'')+'"'+(now?' aria-current="step"':'')+'>'+
      '<span class="step__dot">'+(done?icon('i-check','icon--sm'):(i+1))+'</span>'+
      '<span class="step__label">'+esc(shortStage(st.name))+'</span></li>';
  }).join('');
  const pos=stages.findIndex(st=>cur && st.id===cur.id);
  return '<section class="panel space-top-14"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Workshop journey</h3>'+
    '<p class="panel__description">All '+stages.length+' stages on the floor. '+
      (p.items.length>1?'Shown at the earliest of the '+p.items.length+' products.':'')+
    '</p></div>'+(cur?badge(cur.name):'')+'</div>'+
    '<div class="panel__body"><ol class="stepper">'+steps+'</ol>'+
    (cur?'<div class="stepper__foot"><div><strong>'+esc(cur.name)+'</strong>'+
      '<small>Stage '+(pos+1)+' of '+stages.length+'</small></div>'+
      '<button class="button button--secondary" type="button" onclick="go(\'#/item/'+
        (p.items.find(i=>i.current_stage_id===cur.id)||p.items[0]).id+'\')">Open current stage</button></div>':'')+
    '</div></section>';
}

        ' aria-selected="'+(tab===t[0]?'true':'false')+'"'+
        ' aria-controls="po-panel" tabindex="'+(tab===t[0]?'0':'-1')+'"'+
        ' onkeydown="poTabKey(event)" onclick="poTab(\''+t[0]+'\')">'+
        t[1]+(t[2]?' '+badge(t[2]+''):'')+'</button>').join('')+'</div>';

        // "Extras ₹30,500" tells nobody what the money is for, and a figure
        // without a reason is the thing that generates a telephone call. Each
        // charge is named on its own line instead.
        const charges = (S.chgByPo[p.id]||[]);

          .concat(charges.map(c=>[c.label, money(c.amount, c.currency||m.cur)]))

// How a piece was crated is the thing a buyer asks about when it arrives, so
// the packing and dispatch photographs belong on the shipping panel rather than
// buried in the general gallery. Approval rules are unchanged.
function packingPhotos(p, compact){
  if(compact) return '';
  const dispatchIds = (S.stages||[])
    .filter(s=>['packing','shipped','delivered'].includes(s.key))
    .map(s=>s.id);
  if(!dispatchIds.length) return '';
  let list = [];
  (p.items||[]).forEach(it=>{
    list = list.concat((S.photosByItem[it.id]||[]).filter(x=>dispatchIds.includes(x.stage_id)));
  });
  list = visiblePhotos(list);
  if(!list.length) return '';
  return '<div class="space-top-12"><p class="eyebrow">Packing and dispatch</p>'+photoGridOf(list)+'</div>';
}

  const admin=isAdmin();
  const rows=[['Ship to',p.ship_to],['Mode',p.ship_mode],['Forwarder',p.forwarder],['Container / LR no.',p.container_no],

function commentThread(it, stageId){
  const list=(S.commentsByItem[it.id]||[]).filter(c=>c.stage_id===stageId);
  let h='';
  if(list.length){
    h+='<div class="comment-thread">'+list.map(c=>{
      const me=c.author_id===uid();
      return '<div class="comment"><span class="comment__avatar">'+esc(initials(c.author_name||c.author_role||'?'))+'</span>'+
        '<div class="comment__bubble"><strong>'+esc(c.author_name||c.author_role)+(me?' · you':'')+'</strong>'+esc(c.body)+
        (c.attachment_path?'<div class="photo-placeholder space-top-10" style="min-height:120px;cursor:zoom-in" onclick="openPhoto(event,this)" data-ph-path="'+esc(c.attachment_path)+'" data-cap="">'+
          '<img alt="" data-ph-path="'+esc(c.attachment_path)+'" onload="this.parentNode.classList.add(\'is-loaded\')"><span>Attachment</span></div>':'')+
        '<div class="field-hint space-top-10">'+ftime(c.created_at)+
        (c.resolved_at?' · dealt with':'')+
        // A buyer's question stays open until somebody closes it, so the panel
        // of things needing attention empties instead of growing for ever.
        (isAdmin()&&c.author_role==='buyer'
          ? (c.resolved_at
              ? ' · <a href="#" onclick="event.preventDefault();reopenComment(\''+c.id+'\')">reopen</a>'
              : ' · <a href="#" onclick="event.preventDefault();resolveComment(\''+c.id+'\')">mark dealt with</a>')
          : '')+
        '</div></div></div>';
    }).join('')+'</div>';
  }
  h+='<div class="comment-composer"><input type="text" id="cmt-'+stageId+'" placeholder="Leave a comment on this stage" '+
     'onkeydown="if(event.key===\'Enter\')sendComment(\''+it.id+'\','+stageId+')">'+
     '<button class="button" type="button" onclick="sendComment(\''+it.id+'\','+stageId+')">Send</button></div>';
  return h;
}

/* Every round this piece and stage has been through, under the live gate. It is
   the reason the revision tables exist: asking a third time used to overwrite
   what the buyer said the first two times, and neither he nor the workshop could
   see what had already been settled. */
function approvalRounds(it, st){
  const hist=approvalHistory(it.id, st.id).filter(x=>x.decision);
  if(!hist.length) return '';
  return '<div class="approval-hist"><p class="approval-hist__t">Earlier rounds</p>'+
    hist.map(x=>{
      const ok=x.decision.decision==='approved';
      return '<div class="approval-hist__r"><div>'+
        '<strong>'+esc('Version '+x.rev.rev_no)+'</strong>'+
        '<span>'+esc((x.decision.decided_at?fdate(x.decision.decided_at):'')+
          ((x.rev.photo_ids||[]).length?(' · '+x.rev.photo_ids.length+' photograph'+
            (x.rev.photo_ids.length===1?'':'s')):''))+'</span>'+
        (x.decision.reason?'<span class="approval-row__why">'+esc('\u201c'+x.decision.reason+'\u201d')+'</span>':'')+
        '</div>'+badge(ok?'Approved':'Changes asked', ok?'success':'pending')+'</div>';
    }).join('')+'</div>';
}

function approvalGate(it, row, st){
  if(!row) return '';
  const hist=approvalRounds(it, st);
  if(row.approval==='requested'){
    if(!isAdmin()) return '<div class="approval-gate"><div>'+
      '<p class="approval-gate__title">'+icon('i-check')+' Approve '+esc(st.name.toLowerCase())+'?</p>'+
      '<p class="approval-gate__copy">'+esc(row.approval_note||'Your sign-off lets the workshop move to the next stage.')+'</p></div>'+
      '<div class="button-row"><button class="button button--success" type="button" onclick="respondApproval(\''+it.id+'\','+st.id+',\'approved\')">Approve</button>'+
      '<button class="button button--secondary" type="button" onclick="respondApproval(\''+it.id+'\','+st.id+',\'changes_requested\')">Request changes</button></div>'+hist+'</div>';
    return '<div class="approval-gate"><div>'+
      '<p class="approval-gate__title">'+icon('i-check')+' Waiting on the buyer</p>'+
      '<p class="approval-gate__copy">Approval requested'+(row.approval_at?' '+ftime(row.approval_at):'')+'. The stage stays open until they respond.</p></div>'+
      '<div class="button-row"><button class="button button--secondary" type="button" onclick="requestApproval(\''+it.id+'\','+st.id+',false)">Withdraw request</button></div>'+hist+'</div>';
  }
  if(row.approval==='approved')
    return '<div class="approval-gate"><div><p class="approval-gate__title">'+icon('i-check')+' Approved by the buyer</p>'+
      '<p class="approval-gate__copy">'+esc([row.approval_at?ftime(row.approval_at):'', row.approval_note].filter(Boolean).join(' · '))+'</p></div>'+hist+'</div>';
  if(row.approval==='changes_requested')
    return '<div class="approval-gate"><div><p class="approval-gate__title">'+icon('i-check')+' Changes requested</p>'+
      '<p class="approval-gate__copy">'+esc(row.approval_note||'The buyer has asked for changes at this stage.')+'</p></div>'+
      (isAdmin()?'<div class="button-row"><button class="button" type="button" onclick="requestApproval(\''+it.id+'\','+st.id+',true)">Re-request approval</button></div>':'')+
      hist+'</div>';
  return '';
}

function stageActions(it, row, st){
  if(isStaff()) return '<div class="button-row"><button class="button button--workshop" type="button" onclick="pickPhotos(\''+it.id+'\','+st.id+')">'+
    icon('i-camera')+'Add photos</button></div>';
  if(!isAdmin()) return '';
  let h='<div class="button-row">';
  if(row.status!=='in_progress') h+='<button class="button button--secondary" type="button" onclick="advance(\''+it.id+'\','+st.id+',false)">Start stage</button>';
  if(row.status!=='completed') h+='<button class="button button--success" type="button" onclick="advance(\''+it.id+'\','+st.id+',true)">Mark complete</button>';
  if(row.status==='completed') h+='<button class="button button--secondary" type="button" onclick="setStage(\''+it.id+'\','+st.id+',\'in_progress\')">Reopen</button>';
  h+='<button class="button button--secondary" type="button" onclick="pickPhotos(\''+it.id+'\','+st.id+')">'+icon('i-camera','icon--sm')+'Add photos</button>';
  h+='<button class="button button--secondary" type="button" onclick="mNote(\''+it.id+'\','+st.id+')">Workshop note</button>';
  h+='<button class="button button--secondary" type="button" onclick="mPlan(\''+it.id+'\','+st.id+')">Planned date</button>';
  if(row.status==='on_hold')
    h+='<button class="button button--success" type="button" onclick="liftHold(\''+it.id+'\','+st.id+')">Lift hold</button>';
  else
    h+='<button class="button button--secondary" type="button" onclick="mHold(\''+it.id+'\','+st.id+')">Put on hold</button>';
  // Not every piece needs every stage — a plain slab never gets moulded.
  if(row.status==='skipped')
    h+='<button class="button button--quiet" type="button" onclick="setStage(\''+it.id+'\','+st.id+',\'pending\')">Needed after all</button>';
  else if(row.status!=='completed')
    h+='<button class="button button--quiet" type="button" onclick="skipStage(\''+it.id+'\','+st.id+')">Not needed</button>';
  if(row.approval==='none'||row.approval==='approved'||!row.approval)
    h+='<button class="button button--secondary" type="button" onclick="requestApproval(\''+it.id+'\','+st.id+',true)">Ask buyer to approve</button>';
  h+='</div>';
  return h;
}

// A one-word slip warning on the collapsed row, workshop-side only.
function lateChip(it, row){
  if(!isAdmin() && !isStaff()) return '';
  const d = stageDelay(it.id, row);
  if(!d || d.state !== 'overdue') return '';
  return badge(d.days+' day'+(d.days===1?'':'s')+' over', 'alert');
}

// Planned dates, delays and hold detail are shown to the workshop only. A buyer
// reading "planned 5 Sep" and then watching it pass is the phone call we are
// trying to stop; what he sees is the delivery date and what has actually happened.
function stageInternalPanel(it, row){
  if(!isAdmin() && !isStaff()) return '';
  const d = stageDelay(it.id, row);
  const hold = holdOf(it.id, row);
  if(!d && !hold) return '';
  let h = '<div class="internal-strip"><span class="internal-strip__tag">Workshop only</span>';
  if(d){
    const label = d.state==='late'    ? Math.abs(d.days)+' day'+(Math.abs(d.days)===1?'':'s')+' late'
                : d.state==='ontime'  ? (d.days===0?'On time':Math.abs(d.days)+' day'+(Math.abs(d.days)===1?'':'s')+' early')
                : d.state==='overdue' ? d.days+' day'+(d.days===1?'':'s')+' over'
                : 'Due '+fdate(d.planned);
    const tone = (d.state==='late'||d.state==='overdue') ? 'alert' : 'success';
    h += '<span>Planned '+esc(fdate(d.planned))+'</span>'+badge(label, tone);
  }
  if(hold){
    h += '<span class="internal-strip__hold">'+
      esc([hold.hold_reason, hold.hold_owner, hold.hold_revised_date?('revised to '+fdate(hold.hold_revised_date)):'']
        .filter(Boolean).join(' · '))+'</span>';
  }
  return h + '</div>';
}

  const byStage={}; shots.forEach(x=>{ const k=x.stage_id||'none'; (byStage[k]=byStage[k]||[]).push(x); });

  const rev=openRevision(it.id, st?st.id:null);

    .sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));

  let h='<div class="product-page">'+
    '<nav class="crumbs"><a href="#" onclick="event.preventDefault();S.buyerPo=\''+p.id+'\';go(\'#/orders\')">My orders</a>'+
      icon('i-chevron','icon-sm')+

    '<section class="product-hero"><div class="sf-product-hero">'+

      '<button class="button secondary" type="button" onclick="mBuyerComment(\''+it.id+'\')">'+
        icon('i-message','icon-sm')+'Leave a comment</button></div>'+
    '<div class="status-grid">'+
      '<div class="status-box current"><span>Current production stage</span>'+
        '<strong>'+esc(st?st.name:'Not started')+(idx>=0?(' · '+(idx+1)+' of '+active.length):'')+'</strong></div>'+
      '<div class="status-box"><span>Latest approved record</span>'+
        '<strong>'+esc(upd?fdate(upd.work_date):'Nothing published yet')+'</strong></div>'+
      '<div class="status-box"><span>Next product stage</span><strong>'+esc(nextName)+'</strong></div>'+

        '<strong>'+esc(p.expected_ship_date?fdate(p.expected_ship_date):'To be confirmed')+'</strong></div>'+
    '</div></section>';

  // a decision waiting on him is the one thing that outranks the journey

    esc((st?st.name:'A stage')+' '+(rev.label||('R'+rev.rev_no))+' is waiting for you')+'</strong>'+

      (shown.length
        ? '<div class="gallery">'+shown.slice(0,3).map(x=>
            '<button class="photo" type="button" onclick="openPhoto(event,this)" '+
            'data-ph-path="'+esc(x.path)+'" data-cap="'+esc(x.caption||'')+'">'+
            '<img alt="'+esc(x.caption||it.product)+'" data-ph-path="'+esc(x.path)+'">'+

        : '<div class="empty"><p>No released photographs for this stage yet.</p></div>')+
    '</div></section>'+

    '<section class="card"><div class="card-head"><div>'+
      '<h2>Product conversation</h2>'+

    '<div class="card-body">'+
      (cmts.length?cmts.map(c=>{

function vItem(id){
  const it=S.itemsById[id];
  if(!it){ const m='<div class="empty-state">Product not found.</div>';
    if(isStaff()) $('app').innerHTML=m; else paint(m,null); return; }
  // Three people open a product for three different reasons, so there are three
  // pages: the owner's question-led record, the buyer's released record built
  // from his handoff, and the workshop's job sheet.
  if(isAdmin()) return vItemOwner(it);
  if(!isStaff()) return vBuyerItem(it);
  const p=it.po;
  const staff=isStaff();
  const admin=isAdmin();
  const due=it.target_date||(p&&p.expected_ship_date);
  const itDone=pieceIsMade(it);

  let h='';
  if(!staff){
    h+='<nav class="breadcrumb" aria-label="Breadcrumb"><a href="#/home">Orders</a>'+icon('i-chevron','icon--sm')+
      '<a href="#/po/'+p.id+'">'+esc(p.po_number)+'</a>'+icon('i-chevron','icon--sm')+
      '<strong aria-current="page">'+esc(it.product)+'</strong></nav>';

    h+='<div class="button-row"><button class="button button--secondary" type="button" onclick="go(\'#/home\')">← Production floor</button></div>';
  }

    eyebrow([it.item_ref, (+it.qty||1)+' '+(it.unit||'pcs')].filter(Boolean).join(' · '))+
    '<h1 class="detail-title">'+esc(it.product)+'</h1>'+
    '<p class="detail-subtitle">'+esc([it.stone, it.finish, dimsOf(it)].filter(Boolean).join(' · '))+

    (admin?'<div class="page-heading__actions">'+

      '<button class="button button--secondary" type="button" onclick="mItem(\''+p.id+'\',\''+it.id+'\')">Edit product</button>'+

  '</div>';

  h+='<div class="button-row space-top-12">'+statusBadge(it)+stageBadge(it)+

  if(it.description) h+='<p class="stage-note space-top-12">'+esc(it.description)+'</p>';

  /* reference media — the drawing, the 3D model, the approved block and the

  const itemDocs=(admin?(S.docsByItem&&S.docsByItem[it.id])
                       :(S.staffDocs||[]).filter(d=>d.item_id===it.id))||[];
  const poDocs=staff?(S.staffDocs||[]).filter(d=>d.po_id===it.po_id && !d.item_id):[];
  const docs=itemDocs.concat(poDocs);
  const KIND_LABEL={drawing:'Production drawing',model:'3D model',block:'Approved block',reference:'Target product'};
  const groupOf=p=>KIND_LABEL[p.photo_type]||'Reference';

    h+='<section class="panel space-top-18"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Reference media</h3>'+
      '<p class="panel__description">The drawing, the 3D model, the approved block and what the finished piece should look like.</p></div>'+
      ((admin||staff)?'<button class="button'+(staff?' button--workshop':' button--secondary')+'" type="button" onclick="mMedia(\''+it.id+'\')">'+
        icon('i-camera','icon--sm')+'Add media</button>':'')+'</div>'+
      '<div class="panel__body">';
    if(gen.length){
      const groups={};
      gen.forEach(p=>{ (groups[groupOf(p)]=groups[groupOf(p)]||[]).push(p); });
      h+=Object.keys(groups).map(g=>'<div class="space-top-12"><p class="eyebrow">'+esc(g)+'</p>'+
        photoGridOf(groups[g])+'</div>').join('');

    }
    if(docs.length){
      h+='<div class="side-card__rows space-top-12">'+docs.map(d=>
        '<div class="side-row"><span style="cursor:pointer;text-decoration:underline" onclick="openDoc(\''+jsq(d.path)+'\')">'+esc(d.name)+'</span>'+
        '<strong>'+esc(KIND_LABEL[d.doc_type]||'File')+'</strong></div>').join('')+'</div>';
    }
    h+=(staff?'<p class="field-hint space-top-10">Your photos are checked by the office before the client sees them.</p>':'')+
      '</div></section>';
  }

  h+=progressFeed(it);

  /* the timeline */
  const rows=S.stByItem[it.id]||[];
  const byStage={}; rows.forEach(r=>byStage[r.stage_id]=r);
  const stages=S.stages.filter(s=>s.active||byStage[s.id]);
  h+='<section class="timeline-card space-top-18"><div class="timeline">';
  let grp=null, openGroup=false;
  stages.forEach(st=>{
    const g=st.grp||'Production';
    if(g.toLowerCase()!==String(grp||'').toLowerCase()){
      if(openGroup) h+='</div>';
      h+='<div class="timeline-group"><p class="timeline-group__title">'+esc(g)+'</p>';
      grp=g; openGroup=true;
    }
    h+=stageRow(it, st, byStage[st.id]||{status:'pending',approval:'none',stage_id:st.id});
  });
  if(openGroup) h+='</div>';
  h+='</div></section><div style="height:24px"></div>';

  if(staff){ $('app').className='staff-list'; $('app').innerHTML=h; } else paint(h, p.id);
  hydrateImages();
  if(!staff) markRead(it.id);
}

function stageRow(it, st, row){
  const staff=isStaff(), admin=isAdmin();
  const cls = row.status==='completed'?' stage-row--done'
            : row.status==='in_progress'?' stage-row--current'
            : row.status==='on_hold'?' stage-row--hold':'';
  const open = row.status==='in_progress' || row.approval==='requested' ||
    (window.__openStages && window.__openStages[it.id+'-'+st.id]);
  const photos=visiblePhotos((S.photosByItem[it.id]||[]).filter(x=>x.stage_id===st.id));
  const nCmt=(S.commentsByItem[it.id]||[]).filter(c=>c.stage_id===st.id).length;

  let stateBadge;
  if(row.status==='completed') stateBadge=badge(row.approval==='approved'?'Buyer approved':'Complete','success');
  else if(row.status==='in_progress') stateBadge=badge('Current','pending');
  else if(row.status==='on_hold') stateBadge=badge('On hold','alert');
  else if(row.status==='skipped') stateBadge=badge('Skipped');
  else if(st.approval_gate) stateBadge=badge('Approval gate');
  else stateBadge=badge('Pending');

  const meta = row.status==='completed'?('Completed '+fdate(row.completed_at))
    : row.status==='in_progress'?('Started '+fdate(row.started_at))
    : row.status==='on_hold'?'On hold'
    : row.status==='skipped'?'Skipped'
    : (st.approval_gate?'Needs the buyer’s sign-off when reached':'');

  let h='<article class="stage-row'+cls+'">'+
    '<span class="stage-row__icon">'+icon(stageSymbol(st))+'</span>'+
    '<div style="min-width:0">'+
      '<div class="stage-row__top" style="cursor:pointer" onclick="toggleStage(\''+it.id+'\','+st.id+')">'+
        '<p class="stage-row__name">'+esc(st.name)+'</p>'+stateBadge+'</div>'+
      ((meta||(row.note&&!open))?'<p class="stage-row__meta">'+esc(meta)+
        esc(row.note&&!open?(meta?' · ':'')+row.note.slice(0,60):'')+'</p>':'')+
      (open?'':'<div class="stage-row__media">'+
        (photos.length?badge(photos.length+' photo'+(photos.length>1?'s':'')):'')+
        (nCmt&&!staff?badge(nCmt+' comment'+(nCmt>1?'s':'')):'')+
        lateChip(it,row)+
        ((admin||staff)?'<button class="button button--secondary" type="button" onclick="event.stopPropagation();pickPhotos(\''+it.id+'\','+st.id+')">'+
          icon('i-camera','icon--sm')+'Add photos</button>':'')+
        '<button class="button button--quiet" type="button" onclick="toggleStage(\''+it.id+'\','+st.id+')">Open</button>'+
      '</div>')+
    '</div>';
  if(open){
    h+='<div class="stage-expanded">'+
      stageInternalPanel(it,row)+
      (row.note?'<p class="stage-note"><strong>Workshop note:</strong> '+esc(row.note)+'</p>':'')+
      ((st.description&&!admin)?'<p class="stage-note">'+esc(st.description)+'</p>':'')+
      (photos.length?photoGridOf(photos):'<p class="panel__description">No photos on this stage yet.</p>')+
      (staff?'':approvalGate(it,row,st))+
      stageActions(it,row,st)+
      (staff?'':commentThread(it, st.id))+
      '<div class="button-row">'+
        (staff?'':'<button class="button button--secondary" type="button" onclick="attachToComment(\''+it.id+'\','+st.id+')">Attach a photo</button>')+
        '<button class="button button--secondary" type="button" onclick="toggleStage(\''+it.id+'\','+st.id+')">Close stage</button></div>'+
    '</div>';
  }
  h+='</article>';
  return h;
}

/* ---------------------------------------------------------------------------
   The workshop.

   Built from the ChatGPT WORKSHOP handoff. Missing updates and blocked work come
   first, because that is what the office is chasing. Two differences from the
   handoff, both deliberate: no PO number appears anywhere on a floor screen, and
   there is no "assigned to me" — nothing in the database assigns a person to a
   piece, so pretending otherwise would be a lie in the interface.
--------------------------------------------------------------------------- */

function staffBuckets(){
  const q=(window.__staffQ||'').toLowerCase();
  let items=(S.items||[]).slice();
  if(q) items=items.filter(it=>((it.product||'')+' '+(it.stone||'')+' '+(it.finish||'')+' '+
    (it.item_ref||'')+' '+(it.item_code||'')).toLowerCase().indexOf(q)>=0);
  const open=items.filter(it=>!['delivered','cancelled','made'].includes(it.status));
  const needs=open.filter(it=>!updateToday(it.id));
  const blocked=open.filter(it=>(S.stByItem[it.id]||[]).some(r=>r.status==='on_hold'));
  const ready=open.filter(it=>{
    const rows=S.stByItem[it.id]||[];
    return rows.some(r=>r.status==='in_progress') && !blocked.includes(it);
  });
  const done=items.filter(it=>['delivered','cancelled','made'].includes(it.status));
  return {open, needs, blocked, ready, done};
}

function setStaffFilter(k){ window.__staffFilter=k; vStaffHome(); }

/* The tasks this person has been given, and the three answers to each. English
   and Hindi together, because the person reading it may be comfortable in only
   one of them and the buttons have to be unambiguous in both. */
function staffTaskStrip(){
  const tasks=myOpenTasks();
  if(!tasks.length) return '';
  const me=uid();
  return '<section class="ws-tasks"><h2 class="ws-tasks__title">Your work · आपका काम</h2>'+
    tasks.map(a=>{
      const it=S.itemsById[a.item_id]; if(!it) return '';
      const stg=S.stagesById[a.stage_id];
      const lead=a.assigned_to===me;
      const answered=a.ack_state!=='pending';
      const ansMap={accepted:['Accepted · स्वीकार','success'],
                    clarify:['Question sent · सवाल भेजा','pending'],
                    cannot_start:['Cannot start · नहीं कर सकता','alert']};
      const ans=ansMap[a.ack_state];
      return '<article class="ws-task">'+
        '<p class="eyebrow">'+esc([batchCodeOf(it.id), it.item_ref].filter(Boolean).join(' · '))+'</p>'+
        '<button class="ws-task__name" type="button" onclick="go(\'#/item/'+it.id+'\')">'+esc(it.product)+'</button>'+
        '<p class="ws-task__stage">'+esc(stg?stg.name:'')+
          (lead?'':' · helping / मदद')+'</p>'+
        (a.instruction?'<p class="ws-task__said">“'+esc(a.instruction)+'”</p>':'')+
        (a.evidence_required?'<p class="ws-task__need">Send back · भेजें: '+esc(a.evidence_required)+'</p>':'')+
        (a.target_date?'<p class="ws-task__by">Finish by · तक पूरा करें: '+esc(fdate(a.target_date))+'</p>':'')+
        (answered
          ? '<div class="ws-task__done">'+badge(ans?ans[0]:'',ans?ans[1]:'')+
            (a.ack_note?'<span>'+esc(a.ack_note)+'</span>':'')+'</div>'
          : (lead
            ? '<div class="ws-task__do">'+
              '<button class="button button--workshop" type="button" onclick="mAckTask(\''+a.id+'\',\'accepted\')">Accept · ठीक है</button>'+
              '<button class="button button--secondary" type="button" onclick="mAckTask(\''+a.id+'\',\'clarify\')">Ask · सवाल</button>'+
              '<button class="button button--secondary" type="button" onclick="mAckTask(\''+a.id+'\',\'cannot_start\')">Cannot start · नहीं कर सकता</button>'+
              '</div>'
            : '<div class="ws-task__done"><span>Waiting for '+esc(personName(a.assigned_to))+' to accept · '+
              esc(personName(a.assigned_to))+' के स्वीकार करने का इंतज़ार</span></div>'))+
        '</article>';
    }).join('')+'</section>';
}

     ['blocked','Blocked',b.blocked.length],['ready','In progress',b.ready.length]]
    .map(x=>'<button class="chip'+(f===x[0]?' chip--on':'')+'" type="button" onclick="setStaffFilter(\''+x[0]+'\')">'+
      esc(x[1])+' · '+x[2]+'</button>').join('')+

      :'<p class="ws-state ws-state--ok"><b></b>Today’s update is in</p>')+

function vUpdates(){
  if(!isAdmin()) return vHome();
  const active=S.buyers.filter(b=>b.active && S.pos.some(p=>p.buyer_id===b.id && p.status!=='cancelled'));
  let h='<div class="page-heading"><div>'+eyebrow('Push, not pull')+
    '<h1 class="display-title">Client updates</h1>'+
    '<p class="lede">Send each buyer a short progress note. This is what stops the phone calls — they hear from you before they think to ask.</p></div></div>';

  if(!active.length){ $('app').innerHTML=h+'<div class="empty-state">No active buyers with open orders.</div>'; return; }

  const lateAll=S.items.filter(it=>{ const l=lateness(it); return l&&l.state==='late'; });
  if(lateAll.length) h+='<div class="attn attn--error attn--flat"><span><strong>'+lateAll.length+' item'+
    (lateAll.length>1?'s are':' is')+' past the planned date.</strong> Say so in the message before they find out. '+
    'A date you move yourself costs far less than one they discover.</span></div>';

  h+='<div class="utility-stack space-top-14">';
  active.forEach(b=>{
    const age=updateAge(b);
    const pos=S.pos.filter(p=>p.buyer_id===b.id && p.status!=='cancelled' && p.status!=='completed' && p.items.length);
    const nItems=pos.reduce((a,p)=>a+p.items.length,0);
    const late=pos.reduce((a,p)=>a+p.items.filter(it=>{const l=lateness(it); return l&&l.state==='late';}).length,0);
    h+='<section class="panel"><div class="panel__head"><div>'+
      eyebrow(nItems+' item'+(nItems!==1?'s':'')+' · '+pos.length+' order'+(pos.length!==1?'s':''))+
      '<h3 class="panel__title">'+esc(b.company)+'</h3>'+
      '<p class="panel__description">Update '+esc(age.t)+'.</p></div>'+
      (late?badge(late+' running late','alert'):badge(age.t, age.k==='you'?'pending':'success'))+'</div>'+
      '<div class="panel__body">'+
        (b.phone?'':'<div class="attn attn--warn attn--flat"><span>No WhatsApp number saved for this buyer. Add one under Buyers &amp; logins so the button can dial straight through.</span></div>')+
        '<p class="stage-note pre-wrap">'+esc(buyerUpdateText(b.id))+'</p>'+
        '<div class="button-row space-top-12">'+
          '<button class="button" type="button" onclick="sendBuyerUpdate(\''+b.id+'\')">Send on WhatsApp</button>'+
          '<button class="button button--secondary" type="button" onclick="copyText(buyerUpdateText(\''+b.id+'\'))">Copy text</button>'+
          '<button class="button button--quiet" type="button" onclick="markUpdateSent(\''+b.id+'\')">Mark as sent</button>'+
        '</div></div></section>';
  });
  h+='</div><p class="field-hint space-top-12">The message is built from the live data, so it is right by definition. You can edit it in WhatsApp before sending.</p>';
  $('app').innerHTML=h;
}

/* ---------------------------------------------------------------------------
   Daily updates — the three faces of the same record.
--------------------------------------------------------------------------- */

function updStatusBadge(u){
  const m={pending:['Awaiting review','pending'], partially_approved:['Published','success'],
           approved:['Published','success'], changes_requested:['Reshoot asked','alert']};
  const x=m[u.review_status]||[u.review_status,''];
  return badge(x[0], x[1]);
}

/* ---- buyer + admin: the progress feed on a product page ---- */
function progressFeed(it){
  const buyer = !isAdmin() && !isStaff();
  let list = updatesFor(it.id);
  if(buyer) list = list.filter(u=>u.published_at && u.work_status!=='no_work');
  if(!list.length){
    return '<section class="panel space-top-18"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Latest progress</h3>'+
      '<p class="panel__description">'+(buyer
        ? 'Workshop photographs appear here as the piece is made.'
        : 'No daily updates recorded yet.')+'</p></div></div>'+
      '<div class="panel__body"><div class="empty-state">'+(buyer
        ? 'Nothing published yet for this piece.'
        : 'When the floor submits an update it will show here.')+'</div></div></section>';
  }
  let h='<section class="panel space-top-18"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Latest progress</h3>'+
    '<p class="panel__description">Photographs from the workshop, newest first.</p></div>'+
    badge(list.length+' update'+(list.length===1?'':'s'))+'</div><div class="panel__body">';

  list.slice(0,25).forEach(u=>{
    const st=S.stagesById[u.stage_id];
    const ph=updatePhotos(u.id);
    const int_=(!buyer && S.updInternal[u.id])||null;
    const cmts=(S.commentsByItem[it.id]||[]).filter(c=>c.update_id===u.id);
    h+='<article class="daily-entry">'+
      '<div class="row-between">'+
        '<div><h4 class="attention-item__title">'+esc(fdate(u.work_date))+'</h4>'+
        '<p class="activity-item__meta">'+esc([st?st.name:'', u.published_at?('published '+ftime(u.published_at)):''].filter(Boolean).join(' · '))+'</p></div>'+
        (buyer ? (ph.length?badge(ph.length+' photo'+(ph.length===1?'':'s'),'success'):'') : updStatusBadge(u))+
      '</div>'+
      (u.work_status==='no_work'
        ? '<p class="stage-note space-top-10">No work today — '+esc(u.no_work_reason||'')+'</p>'
        : (u.public_summary?'<p class="stage-note space-top-10">'+esc(u.public_summary)+'</p>':''))+
      (int_ && int_.internal_note ? '<p class="field-hint">Internal: '+esc(int_.internal_note)+'</p>':'')+
      (int_ && int_.blocker_reason ? '<div class="attn attn--error attn--flat"><span><strong>Blocked:</strong> '+
          esc(int_.blocker_reason)+(int_.blocker_owner?' — '+esc(int_.blocker_owner):'')+
          (int_.revised_completion_date?' · revised to '+esc(fdate(int_.revised_completion_date)):'')+'</span></div>':'')+
      (ph.length?photoGridOf(ph,{del:!buyer}):'')+
      (cmts.length?'<div class="comment-thread space-top-12">'+cmts.map(c=>
        '<div class="comment"><span class="comment__avatar">'+esc(initials(c.author_name||'?'))+'</span>'+
        '<div class="comment__bubble"><strong>'+esc(c.author_name||c.author_role)+'</strong>'+esc(c.body)+
        '<div class="field-hint space-top-10">'+ftime(c.created_at)+'</div></div></div>').join('')+'</div>':'')+
      (isStaff()?'':'<div class="comment-composer space-top-12">'+
        '<input type="text" id="ucmt-'+u.id+'" placeholder="Comment on this update" '+
        'onkeydown="if(event.key===\'Enter\')sendUpdateComment(\''+it.id+'\',\''+u.id+'\')">'+
        '<button class="button" type="button" onclick="sendUpdateComment(\''+it.id+'\',\''+u.id+'\')">Send</button></div>')+
      (isAdmin()&&u.review_status==='pending'
        ? '<div class="button-row space-top-12"><button class="button" type="button" onclick="mReviewUpdate(\''+u.id+'\')">Review and publish</button></div>':'')+
    '</article>';
  });
  h+='</div></section>';
  return h;
}

/* ---- admin: the review queue ---- */
function vReview(){
  if(!isAdmin()) return vHome();
  const pend=pendingUpdates();
  const missing=itemsMissingToday();
  const blocked=blockedItems();
  const todayDone=activeItems().filter(it=>updateToday(it.id));

  let h='<div class="page-heading"><div>'+eyebrow('Production workspace')+
    '<h1 class="display-title">Today in the workshop.</h1>'+
    '<p class="lede">Daily updates, photographs, missing submissions and blocks in one operational queue.</p></div>'+
    '<div class="page-heading__actions">'+
      '<button class="button button--secondary" type="button" onclick="remindAll()">Remind missing</button>'+
      '<button class="button" type="button" onclick="pickDaily()">Add update</button></div></div>';

  h+='<section class="summary-grid">'+
    statCard('Awaiting review', pend.length, pend.length?'Nothing reaches the client until you publish':'Queue is clear')+
    statCard('Updated today', todayDone.length+' of '+activeItems().length, '')+
    statCard('Missing today', missing.length, missing.length?'Active pieces with no record':'All recorded')+
    statCard('Blocked', blocked.length, blocked.length?'Needs your attention':'Nothing blocked')+
  '</section>';

  h+='<div class="dashboard-grid"><section class="panel dashboard-grid__wide">'+
    '<div class="panel__head"><div><h3 class="panel__title">Awaiting review</h3>'+
    '<p class="panel__description">Only approved photographs and published text reach the buyer.</p></div>'+
    (pend.length?badge(pend.length+'','alert'):badge('Clear','success'))+'</div><div class="panel__body">';
  if(!pend.length) h+='<div class="empty-state">Nothing waiting. Submissions from the floor appear here.</div>';
  else pend.forEach(u=>{
    const it=S.itemsById[u.item_id]; const st=S.stagesById[u.stage_id];
    const ph=(S.photosByUpdate[u.id]||[]);
    const who=S.profilesAll.find(p=>p.user_id===u.submitted_by);
    h+='<article class="daily-entry"><div class="row-between">'+
      '<div>'+eyebrow([st?st.name:'', fdate(u.work_date)].filter(Boolean).join(' · '))+
      '<h4 class="approval-group__name">'+esc(it?it.product:'—')+'</h4>'+
      '<p class="approval-group__meta">'+esc([ph.length+' photo'+(ph.length===1?'':'s'),
        'by '+(who?shortLogin(who.full_name||who.email):'staff'), ftime(u.submitted_at)].join(' · '))+'</p></div>'+
      updStatusBadge(u)+'</div>'+
      (u.public_summary?'<p class="stage-note space-top-10">'+esc(u.public_summary)+'</p>':'')+
      (u.work_status==='no_work'?'<div class="attn attn--warn attn--flat"><span>No work — '+esc(u.no_work_reason||'')+'</span></div>':'')+
      (ph.length?photoGridOf(ph):'')+
      '<div class="button-row space-top-12">'+
        '<button class="button" type="button" onclick="mReviewUpdate(\''+u.id+'\')">Review and publish</button>'+
        (it?'<button class="button button--quiet" type="button" onclick="go(\'#/item/'+it.id+'\')">Open product</button>':'')+
      '</div></article>';
  });
  h+='</div></section>';

  h+='<section class="panel dashboard-grid__side"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Missing today</h3><p class="panel__description">Active pieces with no record for '+esc(fdate(today()))+'.</p></div>'+
    (missing.length?'<button class="button button--secondary" type="button" onclick="remindAll()">Remind everyone</button>':'')+'</div>'+
    '<div class="panel__body">';
  if(!missing.length) h+='<div class="empty-state">Every active piece has today’s update.</div>';
  else h+=missing.map(it=>{
    const d=daysSinceUpdate(it.id);
    return '<div class="login-row"><div class="grow"><strong>'+esc(it.product)+'</strong>'+
      '<p class="field-hint">'+esc(d===null?'never updated':(d===0?'updated today':d+' day'+(d===1?'':'s')+' since last update'))+'</p></div>'+
      '<div class="button-row"><button class="button button--quiet" type="button" onclick="remindItem(\''+it.id+'\')">Remind</button>'+
      '<button class="button button--secondary" type="button" onclick="mDailyUpdate(\''+it.id+'\',null)">Add for them</button></div></div>';
  }).join('');
  h+='</div></section>';

  if(blocked.length){
    h+='<section class="panel dashboard-grid__wide"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Reported blocked</h3><p class="panel__description">Raised by the floor in a daily update. The buyer does not see any of this.</p></div>'+
      badge(blocked.length+'','alert')+'</div><div class="panel__body">'+
      blocked.map(b=>'<div class="login-row"><div class="grow"><strong>'+esc(b.item.product)+'</strong>'+
        '<p class="field-hint">'+esc([b.reason, b.owner, b.revised?('revised to '+fdate(b.revised)):''].filter(Boolean).join(' · '))+'</p></div>'+
        '<div class="button-row"><button class="button button--quiet" type="button" onclick="go(\'#/item/'+b.item.id+'\')">Open</button></div></div>').join('')+
      '</div></section>';
  }

  // A stage held with a reason and an owner, and a stage running past its plan,
  // are the two things that turn into a telephone call if nobody looks at them.
  const held = heldStages();
  if(held.length){
    h+='<section class="panel dashboard-grid__wide"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Stages on hold</h3><p class="panel__description">Held by you, with a reason, a person and a revised date. Workshop only.</p></div>'+
      badge(held.length+'','alert')+'</div><div class="panel__body">'+
      held.map(x=>'<div class="login-row"><div class="grow"><strong>'+esc(x.item.product)+'</strong>'+
        '<p class="field-hint">'+esc([x.stage?x.stage.name:'', x.hold.hold_reason, x.hold.hold_owner,
          x.hold.hold_revised_date?('revised to '+fdate(x.hold.hold_revised_date)):''].filter(Boolean).join(' · '))+'</p></div>'+
        '<div class="button-row"><button class="button button--success" type="button" onclick="liftHold(\''+x.item.id+'\','+x.row.stage_id+')">Lift hold</button>'+
        '<button class="button button--quiet" type="button" onclick="go(\'#/item/'+x.item.id+'\')">Open</button></div></div>').join('')+
      '</div></section>';
  }

  const late = lateStages();
  if(late.length){
    h+='<section class="panel dashboard-grid__wide"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Running late</h3><p class="panel__description">Past their planned date. The buyer sees the delivery date, not this.</p></div>'+
      badge(late.length+'','alert')+'</div><div class="panel__body">'+
      late.map(x=>'<div class="login-row"><div class="grow"><strong>'+esc(x.item.product)+'</strong>'+
        '<p class="field-hint">'+esc((x.stage?x.stage.name+' · ':'')+'planned '+fdate(x.delay.planned)+' · '+
          x.delay.days+' day'+(x.delay.days===1?'':'s')+' over')+'</p></div>'+
        '<div class="button-row"><button class="button button--secondary" type="button" onclick="mPlan(\''+x.item.id+'\','+x.row.stage_id+')">Re-plan</button>'+
        '<button class="button button--quiet" type="button" onclick="go(\'#/item/'+x.item.id+'\')">Open</button></div></div>').join('')+
      '</div></section>';
  }
  h+='</div>';
  $('app').innerHTML=h;
  hydrateImages();
}

/* ---------------------------------------------------------------------------
   Finance — admin only.

   Deliberately a statement of account, not accounting: purchase orders, extras
   added later, money received, what is still owed. No invoicing, no tax
   ledgers, nothing that pretends to be Tally. Buyers cannot see any of it yet;
   the database refuses them the rows, not just the screen.
--------------------------------------------------------------------------- */

/* ------------------------------------------------------------- finance -- */
/* ChatGPT's financeView from the final handoff: his page head with the two
   actions, four .metric tiles, the Receivables .data-table with its Open /
   Overdue / Paid segments, and the ageing panel beside it. Every balance traces
   to a posted invoice and a recorded payment — nothing here is derived from an
   order's value. */
function sfaMetric(label, value, note, tone, action){
  return '<button class="metric '+(tone||'')+'" type="button" onclick="'+(action||'')+'">'+
    '<div class="metric-label"><span>'+esc(label)+'</span>'+icon('i-chevron','icon-sm')+'</div>'+
    '<strong class="metric-value">'+esc(value)+'</strong>'+
    '<span class="metric-note">'+esc(note)+'</span></button>';
}
function setFinSeg(k){ window.__finSeg=k; render(); }

function vFinance(){
  if(!isAdmin()) return vHome();
  const seg=window.__finSeg||'open';
  const inv=(S.invoices||[]).filter(i=>i.published_at)
    .sort((a,b)=>String(b.invoice_date).localeCompare(String(a.invoice_date)));
  const allocFor=i=>(S.allocations||[]).filter(a=>a.invoice_id===i.id)
    .reduce((a,x)=>a+(+x.amount||0),0);
  const ag=receivableAgeing();
  const rows=inv.map(i=>{
    const b=S.buyersById[i.buyer_id]||{};
    const po=S.posById[i.po_id];
    const paid=allocFor(i);
    const bal=Math.max((+i.total||0)-paid,0);
    const age=dayGap(String(i.invoice_date).slice(0,10), today())||0;
    const state=bal<=0?'paid':(age>30?'overdue':'open');
    return {i,b,po,paid,bal,age,state};
  });
  const shown=rows.filter(r=>seg==='paid'?r.state==='paid':seg==='overdue'?r.state==='overdue':r.state!=='paid');
  const overdue=rows.filter(r=>r.state==='overdue').reduce((a,r)=>a+r.bal,0);
  const charges=(S.charges||[]).map(c=>Object.assign({}, c, {po:S.posById[c.po_id]}));
  const chargeTotal=charges.reduce((a,c)=>a+(+c.amount||0),0);
  const pct=ag.outstanding?Math.round((overdue/ag.outstanding)*100):0;

  let h='<div>'+sfHead('Accounts receivable','Finance.',
    'Invoices, payments, allocations and ageing — never an order-value approximation.',
    '<div class="button-row">'+
      '<button class="button secondary" type="button" onclick="go(\'#/accounts\')">Upload a Tally document</button>'+
      '<button class="button" type="button" onclick="mPayment()">Record payment</button></div>');

  h+='<section class="summary">'+
    sfaMetric('Invoiced', money(ag.total,ag.currency),
      inv.length+' posted invoice'+(inv.length===1?'':'s'),'',"setFinSeg('open')")+
    sfaMetric('Received', money(ag.paid,ag.currency),'Verified and allocated','money',"setFinSeg('paid')")+
    sfaMetric('Outstanding', money(ag.outstanding,ag.currency),
      rows.filter(r=>r.state!=='paid').length+' open invoice'+(rows.filter(r=>r.state!=='paid').length===1?'':'s'),
      '',"setFinSeg('open')")+
    sfaMetric('Aged over 30 days', money(overdue,ag.currency),
      overdue?(rows.filter(r=>r.state==='overdue').length+' invoice'+(rows.filter(r=>r.state==='overdue').length===1?'':'s')):'Nothing aged',
      overdue?'alert':'',"setFinSeg('overdue')")+
    '</section>';

  h+='<div class="grid-main"><section class="card"><div class="card-head"><div>'+
    '<h2>Receivables</h2><p>Every balance traces to a posted invoice and a recorded allocation.</p></div>'+
    '<div class="seg-tabs">'+
      [['open','Open'],['overdue','Overdue'],['paid','Paid']].map(([k,l])=>
        '<button class="seg-tab" type="button" aria-selected="'+(seg===k)+'" onclick="setFinSeg(\''+k+'\')">'+l+'</button>').join('')+
    '</div></div>'+
    (shown.length?'<div class="table-wrap"><table class="data-table"><thead><tr>'+
      '<th>Invoice / buyer</th><th>Order</th><th>Invoice date</th><th>Status</th>'+
      '<th class="amount">Invoice</th><th class="amount">Balance</th><th></th></tr></thead><tbody>'+
      shown.map(r=>'<tr><td><strong>'+esc(r.i.invoice_no||'—')+'</strong>'+
        '<small>'+esc(r.b.company||'')+'</small></td>'+
        '<td>'+esc(r.po?r.po.po_number:'Account level')+'</td>'+
        '<td>'+esc(fdate(r.i.invoice_date))+'</td>'+
        '<td>'+sfaBadge(r.state==='paid'?'Cleared':r.state==='overdue'?('Aged '+r.age+' days'):'Open',
          r.state==='paid'?'green':r.state==='overdue'?'red':'amber')+'</td>'+
        '<td class="amount">'+esc(money(r.i.total,r.i.currency||'INR'))+'</td>'+
        '<td class="amount">'+esc(r.bal>0?money(r.bal,r.i.currency||'INR'):'Nil')+'</td>'+
        '<td>'+(r.i.doc_path?'<button class="button quiet" type="button" onclick="openDoc(\''+jsq(r.i.doc_path)+'\')">Open</button>':'')+
        '</td></tr>').join('')+
      '</tbody></table></div>'
     :'<div class="card-body"><div class="empty"><h2>'+
       (inv.length?'Nothing in this view.':'No invoices posted yet.')+'</h2>'+
       '<p>'+(inv.length?'Try another segment.':'Upload the Tally invoice against the order it belongs to.')+'</p></div></div>')+
    '</section>'+

    '<aside class="stack"><section class="card"><div class="card-head"><h2>Ageing</h2></div>'+
    '<div class="card-body"><div class="collection-total"><small>Total receivable</small>'+
      '<strong>'+esc(money(ag.outstanding,ag.currency))+'</strong>'+
      '<span>'+pct+'% is aged over 30 days</span></div>'+
    '<div class="aging">'+ag.buckets.map(bk=>'<div><span>'+esc(bk.k)+'</span>'+
      '<strong>'+esc(money(bk.v,ag.currency))+'</strong></div>').join('')+'</div></div></section>'+
    // Freight, packing and other charges are money owed that no Tally invoice
    // has covered yet. They belong on this page or they are simply forgotten.
    (charges.length?'<section class="card"><div class="card-head"><div><h2>Other charges</h2>'+
      '<p>Recorded against an order and not yet invoiced.</p></div>'+
      sfaBadge(money(chargeTotal,'INR'),'amber')+'</div><div class="card-body">'+
      charges.map(c=>'<div class="detail-row"><span>'+esc(c.label||'Charge')+
        (c.po?'<small> · '+esc(c.po.po_number)+'</small>':'')+'</span>'+
        '<strong>'+esc(money(c.amount,c.currency||'INR'))+'</strong></div>').join('')+
      '<p class="card-copy">Ordered total including these charges: <strong>'+
        esc(money(ag.total+chargeTotal,ag.currency))+'</strong>. '+
        'Outstanding including them: <strong>'+esc(money(ag.outstanding+chargeTotal,ag.currency))+'</strong>. '+
        'Tally remains the ledger of record; this is what StoneFlow has been told about.</p>'+
      '</div></section>':'')+
    '<div class="notice"><strong>Buyer finance permission</strong>'+
    'Finance access is separate from production access. A buyer project user never inherits invoice visibility by default.</div>'+
    '</aside></div></div>';

  sfaPaint(h);
}

function loginRow(l, label, sub, tag){
  const staffRow = FLOOR_ROLES.indexOf(l.role)>=0;
  const phoneNote = staffRow ? (l.phone ? 'WhatsApp '+l.phone : 'no WhatsApp number — reminders cannot reach them') : '';
  return '<div class="login-row"><div class="grow"><strong>'+esc(label)+'</strong>'+(tag?' '+badge(tag):'')+
    (sub?'<p class="field-hint">'+esc(sub)+'</p>':'')+
    (phoneNote?'<p class="field-hint'+(l.phone?'':' field-hint--warn')+'">'+esc(phoneNote)+'</p>':'')+'</div>'+
    '<div class="button-row">'+
      (staffRow
        ? '<button class="button button--secondary" type="button" onclick="mStaffPhone(\''+l.user_id+'\')">'+

function render(){
  if(!S.ready) return;
  if(!S.session){ vLogin(); return; }
  if(!S.profile){
    $('shell').hidden=true;
    const root=$('login-root'); root.hidden=false;
    root.innerHTML='<div class="login-screen"><aside class="login-story"><div class="login-story__content">'+
      '<div class="wordmark"><span class="wordmark__mark wordmark__mark--inverse">'+icon('i-mark','icon--lg')+'</span>'+
      '<span><span class="wordmark__title">StoneFlow</span><span class="wordmark__byline">by Gujraj Impex</span></span></div>'+
      '<p class="login-story__quote">Craft in progress.</p></div></aside>'+
      '<main class="login-form-wrap"><div class="login-form"><h2>No access yet</h2>'+
      '<p class="login-form__tagline">This login has not been given access. Please contact Gujraj Impex.</p>'+
      '<div class="button-row"><button class="button" type="button" onclick="signOut()">Sign out</button></div></div></main></div>';
    return;
  }
  updateHeader();
  const hash=location.hash||'#/home';
  const parts=hash.slice(2).split('/');
  window.scrollTo(0,0);
  if(isStaff()){
    if(parts[0]==='item' && parts[1]) vItem(parts[1]);
    else if(isSupervisor()){
      if(parts[0]==='batches') vSupBatches();
      else if(parts[0]==='team') vSupTeam();
      else if(parts[0]==='pieces') vStaffHome();
      else vSupHome();
    }
    else vStaffHome();
    return;
  }
  if(!isAdmin()){
    // The audited portal has no separate purchase-order tab page: an order is
    // read inside My orders, and a product opens its own record. A #/po link
    // therefore selects that order and shows it there.
    if(parts[0]==='po' && parts[1]){ S.buyerPo=parts[1]; vBuyerOrders(); }
    else if(parts[0]==='item' && parts[1]) vItem(parts[1]);
    else if(parts[0]==='orders') vBuyerOrders();
    else if(parts[0]==='approvals') vBuyerApprovals();
    else if(parts[0]==='photos') vBuyerPhotos();
    else if(parts[0]==='documents') vBuyerDocuments();
    else if(parts[0]==='finance') vBuyerFinance();
    else if(parts[0]==='messages') vBuyerMessages();
    else if(parts[0]==='company') vBuyerCompany();
    else vBuyerHome();
    return;
  }
  if(parts[0]!=='orders') document.body.classList.remove('inspector-open');
  if(parts[0]==='po' && parts[1]) vPO(parts[1]);
  else if(parts[0]==='item' && parts[1]) vItem(parts[1]);
  // the console's routes
  else if(parts[0]==='orders') vOrders();
  else if(parts[0]==='production') vProduction(parts[1]||'priority');
  else if(parts[0]==='clients') vClients(parts[1]);
  else if(parts[0]==='reports') vReports(parts[1]);
  else if(parts[0]==='access') vAccess();
  else if(parts[0]==='admin') vAdmin(parts[1]);
  // the routes that existed before the console, still honoured so that a
  // bookmark, a WhatsApp link or an old habit never lands on a blank page
  else if(parts[0]==='updates') vClients('updates');
  else if(parts[0]==='approvals') vProduction('review');
  else if(parts[0]==='review') vProduction('review');
  else if(parts[0]==='finance') vFinance();
  else if(parts[0]==='accounts') vAccounts();
  else if(parts[0]==='daily') vReports('log');
  else if(parts[0]==='buyers') vAccess();
  else if(parts[0]==='settings') vAdmin('settings');
  else if(parts[0]==='activity') vReports('activity');
  else if(parts[0]==='import') vAdmin('import');
  else vCommandCentre();
}

  let h='<div class="product-workspace">'+

    icon('i-chevron','icon-sm')+'<span>'+esc(it.item_ref||it.item_code||it.product)+'</span></nav>';

  /* hero — the picture leads, because a person identifies a piece by looking at

  h+='<section class="product-hero"><div class="product-hero-top product-image-first">'+

      '<button class="button secondary" type="button" onclick="mItem(\''+p.id+'\',\''+it.id+'\')">Edit product</button>'+

  const b=S.buyersById[p.buyer_id];

    '<p>Identity, specification, responsibility and visibility.</p></header>'+

function buyerCounts(){
  const bid=S.profile?S.profile.buyer_id:null;
  const open=(S.pos||[]).filter(p=>p.status!=='cancelled' && p.status!=='completed').length;
  const decisions=pendingApprovals().length;
  const photos=visiblePhotos((S.photos||[]).filter(p=>!p.log_date)).length;
  const docs=bid?buyerDocs(bid).length:0;
  const msgs=(S.comments||[]).filter(c=>c.author_role==='admin' && !c.resolved_at).length;
  const fin=bid?((latestStatement(bid)?1:0)+((S.invByBuyer[bid]||[]).length?1:0)):0;
  return {open, decisions, photos, docs, msgs, fin};
}

// Money, the way it is actually owed. A bare "amount due" to a buyer on 100%
// advance terms is a bill for money he has already sent, and it produces the
// telephone call this whole product exists to stop.
function buyerStanding(){
  const bid=S.profile?S.profile.buyer_id:null;
  if(!bid) return null;
  const sn=latestStatement(bid);
  const st=statementStanding(sn);
  if(st) return {label:st.label, value:money(st.amount, st.currency),
                 note:'As at '+fdate(st.as_of), credit:st.credit};
  const inv=(S.invByBuyer[bid]||[]).filter(i=>i.published_at);
  if(inv.length) return {label:'Invoiced to date', value:money(inv.reduce((a,i)=>a+(+i.total||0),0), inv[0].currency||'INR'),
                 note:inv.length+' posted invoice'+(inv.length===1?'':'s'), credit:false};
  return {label:'Your account', value:'—', note:'No statement published yet', credit:false, muted:true};
}

// The menu is not the boundary — the database is — but there is no sense showing
// a login a section it will only ever find empty.
function financeVisible(){
  const bid=S.profile?S.profile.buyer_id:null;
  if(!bid) return false;
  if(S.profile.finance_access===false) return false;
  return true;
}

// "Due today", "Overdue", or the date. His prototype hard-codes "Due today";
// with real revisions the badge has to say which of the three it actually is.
function dueBadge(rev){
  if(!rev || !rev.due_at) return 'Please review';
  const t=today();
  if(rev.due_at < t) return 'Overdue';
  if(rev.due_at === t) return 'Due today';
  return 'Due '+fdate(rev.due_at);
}

function sfDue(rev){
  if(!rev || !rev.due_at) return 'Please review';
  const t=today();
  if(rev.due_at < t) return 'Overdue';
  if(rev.due_at === t) return 'Due today';
  return 'Due '+fdate(rev.due_at);
}
function sfDueWord(rev){
  if(!rev || !rev.due_at) return 'awaiting your review';
  const t=today();
  if(rev.due_at < t) return 'overdue';
  if(rev.due_at === t) return 'due today';
  return 'due '+fdate(rev.due_at);
}
function sfDay(v){
  const s=String(v).slice(0,10);
  return s===today() ? 'today' : fdate(s);
}
function sfWhen(v){
  const s=String(v);
  if(s.slice(0,10)===today()){
    const t=new Date(s);
    if(!isNaN(t)) return 'today at '+t.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
    return 'today';
  }
  return fdate(s);
}
