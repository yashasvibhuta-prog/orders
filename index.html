.sfa .co-account-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.sfa .co-badge{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:7px;font-weight:750}
.sfa .co-account-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.8fr);gap:12px}
.sfa .co-panel{border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden}
.sfa .co-panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.sfa .co-panel-head h2{margin:0;font-size:22px}
.sfa .co-panel-head p{margin:4px 0 0;color:var(--muted);font-size:8px}
.sfa .co-order-table{width:100%;border-collapse:collapse}
.sfa .co-order-table th{padding:8px 11px;background:var(--surface-2);color:var(--muted);font-size:6px;text-transform:uppercase;letter-spacing:.05em;text-align:left}
.sfa .co-order-table td{padding:11px;border-top:1px solid var(--line);font-size:8px}
.sfa .co-order-table td strong,.sfa .co-order-table td span{display:block}
.sfa .co-order-table td span{margin-top:3px;color:var(--muted);font-size:7px}
.sfa .co-empty{padding:28px;text-align:center;color:var(--muted)}
.sfa .co-empty strong{display:block;color:var(--ink);font-size:14px}
.sfa .co-empty p{margin:5px 0 12px;font-size:8px}
.sfa .co-actions{padding:3px 14px}
.sfa .co-action{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.sfa .co-action:first-child{border-top:0}
.sfa .co-action i{width:7px;height:7px;border-radius:50%;background:var(--pending)}
.sfa .co-action i.attention{background:var(--warning)}
.sfa .co-action i.danger{background:var(--danger)}
.sfa .co-action strong,.sfa .co-action span{display:block}
.sfa .co-action strong{font-size:8px}
.sfa .co-action span{margin-top:3px;color:var(--muted);font-size:7px}
.sfa .co-activity{padding:0 15px}
.sfa .co-activity-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.sfa .co-activity-row:first-child{border-top:0}
.sfa .co-activity-icon{width:28px;height:28px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center}
.sfa .co-activity-row strong,.sfa .co-activity-row span{display:block}
.sfa .co-activity-row strong{font-size:8px}
.sfa .co-activity-row span,.sfa .co-activity-row time{margin-top:3px;color:var(--muted);font-size:7px}
.sfa .co-detail-body{padding:10px 15px}
.sfa .co-detail-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.sfa .co-detail-row:first-child{border-top:0}
.sfa .co-detail-row span{color:var(--muted);font-size:8px}
.sfa .co-detail-row strong{text-align:right;font-size:8px;overflow-wrap:anywhere}
.sfa .co-contact-card{padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:7px}
.sfa .co-contact-card strong,.sfa .co-contact-card span{display:block}
.sfa .co-contact-card strong{font-size:8px}
.sfa .co-contact-card span{margin-top:3px;color:var(--muted);font-size:7px}
.sfa .co-directory-empty{padding:20px;text-align:center;color:var(--muted);font-size:8px}
@media(max-width:1050px){.sfa .co-workspace{grid-template-columns:1fr}
.sfa .co-directory{position:static}
.sfa .co-directory-list{display:grid;grid-template-columns:repeat(2,1fr)}
.sfa .co-account-grid{grid-template-columns:1fr}}
@media(max-width:680px){.sfa .co-page{padding:16px 13px 60px}
.sfa .co-head,.sfa .co-account-head{display:block}
.sfa .co-head .button-row,.sfa .co-account-actions{margin-top:12px;justify-content:flex-start}
.sfa .co-summary{grid-template-columns:repeat(2,1fr)}
.sfa .co-directory-list{grid-template-columns:1fr}
.sfa .co-order-table{display:block;overflow-x:auto}}

/* His sheet gives .owner-kpi-meter a height, but the element is a <span> inside
   a <button>, so it stays inline and the height never applies. Making it a block
   realises his own declaration; it is not a design change. */
.sfa .owner-kpi-meter,.sfa .owner-team-row i,.sfa .owner-age-row i{display:block}

/* His .split-shell uses negative margins to break out of the padding HIS shell
   applies. Inside this console the column is already full-bleed, so the same
   margins push it under the sidebar and off the right edge. */
.sfa .split-shell{margin:0;min-height:calc(100vh - 150px)}
.page--owner:has(.split-shell){padding-left:0;padding-right:0}

/* His console fills the browser column; the page width my own screens use is
   not his design. Same treatment the buyer portal gets. */
.page--owner{width:100%;max-width:none;padding-left:20px;padding-right:20px}
.sfa{width:100%;max-width:1660px;margin:0 auto}
.sfa img{max-width:100%}
.sfa .owner-primary-grid>*,.sfa .owner-secondary-grid>*{min-width:0}
.sfa .owner-table-wrap{overflow-x:auto}

/* His settings shell keeps its header and health strip; the working editor runs
   full width beneath it rather than inside his two-column workspace. */
.sfa .settings-body{margin-top:12px}

<style>
/* ---------------------------------------------------------------------------
   The workshop floor.

   The supervisor screens reuse the owner console's shell, tokens, panels,
   buttons and tables — the brief is explicit that this is not a second visual
   product, and the practical reason is that Yash and Kunal should be able to
   stand at the same screen and recognise it. What is here is only the shapes
   the console did not already have: a piece row, an alert raised from the
   floor, a batch group, the pick lists in the two new forms, and the artisan's
   task cards, which are the one place the type has to work in Hindi as well.
--------------------------------------------------------------------------- */

/* one piece, as a supervisor reads it ------------------------------------- */
.fl-rows{ display:grid; }
.fl-row{
  display:grid;
  grid-template-columns:56px minmax(160px,1.6fr) minmax(120px,1fr) minmax(120px,1fr) auto auto;
  gap:14px; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--line, #e8e6e1);
}
.fl-row:last-child{ border-bottom:0; }
.fl-row__thumb{
  width:56px; height:56px; border-radius:8px; overflow:hidden;
  display:grid; place-items:center; flex:0 0 56px;
}
.fl-row__thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.fl-row__main{ min-width:0; }
.fl-row__name{
  display:block; text-align:left; padding:0; border:0; background:none;
  font:inherit; font-weight:600; color:inherit; cursor:pointer;
  text-decoration:underline; text-decoration-color:transparent;
  text-underline-offset:3px; transition:text-decoration-color .15s;
}
.fl-row__name:hover, .fl-row__name:focus-visible{ text-decoration-color:currentColor; }
.fl-row__meta, .fl-row__said, .fl-cell-sub{
  display:block; font-size:12px; color:var(--muted, #6b6660); margin-top:2px;
}
.fl-row__said{ font-style:italic; }
.fl-row__stage{ font-size:13px; }
.fl-row__who{ font-size:13px; min-width:0; }
.fl-row__who span{ display:block; font-size:12px; color:var(--muted, #6b6660); }
.fl-row__do{ display:flex; gap:6px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
.muted{ color:var(--muted, #6b6660); }
.link-button{
  padding:0; border:0; background:none; font:inherit; color:inherit;
  cursor:pointer; text-align:left; text-decoration:underline;
  text-decoration-color:transparent; text-underline-offset:3px;
}
.link-button:hover, .link-button:focus-visible{ text-decoration-color:currentColor; }

/* something the floor could not solve on its own -------------------------- */
.fl-alert{
  display:grid; grid-template-columns:minmax(180px,1.2fr) 2fr auto; gap:14px;
  align-items:center; padding:12px 0; border-bottom:1px solid var(--line, #e8e6e1);
}
.fl-alert:last-child{ border-bottom:0; }
.fl-alert__said{ margin:0; font-size:13px; }

/* a batch, and the pieces waiting to become one --------------------------- */
.fl-batch--late{ border-left:3px solid var(--danger, #a4413f); }
.fl-batch--soon{ border-left:3px solid var(--warn, #a18a5d); }
.fl-group + .fl-group{ margin-top:18px; padding-top:18px; border-top:1px solid var(--line, #e8e6e1); }
.fl-group__head{
  display:flex; gap:12px; align-items:center; justify-content:space-between;
  flex-wrap:wrap; margin-bottom:6px;
}
.fl-group__head span{ display:block; font-size:12px; color:var(--muted, #6b6660); }

/* ticking pieces and people ------------------------------------------------ */
.pick-list{
  max-height:260px; overflow:auto; border:1px solid var(--line, #e8e6e1);
  border-radius:10px; padding:4px;
}
.pick-list--tight{ max-height:170px; }
.pick{
  display:flex; gap:10px; align-items:flex-start; padding:9px 10px;
  border-radius:8px; cursor:pointer; min-height:44px;
}
.pick:hover{ background:var(--soft, #f4f2ee); }
.pick input{ margin-top:3px; width:18px; height:18px; flex:0 0 18px; }
.pick small{ display:block; font-size:12px; color:var(--muted, #6b6660); }
.pick--off{ opacity:.45; cursor:not-allowed; }
.pick-fixed{
  border:1px solid var(--line, #e8e6e1); border-radius:10px; padding:10px 12px;
}
.pick-fixed small{ display:block; font-size:12px; color:var(--muted, #6b6660); margin-top:2px; }

/* the artisan's tasks ------------------------------------------------------ */
.ws-tasks{ margin:14px 0 4px; }
.ws-tasks__title{ font-size:15px; margin:0 0 8px; }
.ws-task{
  border:1px solid var(--line, #e8e6e1); border-radius:12px;
  padding:14px; margin-bottom:10px; background:var(--paper, #fff);
}
.ws-task__name{
  display:block; text-align:left; padding:0; border:0; background:none;
  font:inherit; font-size:17px; font-weight:600; color:inherit; cursor:pointer;
  margin:2px 0 4px;
}
.ws-task__stage{ margin:0 0 6px; font-size:14px; }
.ws-task__said{ margin:0 0 6px; font-size:14px; font-style:italic; }
.ws-task__need, .ws-task__by{ margin:0 0 4px; font-size:13px; color:var(--muted, #6b6660); }
.ws-task__do{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
/* the floor works on a tablet with wet hands: nothing here is smaller than a
   thumb, and the buttons wrap rather than shrink */
.ws-task__do .button{ min-height:48px; flex:1 1 46%; justify-content:center; }
.ws-task__done{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
.ws-task__done span{ font-size:13px; color:var(--muted, #6b6660); }

/* the supervisor's search sits in the top bar rather than under it --------- */
.search--top{ flex:1 1 320px; max-width:460px; }

@media (max-width: 900px){
  .fl-row{
    grid-template-columns:52px 1fr auto;
    grid-template-areas:'thumb main state' 'thumb stage stage' 'who who who' 'do do do';
    row-gap:6px;
  }
  .fl-row__thumb{ grid-area:thumb; }
  .fl-row__main{ grid-area:main; }
  .fl-row__stage{ grid-area:stage; }
  .fl-row__who{ grid-area:who; }
  .fl-row__state{ grid-area:state; }
  .fl-row__do{ grid-area:do; justify-content:flex-start; }
  .fl-row__do .button{ min-height:44px; }
  .fl-alert{ grid-template-columns:1fr; }
}
</style>

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// esc() is for HTML text and attributes. It is the WRONG escape for a value that
// lands inside a JavaScript string in an inline handler — onclick="f('...')" —
// because the browser HTML-decodes the attribute first, so &#39; turns back into
// a quote and closes the string. jsq() emits \uXXXX instead: harmless in the
// attribute, and a plain character once JavaScript reads it. A photo called
// "Ravi's slab.jpg" is the everyday case, not the attack.
function jsq(s){ return String(s==null?'':s)
  .replace(/[\\'"<>&\r\n\u2028\u2029]/g, c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0')); }

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// The buyer portal dates its header in full — "Saturday, 29 August" — so the

            'September','October','November','December'];
function fdate(d){ if(!d) return ''; const t=new Date(d+(String(d).length===10?'T00:00:00':''));
  if(isNaN(t)) return String(d); return t.getDate()+' '+MON[t.getMonth()]+' '+String(t.getFullYear()).slice(2); }
function ftime(d){ if(!d) return ''; const t=new Date(d); if(isNaN(t)) return '';
  const now=new Date(); const diff=(now-t)/1000;
  if(diff<90) return 'just now';
  if(diff<3600) return Math.round(diff/60)+' min ago';
  if(diff<86400 && now.getDate()===t.getDate()) { let h=t.getHours(), m=String(t.getMinutes()).padStart(2,'0'), ap=h>=12?'pm':'am'; h=h%12||12; return 'today '+h+':'+m+' '+ap; }
  return fdate(t.toISOString().slice(0,10)); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const FRACS = {0:'',1:'⅛',2:'¼',3:'⅜',4:'½',5:'⅝',6:'¾',7:'⅞'};
function mmToIn(mm){
  const v=Number(mm); if(!isFinite(v)) return '';
  const eighths=Math.round(v/25.4*8); const whole=Math.floor(eighths/8); const rem=eighths%8;
  if(whole===0 && rem===0) return '0';
  return (whole||rem===0? whole:'') + (FRACS[rem]||'');
}
function dimsOf(it){
  if(it.l_mm||it.w_mm||it.h_mm){
    const mm=[it.l_mm,it.w_mm,it.h_mm].filter(x=>x!=null&&x!=='').map(x=>Math.round(Number(x))).join(' × ');
    const inch=[it.l_mm,it.w_mm,it.h_mm].filter(x=>x!=null&&x!=='').map(mmToIn).join(' × ');
    return mm+' mm · '+inch+' in';
  }
  if(it.dims_text){
    const t=String(it.dims_text);
    if(/mm/i.test(t)){
      const inch=t.replace(/mm/ig,'in').replace(/\d+(\.\d+)?/g, n=>mmToIn(n));
      return t+' · ≈ '+inch;
    }
    return t;
  }
  return '';
}

function daysUntil(d){
  if(!d) return null;
  const t=new Date(String(d).slice(0,10)+'T00:00:00');
  if(isNaN(t)) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((t-now)/86400000);
}
function countdown(d, done){
  const n=daysUntil(d);
  if(n===null) return '';
  if(done) return '<span class="badge badge--success">Delivered</span>';
  if(n<0) return '<span class="badge badge--alert">'+Math.abs(n)+' day'+(Math.abs(n)===1?'':'s')+' overdue</span>';
  if(n===0) return '<span class="badge badge--pending">Due today</span>';
  return '<span class="badge'+(n<=7?' badge--pending':'')+'">'+n+' day'+(n===1?'':'s')+' to delivery</span>';
}
// plain text version for the mini-stat tiles
function countdownText(d, done){
  const n=daysUntil(d);
  if(n===null) return '—';
  if(done) return 'Delivered';
  if(n<0) return Math.abs(n)+' day'+(Math.abs(n)===1?'':'s')+' overdue';
  if(n===0) return 'Due today';
  return n+' day'+(n===1?'':'s');
}
function initials(s){
  s=String(s||'').replace(/@.*$/,'').replace(/[._-]+/g,' ').trim();
  if(!s) return '··';
  const w=s.split(/\s+/);
  return ((w[0][0]||'')+(w.length>1?(w[w.length-1][0]||''):'')).toUpperCase();
}

function money(v, cur){
  if(v==null||v==='') return '';
  const n=Number(v); if(!isFinite(n)) return '';
  try{ return new Intl.NumberFormat('en-IN',{style:'currency',currency:cur||'INR',maximumFractionDigits:0}).format(n); }
  catch(e){ return (cur||'INR')+' '+n.toLocaleString('en-IN'); }
}

function csvParse(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur='';
      if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); if(row.length>1||row[0]!=='') rows.push(row); }
  return rows;
}

function toast(msg, opts){

  const x=el('<button class="button" aria-label="Dismiss">✕</button>'); x.onclick=()=>t.remove(); t.appendChild(x);
  $('toast').appendChild(t);
  setTimeout(()=>t.remove(), opts.action?12000:4200);
}

function modal(html){

  bg.appendChild(m);

  m.setAttribute('aria-modal','true');
  const heading = m.querySelector('h3');
  if(heading){
    if(!heading.id) heading.id = 'modal-title-'+Math.random().toString(36).slice(2,8);

  // put the caret where the person is about to type, or on the dialog itself
  const first = m.querySelector('input:not([type=hidden]),select,textarea,button');
  if(first) first.focus(); else { m.tabIndex=-1; m.focus(); }
  return {bg, m, close:()=>bg.remove()};

// Passwords have to be typed on a workshop tablet and read out over WhatsApp, so
// they stay as words — but two words from a list of twelve is about a million
// possibilities, which is guessable, and Math.random() is predictable: knowing
// roughly when a password was made narrows it much further. Three words from
// sixty-four, drawn from the browser's cryptographic source, is about two
// billion, and no easier to type.
const PW_WORDS = [
  'Marble','Onyx','Bronze','Ivory','Chisel','Lathe','Kesar','Aravalli',
  'Mewar','Agate','Quartz','Carve','Granite','Basalt','Slate','Jasper',
  'Amber','Copper','Silver','Cobalt','Indigo','Saffron','Cedar','Teak',
  'Walnut','Maple','Willow','Orchid','Jasmine','Lotus','Neem','Banyan',
  'Falcon','Heron','Panther','Ibex','Camel','Bison','Otter','Sparrow',
  'Compass','Anvil','Mallet','Caliper','Trowel','Ladder','Beacon','Harbour',
  'Summit','Canyon','Meadow','Delta','Monsoon','Zephyr','Ember','Lantern',
  'Prism','Marlin','Coral','Pearl','Topaz','Garnet','Opal','Ruby'
];
// A plain remainder would make the first few words slightly likelier than the
// rest; discarding the tail keeps every choice equally likely.
function pwPick(n){
  const a = new Uint32Array(1);
  const limit = Math.floor(4294967296 / n) * n;
  let v;
  do { crypto.getRandomValues(a); v = a[0]; } while (v >= limit);
  return v % n;
}
function genPassword(){
  const w = PW_WORDS;
  return w[pwPick(w.length)]+'.'+w[pwPick(w.length)]+'.'+w[pwPick(w.length)]+'.'+(1000+pwPick(9000));
}
function waLink(phone, text){
  const p=String(phone||'').replace(/[^0-9]/g,'');
  return 'https://wa.me/'+(p?p:'')+'?text='+encodeURIComponent(text);
}

// for accounts created before the split. isStaff() means "anyone on the floor",

const FLOOR_ROLES=['staff','supervisor','worker'];
function isStaff(){ return !!S.profile && FLOOR_ROLES.indexOf(S.profile.role)>=0; }

async function loadCore(){
  const [p,se,st] = await Promise.all([
    sb.from('bt_profiles').select('*').eq('user_id', uid()).maybeSingle(),
    sb.rpc('bt_public_settings'),
    sb.from('bt_stages').select('*').order('sort_order')
  ]);
  if(p.error) throw p.error;
  S.profile = p.data;
  S.settings = (Array.isArray(se.data)? se.data[0] : se.data) || {};
  S.stages = (st.data||[]);
  S.stagesById = {}; S.stages.forEach(s=>S.stagesById[s.id]=s);
}

async function loadStaffData(){
  // Staff never query buyers, POs, comments or documents — the shop floor view only.
  // Pieces come through bt_staff_items() rather than the table, because the row
  // carries rate, taxable_amount, tax and line_total and the floor must never
  // read those. Stage rows are fetched separately since the embed is gone.
  const [it, ist, ph, sp, dc, upd, updi, sti, pr, bt, bi, asg] = await Promise.all([
    sb.rpc('bt_staff_items'),
    sb.from('bt_item_stages').select('*'),
    sb.from('bt_photos').select('*').order('created_at'),
    sb.rpc('bt_staff_pos'),
    sb.from('bt_documents').select('*').order('created_at'),
    sb.from('bt_updates').select('*').order('work_date',{ascending:false}),
    sb.from('bt_update_internal').select('*'),
    sb.from('bt_stage_internal').select('*'),
    sb.rpc('bt_staff_names'),
    // Batches and assignments come through their own floor-safe functions: the
    // tables behind them carry the purchase order, and the floor never sees it.
    sb.rpc('bt_floor_batches'),
    sb.rpc('bt_floor_batch_items'),
    sb.rpc('bt_floor_assignments')
  ]);
  const err=[it,ist,ph,sp].find(r=>r.error);
  if(err) throw err.error;
  const stageRows={};
  (ist.data||[]).forEach(r=>{ (stageRows[r.item_id]=stageRows[r.item_id]||[]).push(r); });

  const shipBy={}; (sp.data||[]).forEach(p=>{ shipBy[p.po_id]={expected_ship_date:p.expected_ship_date, status:p.po_status}; });
  S.buyers=[]; S.buyersById={}; S.pos=[]; S.posById={}; S.comments=[]; S.commentsByItem={};
  S.docsByPo={}; S.docsByItem={}; S.readMarks={}; S.activity=[];
  // An update can be entered by one person on behalf of another, so the floor
  // resolves colleague names through bt_staff_names() — the workshop and the
  // office and nothing else. Opening bt_profiles would also hand it every buyer
  // login's name and company.
  S.profilesAll=((pr&&pr.data)||[]); S.poScope=[];
  indexApprovals([], []);
  indexAllocations([]);
  S.payments=[]; S.charges=[]; indexFinance();
  indexAccounts([],[],[],[]);
  S.updates = upd.data||[]; S.updInternal = {};
  (updi.data||[]).forEach(x=>{ S.updInternal[x.update_id]=x; });
  indexStageInternal((sti&&sti.data)||[]);
  indexUpdates();
  S.items=(it.data||[]).slice().sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
  S.itemsById={}; S.stByItem={};
  const activeStageIds = S.stages.filter(s=>s.active).map(s=>s.id);
  S.items.forEach(x=>{
    S.itemsById[x.id]=x;
    x.po = Object.assign({id:x.po_id, po_number:'', buyer_id:null}, shipBy[x.po_id]||{});
    const rows=(stageRows[x.id]||[]).slice();
    rows.sort((a,c)=>(S.stagesById[a.stage_id]?S.stagesById[a.stage_id].sort_order:999)-(S.stagesById[c.stage_id]?S.stagesById[c.stage_id].sort_order:999));
    S.stByItem[x.id]=rows;
    const done=rows.filter(r=>activeStageIds.includes(r.stage_id)&&(r.status==='completed'||r.status==='skipped')).length;
    const inprog=rows.some(r=>activeStageIds.includes(r.stage_id)&&r.status==='in_progress')?0.5:0;

  S.staffDocs = (dc&&dc.data)||[];

}

/* ---- batches and assignments ----------------------------------------------
   A batch is the floor's name for the pieces that leave together — B-2609-01
   rather than a purchase order number. An assignment is one person, one piece,
   one stage, one day. Superseded assignments stay in the list because they are
   the record of who was on a piece before it changed hands; every screen that
   shows "current" work has to say so. */
function indexFloor(batches, alloc, asg){
  S.batches = (batches||[]).slice().sort((a,b)=>
    String(a.planned_ship_date||'9999').localeCompare(String(b.planned_ship_date||'9999'))
    || String(a.code).localeCompare(String(b.code)));
  S.batchById={}; S.batches.forEach(b=>{ S.batchById[b.id]=b; b.items=[]; });
  S.batchOfItem={};
  (alloc||[]).forEach(r=>{
    S.batchOfItem[r.item_id]=r.batch_id;
    const b=S.batchById[r.batch_id]; if(b) b.items.push(r.item_id);
  });
  S.assignments=(asg||[]).slice().sort((a,b)=>
    String(b.work_date||'').localeCompare(String(a.work_date||''))
    || String(b.created_at||'').localeCompare(String(a.created_at||'')));
  S.asgByItem={};
  S.assignments.forEach(a=>{ (S.asgByItem[a.item_id]=S.asgByItem[a.item_id]||[]).push(a); });
}
function batchOf(itemId){ return S.batchById[S.batchOfItem[itemId]] || null; }
function batchCodeOf(itemId){ const b=batchOf(itemId); return b?b.code:''; }
// The standing assignment for a piece: the one nobody has replaced or finished.
function openAssignment(itemId, stageId){
  return (S.asgByItem[itemId]||[]).find(a=>!a.superseded_by && !a.done_at &&

function assignmentsFor(itemId){ return S.asgByItem[itemId]||[]; }

    (a.assigned_to===me || (a.support||[]).indexOf(me)>=0));
}
function activeStages(){ return (S.stages||[]).filter(s=>s.active); }
// Pieces the floor can see that no batch has claimed yet. Grouped by po_id,
// which is an opaque id on the floor — the shipment they belong to, never a
// number anyone could quote to a buyer.
function unbatchedGroups(){
  const g={};
  (S.items||[]).forEach(it=>{
    if(S.batchOfItem[it.id]) return;
    if(['delivered','cancelled'].includes(it.status)) return;
    (g[it.po_id||'none']=g[it.po_id||'none']||[]).push(it);
  });
  return Object.keys(g).map(k=>({key:k, items:g[k],
    ship:((S.items.find(x=>x.po_id===k)||{}).po||{}).expected_ship_date||null}))
    .sort((a,b)=>String(a.ship||'9999').localeCompare(String(b.ship||'9999')));
}

// returns the workshop and the office and no buyer at all.
function floorPeople(){

  // too — a supervisor needs Yash's name to read "posted by the office", and
  // must not be offered him as somebody to give carving work to. The server
  // refuses that anyway; the form should not have suggested it.
  return (S.profilesAll||[]).filter(p=>p.user_id && p.full_name &&
      p.active!==false && FLOOR_ROLES.indexOf(p.role)>=0)
    .slice().sort((a,b)=>String(a.full_name).localeCompare(String(b.full_name)));
}
function personName(userId){
  const p=(S.profilesAll||[]).find(x=>x.user_id===userId);

  return (S.profile && S.profile.user_id===userId)?(S.profile.full_name||S.profile.email||''):'';
}
// How much work each person is carrying right now — the number a supervisor

function workloadByPerson(){

    n[a.assigned_to]=(n[a.assigned_to]||0)+1;
    (a.support||[]).forEach(s=>{ n[s]=(n[s]||0)+0; });
  });
  return n;
}

/* ---- daily workshop updates ----------------------------------------------
   A daily update is a record inside a stage, not a new stage. Buyers only ever
   receive rows the database has already published; the pending ones are not
   filtered here, they never arrive. */
function indexUpdates(){
  S.updByItem={}; S.photosByUpdate={};
  (S.updates||[]).forEach(u=>{ (S.updByItem[u.item_id]=S.updByItem[u.item_id]||[]).push(u); });
  Object.values(S.updByItem).forEach(l=>l.sort((a,b)=>String(b.work_date).localeCompare(String(a.work_date))
    || String(b.submitted_at).localeCompare(String(a.submitted_at))));

// Planned dates and hold detail. The buyer has no policy on bt_stage_internal,
// so for a buyer this index is simply empty and every helper below returns null
// — the privacy does not depend on any caller remembering to check the role.
function indexStageInternal(rows){
  S.stInternal = {};
  (rows||[]).forEach(r=>{ S.stInternal[r.item_id+'|'+r.stage_id] = r; });
}
function stageInternal(itemId, stageId){ return (S.stInternal||{})[itemId+'|'+stageId] || null; }

function dayGap(a, b){
  if(!a || !b) return null;
  const ms = new Date(b+'T00:00:00') - new Date(a+'T00:00:00');
  return Math.round(ms / 86400000);
}

// A stage is late against its own plan, not against the delivery date: catching
// a slip at moulding is what stops it becoming a slip at dispatch.
function stageDelay(itemId, row){
  if(!row) return null;
  const si = stageInternal(itemId, row.stage_id);
  const planned = si && si.planned_date;
  if(!planned) return null;
  if(row.status === 'completed'){
    const late = dayGap(planned, row.completed_at || today());
    return { planned, done: row.completed_at, days: late,
             state: late > 0 ? 'late' : 'ontime' };
  }
  if(row.status === 'skipped') return null;
  const over = dayGap(planned, today());
  return { planned, done: null, days: over,
           state: over > 0 ? 'overdue' : 'due' };
}

function holdOf(itemId, row){
  if(!row || row.status !== 'on_hold') return null;
  const si = stageInternal(itemId, row.stage_id);
  if(!si) return null;
  if(!si.hold_reason && !si.hold_owner && !si.hold_revised_date) return null;
  return si;
}

// Every piece currently on hold, for the owner's dashboard.
function heldStages(){
  const out = [];
  (S.items||[]).forEach(it=>{
    (S.stByItem[it.id]||[]).forEach(r=>{
      const h = holdOf(it.id, r);
      if(h) out.push({ item: it, row: r, stage: S.stagesById[r.stage_id], hold: h });
    });
  });
  return out;
}

// Stages running past their planned date, worst first.
function lateStages(){
  const out = [];
  (S.items||[]).forEach(it=>{
    (S.stByItem[it.id]||[]).forEach(r=>{
      if(r.status !== 'in_progress' && r.status !== 'on_hold') return;
      const d = stageDelay(it.id, r);
      if(d && d.state === 'overdue') out.push({ item: it, row: r, stage: S.stagesById[r.stage_id], delay: d });
    });
  });
  return out.sort((a,b)=>b.delay.days - a.delay.days);
}

// stage-specific prompts. Guidance, not gates.
const PHOTO_PROMPTS = {
  stone_selection:['Full block or slab','Vein detail','Any defect or repair'],
  dressing_sizing:['Complete product','The face worked today','Dimension check'],
  prod_sizing:['Overall form','Readable measuring tape or caliper'],
  moulding:['Full profile','Detail of the carving'],
  finishing:['Full product','Surface close-up','Edge or corner detail'],
  sealing:['Application coverage','Completed surface'],
  final_photos:['All sides','Dimensions','Finish and any accessories'],
  packing:['Protected product','Closed crate','Shipping label'],
  production_drawing_79:['The drawing as issued','Marked stone against the drawing']
};
function promptsFor(stage){
  if(!stage) return ['Full product','Detail of today\'s work'];
  if(PHOTO_PROMPTS[stage.key]) return PHOTO_PROMPTS[stage.key];
  const n=(stage.name||'').toLowerCase();
  if(n.indexOf('pack')>=0) return PHOTO_PROMPTS.packing;
  if(n.indexOf('finish')>=0||n.indexOf('polish')>=0) return PHOTO_PROMPTS.finishing;
  if(n.indexOf('siz')>=0) return PHOTO_PROMPTS.prod_sizing;
  if(n.indexOf('mould')>=0||n.indexOf('carv')>=0) return PHOTO_PROMPTS.moulding;
  if(n.indexOf('seal')>=0) return PHOTO_PROMPTS.sealing;
  return ['Full product','Detail of today\'s work','Dimension check'];
}

// ---- next action: the single most useful thing to do about an item, right now ----
function nextAction(it){
  const rows=S.stByItem[it.id]||[];
  const appr=rows.find(r=>r.approval==='requested');
  if(appr) return isAdmin()||isStaff()
    ? {t:'Waiting on buyer', k:'wait', stage:S.stagesById[appr.stage_id]}
    : {t:'Your approval needed', k:'you', stage:S.stagesById[appr.stage_id]};
  const chg=rows.find(r=>r.approval==='changes_requested');
  if(chg) return {t:'Changes requested', k:'you', stage:S.stagesById[chg.stage_id]};
  if(!isAdmin()&&!isStaff()){
    if(unreadCount(it.id)) return {t:unreadCount(it.id)+' new message'+(unreadCount(it.id)>1?'s':''), k:'you'};
    const cur=curStage(it);
    return {t:cur?('In '+cur.name):'Scheduled', k:'ok'};
  }
  if(pendingPhotos().some(p=>p.item_id===it.id)) return {t:'Photos to approve', k:'you'};
  if(unreadCount(it.id)) return {t:unreadCount(it.id)+' new message'+(unreadCount(it.id)>1?'s':''), k:'you'};
  const active=S.stages.filter(s=>s.active);
  const byId={}; rows.forEach(r=>byId[r.stage_id]=r);
  const running=active.find(s=>byId[s.id]&&byId[s.id].status==='in_progress');
  if(running) return {t:'In '+running.name.replace(/^Production — /,'')+' — mark done when finished', k:'do', stage:running, mark:true};
  const next=active.find(s=>!byId[s.id]||byId[s.id].status==='pending');
  if(next) return {t:'Ready to move to '+next.name.replace(/^Production — /,''), k:'do', stage:next, mark:false};
  return {t:'All stages complete', k:'ok'};
}
function nextStageFor(it){
  const rows=S.stByItem[it.id]||[]; const byId={}; rows.forEach(r=>byId[r.stage_id]=r);
  const active=S.stages.filter(s=>s.active);
  const running=active.find(s=>byId[s.id]&&byId[s.id].status==='in_progress');
  if(running) return {stage:running, complete:true, label:'Mark '+running.name+' complete', short:'Mark done'};
  const next=active.find(s=>!byId[s.id]||byId[s.id].status==='pending');
  if(!next) return null;
  return {stage:next, complete:false, label:'Move to '+next.name, short:'Move to '+next.name.replace(/^Production — /,'')};
}

// ---- is this item running late, and by how much ----
function lateness(it){
  const due = it.target_date || (it.po && it.po.expected_ship_date);
  if(!due) return null;
  if(['delivered','shipped','made'].includes(it.status)) return null;
  const n = daysUntil(due);
  if(n===null) return null;
  if(n < 0) return {days:Math.abs(n), state:'late'};
  if(n <= 7) return {days:n, state:'soon'};
  return null;
}

// ---- compose the weekly progress message for one buyer ----
function buyerUpdateText(buyerId){
  const b=S.buyersById[buyerId];
  const pos=S.pos.filter(p=>p.buyer_id===buyerId && p.status!=='cancelled' && p.status!=='completed' && p.items.length);
  const co=S.settings.company_name||'Gujraj Impex';
  let lines=[co+' — order update, '+fdate(today())];
  if(!pos.length) return lines.concat(['No open orders at present.']).join('\n');
  pos.forEach(p=>{
    lines.push('');
    lines.push(p.po_number+(p.project?' · '+p.project:''));
    p.items.forEach(it=>{
      const st=curStage(it);
      const late=lateness(it);
      let l='• '+it.product+(it.qty>1?' ×'+(+it.qty):'')+' — '+(st?st.name:'scheduled');
      lines.push(l);
      const due=it.target_date||p.expected_ship_date;
      if(due){
        const n=daysUntil(due);
        lines.push('   '+(late&&late.state==='late'
            ? 'Running '+late.days+' day'+(late.days===1?'':'s')+' past the planned date'
            : (n<=7? 'On track · '+n+' day'+(n===1?'':'s')+' to go' : 'On track'))
          +' · planned '+fdate(due));
      }
    });
    const nph=(S.photosByPo[p.id]||[]).filter(x=>x.status==='approved').length
      + p.items.reduce((a,it)=>a+(S.photosByItem[it.id]||[]).filter(x=>x.status==='approved').length,0);
    if(nph) lines.push('   '+nph+' photo'+(nph>1?'s':'')+' on your tracker');
  });
  const waiting=pendingApprovals().filter(a=>a.item.po && a.item.po.buyer_id===buyerId);
  if(waiting.length){
    lines.push('');
    lines.push('Waiting for your approval:');
    waiting.forEach(a=>lines.push('• '+a.item.product+' — '+(a.stage?a.stage.name:'')));
  }
  lines.push('');
  lines.push('Photos and full detail: '+trackerUrl());
  return lines.join('\n');
}

function updateAge(b){
  if(!b.last_update_sent) return {t:'never sent', k:'you'};
  const d=Math.floor((Date.now()-new Date(b.last_update_sent).getTime())/86400000);
  if(d>=7) return {t:'last sent '+d+' days ago', k:'you'};
  if(d===0) return {t:'sent today', k:'ok'};
  return {t:'sent '+d+' day'+(d===1?'':'s')+' ago', k:'ok'};
}

function searchHits(q){

/* ---- money: what a PO is worth, what came in, what is still owed ----
   Admin-only. S.payments and S.charges are empty for every other role, and the
   database refuses to return them anyway, so these helpers degrade to zero. */
function indexFinance(){
  S.payByPo={}; S.chgByPo={}; S.payByBuyer={};
  (S.payments||[]).forEach(x=>{
    if(x.po_id) (S.payByPo[x.po_id]=S.payByPo[x.po_id]||[]).push(x);
    (S.payByBuyer[x.buyer_id]=S.payByBuyer[x.buyer_id]||[]).push(x);
  });
  (S.charges||[]).forEach(x=>{ (S.chgByPo[x.po_id]=S.chgByPo[x.po_id]||[]).push(x); });
}
function num(v){ const n=Number(v); return isFinite(n)?n:0; }

// One PO's money. Extras are added on top of the PO value; a negative extra is a discount.
function poMoney(p){
  const cur = p.currency || 'INR';
  const value = num(p.amount_total);
  const extras = (S.chgByPo[p.id]||[]).reduce((a,c)=>a+num(c.amount),0);
  const paid = (S.payByPo[p.id]||[]).reduce((a,c)=>a+num(c.amount),0);
  const due = value + extras;
  return { cur, value, extras, paid, due, balance: due - paid,
           hasValue: p.amount_total != null };
}

// A buyer's account, grouped by currency — adding rupees to dollars would be a lie.
function buyerMoney(buyerId){
  const byCur = {};
  const touch = c => (byCur[c] = byCur[c] || { cur:c, due:0, paid:0, balance:0, orders:0, unallocated:0 });
  S.pos.filter(p=>p.buyer_id===buyerId && p.status!=='cancelled').forEach(p=>{
    const m = poMoney(p);
    if(!m.hasValue && !m.extras && !m.paid) return;
    const g = touch(m.cur);
    g.due += m.due; g.paid += m.paid; g.orders++;
  });
  // payments not tied to a PO still reduce what the buyer owes
  (S.payByBuyer[buyerId]||[]).filter(x=>!x.po_id).forEach(x=>{
    const g = touch(x.currency||'INR');
    g.paid += num(x.amount); g.unallocated += num(x.amount);
  });
  Object.values(byCur).forEach(g=>{ g.balance = g.due - g.paid; });
  return Object.values(byCur).sort((a,b)=>b.due-a.due);
}

    admin ? sb.from('bt_buyer_po_scope').select('*') : Promise.resolve({data:[]}),

  S.buyers = b.data||[]; S.buyersById={}; S.buyers.forEach(x=>S.buyersById[x.id]=x);

  S.pos = po.data||[]; S.posById={}; S.items=[]; S.itemsById={}; S.stByItem={};
  const activeStageIds = S.stages.filter(s=>s.active).map(s=>s.id);

  S.lastLoad = Date.now();
}

/* ---- accounting documents -------------------------------------------------
   Copies of what Tally and the GST portal already hold. Nothing here is
   recalculated; the buyer's own policies decide what arrives. */
function indexAccounts(invoices, ewaybills, snapshots, lines){
  S.invoices = invoices||[];
  S.ewaybills = ewaybills||[];
  S.ledgerSnaps = snapshots||[];
  S.ledgerLines = {};
  (lines||[]).forEach(l=>{ (S.ledgerLines[l.snapshot_id]=S.ledgerLines[l.snapshot_id]||[]).push(l); });
  S.invByBuyer = {}; S.ewbByDoc = {};
  S.invoices.forEach(i=>{ (S.invByBuyer[i.buyer_id]=S.invByBuyer[i.buyer_id]||[]).push(i); });
  // an e-way bill names the invoice it dispatches, which is how a consignment
  // finds its way onto the right order without anyone typing a reference
  S.ewaybills.forEach(e=>{ if(e.document_no) S.ewbByDoc[e.document_no]=e; });
}

// The most recent statement for a buyer that the reader is allowed to see.
function latestStatement(buyerId){
  return (S.ledgerSnaps||[]).filter(s=>s.buyer_id===buyerId)
    .sort((a,b)=>String(b.as_of).localeCompare(String(a.as_of)))[0] || null;
}

// A figure with a direction. "Balance" on its own is the ambiguity we are
// trying to remove: on 100% advance terms a buyer is normally in credit, and
// that money is held by us, not owed by them.
function statementStanding(sn){
  if(!sn || sn.closing == null) return null;
  const credit = sn.standing === 'advance_held' || sn.closing_side === 'credit';
  return {
    credit,
    amount: sn.closing,
    currency: sn.currency || 'INR',
    label: credit ? 'Advance held with Gujraj Impex' : 'Outstanding and payable',
    note: credit
      ? 'Paid in advance and not yet drawn against. Nothing is due from you.'
      : 'This amount is payable to Gujraj Impex.',
    as_of: sn.as_of
  };
}

// e-way bills that belong to an order: matched through the invoices raised on it
function ewaybillsForPo(poId){
  const direct = (S.ewaybills||[]).filter(e=>e.po_id===poId);
  const viaInvoice = (S.invoices||[]).filter(i=>i.po_id===poId)
    .map(i=>S.ewbByDoc[i.invoice_no]).filter(Boolean);
  const seen={}; return direct.concat(viaInvoice).filter(e=>!seen[e.id]&&(seen[e.id]=1));
}

function unreadCount(itemId){
  const mark = S.readMarks[itemId] || '1970-01-01';
  return (S.commentsByItem[itemId]||[]).filter(c=>c.author_id!==uid() && c.created_at>mark).length;
}
function pendingApprovals(){

}
function itemsWithUnread(){ return S.items.filter(it=>unreadCount(it.id)>0); }
// Photos attached to a daily update are reviewed in Daily updates, not here —
// approving one in isolation would publish an image without its wording.
function pendingPhotos(){ return S.photos.filter(p=>p.status==='pending' && !p.update_id); }

/* ---- the console's counters -----------------------------------------------
   Every badge on the sidebar comes from here, so a number on the nav and the
   number of rows on the screen it opens can never disagree. */
function queueCounts(){
  const approvals = pendingUpdates().length + pendingPhotos().length;
  const missing   = itemsMissingToday().length;
  const blocked   = blockedItems().length + heldStages().length;
  const decisions = openDecisions().length + pendingApprovals().length;
  const clientUpdates = (S.buyers||[]).filter(b=>b.active &&
    updateAge(b).k==='you' && (S.pos||[]).some(p=>p.buyer_id===b.id && p.status==='open')).length;
  const late = lateStages().length;
  const owed = overdueBuyers();
  return {
    approvals, missing, blocked, decisions, clientUpdates, late,
    workshop: approvals + missing + blocked,
    urgent: decisions + blocked + owed.length,
    overdue: owed.reduce((s,x)=>s+x.amount,0),
    overdueCount: owed.length
  };
}

// A buyer sits "overdue" when a published statement says they owe us. Nothing is
// inferred from a PO value: money owed comes from the books or not at all.
function overdueBuyers(){
  return (S.buyers||[]).map(b=>{
    const sn=latestStatement(b.id);
    const st=statementStanding(sn);
    if(!st || st.credit || !st.amount) return null;
    return { buyer:b, amount:Number(st.amount)||0, as_of:st.as_of, currency:st.currency };
  }).filter(Boolean).sort((a,b)=>b.amount-a.amount);
}

/* One prioritised list of everything waiting on Yash, drawn from the queues that
   used to live on four separate screens. Each row knows its own urgency, which
   filter chip it belongs to, and the single button that deals with it.
     urgency 0 = urgent now, 1 = due today, 2 = waiting on others            */
function ownerActions(){
  const rows=[];
  const push=(o)=>rows.push(o);

  // Money the books say is owed. Never inferred from a PO value.
  overdueBuyers().forEach(o=>{
    const days=dayGap(o.as_of, today());
    push({ urgency:0, chip:'finance', chipLabel:'Finance', icon:'stage-planning',
      type:'finance', title:'Outstanding on the latest statement',
      meta:o.buyer.company+' · '+money(o.amount,o.currency)+' · as at '+fdate(o.as_of),
      sort:-o.amount, action:{label:'Open', go:"go('#/finance')"},
      note:days>0?('Statement is '+days+' day'+(days===1?'':'s')+' old'):'' });
  });

  // The floor has reported a piece stuck.
  blockedItems().forEach(b=>{
    push({ urgency:0, chip:'blocked', chipLabel:'Blocked', icon:'stage-sealing',
      type:'blocked', item:b.item, title:b.item.product+' reported blocked',
      meta:poRef(b.item)+' · '+(b.reason||'no reason recorded'),
      action:{label:'Open', go:"go('#/item/"+b.item.id+"')"},
      note:b.owner?('With '+b.owner):'' });
  });

  // A hold Yash placed himself, still not lifted.
  heldStages().forEach(hd=>{
    push({ urgency:0, chip:'blocked', chipLabel:'Blocked', icon:'stage-sealing',
      type:'blocked', item:hd.item, stage:hd.stage, title:(hd.stage?hd.stage.name:'A stage')+' on hold',
      meta:hd.item.product+' · '+poRef(hd.item)+(hd.hold.hold_reason?' · '+hd.hold.hold_reason:''),
      action:{label:'Lift hold', go:"go('#/item/"+hd.item.id+"')"} });
  });

  // Photographs and daily updates the buyer cannot see until reviewed.
  const nu=pendingUpdates().length, np=pendingPhotos().length;
  if(nu) push({ urgency:1, chip:'approval', chipLabel:'Approvals', icon:'i-camera',
    type:'review', title:'Review '+nu+' workshop update'+(nu===1?'':'s'),
    meta:'Submitted by the floor and not yet published to the buyer',
    action:{label:'Review', go:"go('#/production/review')"} });
  if(np) push({ urgency:1, chip:'approval', chipLabel:'Approvals', icon:'i-camera',
    type:'review', title:'Approve '+np+' photograph'+(np===1?'':'s'),
    meta:'The client cannot see them until you approve',
    action:{label:'Review', go:"go('#/production/review')"} });

  // Pieces with nothing recorded today.
  const miss=itemsMissingToday();
  if(miss.length) push({ urgency:1, chip:'missing', chipLabel:'Missing', icon:'stage-planning',
    type:'missing', item:miss[0], title:'Daily update missing on '+miss.length+' piece'+(miss.length===1?'':'s'),
    meta:miss.slice(0,2).map(i=>i.product).join(', ')+(miss.length>2?' and '+(miss.length-2)+' more':''),
    action:{label:'Remind', go:"go('#/production/missing')"} });

  // Stages past the date they were planned to finish.
  lateStages().slice(0,4).forEach(l=>{
    push({ urgency:1, chip:'late', chipLabel:'Running late', icon:'stage-shipped',
      type:'stage', item:l.item, stage:l.stage,
      title:(l.stage?l.stage.name:'A stage')+' is '+l.delay.days+' day'+(l.delay.days===1?'':'s')+' over',
      meta:l.item.product+' · '+poRef(l.item),
      sort:-l.delay.days, action:{label:'Re-plan', go:"go('#/item/"+l.item.id+"')"} });
  });

  // Buyers who have not had an update in a while.
  const due=(S.buyers||[]).filter(b=>b.active && updateAge(b).k==='you' &&
    (S.pos||[]).some(p=>p.buyer_id===b.id && p.status==='open'));
  due.forEach(b=>push({ urgency:1, chip:'client', chipLabel:'Client updates', icon:'stage-selection',
    type:'publish', title:'Approved progress not sent to '+b.company,
    meta:updateAge(b).label,
    action:{label:'Preview', go:"go('#/clients/updates')"} }));

  // A buyer asked something and nobody has closed it.
  openDecisions().forEach(c=>{
    const it=S.itemsById[c.item_id];
    push({ urgency:1, chip:'decision', chipLabel:'Questions', icon:'stage-selection',
      type:'publish', item:it, title:'Question from the buyer',
      meta:(it?it.product+' · ':'')+String(c.body||'').slice(0,90),
      action:{label:'Open', go:"go('#/item/"+c.item_id+"')"} });
  });

  // Sent to the buyer and now his move, so it sits below Yash's own work.
  pendingApprovals().forEach(a=>{
    push({ urgency:2, chip:'waiting', chipLabel:'With the buyer', icon:'i-check',
      type:'waiting', item:a.item, stage:a.stage,
      title:'Waiting on '+(a.item.po?(S.buyersById[a.item.po.buyer_id]||{}).company||'the buyer':'the buyer'),
      meta:a.item.product+' · '+(a.stage?a.stage.name:''),
      action:{label:'Open', go:"go('#/item/"+a.item.id+"')"} });
  });

  return rows.sort((a,b)=>(a.urgency-b.urgency)||((a.sort||0)-(b.sort||0)));
}

function poRef(item){ return item && item.po ? item.po.po_number : ''; }

// Dated commitments for the week ahead: deliveries, planned stages, nothing invented.
function nextSevenDays(){
  const out=[], t=today();
  (S.pos||[]).forEach(p=>{
    const d=p.expected_ship_date||p.delivery_date;
    if(!d || d<t || dayGap(t,d)>7) return;
    out.push({ date:d, title:'Planned dispatch', meta:p.po_number+' · '+(p.project||''), go:"go('#/po/"+p.id+"')" });
  });
  (S.items||[]).forEach(it=>{
    (S.stByItem[it.id]||[]).forEach(r=>{
      const int_=(S.stInternal||{})[it.id+'|'+r.stage_id];
      if(!int_ || !int_.planned_date) return;
      if(int_.planned_date<t || dayGap(t,int_.planned_date)>7) return;
      if(r.status==='completed'||r.status==='skipped') return;
      out.push({ date:int_.planned_date, title:(S.stagesById[r.stage_id]||{}).name+' planned',
        meta:it.product+' · '+poRef(it), go:"go('#/item/"+it.id+"')" });
    });
  });
  return out.sort((a,b)=>String(a.date).localeCompare(String(b.date))).slice(0,6);
}


/* Which orders need something doing about them. Each bucket answers a question
   Yash actually asks: what is stuck, what is late, what is sitting with the
   buyer, what can go out. */
function poBuckets(open){
  const risk=[], buyer=[], ship=[], attention=[];
  const lateByItem={}; lateStages().forEach(l=>{ lateByItem[l.item.id]=true; });
  const heldByItem={}; heldStages().forEach(h=>{ heldByItem[h.item.id]=true; });
  const blockedByItem={}; blockedItems().forEach(b=>{ blockedByItem[b.item.id]=true; });
  const waitingByItem={}; pendingApprovals().forEach(a=>{ waitingByItem[a.item.id]=true; });
  const decidingPo={}; openDecisions().forEach(c=>{
    const it=S.itemsById[c.item_id]; if(it) decidingPo[it.po_id]=true; });

  (open||[]).forEach(p=>{
    const items=p.items||[];
    const isLate=items.some(i=>lateByItem[i.id]) ||
      (p.expected_ship_date && p.expected_ship_date < today() && p.status!=='completed');
    const isStuck=items.some(i=>heldByItem[i.id]||blockedByItem[i.id]);
    const withBuyer=items.some(i=>waitingByItem[i.id]) || decidingPo[p.id];
    // Shipping is a purchase-order fact, not a product one. The old test read
    // product statuses and a "packing" stage that no longer exists, so this
    // bucket could never fill. One definition of shippable, and it lives in
    // poReadiness().
    const readyToShip=poReadiness(p).shippable;
    if(isLate||isStuck) risk.push(p);
    if(withBuyer) buyer.push(p);
    if(readyToShip) ship.push(p);
    if(isLate||isStuck||withBuyer) attention.push(p);
  });
  return { open:open||[], attention, risk, buyer, ship };
}


/* What the buyer's home page is really answering: where is my work today. The
   most recent published updates across all his pieces, newest first, so the
   first thing he sees is a dated photograph rather than a dashboard. */
function buyerLatest(n){
  const out=[];
  (S.items||[]).forEach(it=>{
    (updatesFor(it.id)||[]).forEach(u=>{
      if(!u.published_at || u.work_status==='no_work') return;
      out.push({ item:it, update:u, stage:S.stagesById[u.stage_id], photos:updatePhotos(u.id) });
    });
  });
  out.sort((a,b)=>String(b.update.work_date).localeCompare(String(a.update.work_date)) ||
    String(b.update.published_at).localeCompare(String(a.update.published_at)));
  return out.slice(0, n||6);
}

// Everything published to this buyer that he can download.
function buyerDocs(buyerId){
  const inv=(S.invoices||[]).filter(i=>i.buyer_id===buyerId && i.published_at)
    .map(i=>({ kind:'Invoice', ref:i.invoice_no, date:i.invoice_date,
      meta:money(i.total,i.currency), path:i.doc_path }));
  const ewb=(S.ewaybills||[]).filter(e=>e.buyer_id===buyerId && e.published_at)
    .map(e=>({ kind:'E-way bill', ref:e.eway_no, date:e.eway_date,
      meta:[e.vehicle,e.transporter].filter(Boolean).join(' · '), path:e.doc_path }));
  const docs=[];
  Object.values(S.docsByPo||{}).forEach(l=>(l||[]).forEach(d=>{

      date:(d.created_at||'').slice(0,10), meta:po.po_number, path:d.path });

// A sidebar entry is "on" for its own page and for anything nested under it.
function navActive(hash){

/* Approvals as a permanent record. A decision is bound to the revision it was
   made against, so a re-request never overwrites what the buyer said before —
   revNo 1 stands even after revision 3 is approved. */
function indexApprovals(revs, decs){
  S.revisions=revs||[];
  S.decisionByRev={}; (decs||[]).forEach(d=>{ S.decisionByRev[d.revision_id]=d; });
  S.revByStage={};
  S.revisions.forEach(r=>{
    const k=r.item_id+'|'+r.stage_id;
    (S.revByStage[k]=S.revByStage[k]||[]).push(r);
  });
  Object.keys(S.revByStage).forEach(k=>
    S.revByStage[k].sort((a,b)=>(b.rev_no||0)-(a.rev_no||0)));
}

// Every round on this piece and stage, newest first, each with its decision.
function approvalHistory(itemId, stageId){
  return (S.revByStage[itemId+'|'+stageId]||[]).map(r=>({
    rev:r, decision:S.decisionByRev[r.id]||null,
    photos:(r.photo_ids||[]).map(id=>(S.photos||[]).find(p=>p.id===id)).filter(Boolean)
  }));
}
// The round still waiting on the buyer, if there is one.
function openRevision(itemId, stageId){
  return (S.revByStage[itemId+'|'+stageId]||[])
    .find(r=>!r.superseded_at && !S.decisionByRev[r.id]) || null;
}
function decisionLabel(d){
  if(!d) return 'Waiting';
  return d.decision==='approved' ? 'Approved' : 'Changes asked for';
}

/* A buyer's activity feed, composed entirely from rows RLS has already handed
   him: completed stages, published updates, released photographs, requests we
   raised and decisions he made. Nothing is read from bt_activity — that log
   carries staff names, photo rejections and internal notes, and it stays
   admin-only. Building the feed from what the buyer can already see means it
   cannot leak something new, whatever is added to the audit log later. */
function buyerActivity(n){
  const ev=[];
  const push=(at, kind, title, detail, href)=>{
    if(at) ev.push({at:String(at), kind, title, detail:detail||'', href:href||''});
  };

  (S.items||[]).forEach(it=>{
    const href='#/item/'+it.id;
    (S.stByItem[it.id]||[]).forEach(r=>{
      const st=S.stagesById[r.stage_id];
      if(!st || !st.active) return;
      if(r.status==='completed' && r.completed_at)
        push(r.completed_at, 'stage', st.name+' finished', it.product, href);
    });
  });

  // only updates we released; the pending and rejected ones never reach him
  (S.updates||[]).filter(u=>u.published_at).forEach(u=>{
    const it=S.itemsById[u.item_id]; if(!it) return;
    push(u.published_at, 'update', 'Progress update', it.product, '#/item/'+it.id);
  });

  // photographs, counted per piece per day so ten shots are one line, not ten
  const shots={};
  visiblePhotos((S.photos||[]).filter(p=>p.item_id)).forEach(p=>{
    const d=String(p.created_at||'').slice(0,10); if(!d) return;
    const k=p.item_id+'|'+d;
    shots[k]=(shots[k]||{n:0, at:p.created_at, item:p.item_id});
    shots[k].n++;
    if(String(p.created_at)>String(shots[k].at)) shots[k].at=p.created_at;
  });
  Object.keys(shots).forEach(k=>{
    const g=shots[k]; const it=S.itemsById[g.item]; if(!it) return;
    push(g.at, 'photo', g.n+' new photograph'+(g.n===1?'':'s'), it.product, '#/photos');
  });

  (S.revisions||[]).forEach(r=>{
    const it=S.itemsById[r.item_id]; if(!it) return;
    const st=S.stagesById[r.stage_id];
    push(r.requested_at, 'ask', 'We asked you to approve '+(st?st.name.toLowerCase():'a stage'),
         it.product, '#/approvals');
    const d=S.decisionByRev[r.id];
    if(d) push(d.decided_at, d.decision==='approved'?'ok':'change',
      d.decision==='approved'?'You approved '+(st?st.name.toLowerCase():'a stage')
                             :'You asked for a change',
      it.product+(d.reason?(' — '+d.reason):''), '#/approvals');
  });

  (S.pos||[]).forEach(p=>{
    if(p.packed_at) push(p.packed_at, 'pack', 'Packed', p.project||p.po_number, '#/po/'+p.id);
    if(p.dispatch_state==='dispatched'||p.dispatch_state==='delivered')
      push(p.updated_at, 'ship', p.dispatch_state==='delivered'?'Delivered':'Dispatched',
           p.project||p.po_number, '#/po/'+p.id);
  });

  ev.sort((a,b)=>b.at.localeCompare(a.at));
  return n?ev.slice(0,n):ev;
}

/* The other half of the same question. "Where is my order" is answered by the
   stages; "what happens next, and is it me you are waiting for" is not, and that
   second one is what actually generates the telephone call. */
function buyerNext(){
  const out=[];
  (S.pos||[]).filter(p=>p.status!=='cancelled' && p.status!=='completed').forEach(p=>{
    const r=poReadiness(p);
    const items=r.items;
    if(!items.length){
      out.push({po:p, who:'us', what:'We are still adding the pieces to this order', when:''});
      return;
    }
    // anything sitting with him outranks anything sitting with us
    const waiting=[];
    items.forEach(it=>(S.stByItem[it.id]||[]).forEach(row=>{
      if(row.approval==='requested'){
        const st=S.stagesById[row.stage_id];
        waiting.push({item:it, stage:st});
      }
    }));
    if(waiting.length){
      out.push({po:p, who:'you',
        what:waiting.length===1
          ? 'Your decision on '+(waiting[0].stage?waiting[0].stage.name.toLowerCase():'a stage')+
            ' — '+waiting[0].item.product
          : waiting.length+' decisions are waiting on you',
        when:'', href:'#/approvals'});
      return;
    }
    if(r.shippable){
      out.push({po:p, who:'us', what:'Ready to leave the workshop', when:''});
      return;
    }
    // otherwise the earliest unfinished stage across the order is the next move
    let soonest=null;
    items.forEach(it=>{
      const now=stageNow(it);
      if(!now) return;
      if(!soonest || now.stage.sort_order<soonest.stage.sort_order)
        soonest={stage:now.stage, item:it, held:now.held};
    });
    out.push({po:p, who:'us',
      what: soonest
        ? (soonest.held?'On hold at ':'Next: ')+soonest.stage.name
        : (r.blocker||'In production'),
      when: p.expected_ship_date?('delivery '+fdate(p.expected_ship_date)):''});
  });
  // the ones needing him first
  out.sort((a,b)=>(a.who==='you'?0:1)-(b.who==='you'?0:1));
  return out;
}

/* Money allocated in Tally to a specific purchase order. Finance is kept at
   buyer level — this is the dispatch control on top of it, and the reason a
   buyer being in credit overall does not release an unrelated order. */
function indexAllocations(rows){
  S.allocations=rows||[];
  S.allocByPo={};
  S.allocations.forEach(a=>{ (S.allocByPo[a.po_id]=S.allocByPo[a.po_id]||[]).push(a); });
}

function poFinance(po){
  const invs=(S.invoices||[]).filter(i=>i.po_id===po.id);
  const invoiced=invs.reduce((a,i)=>a+(+i.total||0),0);
  const allocated=(S.allocByPo[po.id]||[]).reduce((a,x)=>a+(+x.amount||0),0);
  const outstanding=Math.max(invoiced-allocated,0);
  const cleared=!!po.finance_cleared;
  let state='verification_pending';
  if(!invs.length)                       state='not_invoiced';
  else if(cleared && outstanding<=0)     state='cleared';
  else if(allocated<=0)                  state='not_received';
  else if(outstanding>0)                 state='part_paid';
  return { invoiced, allocated, outstanding, invoices:invs.length, cleared, state,
    label:{not_invoiced:'Not invoiced', cleared:'Completely cleared',
           not_received:'Payment not received', part_paid:'Part paid',
           verification_pending:'Payment received — verification pending'}[state] };
}

// The target image for a piece: what the buyer ordered, not what it looks like
// mid-production. Falls back to the earliest released photograph.
function targetImage(it){
  const list=visiblePhotos((S.photosByItem[it.id]||[]));
  const t=list.find(p=>p.photo_type==='target') || list.find(p=>!p.stage_id) || list[0];
  return t||null;
}

function visiblePhotos(list){
  list=list||[];
  if(isAdmin()||isStaff()) return list;
  const published={}; (S.updates||[]).forEach(u=>{ if(u.published_at) published[u.id]=1; });
  // approved is not enough: a daily-update photo also needs its update published
  return list.filter(p=>p.status==='approved' && (!p.update_id || published[p.update_id]));
}

async function signedUrl(path){
  const c=S.urlCache[path];
  if(c && c.exp>Date.now()) return c.url;
  const {data,error} = await sb.storage.from(CONFIG.bucket).createSignedUrl(path, 3600);
  if(error||!data) return '';
  S.urlCache[path]={url:data.signedUrl, exp:Date.now()+50*60*1000};
  return data.signedUrl;
}
async function hydrateImages(root){
  const nodes=(root||document).querySelectorAll('[data-ph-path]');
  for(const n of nodes){
    const p=n.getAttribute('data-ph-path');
    const u=await signedUrl(p);
    if(!u) continue;
    if(n.tagName==='IMG') n.src=u; else n.style.backgroundImage='url('+u+')';
    n.setAttribute('data-ph-url', u);
  }
}

async function resizeImage(file, maxDim, quality){
  maxDim=maxDim||1600; quality=quality||0.82;
  try{
    const bmp=await createImageBitmap(file);
    const scale=Math.min(1, maxDim/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*scale), h=Math.round(bmp.height*scale);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h);
    const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',quality));
    return blob||file;
  }catch(e){ return file; }
}

function trackerUrl(){
  return (S.settings && S.settings.tracker_url) || (location.origin+location.pathname);
}

/* ---------------------------------------------------------------------------
   The owner's product page — the five questions, and the panels behind them.

   The old page was a timeline with controls attached to it, which answers
   "what are the stages" rather than the questions Yash is actually holding when
   he opens a piece. Everything below is derived from real rows; where the data
   does not exist the answer says so rather than inventing a value.
--------------------------------------------------------------------------- */

// The stage the piece is on right now: the running one, else the last completed.
function stageNow(it){
  const rows=S.stByItem[it.id]||[]; const by={}; rows.forEach(r=>by[r.stage_id]=r);
  const active=S.stages.filter(s=>s.active);
  const running=active.find(s=>by[s.id]&&by[s.id].status==='in_progress');
  const held=active.find(s=>by[s.id]&&by[s.id].status==='on_hold');
  const s=running||held||active.slice().reverse().find(s=>by[s.id]&&by[s.id].status==='completed')||active[0];
  if(!s) return null;
  const idx=active.findIndex(x=>x.id===s.id);
  const row=by[s.id]||{status:'pending',approval:'none',stage_id:s.id};
  // running / held describe THIS stage, not "is anything anywhere held" — the
  // first cut of this asked the wrong question and reported a piece on hold
  // because a later stage was.
  return { stage:s, row:row,
           internal:stageInternal(it.id, s.id), number:idx+1, total:active.length,
           running:row.status==='in_progress', held:row.status==='on_hold' };
}

// The stage a piece is actually on — never a deactivated one. Pointers go stale
// when the workflow changes (nine stages replaced fourteen and every piece was
// left reading "Order Confirmed"). Screens must never name a stage the workshop
// no longer works, whatever the row says.
function curStage(it){
  if(!it) return null;
  const s=S.stagesById[it.current_stage_id];
  if(s && s.active) return s;
  const n=stageNow(it);
  return n?n.stage:null;
}

// Photographs waiting on Yash for this piece, and the update they belong to.
function itemPending(it){
  return (S.photosByItem[it.id]||[]).filter(p=>p.status==='pending');
}
function itemUpdatesWaiting(it){
  return (S.updByItem[it.id]||[]).filter(u=>u.review_status==='pending');
}
function itemApprovedUnsent(it){
  return (S.updByItem[it.id]||[]).filter(u=>
    (u.review_status==='approved'||u.review_status==='partially_approved') && !u.published_at);
}

// The five answers. Each is {q, a, sub} — and `sub` is allowed to be empty.
function itemAnswers(it){
  const now=stageNow(it);
  const pend=itemPending(it);
  const waiting=itemUpdatesWaiting(it);
  const late=lateness(it);
  const nxt=nextStageFor(it);
  const feed=(S.updByItem[it.id]||[]);
  const lastUpd=feed[0];
  const lastPhoto=(S.photosByItem[it.id]||[]).slice()
    .sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0];

  // Where is it
  const where = now
    ? { a: now.stage.name, sub: 'Stage '+now.number+' of '+now.total+
        (now.held?' · on hold':(now.row.started_at?' · started '+fdate(now.row.started_at):' · not started')) }
    : { a:'Not started', sub:'' };

  // What happened
  let happened={a:'Nothing yet', sub:'No update or photograph on this piece'};
  if(lastUpd || lastPhoto){
    const updNewer = lastUpd && (!lastPhoto ||
      String(lastUpd.submitted_at||lastUpd.work_date) >= String(lastPhoto.created_at));
    if(updNewer){
      happened={ a: workStatusLabel(lastUpd),
        sub: fdate(lastUpd.work_date)+' · '+(staffName(lastUpd.submitted_by)||'the workshop') };
    } else {
      const n=(S.photosByItem[it.id]||[]).filter(p=>p.created_at&&p.created_at.slice(0,10)===String(lastPhoto.created_at).slice(0,10)).length;
      happened={ a: n+' photograph'+(n===1?'':'s')+' added', sub: ftime(lastPhoto.created_at) };
    }
  }

  // Is it delayed
  let delayed={a:'On track', sub:''};
  const plan = now && now.internal && now.internal.planned_date;
  if(now && now.held) delayed={a:'On hold', sub:(now.internal&&now.internal.hold_reason)||'Reason not recorded'};
  else if(late && late.state==='late') delayed={a:late.days+' day'+(late.days===1?'':'s')+' late', sub:'Against '+(it.target_date?'the target date':'the ship date')};
  else if(plan && daysUntil(plan)<0 && now.row.status!=='completed')
    delayed={a:'Behind plan', sub:'This stage was planned for '+fdate(plan)};
  else {
    const due=it.target_date||(it.po&&it.po.expected_ship_date);
    delayed={a:'On track', sub:plan?('Stage planned '+fdate(plan)):(due?('Piece due '+fdate(due)):'')};
  }

  // What needs approval
  let appr={a:'Nothing waiting', sub:''};
  const gate = now && now.row.approval==='requested';
  if(waiting.length) appr={a:waiting.length+' update'+(waiting.length===1?'':'s'), sub:'Submitted by the workshop, not yet reviewed'};
  else if(pend.length) appr={a:pend.length+' photograph'+(pend.length===1?'':'s'), sub:'Waiting on your review'};
  else if(gate) appr={a:'Buyer decision', sub:'Approval requested at '+now.stage.name};
  else if(itemApprovedUnsent(it).length) appr={a:'Approved, not sent', sub:'The buyer cannot see it until you publish'};

  // What happens next
  const next = nxt
    ? { a: nxt.complete?('Complete '+nxt.stage.name):nxt.stage.name,
        sub: nxt.complete?'Then the piece moves on':'Once this stage is finished' }
    : { a:'Nothing left', sub:'Every stage is done' };

  return [
    {q:'Where is it?',           a:where.a,     sub:where.sub},
    {q:'What happened?',         a:happened.a,  sub:happened.sub},
    {q:'Is it delayed?',         a:delayed.a,   sub:delayed.sub, warn:/late|hold|Behind/i.test(delayed.a)},
    {q:'What needs approval?',   a:appr.a,      sub:appr.sub,    warn:appr.a!=='Nothing waiting'},
    {q:'What happens next?',     a:next.a,      sub:next.sub}
  ];
}

function workStatusLabel(u){
  if(!u) return '';
  if(u.work_status==='no_work')  return 'No work logged';
  if(u.work_status==='blocked')  return 'Reported blocked';
  return 'Work logged';
}

  const out=[];
  const now=stageNow(it);
  const waiting=itemUpdatesWaiting(it);
  const pend=itemPending(it);
  const unsent=itemApprovedUnsent(it);
  if(waiting.length) out.push({ title:'Review '+waiting.length+' workshop update'+(waiting.length===1?'':'s'),
    sub:'Submitted '+fdate(waiting[0].work_date)+' · nothing reaches the buyer until you approve it',
    action:'Review', run:"go('#/production/review')" });
  if(pend.length) out.push({ title:'Review '+pend.length+' photograph'+(pend.length===1?'':'s'),
    sub:'Uploaded by the workshop · the buyer cannot see them yet',
    action:'Review', run:"go('#/production/photos')" });
  if(unsent.length) out.push({ title:'Approved work not sent to the buyer',
    sub:unsent.length+' update'+(unsent.length===1?' is':'s are')+' approved but unpublished',
    action:'Publish', run:"go('#/production/review')" });
  if(now && now.held) out.push({ title:'This stage is on hold',
    sub:((now.internal&&now.internal.hold_reason)||'No reason recorded')+
        ((now.internal&&now.internal.hold_revised_date)?(' · revised to '+fdate(now.internal.hold_revised_date)):''),
    action:'Open', run:"toggleStage('"+it.id+"',"+now.stage.id+")" });
  if(now && now.row.approval==='requested') out.push({ title:'Waiting on the buyer',
    sub:'Approval requested at '+now.stage.name, action:'', run:'' });
  const cmt=(S.commentsByItem[it.id]||[]).filter(c=>c.author_role==='buyer' && !c.resolved_at);

    sub:'Left against a stage on this piece', action:'Open', run:"go('#/item/"+it.id+"')" });
  if(!out.length) out.push({ title:'Nothing is holding this piece up',
    sub:(now && now.internal && now.internal.planned_date)
        ? ('Next checkpoint: '+now.stage.name+' by '+fdate(now.internal.planned_date))
        : 'No decision is waiting on you', action:'', run:'', calm:true });

}

/* ---------------------------------------------------------------------------
   Reports — exceptions and bottlenecks first.

   Every figure here is computed from stage rows, updates and photographs that
   already exist. Where the underlying data is thin the report says so rather
   than filling the gap with a plausible number, because a wrong average here
   would be acted on.
--------------------------------------------------------------------------- */

// How long each stage actually takes, and how that compares with the plan.
function cycleTimeByStage(){
  const acc={};
  (S.items||[]).forEach(it=>{
    (S.stByItem[it.id]||[]).forEach(r=>{
      if(r.status!=='completed' || !r.started_at || !r.completed_at) return;
      const d=dayGap(r.started_at, r.completed_at);
      if(d===null || d<0) return;
      const a=acc[r.stage_id]=acc[r.stage_id]||{days:[], slips:[]};
      a.days.push(d);
      const si=stageInternal(it.id, r.stage_id);
      if(si && si.planned_date){
        const s=dayGap(si.planned_date, r.completed_at);
        if(s!==null) a.slips.push(s);
      }
    });
  });
  const avg=l=>l.length?(l.reduce((x,y)=>x+y,0)/l.length):null;
  const out=S.stages.filter(s=>s.active).map(s=>{
    const a=acc[s.id];
    return { stage:s, n:a?a.days.length:0, avg:a?avg(a.days):null, slip:a?avg(a.slips):null };
  }).filter(x=>x.n>0);
  const worst=out.reduce((m,x)=>Math.max(m, x.avg||0), 0);
  out.forEach(x=>{ x.pct = worst? Math.max(4, Math.round((x.avg/worst)*100)) : 0; });
  return out;
}

// Did the workshop post an update, on the days it should have?
function updateCompliance(){
  const active=(S.items||[]).filter(it=>it.status!=='delivered'&&it.status!=='cancelled');
  const t=today();
  const posted=id=>(S.updByItem[id]||[]);
  const todayN=active.filter(it=>posted(it.id).some(u=>u.work_date===t)).length;

  const dayList=(back,len)=>{
    const out=[]; const d=new Date(t+'T00:00:00');
    d.setDate(d.getDate()-back);
    for(let i=0;i<len;i++){ out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()-1); }
    return out;
  };
  const rate=days=>{
    let want=0, got=0;
    active.forEach(it=>{ days.forEach(d=>{ want++; if(posted(it.id).some(u=>u.work_date===d)) got++; }); });
    return want?Math.round((got/want)*100):null;
  };
  const ph=(S.photos||[]).filter(p=>p.status==='approved'||p.status==='rejected');
  const approved=ph.length?Math.round((ph.filter(p=>p.status==='approved').length/ph.length)*100):null;
  const reviewed=(S.updates||[]).filter(u=>u.reviewed_at&&u.submitted_at);
  const sameDay=reviewed.length
    ? Math.round((reviewed.filter(u=>String(u.reviewed_at).slice(0,10)===String(u.submitted_at).slice(0,10)).length/reviewed.length)*100)
    : null;

  return { today:todayN, of:active.length,
           thisWeek:rate(dayList(0,7)), lastWeek:rate(dayList(7,7)),
           photosApproved:approved, sameDayReview:sameDay,
           missing:active.filter(it=>!posted(it.id).some(u=>u.work_date===t)) };
}

// Which orders are actually at risk, and the reason in one line.
function deliveryRisk(){
  const out=[];
  (S.pos||[]).filter(p=>p.status!=='cancelled'&&p.status!=='completed').forEach(p=>{
    const items=(p.items||[]).length?p.items:(S.items||[]).filter(i=>i.po_id===p.id);
    if(!items.length) return;
    const reasons=[]; let level=0;   // 0 on track, 1 watch, 2 at risk
    items.forEach(it=>{
      (S.stByItem[it.id]||[]).forEach(r=>{
        if(r.status==='on_hold'){
          const si=stageInternal(it.id, r.stage_id);
          reasons.push((si&&si.hold_reason)||((S.stagesById[r.stage_id]||{}).name+' is on hold'));
          level=2;
        }
        if(r.approval==='requested'){
          reasons.push('Waiting on the buyer at '+((S.stagesById[r.stage_id]||{}).name||'a stage'));
          level=Math.max(level,1);
        }
        const d=stageDelay(it.id, r);
        if(d && d.state==='overdue' && d.days>0){
          reasons.push(((S.stagesById[r.stage_id]||{}).name||'A stage')+' is '+d.days+' day'+(d.days===1?'':'s')+' past its planned date');
          level=Math.max(level,2);
        }
      });
    });
    const n=daysUntil(p.expected_ship_date);
    if(n!==null && n<0){ reasons.push('Ship date passed '+Math.abs(n)+' day'+(Math.abs(n)===1?'':'s')+' ago'); level=2; }
    else if(n!==null && n<=14){ reasons.push('Ships in '+n+' day'+(n===1?'':'s')); level=Math.max(level,1); }
    const noUpd=items.filter(it=>!(S.updByItem[it.id]||[]).some(u=>u.work_date===today())).length;
    if(noUpd===items.length && items.length){ reasons.push('No update logged today'); level=Math.max(level,1); }
    out.push({ po:p, level, reasons:[...new Set(reasons)].slice(0,3),
      label: level===2?'At risk':level===1?'Watch':'On track' });
  });
  out.sort((a,b)=>b.level-a.level || String(a.po.expected_ship_date||'9').localeCompare(String(b.po.expected_ship_date||'9')));
  return out;
}

/* ---------------------------------------------------------------------------
   Reporting figures.

   Two rules here. Nothing is invented: where a number cannot be computed from
   rows that exist, the report says so. And nothing is dressed up as a
   prediction — "delivery confidence" is a stated arithmetic of the exceptions
   against an order, not a forecast, and the page says which exceptions.
--------------------------------------------------------------------------- */

function reportWindow(){ return window.__repDays||30; }
function setReportWindow(n){ window.__repDays=n; render(); }

// A day list, newest first.
function lastDays(n, back){
  const out=[]; const d=new Date(today()+'T00:00:00');
  d.setDate(d.getDate()-(back||0));
  for(let i=0;i<n;i++){ out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()-1); }
  return out;
}

// Compliance for each of the last n days, oldest first — the series behind the chart.
function complianceSeries(n){
  const active=(S.items||[]).filter(it=>it.status!=='delivered'&&it.status!=='cancelled');
  return lastDays(n).reverse().map(d=>{
    if(!active.length) return {d, pct:null};
    const got=active.filter(it=>(S.updByItem[it.id]||[]).some(u=>u.work_date===d)).length;
    return {d, pct:Math.round((got/active.length)*100)};
  });
}

// Average days a stage is running past its planned date, right now.
function avgStageDelay(){
  const l=[];
  (S.items||[]).forEach(it=>(S.stByItem[it.id]||[]).forEach(r=>{
    const d=stageDelay(it.id,r);
    if(d && (d.state==='overdue'||d.state==='late') && d.days>0) l.push(d.days);
  }));
  return l.length?(l.reduce((a,b)=>a+b,0)/l.length):null;
}

// Money owed to Gujraj Impex, aged by the date the invoice was raised. There is
// no payment-term field on an invoice, so it cannot be aged against a due date
// and the page says as much rather than implying one.
function receivableAgeing(){
  const inv=(S.invoices||[]).filter(i=>i.published_at);
  const paid=(S.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);
  const total=inv.reduce((a,i)=>a+(+i.total||0),0);
  const buckets=[{k:'0–30 days',v:0},{k:'31–60 days',v:0},{k:'61–90 days',v:0},{k:'Over 90 days',v:0}];
  inv.forEach(i=>{
    const age=Math.abs(dayGap(String(i.invoice_date).slice(0,10), today())||0);
    const b=age<=30?0:age<=60?1:age<=90?2:3;
    buckets[b].v += (+i.total||0);
  });
  return { total, paid, outstanding: Math.max(0, total-paid), buckets,
           currency:(inv[0]&&inv[0].currency)||'INR', n:inv.length };
}

// Active pieces by the stage they are sitting in, and where the queue is longest.
function productionFlow(){
  const active=(S.items||[]).filter(it=>it.status!=='delivered'&&it.status!=='cancelled');
  const rows=S.stages.filter(s=>s.active).map(s=>({
    stage:s, items:active.filter(it=>it.current_stage_id===s.id)
  })).filter(r=>r.items.length);
  const max=rows.reduce((m,r)=>Math.max(m,r.items.length),0);
  rows.forEach(r=>{ r.pct=max?Math.round((r.items.length/max)*100):0; });
  // the constraint is the busiest stage, and the longest wait inside it
  let constraint=null;
  rows.forEach(r=>{ if(!constraint || r.items.length>constraint.items.length) constraint=r; });
  if(constraint){
    let worst=0;
    constraint.items.forEach(it=>{
      const row=(S.stByItem[it.id]||[]).find(x=>x.stage_id===constraint.stage.id);
      if(row && row.started_at){ const d=dayGap(row.started_at, today()); if(d>worst) worst=d; }
    });
    constraint.longest=worst;
  }
  return { rows, constraint, active:active.length };
}

// How likely an order is to land on its promised date, expressed as the
// exceptions counted against it. Not a forecast — an arithmetic of what is wrong.
function deliveryConfidence(){
  return deliveryRisk().map(r=>{
    let score=100; const why=[];
    r.reasons.forEach(x=>{
      if(/on hold|hold/i.test(x)){ score-=35; }
      else if(/past its planned date/i.test(x)){ score-=25; }
      else if(/Ship date passed/i.test(x)){ score-=30; }
      else if(/Waiting on the buyer/i.test(x)){ score-=15; }
      else if(/No update logged today/i.test(x)){ score-=10; }
      else if(/Ships in/i.test(x)){ score-=5; }
      why.push(x);
    });
    const items=(r.po.items||[]).length||1;
    const done=((r.po.items||[]).reduce((a,i)=>a+i.progress,0)/items);
    score=Math.max(5, Math.min(99, Math.round(score*0.75 + done*25)));
    const stage=((r.po.items||[]).map(i=>curStage(i)).filter(Boolean)
      .sort((a,b)=>a.sort_order-b.sort_order)[0]||{}).name||'Not started';
    return { po:r.po, level:r.level, label:r.label, score, why, stage };
  }).sort((a,b)=>a.score-b.score);
}

function reportKPIs(){
  const conf=deliveryConfidence();
  const uc=updateCompliance();
  const ag=receivableAgeing();
  const delay=avgStageDelay();
  const onTime=conf.length?Math.round(conf.reduce((a,c)=>a+c.score,0)/conf.length):null;
  return {
    onTime, atRisk:conf.filter(c=>c.level===2).length,
    compliance:uc.of?Math.round((uc.today/uc.of)*100):null, uc,
    delay, ageing:ag, series:complianceSeries(14)
  };
}

// Everything the owner should be told before being shown a chart.
function reportExceptions(){
  const out=[];
  const conf=deliveryConfidence();
  conf.filter(c=>c.level===2).slice(0,2).forEach(c=>out.push({
    level:2, title:c.po.po_number+' may miss '+(c.po.expected_ship_date?fdate(c.po.expected_ship_date):'its date'),
    sub:c.why[0]||'Exceptions recorded against this order', run:"go('#/po/"+c.po.id+"')" }));
  const flow=productionFlow();
  if(flow.constraint && flow.constraint.items.length>=3) out.push({
    level:1, title:flow.constraint.stage.name+' is the busiest stage',
    sub:flow.constraint.items.length+' pieces are sitting here'+
      (flow.constraint.longest?(', the longest for '+flow.constraint.longest+' day'+(flow.constraint.longest===1?'':'s')):''),
    run:"go('#/production')" });
  const uc=updateCompliance();
  if(uc.missing.length) out.push({
    level:1, title:uc.missing.length+' workshop update'+(uc.missing.length===1?'':'s')+' missing',
    sub:'Nothing has been logged today for '+uc.missing.slice(0,2).map(i=>i.product).join(', ')+
      (uc.missing.length>2?' and others':''),
    run:"go('#/production/missing')" });
  return out.slice(0,3);
}
