/* ChatGPT's approvalsView(), reproduced element for element: .buyer-filterbar,
   one .approval-po-group per purchase order with its .approval-po-header, an
   .approval-item-audited per decision, and the .audit-source note beneath.
   History keeps his .table inside a .card. His fixed sample values are replaced
   by this buyer's records; the reason he gave is carried in the <small> he uses
   elsewhere in the same table idiom, because a decision history that does not
   say what was asked for is not a record. */
function vBuyerApprovals(){
  const view=S.apprView||'pending';

  // pending: an open revision on one of his pieces
  const pending=[];
  (S.revisions||[]).forEach(r=>{
    if(r.superseded_at || S.decisionByRev[r.id]) return;
    const it=S.itemsById[r.item_id]; if(!it) return;
    pending.push({rev:r, item:it, stage:S.stagesById[r.stage_id], po:S.posById[it.po_id]});
  });
  // decided: every recorded round, newest first
  const decided=[];
  (S.revisions||[]).forEach(r=>{
    const d=S.decisionByRev[r.id]; if(!d) return;
    const it=S.itemsById[r.item_id]; if(!it) return;
    decided.push({rev:r, item:it, stage:S.stagesById[r.stage_id], po:S.posById[it.po_id], dec:d});
  });
  decided.sort((a,b)=>String(b.dec.decided_at).localeCompare(String(a.dec.decided_at)));

  // overdue first, then due today, then due soon, then the rest — but never at
  // the cost of breaking the purchase-order grouping
  const t=today();
  const rank=x=>{
    if(!x.rev.due_at) return 3;
    if(x.rev.due_at < t) return 0;
    if(x.rev.due_at === t) return 1;
    return 2;
  };
  pending.sort((a,b)=>rank(a)-rank(b) ||
    String(a.po&&a.po.po_number).localeCompare(String(b.po&&b.po.po_number)) ||
    (a.item.sort_order||0)-(b.item.sort_order||0));

  const first=pending[0];
  const head=sfHead('Buyer decisions · grouped by purchase order','Approvals.',
    'Open a purchase order, identify the product visually and decide on the exact revision. Nothing from another order is mixed into this queue.',
    first?'<button class="button" type="button" onclick="mBuyerDecision(\''+first.item.id+'\','+first.rev.stage_id+')">'+
      'Review pending decision</button>':'');

  const bar='<div class="buyer-filterbar">'+
    '<button type="button" class="'+(view==='pending'?'active':'')+'" onclick="setApprView(\'pending\')">Pending · '+pending.length+'</button>'+
    '<button type="button" class="'+(view==='history'?'active':'')+'" onclick="setApprView(\'history\')">Decision history · '+decided.length+'</button>'+
    '<span>Purchase order → product → exact approval revision</span>'+
    '</div>';

  // group whichever list is showing under its purchase order
  const groupBy=list=>{
    const g={}, order=[];
    list.forEach(x=>{ if(!g[x.item.po_id]){ g[x.item.po_id]=[]; order.push(x.item.po_id); } g[x.item.po_id].push(x); });
    return order.map(id=>({po:S.posById[id], rows:g[id]})).filter(x=>x.po);
  };

  const item=x=>{
    const img=targetImage(x.item);
    const label=x.rev.label||('R'+x.rev.rev_no);
    const qty=(+x.item.qty||1);
    return '<article class="approval-item-audited">'+
      '<figure>'+
        (img?'<img alt="'+esc(x.item.product)+' target product" data-ph-path="'+esc(img.path)+'">':'')+
        '<figcaption>Target product</figcaption></figure>'+
      '<div><p class="eyebrow">'+esc([x.item.item_code, qty+' piece'+(qty===1?'':'s')].filter(Boolean).join(' · '))+'</p>'+
        '<h3>'+esc(x.item.product)+'</h3>'+
        '<p><strong>'+esc((x.stage?x.stage.name:'Stage')+' '+label)+'.</strong> '+
          esc(x.rev.note||'Please review the approved photographs and confirm.')+'</p>'+
        '<div class="approval-meta-line">'+
          '<span>Requested <strong>'+esc(x.rev.requested_at?fdate(x.rev.requested_at):'—')+'</strong></span>'+
          '<span>Due <strong>'+esc(x.rev.due_at?(x.rev.due_at<t?'Overdue':(x.rev.due_at===t?'Today':fdate(x.rev.due_at))):'Not set')+'</strong></span>'+
          '<span>Impact <strong>'+esc(x.rev.impact||'Production waits')+'</strong></span>'+
        '</div></div>'+
      '<button class="button" type="button" onclick="mBuyerDecision(\''+x.item.id+'\','+x.rev.stage_id+')">'+
        'Review '+esc(label)+'</button>'+
      '</article>';
  };

  let body=bar;
  if(view==='pending'){
    const groups=groupBy(pending);
    if(!groups.length) body+='<section class="card"><div class="empty">'+
      '<h2>Nothing is waiting on you.</h2><p>We will tell you here the moment a decision needs you.</p></div></section>';
    else body+=groups.map(g=>
      '<section class="approval-po-group">'+
        '<header class="approval-po-header"><div>'+
          '<p class="eyebrow">'+esc(g.po.po_number+(g.po.expected_ship_date?' · shipment '+fdate(g.po.expected_ship_date):''))+'</p>'+
          '<h2>'+esc(g.po.project||g.po.po_number)+'</h2></div>'+
          sfBadge(g.rows.length+' decision'+(g.rows.length===1?'':'s')+' due','warning')+'</header>'+
        g.rows.map(item).join('')+
      '</section>').join('');
    body+='<div class="audit-source" style="margin-top:11px">'+icon('i-check','icon-sm')+'<div>'+
      '<strong>Decision integrity</strong>Approval, change request, identity, time, note and exact revision '+
      'form a permanent record. A revised item creates a new decision; it never overwrites this one.'+
      '</div></div>';
  } else if(!decided.length){
    body+='<section class="card"><div class="empty">'+
      '<h2>No decisions recorded yet.</h2><p>Everything you approve or send back is kept here permanently.</p></div></section>';
  } else {
    body+='<section class="card"><div class="table-wrap"><table class="table">'+
      '<thead><tr><th>Purchase order</th><th>Product</th><th>Decision</th><th>Revision</th>'+
      '<th>Result</th><th>Decided by</th><th>Date</th><th></th></tr></thead><tbody>'+
      decided.map(x=>{
        const ok=x.dec.decision==='approved';
        const label=x.rev.label||('R'+x.rev.rev_no);
        return '<tr><td>'+esc(x.po?x.po.po_number:'')+'</td>'+
          '<td><strong>'+esc(x.item.product)+'</strong>'+(x.item.item_code?'<small>'+esc(x.item.item_code)+'</small>':'')+'</td>'+
          '<td>'+esc(x.stage?x.stage.name:'')+'</td>'+
          '<td>'+esc(label)+'</td>'+
          '<td>'+sfBadge(ok?'Approved':'Changes asked', ok?'success':'warning')+
            (x.dec.reason?'<small>'+esc('“'+x.dec.reason+'”')+'</small>':'')+'</td>'+
          '<td>'+esc(x.dec.decided_by===uid()?((S.profile&&S.profile.full_name)||'You'):'Your organisation')+'</td>'+
          '<td>'+esc(x.dec.decided_at?fdate(x.dec.decided_at):'')+'</td>'+
          '<td><button class="button quiet small" type="button" onclick="go(\'#/item/'+x.item.id+'\')">View</button></td></tr>';
      }).join('')+
      '</tbody></table></div></section>';
  }

  sfPaint(head+body);
}

/* Photographs, grouped the way a buyer holds the job in his head: the purchase
   order he raised, the piece on it, and the stage the picture was taken at.
   Grouping by piece alone made a buyer with two orders scroll a single flat run
   of products and work out for himself which order each belonged to. */
/* The six filters the photograph rules ask for. Each one narrows the set; none
   of them changes the order → piece → stage grouping, so a photograph never
   loses the context that says which order and which piece it belongs to. */
/* Photographs, in ChatGPT's photosView markup: the .po-photo-toolbar, one
   <details class="buyer-po-photo-group"> per purchase order with his summary
   facts, .po-gallery-product per piece, .product-stage-photo-row per stage, and
   the PO's own .po-shipment-gallery. The hierarchy is the point: a picture
   always says which order, which piece and which stage it belongs to, and
   packing belongs to the order, never to one piece. */
function photoFilterBar(shownPos){
  const f=S.photoFilter||{};
  const pos=(S.pos||[]).filter(p=>(p.items||[]).length || (S.photos||[]).some(x=>x.po_id===p.id));
  const on=(c,label,js)=>'<button type="button" class="'+(c?'active':'')+'" onclick="'+js+'">'+esc(label)+'</button>';
  const n=shownPos==null?pos.length:shownPos;
  return '<nav class="po-photo-toolbar" aria-label="Filter photograph archive">'+
    on(!f.po && !f.kind,'All purchase orders',"setPhotoFilter({})")+
    pos.map(p=>on(f.po===p.id, p.po_number, "setPhotoFilter({po:'"+p.id+"'})")).join('')+
    on(f.kind==='new','New this week',"setPhotoFilter({kind:'new'})")+
    on(f.kind==='final','Final photographs',"setPhotoFilter({kind:'final'})")+
    on(f.kind==='ship','Packing and shipment',"setPhotoFilter({kind:'ship'})")+
    '<span>'+n+' purchase order'+(n===1?'':'s')+' shown</span>'+
    '</nav>';
}

function sfThumbs(list, cap){
  return list.slice(0,3).map(p=>
    '<button class="stage-photo-thumb" type="button" onclick="openPhoto(event,this)" '+
      'data-ph-path="'+esc(p.path)+'" data-cap="'+esc(p.caption||cap||'')+'">'+
      '<img alt="'+esc(p.caption||cap||'Approved photograph')+'" data-ph-path="'+esc(p.path)+'"></button>').join('');
}

function vBuyerPhotos(){
  const f=S.photoFilter||{};
  const weekAgo=lastDays?lastDays(7)[0]:null;
  const lastStage=(S.stages.filter(x=>x.active).slice(-1)[0]||{}).id;
  // A filter narrows what is shown; it never flattens the order → piece → stage
  // shape, because that shape is how the buyer knows what he is looking at.
  const keep=p=>{
    if(f.po && (p.item_id? (S.itemsById[p.item_id]||{}).po_id!==f.po : p.po_id!==f.po)) return false;
    if(f.item && p.item_id!==f.item) return false;
    if(f.stage && String(p.stage_id)!==String(f.stage)) return false;
    if(f.kind==='new' && !(weekAgo && String(p.created_at).slice(0,10)>=weekAgo)) return false;
    if(f.kind==='final' && String(p.stage_id)!==String(lastStage)) return false;
    if(f.kind==='ship' && p.item_id) return false;
    return true;
  };
  const byItem={}, shipByPo={};
  visiblePhotos((S.photos||[]).filter(p=>!p.log_date)).filter(keep).forEach(p=>{
    if(p.item_id) (byItem[p.item_id]=byItem[p.item_id]||[]).push(p);
    // Packing, crates, loading and dispatch belong to the ORDER, because goods
    // ship per purchase order. Filing them under one piece would say the order
    // shipped when only that piece was photographed.
    else if(p.po_id) (shipByPo[p.po_id]=shipByPo[p.po_id]||[]).push(p);
  });

  const head=sfHead('Approved visual record · purchase order first','Photographs.',
    'Start with a purchase order, then open each product’s released photographs stage by stage. Packing and shipment photographs belong once to the order.');
  const note='<div class="buyer-permission photo-structure-note"><strong>Permanent hierarchy</strong>'+
    'Production photographs belong to a product and a stage. Packing, crate, carrier and dispatch photographs belong to the '+
    'purchase-order shipment. Only images we have checked and released appear here.</div>';

  if(!Object.keys(byItem).length && !Object.keys(shipByPo).length){
    const filtered=!!(f.po||f.item||f.stage||f.kind);
    sfPaint(head+photoFilterBar(0)+'<section class="card"><div class="empty">'+
      (filtered
        ? '<h2>No released photographs match this filter.</h2>'+
          '<p><button class="button quiet small" type="button" onclick="setPhotoFilter({})">Show all purchase orders</button></p>'
        : '<h2>No photographs have been released yet.</h2>'+
          '<p>They appear here as each stage is checked.</p>')+
      '</div></section>'+note);
    return;
  }

  // order → pieces on that order that have pictures
  const byPo={};
  Object.keys(byItem).forEach(id=>{
    const it=S.itemsById[id]; if(!it) return;
    (byPo[it.po_id]=byPo[it.po_id]||[]).push(it);
  });
  Object.keys(shipByPo).forEach(id=>{ byPo[id]=byPo[id]||[]; });

  const pos=Object.keys(byPo).map(id=>S.posById[id]).filter(Boolean)
    .sort((a,b)=>String(b.po_date||'').localeCompare(String(a.po_date||'')));

  const active=S.stages.filter(s=>s.active);
  const stageOrder={}; S.stages.forEach(s=>{ stageOrder[s.id]=s.sort_order; });

  const body=pos.map(p=>{
    const pieces=byPo[p.id].slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    const total=pieces.reduce((a,it)=>a+byItem[it.id].length,0);
    const ship=(shipByPo[p.id]||[]).slice()
      .sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
    const r=poReadiness(p);

    const products=pieces.map(it=>{
      // stage → pictures taken at that stage. A picture with no stage on it is
      // still the buyer's to see, so it gets its own group rather than vanishing.
      const byStage={};
      byItem[it.id].forEach(ph=>{ const k=ph.stage_id||'none'; (byStage[k]=byStage[k]||[]).push(ph); });
      const keys=Object.keys(byStage).sort((a,b)=>{
        if(a==='none') return 1; if(b==='none') return -1;
        return (stageOrder[a]||0)-(stageOrder[b]||0);
      });
      const rows=keys.map(k=>{
        const st=k==='none'?null:S.stagesById[k];
        const list=byStage[k].slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
        const n=st?active.findIndex(s=>s.id===st.id):-1;
        const latest=list[0]&&list[0].created_at?fdate(list[0].created_at):'';
        const name=(n>=0?(n+1)+' · ':'')+(st?st.name:'Other photographs');
        return '<article class="product-stage-photo-row">'+
          '<div class="stage-photo-copy"><strong>'+esc(name)+'</strong><span>'+esc(latest||'Released')+'</span></div>'+
          '<div class="stage-photo-thumbs">'+sfThumbs(list, (st?st.name:'')+' · '+it.product)+
            '<span>'+list.length+' released item'+(list.length===1?'':'s')+'</span></div>'+
          '<button class="button secondary small" type="button" onclick="go(\'#/item/'+it.id+'\')">View all '+list.length+'</button>'+
          '</article>';
      }).join('');
      const img=targetImage(it);
      return '<article class="po-gallery-product">'+
        '<header class="po-gallery-product-head">'+
          '<figure class="po-gallery-product-image">'+
            (img?'<img alt="'+esc(it.product)+' target product" data-ph-path="'+esc(img.path)+'">':'')+
            '<span>Target product</span></figure>'+
          '<div class="po-gallery-product-copy"><p class="eyebrow">'+esc(it.item_code||'')+'</p>'+
            '<h3>'+esc(it.product)+'</h3>'+
            '<span>'+esc([it.stone, dimsOf(it), keys.length+' released stage'+(keys.length===1?'':'s')]
              .filter(Boolean).join(' · '))+'</span></div>'+
          '<button class="button quiet small" type="button" onclick="go(\'#/item/'+it.id+'\')">Open product</button>'+
        '</header>'+
        '<div class="product-stage-gallery">'+rows+'</div></article>';
    }).join('');

    // The order's own shipment record: one gallery for the whole consignment,
    // kept out of the pieces so it can never read as "this piece has shipped".
    const shipBlock='<section class="po-shipment-gallery">'+
      (ship.length
        ? '<div><strong>'+esc(p.po_number)+' packing and shipment photographs</strong>'+
          '<span>'+ship.length+' released item'+(ship.length===1?'':'s')+' for the whole order.</span>'+
          '<div class="stage-photo-thumbs" style="margin-top:8px">'+sfThumbs(ship,'Packing and shipment')+'</div></div>'+
          '<button class="button secondary small" type="button" onclick="openPhoto(event,this.previousElementSibling.querySelector(\'.stage-photo-thumb\'))">'+
          'View</button>'
        : '<div><strong>'+esc(p.po_number)+' packing and shipment photographs</strong><span>'+
          (r.packed
            ? 'Packed. They will appear here once we have checked them.'
            : 'Not available yet. They are published once every product on this order is complete and packed.')+
          '</span></div><button class="button secondary small" type="button" disabled>Awaiting PO packing</button>')+
      '</section>';

    return '<details class="buyer-po-photo-group" open><summary>'+
      '<div class="po-photo-title"><span class="po-photo-chevron">›</span><div>'+
        '<p class="eyebrow">'+esc(p.po_number)+'</p>'+
        '<h2>'+esc(p.project||p.po_number)+' <span>· '+pieces.length+' product'+(pieces.length===1?'':'s')+'</span></h2>'+
      '</div></div>'+
      '<div class="po-photo-fact"><span>Released product media</span><strong>'+total+' item'+(total===1?'':'s')+'</strong></div>'+
      '<div class="po-photo-fact"><span>PO shipment</span><strong>'+
        esc(p.expected_ship_date?fdate(p.expected_ship_date):'To be confirmed')+'</strong></div>'+
      '<div class="po-photo-fact"><span>Shipping media</span><strong>'+
        (ship.length?(ship.length+' item'+(ship.length===1?'':'s')):'Not available')+'</strong></div>'+
      sfBadge(r.stateLabel)+'</summary>'+
      '<div class="po-product-gallery-list">'+
        (products||'<div class="empty"><p>No product photographs released on this order yet.</p></div>')+
      '</div>'+shipBlock+'</details>';
  }).join('');

  sfPaint(head+photoFilterBar(pos.length)+'<section class="buyer-po-gallery">'+body+'</section>'+note);
}

/* Every document the buyer has been given, in ChatGPT's documentsView markup:
   .document-summary counts, his .buyer-filterbar, one .table inside a .card, the
   .final-pack-card per order and the .buyer-permission note. Drawings stay tied
   to a product, invoices and ledgers to the account, packs to a purchase order. */
function buyerDocRows(){
  const bid=S.profile.buyer_id, rows=[];
  const poNum=id=>{ const p=S.posById[id]; return p?p.po_number:'Your account'; };

  (S.invoices||[]).filter(i=>i.buyer_id===bid && i.published_at).forEach(i=>{
    rows.push({group:'finance', name:i.invoice_no||'Invoice', sub:'Official Tally invoice',
      type:'Tally invoice', related:poNum(i.po_id), revision:'Uploaded from Tally',
      published:i.published_at||i.invoice_date, status:'Current', path:i.doc_path});
  });
  (S.ewaybills||[]).filter(e=>e.buyer_id===bid && e.published_at).forEach(e=>{
    const live=!e.valid_until || String(e.valid_until)>=today();
    rows.push({group:'finance', name:e.eway_no||'E-way bill',
      sub:[e.vehicle,e.transporter].filter(Boolean).join(' · ')||'Transport document',
      type:'E-way bill', related:poNum(e.po_id), revision:'Issued on the portal',
      published:e.published_at||e.eway_date, status:live?'Current':'Expired', path:e.doc_path});
  });
  (S.ledgerSnaps||[]).filter(x=>x.buyer_id===bid && x.published_at).forEach(x=>{
    rows.push({group:'finance', name:'Ledger statement', sub:'As at '+fdate(x.as_of),
      type:'Tally ledger', related:'Your account', revision:'Copied from Tally',
      published:x.published_at||x.as_of, status:'Current', path:null, snap:x});
  });
  Object.values(S.docsByPo||{}).forEach(l=>(l||[]).forEach(d=>{
    const po=S.posById[d.po_id];
    if(!po || po.buyer_id!==bid || d.for_buyer===false) return;
    const t=String(d.doc_type||'').toLowerCase();
    const isPo=/purchase|^po$|order/.test(t);
    const it=d.item_id?S.itemsById[d.item_id]:null;
    rows.push({group:isPo?'po':'drawing', name:d.name||'Document',
      sub:it?it.product:(d.doc_type||'Published file'),
      type:d.doc_type||'Document', related:it?(po.po_number+' · '+it.product):po.po_number,
      revision:it?'Current for this product':'Current',
      published:d.created_at, status:'Current', path:d.path});
  }));
  return rows.sort((a,b)=>String(b.published).localeCompare(String(a.published)));
}

// The final pack is one download per order: the Tally invoice plus the
// production record. It exists only once the order is finished, its evidence
// approved and its money cleared — so the card states which of those is missing
// instead of offering a button that would fail.
function finalPackCard(po){
  const r=poReadiness(po), fin=poFinance(po);
  const done=r.made>=r.pieces && r.pieces>0;
  const ready=done && fin.cleared;
  const why=!r.pieces?'This order has no products on it yet.'
    :!done?'Not yet available. It is prepared once every product on this order is finished and its photographs approved.'
    :(!fin.cleared?'Production is complete. The pack is released once the amount allocated against this order is cleared.'
      :'Ready. It contains the official Tally invoice and the production record with stage photographs, final views and dimensional evidence.');
  return '<section class="final-pack-card" style="margin-top:11px"><div>'+
    '<h3>'+esc(po.po_number)+' final invoice pack</h3><p>'+esc(why)+'</p></div>'+
    sfBadge(ready?'Ready':(done?'Awaiting payment clearance':'Awaiting final production'), ready?'success':'warning')+
    '</section>';
}

  const chip=(k,label,c)=>'<button type="button" class="'+(filter===k?'active':'')+'" onclick="setDocFilter(\''+k+'\')">'+
    esc(label)+' · '+c+'</button>';
  const bar='<div class="buyer-filterbar">'+
    chip('all','All documents',all.length)+chip('drawing','Drawings',n('drawing'))+
    chip('po','Purchase orders',n('po'))+chip('finance','Tally finance',n('finance'))+
    '<span>'+docs.length+' current file'+(docs.length===1?'':'s')+'</span></div>';

  const table=docs.length
    ? '<section class="card"><div class="table-wrap"><table class="table">'+

      '<th>Published</th><th>Status</th><th></th></tr></thead><tbody>'+
      docs.map(d=>'<tr><td><strong>'+esc(d.name)+'</strong><small>'+esc(d.sub||'')+'</small></td>'+
        '<td>'+esc(d.type)+'</td><td>'+esc(d.related)+'</td><td>'+esc(d.revision)+'</td>'+
        '<td>'+esc(d.published?fdate(d.published):'—')+'</td>'+
        '<td>'+sfBadge(d.status, d.status==='Current'?'success':'warning')+'</td>'+
        '<td>'+(d.path?'<button class="button quiet small" type="button" onclick="openDoc(\''+jsq(d.path)+'\')">Open</button>'
               :(d.snap?'<a class="button quiet small" href="#/finance">View</a>':''))+'</td></tr>').join('')+
      '</tbody></table></div></section>'
    : '<section class="card"><div class="empty"><h2>'+
      (filter==='all'?'No documents yet.':'Nothing in this group yet.')+'</h2>'+
      '<p>Drawings, purchase orders, invoices and shipment papers appear here as they are published to you.</p></div></section>';

  sfPaint(head+summary+bar+table+pos.map(finalPackCard).join('')+
    '<div class="buyer-permission" style="margin-top:11px"><strong>Document authority</strong>'+
    'StoneFlow does not calculate accounts or generate the official invoice. Tally PDFs are uploaded and verified by '+
    esc(S.settings.company_name||'Gujraj Impex')+'; StoneFlow keeps the organised record you see here.</div>');
}

/* ChatGPT's financeView: the four .metric tiles, the .ledger-card with his
   .ledger-top and .ledger-facts, the Tally invoice table carrying PO allocation
   and dispatch clearance, and the .buyer-page-grid footer. Every figure is
   copied from a posted document — nothing on this page is recalculated. */
function vBuyerFinance(){
  if(!financeVisible()){
    sfPaint(sfHead('Finance permission not enabled on this login','Your account.',
      'Invoices, balances and payment clearance are shown only to buyer users your organisation has given finance access.')+
      '<section class="card"><div class="empty"><h2>This login does not include finance access.</h2>'+
      '<p>Ask us to enable it, or use the account that your finance team signs in with.</p></div></section>'+
      '<div class="buyer-permission" style="margin-top:11px"><strong>Separate finance permission</strong>'+
      'Only authorised buyer users may see invoices, ledger balances and payment clearance. Workshop users never receive finance access.</div>');
    return;
  }
  const bid=S.profile.buyer_id;
  const b=S.buyersById[bid]||{};
  const sn=latestStatement(bid), st=statementStanding(sn);
  const inv=(S.invByBuyer[bid]||[]).filter(i=>i.published_at)
    .sort((a,b2)=>String(b2.invoice_date).localeCompare(String(a.invoice_date)));
  const allocFor=i=>(S.allocations||[]).filter(a=>a.invoice_id===i.id)
    .reduce((a,x)=>a+(+x.amount||0),0);
  const totInv=inv.reduce((a,i)=>a+(+i.total||0),0);
  const totAll=inv.reduce((a,i)=>a+allocFor(i),0);

  const head=sfHead('Tally-backed buyer account · organisation scope','Your account.',
    'The balance belongs to '+(b.company||'your organisation')+' as a buyer. Purchase-order references explain allocation and dispatch clearance; they do not create separate ledgers.',
    '');

  if(!st && !inv.length){
    sfPaint(head+'<section class="card"><div class="empty"><h2>Nothing has been published to your account yet.</h2>'+
      '<p>Invoices and your ledger appear here as they are posted in our books.</p></div></section>');
    return;
  }

  const metrics='<section class="summary">'+

/* ChatGPT's messagesView: his .message-shell with the .thread-list rail, the

function sfInitials(name){
  const w=String(name||'').trim().split(/\s+/).filter(Boolean);

  return (w[0][0]+(w[1]?w[1][0]:'')).toUpperCase();
}
function vBuyerMessages(){
  const byItem={};
  (S.comments||[]).forEach(c=>{ if(c.item_id) (byItem[c.item_id]=byItem[c.item_id]||[]).push(c); });
  const threads=Object.keys(byItem).filter(id=>S.itemsById[id]).map(id=>{
    const it=S.itemsById[id];
    const list=byItem[id].slice().sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));

  const head=sfHead('Buyer-safe conversations · attached to the work','Messages.',

  const sel=threads.find(t=>t.id===S.thread)||threads[0];

      'aria-label="Search conversations" oninput="filterBuyerThreads(this.value)"></div>'+
    threads.map(t=>'<button type="button" class="thread-select sf-thread-button'+(t.id===sel.id?' active':'')+'" '+
      'data-thread-search="'+esc(t.title+' '+t.context)+'" onclick="sfSelectBuyerThread(\''+t.id+'\')">'+
      '<strong>'+esc(t.title)+'</strong><span>'+esc(t.preview)+'</span>'+
      '<small><span>'+esc(t.context)+'</span><span>'+esc(ftime(t.last.created_at))+'</span></small></button>').join('')+
    '</aside>';

  const us=S.settings.company_name||'Gujraj Impex';
  const main='<main class="thread-main">'+
    '<header class="thread-head"><div><p class="eyebrow">'+esc(sel.context)+'</p>'+
      '<h2>'+esc(sel.title)+'</h2><p>'+sel.list.length+' message'+(sel.list.length===1?'':'s')+
      ' · last '+esc(ftime(sel.last.created_at))+'</p></div>'+
      '<button class="button quiet small" type="button" onclick="go(\'#/item/'+sel.id+'\')">Open product</button></header>'+
    '<div class="thread-body">'+sel.list.map(c=>{
      const mine=c.author_role!=='admin';
      const who=mine?(c.author_name||'You'):us;
      return '<div class="comment"><span class="comment-avatar">'+esc(sfInitials(who))+'</span>'+
        '<div><strong>'+esc(who)+' <time>'+esc(ftime(c.created_at))+'</time></strong>'+

    }).join('')+'</div>'+
    '<div class="message-composer"><textarea id="sf-msg" aria-label="Write a comment" '+
      'placeholder="Write a question or comment about '+esc(sel.title)+'"></textarea>'+
      '<button class="button" type="button" onclick="sendThreadComment(\''+sel.id+'\')">Send</button></div>'+
    '</main>';

/* ---------------------------------------------------------------------------
   People & access.

   Built from the newer ADMIN handoff. Every login in one list, grouped by what
   it can reach, with the actual scope spelled out rather than implied. The scope
   lines are not decoration: each one names a boundary that is enforced by a
   policy in the database, so this page doubles as the plain-English version of
   the security audit.
--------------------------------------------------------------------------- */

const ACCESS_GROUPS=[
  ['all',      'Everyone'],
  ['buyer',    'Buyer access'],
  ['staff',    'Workshop'],
  ['admin',    'Office & finance'],
  ['nologin',  'No login yet'],
  ['attention','Needs attention']
];

// One row per person or company, with what that login actually reaches.
function accessPeople(){
  const out=[];
  (S.profilesAll||[]).forEach(p=>{
    const b=p.buyer_id?S.buyersById[p.buyer_id]:null;
    const last=(S.activity||[]).find(a=>a.actor_id===p.user_id);
    out.push({
      kind:'person', id:p.user_id, profile:p, buyer:b,
      name:p.full_name||shortLogin(p.email||'')||'Unnamed',
      identity:FLOOR_ROLES.indexOf(p.role)>=0?shortLogin(p.email||''):(p.email||''),
      org:b?b.company:(S.settings.company_name||'Gujraj Impex'),
      role:accessRoleLabel(p),
      scope:accessScopeLabel(p, b),
      lastAt:last?last.created_at:null,
      attention:accessAttention(p, b)
    });
  });
  // A buyer company with no login cannot see anything — that is worth surfacing
  // here rather than leaving Yash to notice the absence.
  (S.buyers||[]).forEach(b=>{
    if((S.profilesAll||[]).some(p=>p.buyer_id===b.id)) return;
    out.push({ kind:'company', id:b.id, buyer:b, name:b.company,
      identity:'No login yet', org:b.company, role:'Buyer company',
      scope:'Cannot sign in', lastAt:null,
      attention:['This company has no login, so nobody there can see their orders'] });
  });
  return out;
}

function accessRoleLabel(p){
  if(p.role==='admin') return 'Owner administrator';
  if(p.role==='supervisor') return 'Workshop supervisor';
  if(p.role==='worker') return 'Workshop labourer';
  if(p.role==='staff') return 'Workshop staff';
  return p.finance_access===false?'Buyer — progress only':'Buyer administrator';
}

function accessScopeLabel(p, b){
  if(p.role==='admin') return 'Everything, including prices';
  if(p.role==='supervisor') return 'Every piece on the floor, and who is on what';
  if(p.role==='worker') return 'Only the work assigned to them today';
  if(p.role==='staff') return 'Every piece on the floor';
  const n=(S.pos||[]).filter(x=>x.buyer_id===p.buyer_id).length;
  return n+' order'+(n===1?'':'s')+(p.finance_access===false?'':' · account');
}

function accessAttention(p, b){
  const out=[];
  if(FLOOR_ROLES.indexOf(p.role)>=0 && !p.phone) out.push('No WhatsApp number, so a reminder has nowhere to go');
  if(p.role==='buyer' && !p.buyer_id) out.push('Buyer login with no company attached — it can see nothing');
  if(p.role==='buyer' && b && !b.active) out.push('The company is marked inactive');
  const seen=(S.activity||[]).some(a=>a.actor_id===p.user_id);
  if(!seen && p.role!=='admin') out.push('Has never done anything in StoneFlow');
  return out;
}

// What this login can and cannot reach, in the words of the boundary itself.
function accessPermissions(p){
  if(!p) return [];
  if(p.role==='admin') return [
    [true,'Every order, buyer, price and payment'],
    [true,'Approve photographs and publish updates to buyers'],
    [true,'Create and remove logins'],
    [true,'Read the internal activity log']
  ];
  if(FLOOR_ROLES.indexOf(p.role)>=0) return [
    [true,'Every piece being made, its stages, sizes and target dates'],
    [true,'Upload photographs and post the daily update'],
    [true,'Read workshop notes, planned dates and holds'],
    [false,'Buyer or company names'],
    [false,'Order numbers, prices, payments or invoices'],
    [false,'Buyer comments and documents'],
    [false,'Publish anything to a buyer without your approval']
  ];
  const fin=p.finance_access!==false;
  return [
    [true,'Their own company’s orders and pieces'],
    [true,'Approved photographs and published updates'],
    [true,'Approve stages and leave comments'],
    [fin,'Invoices, e-way bills and the statement'],
    [false,'Any other buyer’s orders'],
    [false,'Staff names, internal notes, planned dates or holds'],
    [false,'Photographs you have not approved']
  ];
}

// Every stage on every piece: what was planned, what happened, and the gap.
function vStagePerf(){
  if(!isAdmin()) return vHome();
  const rows=[];
  (S.items||[]).forEach(it=>{
    (S.stByItem[it.id]||[]).forEach(r=>{
      const st=S.stagesById[r.stage_id]; if(!st) return;
      const si=stageInternal(it.id, r.stage_id)||{};
      const took=(r.started_at&&r.completed_at)?dayGap(r.started_at,r.completed_at):null;
      const slip=(si.planned_date&&r.completed_at)?dayGap(si.planned_date,r.completed_at):null;
      rows.push({it, st, r, si, took, slip});

  rows.sort((a,b)=>a.it.product.localeCompare(b.it.product) || (a.st.sort_order-b.st.sort_order));
  let body='<section class="panel"><div class="panel__body"><div class="data-table-wrap"><table class="data-table">'+
    '<tr><th>Piece</th><th>Stage</th><th>Status</th><th>Planned</th><th>Started</th><th>Finished</th><th>Took</th><th>Vs plan</th></tr>'+
    rows.map(x=>'<tr><td>'+esc(x.it.product)+'</td><td>'+esc(x.st.name)+'</td>'+

/* ---- tiny inline charts: no library, no network, and they print ---- */
function sparkline(vals, w, h){
  const v=vals.filter(x=>x!==null);
  if(v.length<2) return '<svg class="spark" viewBox="0 0 '+(w||90)+' '+(h||28)+'"></svg>';
  w=w||90; h=h||28;
  const min=Math.min.apply(null,v), max=Math.max.apply(null,v), span=(max-min)||1;
  const pts=vals.map((x,i)=>{
    if(x===null) return null;
    return [ (i/(vals.length-1))*w, h-2-((x-min)/span)*(h-4) ];
  }).filter(Boolean);
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/></svg>';
}
function lineChart(series, target){
  const w=520, h=150, pad=22;
  const vals=series.map(s=>s.pct);
  const pts=series.map((s,i)=>{
    if(s.pct===null) return null;
    return [ pad+(i/Math.max(1,series.length-1))*(w-pad*2), h-pad-(s.pct/100)*(h-pad*2) ];
  }).filter(Boolean);
  const ty=h-pad-((target||95)/100)*(h-pad*2);
  return '<svg class="lchart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img" '+
    'aria-label="Daily update compliance over the last '+series.length+' days">'+
    '<line class="lchart__axis" x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'"/>'+
    '<line class="lchart__target" x1="'+pad+'" y1="'+ty+'" x2="'+(w-pad)+'" y2="'+ty+'"/>'+
    (pts.length>1?'<polyline class="lchart__line" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>':'')+
    pts.map(p=>'<circle class="lchart__dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5"/>').join('')+
    '<text class="lchart__lbl" x="'+pad+'" y="'+(h-6)+'">'+esc(fdate(series[0].d))+'</text>'+
    '<text class="lchart__lbl" x="'+(w-pad)+'" y="'+(h-6)+'" text-anchor="end">today</text>'+
    '</svg>';
}
function donut(parts, total, cur){
  const R=54, C=2*Math.PI*R;
  let off=0;
  const seg=parts.filter(p=>p.v>0).map((p,i)=>{
    const frac=total?p.v/total:0;
    const el='<circle class="donut__seg donut__seg--'+i+'" r="'+R+'" cx="70" cy="70" '+
      'stroke-dasharray="'+(frac*C).toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-off*C).toFixed(2)+'"/>';
    off+=frac; return el;
  }).join('');
  return '<div class="donut-wrap"><svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Receivable by age">'+
    '<circle class="donut__bg" r="'+R+'" cx="70" cy="70"/>'+seg+'</svg>'+
    '<div class="donut__mid"><strong>'+esc(money(total,cur))+'</strong><span>invoiced</span></div></div>'+
    '<div class="donut-key">'+parts.map((p,i)=>'<div><i class="key key--'+i+'"></i>'+esc(p.k)+
      '<strong>'+esc(money(p.v,cur))+'</strong></div>').join('')+'</div>';
}

/* ---------------------------------------------------------------------------
   The shipment-readiness strip.

   The same five checks for the owner and the buyer, from the same function, so
   nobody is ever told a different story about why an order has not shipped. The
   owner additionally gets the buttons that change it.
--------------------------------------------------------------------------- */
function readinessStrip(po, opts){
  opts=opts||{};
  const r=poReadiness(po);
  const admin=isAdmin();
  return '<section class="panel'+(opts.tight?'':' space-top-16')+'"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Shipment readiness</h3>'+
    '<p class="panel__description">'+
      (r.shippable
        ? 'Everything on this order is done. It can be dispatched.'
        : 'Goods ship once every piece on the order is made, packed and paid for.')+
    '</p></div>'+
    badge(r.stateLabel, r.state==='dispatched'||r.state==='delivered'?'success':r.shippable?'success':'pending')+
    '</div><div class="panel__body">'+
    '<div class="ready-steps">'+r.steps.map(s=>
      '<div class="ready-step'+(s.ok?' is-ok':'')+'">'+
      '<span class="ready-step__tick">'+(s.ok?'✓':'')+'</span>'+
      '<div><strong>'+esc(s.k)+'</strong><span>'+esc(s.v)+'</span></div></div>').join('')+'</div>'+
    (r.blocker
      ? '<p class="ready-blocker">'+esc(r.blocker)+'</p>'
      : '<p class="ready-blocker ready-blocker--ok">Nothing is outstanding on this order.</p>')+
    (admin?readinessActions(po, r):'')+
    '</div></section>';
}

function readinessActions(po, r){
  const b=[];
  if(!r.packed && r.made===r.pieces && r.pieces)
    b.push('<button class="button button--secondary" type="button" onclick="mPacked(\''+po.id+'\')">Mark packed</button>');
  if(r.packed && !r.cleared)
    b.push('<button class="button button--secondary" type="button" onclick="mClearFinance(\''+po.id+'\')">Clear payment</button>');
  if(po.dispatch_state!=='dispatched' && po.dispatch_state!=='delivered')
    b.push('<button class="button'+(r.shippable?'':' button--secondary')+'" type="button" onclick="mDispatch(\''+po.id+'\')">Mark dispatched</button>');
  if(po.dispatch_state==='dispatched')
    b.push('<button class="button button--secondary" type="button" onclick="mDelivered(\''+po.id+'\')">Mark delivered</button>');
  b.push('<button class="button button--quiet" type="button" onclick="mShip(\''+po.id+'\')">Shipping details</button>');
  return '<div class="button-row space-top-12">'+b.join('')+'</div>';
}

/* ---------------------------------------------------------------------------
   The supervisor's floor.

   Kunal and Hitesh ran the workshop from the same single scrolling list a
   labourer sees, which meant "who is on what today" was something they held in
   their heads. These three screens are that question written down: Today (what
   is happening and what is missing), Work & people (who does the next piece),
   and Shipment batches (what leaves together, and when).

   Everything here is floor-safe by construction: it reads S.items, S.batches
   and S.assignments, which arrive through bt_staff_items(), bt_floor_batches()
   and bt_floor_assignments(). None of those return a buyer, a purchase order
   number or a rupee. There is nothing to hide in the markup because none of it
   ever reaches the browser.
--------------------------------------------------------------------------- */

function supCounts(){
  const open=(S.items||[]).filter(it=>!['delivered','cancelled','made'].includes(it.status));
  const due=open.filter(it=>!updateToday(it.id)).length;
  const blocked=open.filter(it=>(S.stByItem[it.id]||[]).some(r=>r.status==='on_hold')).length;
  const tasks=(S.assignments||[]).filter(a=>!a.superseded_by && !a.done_at);
  const unanswered=tasks.filter(a=>a.ack_state==='pending').length;
  const stuck=tasks.filter(a=>a.ack_state==='cannot_start'||a.ack_state==='clarify').length;
  const unassigned=open.filter(it=>!openAssignment(it.id)).length;
  const unbatched=open.filter(it=>!S.batchOfItem[it.id]).length;
  return {due, blocked, unanswered, stuck, unassigned, unbatched, open:open.length, tasks:tasks.length};
}

function supDayNote(){
  const d=new Date();
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+', '+fdate(today());
}

// One piece as the supervisor reads it: the photograph, what stage it is on,
// who has it, and whether today has been reported.
function supPieceRow(it, inBatch){
  const st=curStage(it);
  const a=openAssignment(it.id);
  const who=a?personName(a.assigned_to):'';
  const sup=(a&&a.support&&a.support.length)?a.support.map(personName).filter(Boolean):[];
  const reported=!!updateToday(it.id);
  const held=(S.stByItem[it.id]||[]).some(r=>r.status==='on_hold');
  const ph=(S.photosByItem[it.id]||[]);
  const ack=a?a.ack_state:null;
  let state;
  if(held) state=badge('Held','alert');
  else if(ack==='cannot_start') state=badge('Cannot start','alert');
  else if(ack==='clarify') state=badge('Question asked','pending');
  else if(!a) state=badge('Nobody on it','pending');
  else if(ack==='pending') state=badge('Not seen yet','pending');
  else if(reported) state=badge('Reported today','success');
  else state=badge('Update due','pending');

  return '<div class="fl-row">'+
    thumbOf(ph, it.id).replace('class="photo-placeholder','class="photo-placeholder fl-row__thumb ')+
    '<div class="fl-row__main">'+
      // inside a batch card the code is already the heading above these rows
      '<p class="eyebrow">'+esc([it.item_ref, inBatch?'':batchCodeOf(it.id)].filter(Boolean).join(' · '))+'</p>'+
      '<button class="fl-row__name" type="button" onclick="go(\'#/item/'+it.id+'\')">'+esc(it.product)+'</button>'+
      '<span class="fl-row__meta">'+esc([it.stone, dimsOf(it)].filter(Boolean).join(' · '))+'</span>'+
    '</div>'+
    '<div class="fl-row__stage">'+(st?esc(shortStage(st.name)):'<span class="muted">Not started</span>')+
      (a&&a.instruction?'<span class="fl-row__said">“'+esc(a.instruction)+'”</span>':'')+'</div>'+
    '<div class="fl-row__who">'+
      (who?'<strong>'+esc(who)+'</strong>':'<span class="muted">Unassigned</span>')+
      (sup.length?'<span>with '+esc(sup.join(', '))+'</span>':'')+
      (a&&a.target_date?'<span>by '+esc(fdate(a.target_date))+'</span>':'')+'</div>'+
    '<div class="fl-row__state">'+state+'</div>'+
    '<div class="fl-row__do">'+
      '<button class="button secondary small" type="button" onclick="mAssign(\''+it.id+'\')">'+
        (a?'Reassign':'Assign')+'</button>'+
      '<button class="button quiet small" type="button" onclick="go(\'#/item/'+it.id+'\')">Open</button>'+
    '</div></div>';
}

function supBatchCard(b, opts){
  opts=opts||{};
  const items=(b.items||[]).map(id=>S.itemsById[id]).filter(Boolean);
  const n=daysUntil(b.planned_ship_date);
  const late=n!=null&&n<0;
  const soon=n!=null&&n>=0&&n<=14;
  return '<section class="panel fl-batch'+(late?' fl-batch--late':(soon?' fl-batch--soon':''))+'">'+
    '<div class="panel__head"><div>'+
      '<h3 class="panel__title">'+esc(b.code)+'</h3>'+
      '<p class="panel__description">'+
        esc(items.length+' piece'+(items.length===1?'':'s'))+
        (b.planned_ship_date?' · ships '+esc(fdate(b.planned_ship_date)):' · no ship date set')+
      '</p></div>'+
      '<div>'+(b.planned_ship_date?countdown(b.planned_ship_date,false):'')+'</div>'+
    '</div>'+
    '<div class="panel__body fl-rows">'+
      (items.length?items.map(x=>supPieceRow(x,true)).join('')
        :'<div class="empty-state">Nothing allocated to this batch.</div>')+
    '</div></section>';
}

function vSupHome(){
  const c=supCounts();
  const q=(window.__staffQ||'').toLowerCase();
  const match=it=>!q||((it.product||'')+' '+(it.stone||'')+' '+(it.item_ref||'')+' '+
    (batchCodeOf(it.id)||'')).toLowerCase().indexOf(q)>=0;

  let h='<div class="page-heading"><div>'+eyebrow(supDayNote())+
    '<h1 class="display-title">Today.</h1>'+
    '<p class="lede">What is on the floor, who has it, and what has not been reported yet. '+
    'Grouped by the shipment each piece leaves in.</p></div>'+
    '<div class="page-heading__actions">'+
      '<button class="button" type="button" onclick="mCreateBatch()">New shipment batch</button>'+
      '<button class="button button--secondary" type="button" onclick="go(\'#/team\')">Assign work</button>'+
    '</div></div>';

  const tiles=[
    ['Pieces in the workshop', c.open, 'Being made right now'],
    ['Not reported today', c.due, c.due?'Nobody has logged these':'Every piece has today’s update'],
    ['Nobody on it', c.unassigned, c.unassigned?'Waiting for a person':'Everything has someone'],
    ['Needs you', c.stuck+c.unanswered, c.stuck?'A blocker was raised':(c.unanswered?'Tasks not opened yet':'Nothing waiting')]
  ];
  h+='<div class="kpi-grid">'+tiles.map((t,i)=>
    '<article class="kpi'+((i===1&&t[1])||(i===3&&c.stuck)?' kpi--warn':'')+'">'+
    '<span class="kpi__label">'+esc(t[0])+'</span><strong class="kpi__value">'+t[1]+'</strong>'+
    '<span class="kpi__note">'+esc(t[2])+'</span></article>').join('')+'</div>';

  // Blockers first, because they are the only thing here nobody else can clear.
  const stuck=(S.assignments||[]).filter(a=>!a.superseded_by && !a.done_at &&
    (a.ack_state==='cannot_start'||a.ack_state==='clarify'));
  if(stuck.length){
    h+='<section class="panel space-top-16"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Raised by the floor</h3>'+
      '<p class="panel__description">Somebody could not start, or asked a question. '+
      'Nothing moves on these until you answer.</p></div></div><div class="panel__body fl-rows">'+
      stuck.map(a=>{
        const it=S.itemsById[a.item_id]; if(!it) return '';
        const stg=S.stagesById[a.stage_id];
        return '<div class="fl-alert">'+
          '<div><p class="eyebrow">'+esc([it.item_ref,batchCodeOf(it.id)].filter(Boolean).join(' · '))+'</p>'+
          '<button class="fl-row__name" type="button" onclick="go(\'#/item/'+it.id+'\')">'+esc(it.product)+'</button>'+
          '<span class="fl-row__meta">'+esc((stg?shortStage(stg.name):'')+' · '+personName(a.assigned_to))+'</span></div>'+
          '<p class="fl-alert__said">'+esc(a.ack_note||'')+'</p>'+
          '<div class="fl-row__do">'+
            (a.ack_state==='cannot_start'?badge('Cannot start','alert'):badge('Question','pending'))+
            '<button class="button secondary small" type="button" onclick="mAssign(\''+it.id+'\')">Reassign</button>'+
          '</div></div>';
      }).join('')+'</div></section>';
  }

  const batches=(S.batches||[]).filter(b=>(b.items||[]).some(id=>S.itemsById[id]&&match(S.itemsById[id])));
  if(batches.length) h+='<div class="space-top-16">'+batches.map(b=>supBatchCard(b)).join('')+'</div>';

  const loose=(S.items||[]).filter(it=>!S.batchOfItem[it.id] &&
    !['delivered','cancelled'].includes(it.status) && match(it));
  if(loose.length){
    h+='<section class="panel space-top-16"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Not in a batch yet</h3>'+
      '<p class="panel__description">'+loose.length+' piece'+(loose.length===1?'':'s')+
      ' with no shipment group. Give them one so the floor knows what leaves together.</p></div>'+
      '<button class="button secondary small" type="button" onclick="mCreateBatch()">Create a batch</button>'+
      '</div><div class="panel__body fl-rows">'+loose.map(supPieceRow).join('')+'</div></section>';
  }

  if(!batches.length && !loose.length)
    h+='<div class="empty-state space-top-16">'+
      (q?'Nothing matches that search.':'No pieces on the floor yet.')+'</div>';

  // sfaPaint wraps the page in .sfa, which is where the console's token system
  // lives: the light monochrome palette, the 232px sidebar, the 64px top bar and
  // the serif headings. Without it these screens fell back to the older button
  // styles and came out with blue primary buttons — a different product wearing
  // the same name, which is the one thing the brief is most explicit about.
  sfaPaint(h);
}

function vSupBatches(){
  const q=(window.__staffQ||'').toLowerCase();
  let h='<div class="page-heading"><div>'+eyebrow('Shipment groups')+
    '<h1 class="display-title">Shipment batches.</h1>'+
    '<p class="lede">Every batch is the set of pieces that leaves together. The code is the floor’s '+
    'reference for it — the office keeps the order number, and it never comes down here.</p></div>'+
    '<div class="page-heading__actions">'+
      '<button class="button" type="button" onclick="mCreateBatch()">New shipment batch</button></div></div>';

  const list=(S.batches||[]).filter(b=>!q||String(b.code).toLowerCase().indexOf(q)>=0||
    (b.items||[]).some(id=>S.itemsById[id]&&((S.itemsById[id].product||'')+' '+(S.itemsById[id].stone||'')).toLowerCase().indexOf(q)>=0));

  h+=list.length?list.map(b=>supBatchCard(b)).join('')
    :'<div class="empty-state">'+(q?'No batch matches that search.':'No batches yet. Create the first one from the pieces waiting below.')+'</div>';

  const groups=unbatchedGroups();
  if(groups.length){
    const n=groups.reduce((t,g)=>t+g.items.length,0);
    h+='<section class="panel space-top-18"><div class="panel__head"><div>'+
      '<h3 class="panel__title">Waiting for a batch</h3>'+
      '<p class="panel__description">'+n+' piece'+(n===1?'':'s')+' in '+groups.length+
      ' shipment'+(groups.length===1?'':'s')+'. Pieces from different shipments cannot go in one batch.</p></div></div>'+
      '<div class="panel__body">'+groups.map((g,i)=>
        '<div class="fl-group"><div class="fl-group__head"><div>'+
          '<strong>Shipment '+String.fromCharCode(65+i)+'</strong>'+
          '<span>'+g.items.length+' piece'+(g.items.length===1?'':'s')+
          (g.ship?' · expected '+esc(fdate(g.ship)):'')+'</span></div>'+
          '<button class="button secondary small" type="button" onclick="mCreateBatch(\''+jsq(g.key)+'\')">Batch these</button>'+
        '</div><div class="fl-rows">'+g.items.map(supPieceRow).join('')+'</div></div>').join('')+
      '</div></section>';
  }

  // sfaPaint wraps the page in .sfa, which is where the console's token system
  // lives: the light monochrome palette, the 232px sidebar, the 64px top bar and
  // the serif headings. Without it these screens fell back to the older button
  // styles and came out with blue primary buttons — a different product wearing
  // the same name, which is the one thing the brief is most explicit about.
  sfaPaint(h);
}

function vSupTeam(){
  const c=supCounts();
  const open=(S.items||[]).filter(it=>!['delivered','cancelled','made'].includes(it.status));
  const load=workloadByPerson();
  const people=floorPeople();

  let h='<div class="page-heading"><div>'+eyebrow('Task allocation')+
    '<h1 class="display-title">Work &amp; people.</h1>'+
    '<p class="lede">Choose the piece and the stage, then the person. Their current load is beside '+
    'each name so the same three people do not end up carrying the whole floor.</p></div></div>';

  h+='<div class="kpi-grid">'+[
    ['Pieces with nobody on them', c.unassigned, c.unassigned?'Pick someone for these first':'All covered'],
    ['Tasks not opened yet', c.unanswered, 'Given out, not yet seen'],
    ['Blockers raised', c.stuck, c.stuck?'Waiting on you':'None'],
    ['People with work', Object.keys(load).length, 'Carrying at least one piece']
  ].map((t,i)=>'<article class="kpi'+((i===0&&t[1])||(i===2&&t[1])?' kpi--warn':'')+'">'+
    '<span class="kpi__label">'+esc(t[0])+'</span><strong class="kpi__value">'+t[1]+'</strong>'+
    '<span class="kpi__note">'+esc(t[2])+'</span></article>').join('')+'</div>';

  const waiting=open.filter(it=>!openAssignment(it.id));
  h+='<section class="panel space-top-16"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Waiting for a person</h3>'+
    '<p class="panel__description">Each of these is at a stage with nobody standing behind it.</p></div></div>'+
    '<div class="panel__body fl-rows">'+
    (waiting.length?waiting.map(supPieceRow).join('')
      :'<div class="empty-state">Every piece on the floor has somebody on it.</div>')+
    '</div></section>';

  h+='<section class="panel space-top-16"><div class="panel__head"><div>'+
    '<h3 class="panel__title">The workshop</h3>'+
    '<p class="panel__description">Who is carrying what. Wages and advances are not shown here '+
    'and are not sent to this screen.</p></div></div>'+
    '<div class="panel__body">'+
    (people.length?'<div class="data-table-wrap"><table class="data-table"><thead><tr>'+
      '<th>Name</th><th>Pieces now</th><th>Not yet opened</th><th>Blocked</th><th></th></tr></thead><tbody>'+
      people.map(p=>{
        const mine=(S.assignments||[]).filter(a=>!a.superseded_by&&!a.done_at&&a.assigned_to===p.user_id);
        const unseen=mine.filter(a=>a.ack_state==='pending').length;
        const blocked=mine.filter(a=>a.ack_state==='cannot_start').length;
        return '<tr><td><strong>'+esc(p.full_name)+'</strong></td>'+
          '<td>'+mine.length+'</td>'+
          '<td>'+(unseen?'<span class="badge badge--pending">'+unseen+'</span>':'—')+'</td>'+
          '<td>'+(blocked?'<span class="badge badge--alert">'+blocked+'</span>':'—')+'</td>'+
          '<td><button class="button quiet small" type="button" onclick="mAssign(null,null,\''+jsq(p.user_id)+'\')">Give work</button></td></tr>';
      }).join('')+'</tbody></table></div>'
     :'<div class="empty-state">No workshop logins yet. The office creates them under People &amp; access.</div>')+
    '</div></section>';

  const live=(S.assignments||[]).filter(a=>!a.superseded_by&&!a.done_at);
  h+='<section class="panel space-top-16"><div class="panel__head"><div>'+
    '<h3 class="panel__title">Work given out</h3>'+
    '<p class="panel__description">Standing tasks and how each person answered.</p></div></div>'+
    '<div class="panel__body">'+
    (live.length?'<div class="data-table-wrap"><table class="data-table"><thead><tr>'+
      '<th>Piece</th><th>Stage</th><th>Who</th><th>By</th><th>Answer</th><th></th></tr></thead><tbody>'+
      live.map(a=>{
        const it=S.itemsById[a.item_id]; if(!it) return '';
        const stg=S.stagesById[a.stage_id];
        const sup=(a.support||[]).map(personName).filter(Boolean);
        const ansMap={pending:['Not opened yet','pending'],accepted:['Accepted','success'],
                      clarify:['Question asked','pending'],cannot_start:['Cannot start','alert']};
        const ans=ansMap[a.ack_state]||['—',''];
        return '<tr><td><button class="link-button" type="button" onclick="go(\'#/item/'+it.id+'\')">'+
            esc(it.product)+'</button><span class="fl-cell-sub">'+esc(batchCodeOf(it.id)||it.item_ref||'')+'</span></td>'+
          '<td>'+esc(stg?shortStage(stg.name):'')+'</td>'+
          '<td>'+esc(personName(a.assigned_to))+(sup.length?'<span class="fl-cell-sub">with '+esc(sup.join(', '))+'</span>':'')+'</td>'+
          '<td>'+esc(a.target_date?fdate(a.target_date):'—')+'</td>'+
          '<td>'+badge(ans[0],ans[1])+(a.ack_note?'<span class="fl-cell-sub">'+esc(a.ack_note)+'</span>':'')+'</td>'+
          '<td><button class="button quiet small" type="button" onclick="mAssign(\''+it.id+'\')">Change</button></td></tr>';
      }).join('')+'</tbody></table></div>'
     :'<div class="empty-state">No work given out yet.</div>')+
    '</div></section>';

  sfaPaint(h);
}

</script>
<script>
'use strict';
window.__openStages={};
function toggleStage(itemId, stageId){
  const k=itemId+'-'+stageId;
  window.__openStages[k]=!window.__openStages[k];
  render();
}

async function doLogin(){
  const email=normLogin($('li-email').value), pass=$('li-pass').value;
  if(!email||!pass) return;
  $('loading').style.display='flex';
  const {error} = await sb.auth.signInWithPassword({email, password:pass});
  if(error){ $('loading').style.display='none'; vLogin(error.message==='Invalid login credentials'?'Incorrect email or password.':error.message); return; }
}
async function signOut(){ await sb.auth.signOut(); location.hash='#/home'; }

function setBuyerFilter(v){ S.buyerFilter=v; refreshHard(); }
async function refreshHard(){ $('loading').style.display='flex'; try{ await loadData(); }catch(e){ toast('Could not refresh: '+(e.message||e), {err:true}); }
  $('loading').style.display='none'; render(); }

async function markRead(itemId){
  if(unreadCount(itemId)===0 && S.readMarks[itemId]) return;
  try{ await sb.rpc('bt_mark_read', {p_item:itemId}); S.readMarks[itemId]=new Date().toISOString(); updateHeader(); }catch(e){}
}

async function sendComment(itemId, stageId){
  const ta=$('cmt-'+stageId); if(!ta) return;
  const body=ta.value.trim(); if(!body){ toast('Write a comment first'); return; }
  const attach=window.__cmtAttach && window.__cmtAttach.key===itemId+'-'+stageId ? window.__cmtAttach.path : null;
  const {error} = await sb.from('bt_comments').insert({
    item_id:itemId, stage_id:stageId, author_id:uid(),
    author_role:isAdmin()?'admin':'buyer',
    author_name:S.profile.full_name||S.profile.email||'',
    body, attachment_path:attach
  });
  if(error){ toast('Could not send: '+error.message, {err:true}); return; }
  window.__cmtAttach=null;
  window.__openStages[itemId+'-'+stageId]=true;
  await loadData(); render();
  if(isAdmin()){
    const it=S.itemsById[itemId];
    offerWhatsApp(it, 'New note on '+it.product+' ('+(it.po?it.po.po_number:'')+'): '+body);
  }
}

async function attachToComment(itemId, stageId){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async ()=>{
    const f=inp.files[0]; if(!f) return;
    toast('Uploading photo…');
    const blob=await resizeImage(f);
    const buyerId=isAdmin()?(S.itemsById[itemId].po.buyer_id):(S.profile.buyer_id);
    const path=buyerId+'/comments/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
    const {error}=await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
    if(error){ toast('Upload failed: '+error.message,{err:true}); return; }
    window.__cmtAttach={key:itemId+'-'+stageId, path};
    toast('Photo attached — it will be sent with your comment.');
  };
  inp.click();
}

/* A decision is now a permanent record bound to the exact revision it was made
   against, so it is worth collecting properly. A change request cannot be saved
   without a reason — the database refuses one, and this asks for it in the page
   rather than in a browser prompt the buyer can dismiss with an empty string. */

/* ------------------------------------------- the buyer's decision, his design */
/* ChatGPT's openApproval: the exact released photographs the request was made
   against, one note field, and three ways out — ask a question, request a
   change, approve. The decision is bound to the revision it was shown against;
   the database refuses a second decision on a settled one, and refuses a change
   request with no reason. */
function mBuyerDecision(itemId, stageId){
  const it=S.itemsById[itemId], st=S.stagesById[stageId];
  const rev=openRevision(itemId, stageId);
  if(!rev){ toast('Nothing is waiting on you for this stage'); return; }
  const po=S.posById[it.po_id]||{};
  const label=rev.label||('R'+rev.rev_no);
  // exactly the photographs frozen onto this revision, and nothing else
  const ids=rev.photo_ids||[];
  const shots=visiblePhotos((S.photosByItem[itemId]||[])
    .filter(x=>ids.length?ids.indexOf(x.id)>=0:String(x.stage_id)===String(stageId)));

  const m=modal('<div class="sfb"><h3>Review the exact selection.</h3>'+
    '<div class="sub">'+esc([po.po_number, it.item_code, (st?st.name:'')+' '+label].filter(Boolean).join(' · '))+'</div>'+
    '<p class="modal-copy">Compare the released views below with the target product. '+
      'Your response is permanently linked to '+esc(label)+' and cannot be changed afterwards.</p>'+
    (shots.length
      ? '<div class="audit-modal-grid">'+shots.map(x=>
          '<img alt="'+esc(x.caption||'Released view')+'" data-ph-path="'+esc(x.path)+'">').join('')+'</div>'
      : '<div class="empty"><p>No photographs were attached to this request.</p></div>')+
    '<div class="audit-field"><label for="approval-note">Decision note</label>'+
      '<textarea id="approval-note" rows="3" placeholder="Required when requesting a change; optional when approving"></textarea>'+
      '<small>Say which face, vein, colour or dimension needs attention.</small></div>'+
    '<div class="button-row" style="margin-top:12px">'+
      '<button class="button secondary" type="button" onclick="closeModal();mBuyerComment(\''+itemId+'\')">Ask a question</button>'+
      '<button class="button secondary" type="button" id="bd-change">Request change</button>'+
      '<button class="button" type="button" id="bd-ok">Approve '+esc(label)+'</button>'+
    '</div></div>');
  hydrateImages(m.m);

  const send=async (decision)=>{
    const note=(m.m.querySelector('#approval-note').value||'').trim();
    if(decision==='changes_requested' && note.length<3){
      toast('Please say what needs changing',{err:true});
      m.m.querySelector('#approval-note').focus(); return;
    }
    m.m.querySelector('#bd-ok').disabled=true;
    m.m.querySelector('#bd-change').disabled=true;
    const {error}=await sb.rpc('bt_respond_approval',
      {p_item:itemId, p_stage:stageId, p_decision:decision, p_note:note||null});
    if(error){
      m.m.querySelector('#bd-ok').disabled=false;
      m.m.querySelector('#bd-change').disabled=false;
      toast(error.message,{err:true}); return;
    }
    closeModal();
    await loadData();
    mBuyerReceipt(itemId, stageId, decision, label, note);
    render();
  };
  m.m.querySelector('#bd-ok').onclick=()=>send('approved');
  m.m.querySelector('#bd-change').onclick=()=>send('changes_requested');
}

/* What was decided, against which revision, and what happens because of it. A
   decision with no receipt leaves the buyer wondering whether it registered. */
function mBuyerReceipt(itemId, stageId, decision, label, note){
  const it=S.itemsById[itemId], st=S.stagesById[stageId];
  const ok=decision==='approved';
  modal('<div class="sfb"><h3>'+(ok?'Approved.':'Sent back for a change.')+'</h3>'+
    '<div class="sub">'+esc((it?it.product:'')+' · '+(st?st.name:'')+' '+label)+'</div>'+
    '<div class="notice" style="margin-top:10px"><strong>'+
      (ok?'The workshop can move on':'The workshop has been told')+'</strong>'+
      (ok?'Your approval is recorded against '+esc(label)+' with the photographs you were shown.'
         :'Your note goes to the floor with this product. A new set will be sent to you as '+
          esc(label.replace(/(\d+)$/, (n)=>String(+n+1))||'the next revision')+'.')+
    '</div>'+
    (note?'<div class="audit-field" style="margin-top:10px"><label>What you said</label>'+
      '<p class="card-copy">'+esc('\u201c'+note+'\u201d')+'</p></div>':'')+
    '<div class="detail-list" style="margin-top:10px">'+
      '<div class="detail-row"><span>Decision</span><strong>'+(ok?'Approved':'Changes requested')+'</strong></div>'+
      '<div class="detail-row"><span>Revision</span><strong>'+esc(label)+'</strong></div>'+
      '<div class="detail-row"><span>Recorded</span><strong>'+esc(ftime(new Date().toISOString()))+'</strong></div>'+
      '<div class="detail-row"><span>Permanent</span><strong>Yes — it cannot be edited</strong></div>'+
    '</div>'+
    '<div class="button-row" style="margin-top:12px">'+
      '<button class="button secondary" type="button" onclick="closeModal();go(\'#/approvals\')">See my decisions</button>'+
      '<button class="button" type="button" onclick="closeModal()">Done</button>'+
    '</div></div>');
}

/* His openSfPhotos — every released photograph for one product and stage, each
   one labelled with the product, stage and order it belongs to. */
function mBuyerPhotos(itemId, stageId){
  const it=S.itemsById[itemId]; if(!it) return;
  const po=S.posById[it.po_id]||{}, st=S.stagesById[stageId];
  const shots=visiblePhotos((S.photosByItem[itemId]||[])
    .filter(x=>!x.log_date && String(x.stage_id)===String(stageId)));
  const m=modal('<div class="sfb"><h3>'+esc(it.product)+' photographs</h3>'+
    '<div class="sub">'+esc([po.po_number, st?st.name:''].filter(Boolean).join(' · '))+'</div>'+
    '<div class="notice"><strong>Released buyer record</strong>'+
      'These images belong to '+esc(it.item_code||it.product)+', at '+esc(st?st.name:'this stage')+
      ', under '+esc(po.po_number||'this order')+'.</div>'+
    (shots.length?'<div class="all-photos">'+shots.map((x,i)=>
      '<div class="photo" onclick="openPhoto(event,this)" data-ph-path="'+esc(x.path)+'" '+
      'data-cap="'+esc(x.caption||'')+'" style="cursor:zoom-in">'+
      '<img alt="'+esc(x.caption||it.product)+'" data-ph-path="'+esc(x.path)+'">'+
      '<span>'+(i+1)+' of '+shots.length+(x.caption?' · '+esc(x.caption):'')+'</span></div>').join('')+'</div>'
     :'<div class="empty"><p>Nothing released for this stage yet.</p></div>')+
    '<div class="button-row" style="margin-top:12px">'+
      '<span style="color:var(--muted);font-size:11px;flex:1">Only released images appear here.</span>'+
      '<button class="button" type="button" onclick="closeModal()">Close gallery</button></div></div>');
  hydrateImages(m.m);
}

/* His openComment — a comment that stays attached to the product it is about. */
function mBuyerComment(itemId){
  const it=S.itemsById[itemId]; if(!it) return;
  const po=S.posById[it.po_id]||{};
  const st=curStage(it);
  const m=modal('<div class="sfb"><h3>Comment on '+esc(it.product)+'</h3>'+

// One tap from any list: finish the running stage, or start the next one.
/* The approval gate refuses to walk the work past a stage the buyer has not
   signed off. A raw database error in a toast would read as a fault, so the
   refusal is turned into the choice it actually is: approve first, or say why
   you are going ahead anyway. The reason is recorded on the stage it bypassed. */
function gateBlocked(err){
  return err && /has not approved/i.test(err.message||'');
}
// One reason for a batch of pieces the buyer has not signed off. Resolves to the
// reason, or to null when the owner decides to wait instead.
function askGateReason(names){
  return new Promise(resolve=>{
    const list=names.slice(0,6).map(n=>'<li>'+esc(n)+'</li>').join('')+
      (names.length>6?'<li>and '+(names.length-6)+' more</li>':'');
    const m=modal('<h3>The buyer has not approved these yet</h3>'+
      '<div class="sub">'+names.length+' piece'+(names.length===1?'':'s')+' are waiting on a decision</div>'+
      '<div class="form-grid"><ul class="field--full plain-list">'+list+'</ul>'+
      '<div class="field field--full"><label for="gb-why">Why are you going ahead?</label>'+
        '<input id="gb-why" placeholder="e.g. Buyer approved the drawings on the call this morning">'+
        '<p class="field__hint">Recorded against each stage you step past.</p></div>'+
      '<div class="button-row field--full">'+
        '<button class="button" type="button" id="gb-go">Go ahead anyway</button>'+
        '<button class="button button--secondary" type="button" id="gb-wait">Leave them waiting</button>'+
      '</div></div>');
    let done=false;
    const finish=v=>{ if(done) return; done=true; closeModal(); resolve(v); };
    m.m.querySelector('#gb-go').onclick=()=>{
      const w=(m.m.querySelector('#gb-why').value||'').trim();
      if(w.length<3){ toast('Please say why',{err:true}); return; }
      finish(w);
    };
    m.m.querySelector('#gb-wait').onclick=()=>finish(null);
  });
}

async function advanceWithGate(itemId, stageId, complete, after){
  let r=await sb.rpc('bt_advance',
    {p_item:itemId, p_stage:stageId, p_date:today(), p_complete:complete});
  if(!r.error){ await loadData(); render(); if(after) after(); return true; }
  if(!gateBlocked(r.error)){ toast(r.error.message,{err:true}); return false; }

  const it=S.itemsById[itemId];
  const m=modal('<h3>The buyer has not approved this yet</h3>'+
    '<div class="sub">'+esc(it?it.product:'')+'</div>'+
    '<div class="form-grid">'+
    '<p class="field--full field__hint">'+esc(r.error.message)+'</p>'+
    '<div class="field field--full"><label for="gv-why">Why are you going ahead?</label>'+
      '<input id="gv-why" placeholder="e.g. Buyer confirmed on the telephone this morning">'+
      '<p class="field__hint">This is kept against the stage you are stepping past, so it is clear later why the work moved without a recorded decision.</p></div>'+
    '<div class="button-row field--full">'+
      '<button class="button" type="button" id="gv-go">Go ahead anyway</button>'+
      '<button class="button button--secondary" type="button" onclick="closeModal()">Wait for the buyer</button>'+
    '</div></div>');
  const go=m.m.querySelector('#gv-go');
  go.onclick=async ()=>{
    const why=(m.m.querySelector('#gv-why').value||'').trim();
    if(why.length<3){ toast('Please say why',{err:true}); m.m.querySelector('#gv-why').focus(); return; }
    go.disabled=true;
    const r2=await sb.rpc('bt_advance',
      {p_item:itemId, p_stage:stageId, p_date:today(), p_complete:complete, p_override_reason:why});
    if(r2.error){ go.disabled=false; toast(r2.error.message,{err:true}); return; }
    closeModal(); await loadData(); render(); toast('Moved on, and the reason is recorded.');
    if(after) after();
  };
  return false;
}

// Reference media for a piece: the approved drawing, a 3D model, photographs of
// the block that was signed off, and a picture of what it should end up as.
// Images become photos (so they follow the ordinary approval rules); CAD and 3D
// files become documents, because there is nothing to look at in a browser.
const MEDIA_KINDS = {
  drawing:   { label:'Production drawing', hint:'PDF or image of the approved drawing',
               accept:'application/pdf,image/*,.pdf,.dwg,.dxf' },
  model:     { label:'3D model', hint:'STEP, STL, OBJ, 3DM, SKP — for the workshop',
               accept:'.step,.stp,.stl,.obj,.3dm,.skp,.igs,.iges,.fbx,.glb,.gltf,.zip' },
  block:     { label:'Approved block', hint:'The block the buyer signed off',
               accept:'image/*' },
  reference: { label:'Target product', hint:'What the finished piece should look like',
               accept:'image/*' }
};
const _isImage = f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(f.name);

function mMedia(itemId){
  const it = S.itemsById[itemId]; if(!it) return;
  const m = modal('<h3>Reference media</h3><div class="sub">'+esc(it.product)+
    ' — drawings, 3D models and reference photographs for this piece.</div>'+
    '<div class="panel__body">'+
    Object.keys(MEDIA_KINDS).map(k=>{
      const d = MEDIA_KINDS[k];
      return '<div class="login-row"><div class="grow"><strong>'+esc(d.label)+'</strong>'+
        '<p class="field-hint">'+esc(d.hint)+'</p></div>'+
        '<div class="button-row"><button class="button button--secondary" type="button" data-mk="'+k+'">Upload</button></div></div>';
    }).join('')+'</div>'+
    '<p class="field-hint">Files here are visible to the workshop straight away. The buyer sees an image only once you approve it, and a drawing only if you tick it for him.</p>'+
    '<div class="button-row"><button class="button button--secondary" type="button" onclick="closeModal()">Done</button></div>');
  m.m.querySelectorAll('[data-mk]').forEach(b=>{
    b.onclick = ()=> pickMedia(itemId, b.getAttribute('data-mk'));
  });
}

function pickMedia(itemId, kind){
  const spec = MEDIA_KINDS[kind] || MEDIA_KINDS.reference;
  const inp = document.createElement('input');
  inp.type='file'; inp.accept=spec.accept; inp.multiple=true;
  inp.onchange = async ()=>{
    const files=[...inp.files]; if(!files.length) return;
    const it = S.itemsById[itemId]; if(!it) return;
    const buyerId = it.po && it.po.buyer_id;
    closeModal();
    $('loading').style.display='flex';
    let ok=0, failed=0;
    for(let i=0;i<files.length;i++){
      const f = files[i];
      try{
        if(_isImage(f)){
          const blob = await resizeImage(f);
          const path = buyerId+'/items/'+itemId+'/'+kind+'-'+Date.now()+'-'+i+'.jpg';
          const up = await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
          if(up.error) throw up.error;
          const ins = await sb.from('bt_photos').insert({
            item_id:itemId, po_id:it.po_id, path, uploaded_by:uid(),
            status: isStaff()?'pending':'approved', photo_type:kind,
            caption: MEDIA_KINDS[kind].label });
          if(ins.error) throw ins.error;
        } else {
          const safe = f.name.replace(/[^A-Za-z0-9._-]/g,'_').slice(-80);
          const path = buyerId+'/items/'+itemId+'/'+kind+'-'+Date.now()+'-'+safe;
          const up = await sb.storage.from(CONFIG.bucket).upload(path, f, {contentType: f.type||'application/octet-stream'});
          if(up.error) throw up.error;
          // po_id is set as well as item_id so the existing document policy,
          // which reasons about the order, keeps working unchanged
          const ins = await sb.from('bt_documents').insert({
            po_id: it.po_id, item_id: itemId, name: f.name, doc_type: kind, path,
            uploaded_by: uid(), for_staff: true, for_buyer: kind==='drawing' });
          if(ins.error) throw ins.error;
        }
        ok++;
      }catch(e){ failed++; }
    }
    await loadData();
    $('loading').style.display='none';
    render();
    if(ok) toast(ok+' file'+(ok===1?'':'s')+' added'+(failed?', '+failed+' failed':'')+'.', failed?{err:true}:undefined);
    else toast('Nothing uploaded — check the connection and try again.',{err:true});
  };
  inp.click();
}

function pickPhotos(itemId, stageId, poId){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange=async ()=>{
    const files=[...inp.files]; if(!files.length) return;
    toast('Uploading '+files.length+' photo'+(files.length>1?'s':'')+'…');
    const it=itemId?S.itemsById[itemId]:null;
    const staff=isStaff();
    const buyerId=staff?null:(it?it.po.buyer_id:(S.posById[poId]||{}).buyer_id);
    const stKey=stageId?((S.stagesById[stageId]||{}).key||'stage'):(itemId?'item':'order');
    const base=staff?('staff/'+(itemId||poId)+'/')
                    :(itemId?(buyerId+'/items/'+itemId+'/'):(buyerId+'/po/'+poId+'/'));
    let ok=0;
    for(let i=0;i<files.length;i++){
      const blob=await resizeImage(files[i]);
      const path=base+stKey+'-'+Date.now()+'-'+i+'.jpg';
      const up=await sb.storage.from(CONFIG.bucket).upload(path, blob, {contentType:'image/jpeg'});
      if(up.error){ toast('Upload failed: '+up.error.message,{err:true}); continue; }
      const ins=await sb.from('bt_photos').insert({item_id:itemId||null, stage_id:stageId||null, po_id:poId||null,
        path, uploaded_by:uid(), status: staff?'pending':'approved'});
      if(!ins.error) ok++;
    }
    if(itemId&&stageId) window.__openStages[itemId+'-'+stageId]=true;
    await loadData(); render();
    if(ok) toast(staff? (ok+' photo'+(ok>1?'s':'')+' sent to the office for approval') : (ok+' photo'+(ok>1?'s':'')+' added'));
  };
  inp.click();
}

async function setPhotoStatus(ids, status){
  if(!isAdmin()) return;
  if(status==='rejected' && !confirm('Send these photos back to the staff? The client will not see them.')) return;
  const {error}=await sb.from('bt_photos').update({status}).in('id', ids);
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
  if(status==='approved'){
    const first=S.photos.find(p=>p.id===ids[0]);
    const it=first&&first.item_id?S.itemsById[first.item_id]:null;
    if(it) offerWhatsApp(it, (S.settings.company_name||'Gujraj Impex')+' — new photos\n'+it.product+' ('+(it.po?it.po.po_number:'')+')\nPlease see the latest photos on your tracker: '+trackerUrl());
    else toast(ids.length+' photo'+(ids.length>1?'s':'')+' approved and now visible to the client');
  } else toast('Sent back to staff');
}
async function delPhoto(ev, id, path){
  ev.stopPropagation();
  if(!confirm('Delete this photo?')) return;
  // The file goes first, then the row. Storage permission for a staff member is
  // granted by the photo row still being there and still unapproved, so deleting
  // the row first would leave the image stranded in the bucket for ever.
  if(path){
    const {error}=await sb.storage.from(CONFIG.bucket).remove([path]);
    if(error){ toast('Could not remove the file: '+error.message,{err:true}); return; }
  }
  const {error}=await sb.from('bt_photos').delete().eq('id', id);
  if(error){ toast(error.message,{err:true}); return; }
  await loadData(); render();
}
async function openPhoto(ev, node){

}

    if(error){ toast(error.message,{err:true}); return; }
    if(moved){
      try{
        await sb.from('bt_activity').insert({ po_id:poId, actor_id:uid(), actor_role:'admin',
          actor_name:(S.profile.full_name||'Owner'), action:'po_reassigned',

      toast('Moved to '+((S.buyersById[newBuyer]||{}).company||'the new buyer'));

  };
  m.m.querySelector('#po-del').onclick=async ()=>{
    if(!confirm('Delete this PO and all its items, photos and comments?')) return;

    const stg=Number($('blk-stage').value), dt=$('blk-date').value||today(), dn=!!$('blk-done').value;
    // Move everything that can move, then ask once about the pieces the buyer
    // has not signed off — one reason for the batch beats a modal per piece.
    const blocked=[];
    for(const id of ids){
      const {error}=await sb.rpc('bt_advance',{p_item:id,p_stage:stg,p_date:dt,p_complete:dn});
      if(error){

        else { toast(error.message,{err:true}); return; }
      }
    }
    if(blocked.length){
      const names=blocked.map(id=>(S.itemsById[id]||{}).product).filter(Boolean);
      const why=await askGateReason(names);
      if(why===null){ closeModal(); await loadData(); render();
        toast(blocked.length+' piece'+(blocked.length===1?'':'s')+' left waiting on the buyer'); return; }
      for(const id of blocked){

          {p_item:id,p_stage:stg,p_date:dt,p_complete:dn,p_override_reason:why});
        if(error){ toast(error.message,{err:true}); return; }
      }
    }
    closeModal(); await loadData(); render();
    const st=S.stagesById[Number($('blk-stage').value)];
    const b=S.buyersById[p.buyer_id];

      window.open(waLink(b&&b.phone,text),'_blank'); }});
  };
}

/* ---------------------------------------------------------------------------
   Daily workshop update — submission (staff and admin).

   Camera-first: the file input carries capture="environment" so a phone opens
   straight into the camera. Photos are resized through a canvas, which also
   strips EXIF, so no GPS ever reaches a buyer. Nothing is buyer-visible until
   the owner publishes: photos go in as 'pending' and the update as 'pending'.
--------------------------------------------------------------------------- */

window.__du = { files: [], itemId: null, stageId: null };

function mDailyUpdate(itemId, stageId){
