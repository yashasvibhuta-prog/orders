    :root {

    .stage-row__media .button { min-height:60.7px; padding-inline:15.2px; font-size:12.4px; }
    .stage-row--done .stage-row__icon { border-color: transparent; background: var(--sage-soft); color: var(--sage); }
    .stage-row--current { border-color: var(--action-primary); box-shadow: 0 0 0 1px var(--action-soft); }
    .stage-row--current .stage-row__icon { border-color: transparent; background: var(--surface-warm); color: var(--umber); }
    .stage-row--hold { border-color: var(--ink); border-style: dashed; background: var(--surface); }
    .stage-row--hold .stage-row__icon { border-color: transparent; background: var(--rust-soft); color: var(--rust); }
    .stage-expanded { grid-column: 1 / -1; display: grid; gap:16.6px; margin-top:2.8px; padding:17.9px; border-radius:12.5px; background: var(--surface-soft); }
    .stage-note { color: var(--ink-soft); font-size:13.8px; }
    .stage-note strong { color: var(--ink); }
    .photo-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:9.7px; }
    .photo-grid .photo-placeholder { min-height:144.9px; }
    .photo-card { position: relative; }
    .photo-card .badge { position: absolute; top:9.7px; right:9.7px; z-index: 2; }
    .comment-thread { display: grid; gap:11px; }
    .comment { display: grid; grid-template-columns: 28px minmax(0,1fr); gap:11px; }
    .comment__avatar { display: grid; width:38.6px; height:38.6px; place-items: center; border-radius:50%; background: var(--surface-warm); color: var(--umber); font-size:11px; font-weight: 800; }
    .comment__bubble { padding:12.4px 13.8px; border: 1px solid var(--line); border-radius:5px 12.5px 12.5px; background: var(--surface); color: var(--ink-soft); font-size:12.4px; }
    .comment__bubble strong { display: block; margin-bottom:4.1px; color: var(--ink); font-size:12.4px; }
    .comment-composer { display: grid; grid-template-columns: minmax(0,1fr) auto; gap:9.7px; }
    .comment-composer input { min-width:0; min-height:60.7px; padding:0 15.2px; border: 1px solid var(--line-strong); border-radius:11.2px; background: var(--surface); }
    .approval-gate { display: grid; gap:15.2px; padding:17.9px; border: 1px solid var(--line-strong); border-radius:var(--radius-md); background: var(--amber-soft); }
    .approval-gate__title { display: flex; align-items: center; gap:11px; font-size:15.2px; font-weight: 800; }
    .approval-gate__copy { color: var(--ink-soft); font-size:12.4px; }
    .buyer-welcome { padding:27.6px; border-radius:var(--radius-lg); background: var(--umber-dark); color: white; }
    .buyer-welcome .eyebrow { color: #86868B; }
    .buyer-welcome .detail-subtitle { color: #F5F5F7; }
    .buyer-progress { display: grid; gap:13.8px; margin-top:24.8px; }
    .buyer-progress__row { display: flex; align-items: center; justify-content: space-between; gap:16.6px; font-size:13.8px; }
    .buyer-safe-note { display: flex; gap:12.4px; margin-top:16.6px; color: var(--ink-faint); font-size:12.4px; }
    .staff-shell { background: var(--canvas); }
    .staff-header { display: flex; flex-direction: column; gap:19.3px; padding:24.8px 22.1px; border-bottom:1.4px solid var(--line-strong); background: var(--umber-dark); color: white; }
    .staff-header .wordmark__byline { color: #86868B; }
    .staff-header .search input { border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: white; }
    .staff-header .search input::placeholder { color: #86868B; }
    .staff-header .search .icon { color: #F5F5F7; }
    .staff-list { display: grid; gap:16.6px; padding:19.3px; }
    .staff-product { padding:20.7px; border: 1px solid var(--line-strong); border-radius:var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
    .staff-product__thumb { min-height:173.9px; margin-bottom:17.9px; }
    .staff-product__top { display: flex; align-items: flex-start; justify-content: space-between; gap:13.8px; }
    .staff-product__name { font-family: var(--font-display); font-size:30.4px; font-weight: 600; line-height:1.05; }
    .staff-product__spec { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:11px; margin-top:17.9px; }
    .staff-spec { padding:13.8px; border-radius:11.2px; background: var(--surface-soft); }
    .staff-spec span { display: block; color: var(--ink-soft); font-size:11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .staff-spec strong { display: block; margin-top:5.5px; font-size:13.8px; }
    .ship-alert { color: var(--rust); font-weight: 800; }
    .staff-product__actions { display: grid; grid-template-columns: 1fr auto; gap:11px; margin-top:17.9px; }
    .button--workshop { min-height:74.5px; font-size:17.9px; }
    .daily-log { padding:22.1px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface-warm); }

    .daily-log__grid { display: grid; gap:12.4px; margin-top:16.6px; }
    .approval-list { display: grid; gap:16.6px; }
    .approval-group { padding:19.3px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface); }

    .utility-grid { display: grid; gap:19.3px; }
    .form-card { padding:22.1px; border: 1px solid var(--line); border-radius:var(--radius-lg); background: var(--surface); }

    .form-card__description { color: var(--ink-soft); font-size:13.8px; }
    .form-grid { display: grid; gap:16.6px; margin-top:22.1px; }
    .field-hint { color: var(--ink-faint); font-size:11px; }
    .field--full { grid-column: 1 / -1; }
    .upload-drop { display: grid; min-height:207px; place-items: center; padding:27.6px; border: 1.5px dashed var(--line-strong); border-radius:var(--radius-md); background: var(--surface-soft); text-align: center; }
    .upload-drop .icon { margin:auto; color: var(--umber); }
    .upload-drop strong { display: block; margin-top:13.8px; }
    .upload-drop p { margin-top:6.9px; color: var(--ink-soft); font-size:12.4px; }
    .data-table-wrap { overflow-x: auto; }
    .data-table { width:100%; min-width:650px; border-collapse: collapse; }
    .data-table th { padding:13.8px; border-bottom:1.4px solid var(--line-strong); color: var(--ink-faint); font-size:11px; letter-spacing: .08em; text-align: left; text-transform: uppercase; }
    .data-table td { padding:16.6px 13.8px; border-bottom:1.4px solid var(--line); font-size:13.8px; vertical-align: middle; }
    .data-table td strong { display: block; }
    .data-table td small { color: var(--ink-faint); }
    .activity-log { display: grid; gap:0; }
    .activity-log__item { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap:15.2px; padding:17.9px 0; border-bottom:1.4px solid var(--line); }
    .activity-log__item:last-child { border-bottom:0; }
